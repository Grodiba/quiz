of encrypted files on the target system without alerting the legitimate user.", "B": "To increase the encryption level of stored passwords, thereby improving overall system security through obscurity.", "C": "To perform a denial of service on the user's account by entering incorrect passwords multiple times, leading to an account lockout.", "D": "To authenticate to a remote server or service by using a valid user's hashed password, bypassing the need for plaintext credentials."}, "correct": "D", "topic": "Cryptography", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">pass-the-hash</span></div><div class=\"tip-th\">💡 To authenticate to a remote server or service by using a valid user's hashed password, bypassing the need for plaintext credentials.</div>", "fill_hint": ""}, {"num": 367, "stem": "In a penetration testing scenario, which type of encryption is most vulnerable to a known- plaintext attack in a wireless setting?", "options": {"A": "WiFi Protected Access (WPA), although more secure than WEP, still vulnerable.", "B": "Wired Equivalent Privacy (WEP), which uses weak IVs that are susceptible to attack.", "C": "Temporal Key Integrity Protocol (TKIP), susceptible due to its backward compatibility with WEP.", "D": "Wireless Protected Setup (WPS), exploitable via the WPS PIN attack method."}, "correct": "B", "topic": "Cryptography", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 WEP (Wired Equivalent Privacy) คือ protocol เข้ารหัส WiFi เก่ามาก ใช้ IV ที่สั้นเกินไปทำให้เจาะได้ในไม่กี่นาทีด้วย aircrack-ng</div>", "fill_hint": ""}, {"num": 368, "stem": "What command-line tool can be used to extract and analyze metadata from media files, which can help detect deepfakes by revealing anomalies in the file’s creation?", "options": {"A": "strings", "B": "exiftool", "C": "mediainfo", "D": "ffmpeg"}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">✅ คำตอบคือ: <strong>exiftool</strong><br>💡 (ดูคำอธิบายเพิ่มเติมจากเฉลยที่ไฮไลท์สีเขียวด้านบน)</div>", "fill_hint": ""}, {"num": 369, "stem": "Identify the primary tool for conducting a buffer overflow attack on a Windows-based application.", "options": {"A": "Metasploit, a comprehensive framework that allows the user to generate and execute exploit code against a target machine.", "B": "IDA Pro, a disassembler and debugger, useful for understanding the binary but not for direct exploitation of buffer overflows.", "C": "OllyDbg, another debugger used for analyzing binary programs and machine code but not as complete as Metasploit for exploit development.", "D": "Nmap, used for network mapping and port scanning but not specifically tailored for buffer overflow exploitation."}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">buffer overflow</span></div><div class=\"tip-th\">💡 Metasploit คือ penetration testing framework มี exploit modules, payloads, และ auxiliary tools ใช้หลัง scan เจอช่องโหว่เพื่อ exploit</div>", "fill_hint": ""}, {"num": 370, "stem": "What command would you use in Aircrack-ng to initiate a deauthentication attack on a client connected to a network with a BSSID of AA:BB:CC:DD:EE?", "options": {"A": "iwconfig wlan0 mode monitor && airodump-ng --bssid AA:BB:CC:DD:EE:FF --channel 6", "B": "aircrack-ng -0 10 -a 2 -b AA:BB:CC:DD:EE:FF wlan0", "C": "airmon-ng start wlan0 && aireplay-ng --deauth 10 -a AA:BB:CC:DD:EE:FF wlan0", "D": "wlanconfig wlan0 create wlandev wifi0 wlanmode monitor"}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">deauth</span></div><div class=\"tip-th\">💡 Aircrack-ng คือ WiFi security auditing tool ใช้ crack WEP/WPA passwords จาก captured handshake ด้วย dictionary/brute-force</div>", "fill_hint": ""}, {"num": 371, "stem": "Fill in the blank: To inspect the API calls made by a malware sample during execution, security analysts use the tool _____.", "options": {"A": "GDB", "B": "OllyDbg", "C": "Sysinternals Suite", "D": "API Monitor"}, "correct": "D", "topic": "Malware & Viruses", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">📝 เติมช่องว่าง: <strong>API Monitor</strong></div>", "fill_hint": ""}, {"num": 372, "stem": "Which command can be used to capture live network traffic during a data breach investigation on a Linux-based system?", "options": {"A": "ifconfig eth0 down, which brings down the network interface, preventing data capture and making it harder to analyze the breach.", "B": "netstat -anp | grep LISTEN, which lists active network connections and processes but does not capture packet-level traffic.", "C": "tcpdump -i eth0, which captures all packets on the specified network interface, providing valuable evidence of malicious activity.", "D": "lsof -i -P, which lists open files and the processes that opened them, but does not capture live traffic for breach analysis."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Tcpdump คือ command-line packet analyzer ใช้ capture TCP/IP traffic ใน terminal ไม่มี GUI เหมาะกับ Linux server ที่ไม่มี desktop</div>", "fill_hint": ""}, {"num": 373, "stem": "A network administrator suspects that an internal employee is using a packet sniffer to collect sensitive data from within the network. What would be the first step to verify this suspicion and detect the sniffing tool?", "options": {"A": "Review active processes on each machine to identify suspicious programs that could be used for packet sniffing.", "B": "Scan the network for open ports and unusual traffic patterns that could indicate unauthorized sniffing tools in operation.", "C": "Use network monitoring tools to detect excessive ARP requests or traffic duplication, indicating potential packet-sniffing activities.", "D": "Examine server logs for unusual spikes in CPU or memory usage that could indicate sniffing tools running in the background."}, "correct": "C", "topic": "Network Sniffing & MITM", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Use network monitoring tools to detect excessive ARP requests or traffic duplication, indicating potential packet-sniffing activities.</div>", "fill_hint": ""}, {"num": 374, "stem": "An AI-powered intrusion detection system has identified unusual activity involving long- term data exfiltration. How would you proceed to confirm if this is indeed an APT attack?", "options": {"A": "Perform a forensic analysis of the compromised machine to identify any persistent backdoors or malware capable of enabling long-term access.", "B": "Investigate the flagged IP addresses and domains involved in the data transfer, cross- referencing them with known APT actor signatures and techniques.", "C": "Review user access logs and permissions to verify if the suspicious activity was conducted by an authorized insider misusing credentials.", "D": "Cross-check the system’s behavior against known AI-model training data to verify if the flagged activity matches typical APT behavior."}, "correct": "B", "topic": "IDS/IPS & Firewalls", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Investigate the flagged IP addresses and domains involved in the data transfer, cross- referencing them with known APT actor signatures and techniques.</div>", "fill_hint": ""}, {"num": 375, "stem": "You are monitoring the behavior of a previously unknown executable file in an enterprise network. The AI model flags the file as part of an APT attack. What action should you take first to validate the model’s alert?", "options": {"A": "Capture the network traffic and perform a packet-level analysis to examine whether any data was exfiltrated or malicious connections were made.", "B": "Conduct a memory dump analysis of the endpoint where the executable was flagged to investigate if malicious processes are running in the background.", "C": "Immediately block the executable file at the host level and quarantine the affected machine to prevent further spread within the network.", "D": "Run a vulnerability scan across the entire system to identify any additional weak points that the APT might exploit."}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Capture the network traffic and perform a packet-level analysis to examine whether any data was exfiltrated or malicious connections were made.</div>", "fill_hint": ""}, {"num": 376, "stem": "What is the most effective method to prevent attackers from intercepting and reading sensitive data transmitted over a network?", "options": {"A": "Segregating the network using VLANs to control traffic flow and reduce the risk of sniffing across different segments of the network.", "B": "Using MAC filtering to restrict which devices can connect to the network, adding a layer of access control but not directly protecting data in transit.", "C": "Installing firewalls to block unauthorized access, which would prevent attackers from gaining access to the network but may not protect data in transit.", "D": "Implementing end-to-end encryption, which ensures that data is encrypted from the source to the destination, protecting it from interception."}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Implementing end-to-end encryption, which ensures that data is encrypted from the source to the destination, protecting it from interception.</div>", "fill_hint": ""}, {"num": 377, "stem": "During a network audit, you are tasked with implementing security measures to defend against packet sniffing. Which encryption technique should you prioritize to secure data transmission over unsecured Wi-Fi networks?", "options": {"A": "Apply WPA3 encryption on w would you check if a web application's session cookies are not set with the 'HttpOnly' flag?", "options": {"A": "Running a script to automate requests and checking if sessions are maintained.", "B": "Utilizing curl commands to fetch pages and analyze the headers.", "C": "Performing a network packet capture to see if cookies are transmitted in clear text.", "D": "Use a browser's developer tools to inspect the cookies sent by the server."}, "correct": "D", "topic": "Web Application Attacks", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Use a browser's developer tools to inspect the cookies sent by the server.</div>", "fill_hint": ""}, {"num": 397, "stem": "When attempting to escalate privileges on a Unix system by exploiting a vulnerable installed software, what is the first step?", "options": {"A": "Identify vulnerable software versions using dpkg -l or similar commands.", "B": "Utilize social engineering to obtain admin credentials from system users.", "C": "Execute a brute force attack to guess the root password.", "D": "Scan the network for other vulnerable systems that may offer root access."}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Identify vulnerable software versions using dpkg -l or similar commands.</div>", "fill_hint": ""}, {"num": 398, "stem": "Fill in the blank: To intercept data transmitted from an IoT device, attackers often deploy ________ attacks.", "options": {"A": "Replay attacks to resend legitimate captured data packets to the device.", "B": "Eavesdropping on unsecured wireless communications.", "C": "Man-in-the-middle.", "D": "Phishing to deceive users into providing secure access to IoT systems."}, "correct": "C", "topic": "Wireless/IoT & Other", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>Man-in-the-middle.</strong></div><div class=\"tip-th\">💡 MITM (Man-in-the-Middle) คือการแทรกตัวกลางการสื่อสาร อ่านหรือแ  real-time ใช้ตรวจ credentials ใน plain text, troubleshoot network</div>", "fill_hint": ""}, {"num": 401, "stem": "In an advanced penetration testing automation scenario, how would you configure an AI- based system to automatically adapt its testing strategies based on previous outcomes?", "options": {"A": "Setting fixed testing sequences to be triggered after every development cycle", "B": "Implementing a feedback loop with manual review checkpoints", "C": "Utilizing pre-configured attack vectors based on common vulnerabilities", "D": "Developing a machine learning model that adjusts testing parameters in real-time"}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Developing a machine learning model that adjusts testing parameters in real-time</div>", "fill_hint": ""}, {"num": 402, "stem": "Given a scenario where a security professional needs to demonstrate a model inversion attack on an image processing model to detect potential leaks, which of the following methods would effectively extract training images?", "options": {"A": "Applying noise to the model’s input layer and observing changes in output to guess the training data.", "B": "Analyzing metadata embedded in the model’s file system to uncover traces of the original training data.", "C": "Utilizing gradient ascent on the model’s output probabilities to reconstruct the input images.", "D": "Employing a series of controlled, small changes to the inputs and monitoring the corresponding outputs to deduce information about the training images."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Utilizing gradient ascent on the model’s output probabilities to reconstruct the input images.</div>", "fill_hint": ""}, {"num": 403, "stem": "What is the primary command used to initiate an API call that might unintentionally leak model data during a model inversion attack test?", "opt <script>
(function(){
"use strict";

const STORAGE_KEY = "ceh_quiz_progress_v1";
const TOTAL = QUESTIONS.length;

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {};
}
function saveProgress(p){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
}
let PROGRESS = loadProgress();

function getRec(num){
  if(!PROGRESS[num]) PROGRESS[num] = {box:0, seen:0, correct:0, wrong:0, last:null};
  return PROGRESS[num];
}
function recordAnswer(num, isCorrect){
  const r = getRec(num);
  r.seen++;
  if(isCorrect){ r.correct++; r.box = Math.min(4, r.box+1); }
  else { r.wrong++; r.box = 0; }
  r.last = Date.now();
  saveProgress(PROGRESS);
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function weightedSample(pool, n){
  // weight inversely by box (lower box = higher priority) + never-seen gets top priority
  const weighted = pool.map(q=>{
    const r = getRec(q.num);
    let w = (5 - r.box);
    if(r.seen === 0) w += 3;
    return {q, w};
  });
  const chosen = [];
  const arr = weighted.slice();
  while(chosen.length < n && arr.length){
    const totalW = arr.reduce((s,x)=>s+x.w,0);
    let rnd = Math.random()*totalW;
    let idx = 0;
    for(; idx<arr.length; idx++){
      rnd -= arr[idx].w;
      if(rnd<=0) break;
    }
    idx = Math.min(idx, arr.length-1);
    chosen.push(arr[idx].q);
    arr.splice(idx,1);
  }
  return chosen;
}

const app = document.getElementById('app');

function overallStats(){
  let seenCount=0, mastered=0, totalCorrect=0, totalAnswered=0;
  for(const q of QUESTIONS){
    const r = PROGRESS[q.num];
    if(r && r.seen>0){ seenCount++; totalCorrect+=r.correct; totalAnswered+=r.seen; }
    if(r && r.box>=4) mastered++;
  }
  const acc = totalAnswered? Math.round(100*totalCorrect/totalAnswered) : 0;
  return {seenCount, mastered, acc, totalAnswered};
}

function topicBreakdown(){
  const map = {};
  for(const q of QUESTIONS){
    if(!map[q.topic]) map[q.topic] = {total:0, mastered:0, wrongMore:0};
    map[q.topic].total++;
    const r = PROGRESS[q.num];
    if(r && r.box>=4) map[q.topic].mastered++;
    if(r && r.wrong>r.correct) map[q.topic].wrongMore++;
  }
  return map;
}

    <footer class="note">ข้อมูลบันทึกในเบราว์เซอร์นี้เท่านั้น (localStorage) — ล้างแคชแล้วจะเริ่มนับใหม่</footer>
  `;

function renderTopBar(container, label, extra){
  return `<div class="topbar-q"><span>${label}</span><span>${extra||''}</span></div>`;
}

// ---------- Question runner (shared by learn/quiz/exam/weak) ----------
function runSession(opts){
  // opts: {questions, mode: 'learn'|'quiz'|'exam'|'weak', title, timeLimitSec}
  const state = {
    idx: 0,
    list: opts.questions,
    mode: opts.mode,
    title: opts.title,
    answers: [], // {num, chosen, correct, isCorrect}
    startTime: Date.now(),
    timeLimitSec: opts.timeLimitSec || null,
    timerHandle: null,
  };

  function renderQuestion(){
    if(state.idx >= state.list.length){
      return renderSessionSummary(state);
    }
    const q = state.list[state.idx];
    const letters = ['A','B','C','D'];
    let timeStr = '';
    if(state.timeLimitSec){
      const elapsed = Math.floor((Date.now()-state.startTime)/1000);
      const remain = Math.max(0, state.timeLimitSec - elapsed);
      const mm = String(Math.floor(remain/60)).padStart(2,'0');
      const ss = String(remain%60).padStart(2,'0');
      timeStr = `⏱ ${mm}:${ss}`;
      if(remain<=0){ finishSession(state); return; }
    }
    app.innerHTML = `
      <header class="top">
        <h1>${state.title}</h1>
        <div class="stats-mini">${timeStr}</div>
      </header>
      <div class="card">
        ${renderTopBar(null, `ข้อ ${state.idx+1} / ${state.list.length}`, `<span class="topic-pill">${q.topic}</span>`)}
        <div class="progressbar"><div style="width:${100*state.idx/state.list.length}%"></div></div>
        <div class="qnum">คำถามที่ ${q.num} ${q.corrected?'<span class="badge">แก้ไขแล้ว</span>':''}</div>
        <div class="stem">${escapeHtml(q.stem)}</div>
        <div id="opts-wrap">
        ${letters.map(l=>`
          <button class="opt" data-letter="${l}" onclick="App._selectOption('${l}')">
            <span class="letter">${l}</span>${escapeHtml(q.options[l])}
          </button>`).join('')}
        </div>
        <div id="explain-wrap"></div>
        <div class="btn-row" id="btn-row"></div>
      </div>
    `;
    if(state.timeLimitSec){
      state.timerHandle = setTimeout(renderQuestion, 1000);
    }
  }

  function selectOption(letter){
    if(state.timerHandle) clearTimeout(state.timerHandle);
    const q = state.list[state.idx];
    const isCorrect = letter === q.correct;
    document.querySelectorAll('.opt').forEach(btn=>{
      btn.classList.add('locked');
      btn.onclick = null;
      const l = btn.getAttribute('data-letter');
      if(l === q.correct) btn.classList.add('correct');
      else if(l === letter) btn.classList.add('wrong');
    });
    const trickTip = q.trick_tip_th || '';
    const resultIcon = isCorrect
      ? '✅ ถูกต้อง!'
      : '❌ ผิด — เฉลยคือ <strong>' + q.correct + ':</strong> ' + escapeHtml(q.options[q.correct]);
    const resultClass = isCorrect ? 'trick-box correct-box' : 'trick-box wrong-box';
    let explainHtml = `
      <div class="${resultClass}">
        <div class="trick-result">${resultIcon}</div>
        <div class="trick-tip">${trickTip}</div>
      </div>`;
    if(q.corrected){
      explainHtml += `<div class="explain"><b>⚠️ หมายเหตุ:</b> ${escapeHtml(q.correction_note||'ข้อนี้ถูกแก้ไขจากต้นฉบับ')}</div>`;
    }
    document.getElementById('explain-wrap').innerHTML = explainHtml;
    document.getElementById('btn-row').innerHTML = `<button class="btn" onclick="App._nextQuestion()">ข้อถัดไป →</button>`;

    if(state.mode !== 'learn'){
      recordAnswer(q.num, isCorrect);
    }
    state.answers.push({num:q.num, chosen:letter, correct:q.correct, isCorrect, topic:q.topic});
  }

  function revealForLearn(){
    // learn mode: show answer without needing click scoring, just mark chosen viewed
  }

  function nextQuestion(){
    state.idx++;
    renderQuestion();
  }

  App._selectOption = selectOption;
  App._nextQuestion = nextQuestion;
  renderQuestion();
}

function finishSession(state){
  state.idx = state.list.length;
  renderSessionSummary(state);
}

function renderSessionSummary(state){
  const total = state.answers.length;
  const correct = state.answers.filter(a=>a.isCorrect).length;
  const pct = total? Math.round(100*correct/total) : 0;
  const isExam = state.mode === 'exam';
  const passed = pct >= 70;
  const missed = state.answers.filter(a=>!a.isCorrect);

  let resultBlock = '';
  if(isExam){
    resultBlock = `
      <div class="result-big ${passed?'result-pass':'result-fail'}">${passed?'PASS ✅':'NOT YET ❌'}</div>
      <div style="text-align:center;font-size:15px;color:var(--sub);margin-bottom:10px;">คะแนน ${correct}/${total} (${pct}%) — เกณฑ์ผ่าน 70%</div>
    `;
  } else {
    resultBlock = `<div style="text-align:center;font-size:16px;margin-bottom:6px;">ถูก ${correct}/${total} (${pct}%)</div>`;
  }

  app.innerHTML = `
    <header class="top"><h1>สรุปผล</h1></header>
    <div class="card">
      ${resultBlock}
      <div class="progressbar"><div style="width:${pct}%"></div></div>
    </div>
    ${missed.length? `
    <div class="card">
      <h3 style="margin-top:0;">ข้อที่ตอบผิด (${missed.length})</h3>
      <div class="topiclist">
        ${missed.map(m=>{
          const q = QUESTIONS.find(x=>x.num===m.num);
          return `<div class="miss-item">
            <div><b>ข้อ ${q.num}</b> · <span class="topic-pill">${q.topic}</span></div>
            <div style="margin-top:4px;">${escapeHtml(q.stem)}</div>
            <div style="margin-top:6px;color:var(--good);">✔ เฉลย ${q.correct}: ${escapeHtml(q.options[q.correct])}</div>
          </div>`;
        }).join('')}
      </div>
    </div>` : `<div class="card"><p>เยี่ยมมาก ไม่มีข้อผิดเลย 🎉</p></div>`}
    <div class="btn-row">
      <button class="btn" onclick="App.home()">กลับหน้าแรก</button>
      ${missed.length? `<button class="btn secondary" onclick="App.reviewMissed(${JSON.stringify(missed.map(m=>m.num))})">ทบทวนเฉพาะข้อที่ผิด</button>`:''}
    </div>
  `;
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function showQuizSetup(){
  app.innerHTML = `
    <header class="top"><h1>ตั้งค่าแบบทดสอบ</h1></header>
    <div class="card">
      <p>เลือกจำนวนข้อที่ต้องการทำ (ระบบจะสุ่มโดยให้น้ำหนักกับข้อที่ยังไม่ชำนาญมากกว่า):</p>
      <div class="btn-row">
        <button class="btn" onclick="App.startQuiz(10)">10 ข้อ</button>
        <button class="btn" onclick="App.startQuiz(25)">25 ข้อ</button>
        <button class="btn" onclick="App.startQuiz(50)">50 ข้อ</button>
        <button class="btn" onclick="App.startQuiz(100)">100 ข้อ</button>
        <button class="btn secondary" onclick="App.startQuiz(${TOTAL})">ทั้งหมด (${TOTAL})</button>
      </div>
      <div class="btn-row"><button class="btn secondary" onclick="App.home()">← กลับ</button></div>
    </div>
  `;
}

function startQuiz(n){
  const chosen = weightedSample(QUESTIONS, Math.min(n, TOTAL));
  runSession({questions: shuffle(chosen), mode:'quiz', title:`แบบทดสอบ ${chosen.length} ข้อ`});
}

function startLearn(){
  const chosen = weightedSample(QUESTIONS, Math.min(20, TOTAL));
  runSession({questions: chosen, mode:'learn', title:'โหมดเรียนรู้ (Flashcard)'});
}

function startExamSim(){
  const n = Math.min(125, TOTAL);
  const chosen = shuffle(QUESTIONS).slice(0, n);
  runSession({questions: chosen, mode:'exam', title:'จำลองสอบจริง (125 ข้อ)', timeLimitSec: 4*60*60});
}

function startWeakReview(){
  const weak = QUESTIONS.filter(q=>{
    const r = PROGRESS[q.num];
    return !r || r.seen===0 || r.box < 2 || r.wrong > r.correct;
  });
  if(weak.length===0){
    app.innerHTML = `<header class="top"><h1>ทบทวนข้อที่ยังไม่แม่น</h1></header>
      <div class="card"><p>เก่งมาก! ตอนนี้ไม่มีข้อที่เป็นจุดอ่อนแล้ว ลองโหมดจำลองสอบจริงดูได้เลย</p>
      <div class="btn-row"><button class="btn" onclick="App.home()">กลับหน้าแรก</button></div></div>`;
    return;
  }
  const n = Math.min(30, weak.length);
  runSession({questions: shuffle(weak).slice(0,n), mode:'weak', title:`ทบทวนจุดอ่อน (${n} ข้อ)`});
}

function reviewMissed(nums){
  const qs = QUESTIONS.filter(q=>nums.includes(q.num));
  runSession({questions: qs, mode:'quiz', title:'ทบทวนข้อที่ตอบผิด'});
}

function showStats(){
  const s = overallStats();
  const topics = topicBreakdown();
  const rows = Object.entries(topics).sort((a,b)=>b[1].total-a[1].total).map(([name, t])=>{
    const pct = Math.round(100*t.mastered/t.total);
    return `<div class="stat-row"><span>${name} (${t.total} ข้อ)</span><span>${t.mastered}/${t.total} จำได้ (${pct}%)</span></div>`;
  }).join('');
  app.innerHTML = `
    <header class="top"><h1>สถิติของฉัน</h1></header>
    <div class="card">
      <div class="stat-row"><span>ข้อที่จำได้แล้ว (Box 4)</span><span>${s.mastered} / ${TOTAL}</span></div>
      <div class="stat-row"><span>ข้อที่เคยทำแล้ว</span><span>${s.seenCount} / ${TOTAL}</span></div>
      <div class="stat-row"><span>ความแม่นยำสะสม</span><span>${s.acc}%</span></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">แยกตามหัวข้อ</h3>
      ${rows}
    </div>
    <div class="btn-row">
      <button class="btn" onclick="App.home()">กลับหน้าแรก</button>
      <button class="btn secondary" onclick="App.resetProgress()">ล้างสถิติทั้งหมด</button>
    </div>
  `;
}

function showDataNotes(){
  const corrected = QUESTIONS.filter(q=>q.corrected);
  app.innerHTML = `
    <header class="top"><h1>ข้อที่แก้ไขจากต้นฉบับ</h1></header>
    <div class="card">
      <p class="small">ไฟล์ข้อสอบต้นฉบับ (CEHv13 Sample Exam.pdf) มีบางข้อที่ตัวเลือกซ้ำกันเอง หรือตัวเลือกคัดลอกคำถามมาทั้งประโยค ทำให้ไม่สามารถเลือกคำตอบได้อย่างมีเหตุผล ระบบตรวจพบ ${corrected.length} ข้อ และแก้ไขตัวเลือกที่ซ้ำ/ผิดพลาดให้เรียบร้อยแล้ว:</p>
      <div class="topiclist">
        ${corrected.map(q=>`
          <div class="miss-item">
            <div><b>ข้อ ${q.num}</b> · <span class="topic-pill">${q.topic}</span></div>
            <div style="margin-top:4px;">${escapeHtml(q.stem)}</div>
            <div style="margin-top:6px;color:#ffb84d;">${escapeHtml(q.correction_note)}</div>
          </div>`).join('')}
      </div>
    </div>
    <div class="btn-row"><button class="btn" onclick="App.home()">กลับหน้าแรก</button></div>
  `;
}

function resetProgress(){
  if(confirm('ต้องการล้างสถิติความคืบหน้าทั้งหมดหรือไม่?')){
    PROGRESS = {};
    saveProgress(PROGRESS);
    renderHome();
  }
}

const App = {
  home: renderHome,
  showQuizSetup, startQuiz, startLearn, startExamSim, startWeakReview,
  reviewMissed, showStats, showDataNotes, resetProgress,
};
window.App = App;

renderHome();
})();
</script>
