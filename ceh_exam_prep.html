hint": ""}, {"num": 96, "stem": "An attacker injects malicious code into a company's network to capture data packets and extract sensitive information. Which phase of a network-based attack does this describe?", "options": {"A": "Exploitation phase involves the actual act of exploiting a system or network to perform unauthorized actions or access data.", "B": "Installation phase includes setting up backdoors and other malicious tools within the network to ensure continued access and control over the target.", "C": "Reconnaissance phase is the initial phase where attackers gather preliminary data and intelligence on their target network or system.", "D": "Delivery phase often includes sending a payload or malicious tool to the target system to prepare for the main attack phase."}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Exploitation phase involves the actual act of exploiting a system or network to perform unauthorized actions or access data.</div>", "fill_hint": ""}, {"num": 97, "stem": "Fill in the blank: The use of __________ can prevent SQL injection attacks by separating data from commands.", "options": {"A": "Parameterized queries", "B": "Firewall implementation at the network edge", "C": "Database encryption", "D": "Input validation on user forms"}, "correct": "A", "topic": "SQL Injection", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">SQL inject</span></div><div class=\"tip-th\">📝 เติมช่องว่าง: <strong>Parameterized queries</strong></div>", "fill_hint": ""}, {"num": 98, "stem": "In a cybersecurity incident, what is the first step to take after detecting a virus infection on a corporate network?", "options": {"A": "Disconnecting the internet.", "B": "Deleting suspicious files immediately.", "C": "Running a full system antivirus scan.", "D": "Isolating the affected systems from the network."}, "correct": "D", "topic": "Malware & Viruses", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">virus</span></div><div class=\"tip-th\">✅ คำตอบคือ: <strong>Isolating the affected systems from the network.</strong><br>💡 (ดูคำอธิบายเพิ่มเติมจากเฉลยที่ไฮไลท์สีเขียวด้านบน)</div>", "fill_hint": ""}, {"num": 99, "stem": "What is the primary security concern when deploying IoT devices in a home automation network?", "options": {"A": "Devices overheating due to poor management of computing resources.", "B": "Interference from other electronic devices causing signal disruption.", "C": "Insufficient bandwidth to support multiple device connections.", "D": "Lack of secure authentication and encryption mechanisms."}, "correct": "D", "topic": "Wireless/IoT & Other", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 ISO 27001 คือมาตรฐาน international สำหรับ Information Security Management System (ISMS) framework สำหรับจัดการ security องค์กร</div>", "fill_hint": ""}, {"num": 100, "stem": "Fill in the blank: __________ is a common protocol used in IoT devices that lacks built-in security features.", "options": {"A": "Zigbee, a high-level communication protocol used in IoT.", "B": "CoAP (Constrained Application Protocol)", "C": "HTTP (HyperText Transfer Protocol)", "D": "MQTT (Message Queuing Telemetry Transport)"}, "correct": "D", "topic": "Wireless/IoT & Other", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">📝 เติมช่องว่าง: <strong>MQTT (Message Queuing Telemetry Transport)</strong></div>", "fill_hint": ""}, {"num": 101, "stem": "During a routine security assessment, how should an IT professional assess the security of third-party plugins used in their systems?", "options": {"A": "Rely solely on the security features built into the host platform to manage plugin risks.", "B": "Perform code reviews and security audits on the plugins before deployment.", "C": "Consult online forums and user reviews to gauge the security posture of the plugins.", "D": "Use automated vulnerability scanners to identify potential security flaws in plugins."}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Perform code reviews and security audits on the plugins before deployment.</div>", "fill_hint": ""}, {"num": 102, "stem": "During a simulated attack, an ethical hacker uses an AI-based tool to automatically identify SQL injection vulnerabilities. Which tool did they likely use?", "options": {"A": "SQLMap with AI plugins to optimize attack vectors based on machine learning predictions", "B": "Nikto, with built-in heuristic checks for outdated server components", "C": "Metasploit Framework, leveraging AI for enhanced payload delivery in tests", "D": "W3af, designed for web application audits with basic AI-supported suggestions"}, "correct": "A", "topic": "SQL Injection", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">SQL inject</span></div><div class=\"tip-th\">💡 SQLMap with AI plugins to optimize attack vectors based on machine learning predictions</div>", "fill_hint": ""}, {"num": 103, "stem": "Scenario: A malicious actor wants to exfiltrate large volumes of sensitive information from a compromised network. They aim to avoid detection by blending the exfiltration process with normal network activity. What method should they use?", "options": {"A": "Leveraging peer-to-peer (P2P) file-sharing networks for data extraction", "B": "Concealing the data flow within regular HTTP or HTTPS traffic patterns", "C": "Leveraging compromised IoT devices to slowly exfiltrate data over unsecured channels", "D": "Splitting files into small chunks and sending them over different email attachments"}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Concealing the data flow within regular HTTP or HTTPS traffic patterns</div>", "fill_hint": ""}, {"num": 104 numeration Tools", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">port scan</span></div><div class=\"tip-th\">✅ คำตอบคือ: <strong>Accuracy of the data collected</strong><br>💡 (ดูคำอธิบายเพิ่มเติมจากเฉลยที่ไฮไลท์สีเขียวด้านบน)</div>", "fill_hint": ""}, {"num": 108, "stem": "Fill in the blank: The _____ method manipulates data points in the training set of an AI model to compromise its integrity.", "options": {"A": "Cross-site scripting", "B": "Buffer overflow", "C": "Poison attack", "D": "Injection attack"}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>Poison attack</strong></div><div class=\"tip-th\">💡 Poison Attack คือการแทรก malicious data ใน training dataset เพื่อทำให้ AI/ML model เรียนรู้ผิดหรือ predict ผิดตาม attacker ต้องการ</div>", "fill_hint": ""}, {"num": 109, "stem": "Which AI-powered tool can predict and block potential threats based on historical attack patterns before they occur?", "options": {"A": "OSSEC, which focuses on host-based intrusion detection without AI-powered predictive capabilities", "B": "Wireshark, known for packet analysis but lacks built-in AI to predict attacks before they occur", "C": "Darktrace Antigena, which automatically responds to predicted threats based on behavior analysis", "D": "SolarWinds SEM, which focuses on traditional security event management but lacks AI- powered predictive capabilities"}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Darktrace Antigena, which automatically responds to predicted threats based on behavior analysis</div>", "fill_hint": ""}, {"num": 110, "stem": "Scenario: A security analyst wants to use ShellGPT to analyze logs for potential signs of intrusion by correlating user activity and unusual network traffic. What approach should they take?", "options": {"A": "Implement a custom search through log files manually, using ShellGPT for guidance.", "B": "Review raw log files manually and feed segments to ShellGPT for deeper analysis.", "C": "Employ external log analysis tools and consult ShellGPT for remediation advice after manual review.", "D": "Use the log analysis module to identify anomalous patterns in network traffic and correlate them with user activity."}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Use the log analysis module to identify anomalous patterns in network traffic and correlate them with user activity.</div>", "fill_hint": ""}, {"num": 111, "stem": "What security practice should be applied to verify the integrity of plugins before installation?", "options": {"A": "Scan plugins with antivirus software immediately after download but before installation.", "B": "Utilize cryptographic signatures and hash verification to ensure authenticity.", "C": "Install a secondary firewall specifically to monitor and control plugin traffic.", "D": "Only download plugins from the official software vendor's website directly."}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Utilize cryptographic signatures and hash verification to ensure authenticity.</div>", "fill_hint": ""}, {"num": 112, "stem": "An organization is deploying DeepExploit to automate penetration testing across its entire infrastructure. What is the first command to initialize DeepExploit after configuring Metasploit?", "options": {"A": "python3 exploit_runner.py --scan --attack, an alternative script for running Metasploit exploits manually", "B": "msfconsole -r deep_exploit.rc to load the configuration for Metasploit and run basic exploits", "C": "python3 deep_exploit.py --initiate --config-file config.yml --autopilot", "D": "sudo msfvenom -p deep_exploit --run for generating payloads, but without launching automated attacks"}, "corr ation", "C": "biometric verification", "D": "encryption"}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">📝 เติมช่องว่าง: <strong>encryption</strong></div>", "fill_hint": ""}, {"num": 116, "stem": "How does Nebula facilitate automated remediation of identified security flaws?", "options": {"A": "Provides detailed reports for manual review and action planning.", "B": "Integrates with existing CI/CD pipelines to apply patches or configuration changes automatically.", "C": "Sends alerts to administrators to manually patch the system.", "D": "Creates a secure backup of systems before applying any changes."}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Integrates with existing CI/CD pipelines to apply patches or configuration changes automatically.</div>", "fill_hint": ""}, {"num": 117, "stem": "An ethical hacker integrates machine learning models into their network monitoring system to detect anomalies. What should be the first step in setting up the environment to ensure real- time threat detection?", "options": {"A": "Initialize machine learning algorithms such as anomaly detection using Python libraries like sklearn or pycaret", "B": "Ensure that time-series data from the network is properly labeled for anomaly detection in supervised learning models", "C": "Set up an Elasticsearch and Kibana stack to store and visualize log data in real time", "D": "Install a pre-configured virtual machine running a security information and event management (SIEM) system"}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Initialize machine learning algorithms such as anomaly detection using Python libraries like sklearn or pycaret</div>", "fill_hint": ""}, {"num": 118, "stem": "What is the best strategy for minimizing security risks when using plugins in a production environme ing off-hours to reduce the window of opportunity for attacks.", "D": "Regularly update the NLP software to ensure all security patches are applied."}, "correct": "A", "topic": "SQL Injection", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Implement strict input validation rules that include length and content restrictions.</div>", "fill_hint": ""}, {"num": 124, "stem": "In the context of fraud detection using AI, what is the significance of \"feature engineering\"?", "options": {"A": "The approach of integrating third-party security services to enhance AI detection capabilities.", "B": "The method of removing unnecessary data from the dataset to speed up processing.", "C": "The technique of coding algorithms into the AI system to autonomously detect fraud.", "D": "The process of selecting, modifying, and creating features from raw data to increase the predictive power of machine learning algorithms."}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 The process of selecting, modifying, and creating features from raw data to increase the predictive power of machine learning algorithms.</div>", "fill_hint": ""}, {"num": 125, "stem": "Scenario: A cybersecurity professional discovers that sensitive data from a compromised system was exfiltrated through an encrypted channel that mimicked regular HTTPS traffic. What technique was likely employed?", "options": {"A": "Establishing an SSH tunnel with frequent data transfers disguised as normal communication", "B": "Manipulating FTP transfers with hidden commands to extract data in the background", "C": "Directing data through non-standard protocols like VoIP to avoid inspection", "D": "Utilizing an HTTPS tunnel disguised as legitimate web traffic"}, "correct": "D", "topic": "Cryptography", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Trojan คือโปรแกรมที่ปลอมตัวเป็น software ที่มีประโยชน์ แต่ซ่อน malicious code ไว้ ไม่แพร่ ack prediction", "C": "McAfee ePO, primarily focused on managing policies but not real-time AI-driven prediction", "D": "CylancePROTECT, which blocks potential threats using AI to analyze patterns and predict attacks"}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">📝 เติมช่องว่าง: <strong>CylancePROTECT, which blocks potential threats using AI to analyze patterns and predict attacks</strong></div>", "fill_hint": ""}, {"num": 129, "stem": "Fill in the blank: The machine learning model known as _____ is often utilized to identify outliers in datasets, which can help detect fraudulent transactions.", "options": {"A": "Principal Component Analysis", "B": "Support Vector Machines", "C": "K-means clustering", "D": "Isolation Forest"}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">📝 เติมช่องว่าง: <strong>Isolation Forest</strong></div>", "fill_hint": ""}, {"num": 130, "stem": "Fill in the blank: To protect against Model Denial of Service attacks, it is essential to implement ________ monitoring on all AI systems.", "options": {"A": "security", "B": "resource", "C": "connectivity", "D": "performance"}, "correct": "B", "topic": "DoS / DDoS", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">📝 เติมช่องว่าง: <strong>resource</strong></div>", "fill_hint": ""}, {"num": 131, "stem": "Scenario: An organization employs an ethical hacker to perform a detailed assessment of their network security. What manual technique should the hacker use to discover hidden directories and files on the web server?", "options": {"A": "Engaging in phishing campaigns to extract information", "B": "Applying social engineering techniques to obtain network layout", "C": "Utilizing network sniffing to intercept data traffic", "D": "Using directory brute-forcing tools like DirBuster"}, "correct": "D", "topic": "Web Application Attacks", "trick_keywords": [], " raphy"}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Steganography คือการซ่อนข้อมูลใน media เช่น รูปภาพหรือเสียง โดยไม่เปลี่ยน appearance ต่างจาก encryption ที่ยังเห็นว่ามี encrypted data</div>", "fill_hint": ""}, {"num": 148, "stem": "A company is setting up an AI-powered predictive defense system to prevent attacks by analyzing system vulnerabilities. What is the first step in deploying the machine learning model for this system in Python?", "options": {"A": "Integrate the AI model with real-time network data for proactive defense system monitoring", "B": "Import necessary Python libraries like tensorflow and keras for deep learning predictions of cyber threats", "C": "Set up a virtual machine to simulate real-world attack data for training the AI model", "D": "Configure a real-time monitoring system to collect data from network sensors for later AI analysis"}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Import necessary Python libraries like tensorflow and keras for deep learning predictions of cyber threats</div>", "fill_hint": ""}, {"num": 149, "stem": "A security analyst suspects that an AI model is being targeted with a Denial of Service attack. Which method should they use to confirm this?", "options": {"A": "Analyzing the patterns of incoming traffic to identify sudden spikes or anomalies.", "B": "Running a controlled test by simulating an attack on the system.", "C": "Checking the error rates in server logs for increased failure messages.", "D": "Temporarily disabling the AI model to see if the system stabilizes."}, "correct": "A", "topic": "DoS / DDoS", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Analyzing the patterns of incoming traffic to identify sudden spikes or anomalies.</div>", "fill_hint": ""}, {"num": 150, "stem": "Which method is most effective for cleaning a dataset suspected of containing malicious entries due to data poisoning?", "options": {"A": "Run automated scripts to randomly shuffle the dataset and remove duplicate entries.", "B": "Encrypt all data entries to prevent unauthorized access and modifications.", "C": "Apply hashing techniques to verify the authenticity of each data entry before processing.", "D": "Utilize a robust data sanitization process that includes cross-validation with multiple data sources."}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Utilize a robust data sanitization process that includes cross-validation with multiple data sources.</div>", "fill_hint": ""}, {"num": 151, "stem": "Fill in the blank: For continuous monitoring of target changes in directories or file structures online, _____________ is an AI-powered tool that can be scripted in Python.", "options": {"A": "Watchtower, which allows real-time monitoring and can trigger alerts for changes", "B": "DirWatcher, primarily used for local directory changes monitoring", "C": "SysWatch, a tool for system performance tracking and alerting", "D": "FileGuard, a basic scripting tool for file integrity checking"}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">📝 เติมช่องว่าง: <strong>Watchtower, which allows real-time monitoring and can trigger alerts for changes</strong></div>", "fill_hint": ""}, {"num": 152, "stem": "Fill in the blank: _____ is an AI-driven tool that can automate the process of scanning networks and identifying vulnerabilities.", "options": {"A": "Nessus", "B": "Shodan", "C": "Intruder AI", "D": "Metasploit"}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">📝 เติมช่องว่าง: <strong>Intruder AI</strong></div>", "fill_hint": ""}, {"num": 153, "stem": "Scenario: An organization wants to assess the security of their IoT devices. Which Nebula tool sis that follows predefined rules to classify network activities.", "B": "Support vector machines that classify and predict outcomes based on boundary lines.", "C": "Rule-based systems that trigger alerts based on pre-established criteria.", "D": "Deep learning models that analyze large datasets and adapt to new threats dynamically."}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Deep learning models that analyze large datasets and adapt to new threats dynamically.</div>", "fill_hint": ""}, {"num": 199, "stem": "What is the most effective way to ensure data at rest is protected against unauthorized access?", "options": {"A": "Implement full disk encryption using tools like BitLocker or FileVault.", "B": "Use strong passwords and change them frequently to secure data access points.", "C": "Regularly update antivirus software and monitor system logs for signs of data breaches.", "D": "Store all sensitive data in a single, highly secure physical server location."}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Implement full disk encryption using tools like BitLocker or FileVault.</div>", "fill_hint": ""}, {"num": 200, "stem": "Scenario: You are tasked with testing the security of cloud infrastructure using Nebula. Which feature should be prioritized to simulate attacks based on current threat intelligence?", "options": {"A": "Threat simulation module that uses AI to adapt scenarios based on predictive analytics.", "B": "AI-driven compliance checking tool to ensure cloud configurations meet industry standards.", "C": "Data breach simulation tool to test the effectiveness of data encryption and access controls.", "D": "Penetration testing toolkit that focuses on physical security tests."}, "correct": "A", "topic": "Cloud Security", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Threat simulation module that uses A uses", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">worm</span></div><div class=\"tip-th\">💡 Nmap คือ network scanner ใช้ค้นหา hosts, open ports, services, OS (-sS=stealth SYN, -O=OS detect, -sV=version, -A=aggressive)</div>", "fill_hint": ""}, {"num": 204, "stem": "What method is effective for gaining unauthorized access to Linux systems by exploiting weak SSH configurations?", "options": {"A": "Brute-forcing SSH logins using Hydra with a common password list.", "B": "Installing a keylogger to capture credentials during user logins.", "C": "Performing a Man-in-the-Middle attack to intercept SSH credentials.", "D": "Using nmap to scan for open SSH ports and attempt a version overflow."}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Brute-forcing SSH logins using Hydra with a common password list.</div>", "fill_hint": ""}, {"num": 205, "stem": "What is the best approach to test a web application for Cross-Site Request Forgery (CSRF) vulnerabilities?", "options": {"A": "Analyzing the application's source code to look for state-changing operations that lack CSRF tokens.", "B": "Crafting malicious requests that mimic legitimate requests to see if they are executed without the user's consent.", "C": "Requesting page resources with and without login credentials to check for improper access control.", "D": "Observing if cookies or tokens are stored insecurely or sent over non-HTTPS connections."}, "correct": "B", "topic": "Web Application Attacks", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">CSRF</span></div><div class=\"tip-th\">💡 Crafting malicious requests that mimic legitimate requests to see if they are executed without the user's consent.</div>", "fill_hint": ""}, {"num": 206, "stem": "While monitoring a secure network, how would you use Wireshark to detect unauthorized SSH access attempts?", "options": {"A": "Watching for multiple rapid DNS queries to identify possible data exfiltration.", "B": "Analyzing encrypted traffic volumes for inconsistencies with known baseline levels.", "C": "Setting filters for TCP port 22 and monitoring for failed connection attempts.", "D": "Reviewing all UDP traffic to check for potential backdoor communications."}, "correct": "C", "topic": "Scanning & Enumeration Tools", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">Wireshark</span></div><div class=\"tip-th\">💡 Setting filters for TCP port 22 and monitoring for failed connection attempts.</div>", "fill_hint": ""}, {"num": 207, "stem": "What is the most effective way to use Wireshark to troubleshoot a suspected network latency issue?", "options": {"A": "Capturing all packets and then using the \"Follow TCP Stream\" feature to review session specifics.", "B": "Analyzing the round trip time statistics for specific devices.", "C": "Using \"Expert Analysis\" to automatically detect anomalies and potential issues.", "D": "Applying filters to show only SYN and ACK flags to determine handshake issues."}, "correct": "A", "topic": "Scanning & Enumeration Tools", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">Wireshark</span></div><div class=\"tip-th\">💡 Capturing all packets and then using the \"Follow TCP Stream\" feature to review session specifics.</div>", "fill_hint": ""}, {"num": 208, "stem": "During a security audit, you need to ensure no fileless malware is executing via common Windows administrative tools. What is your first action?", "options": {"A": "Increase firewall settings to block all incoming and outgoing connections.", "B": "Disable all scripting environments including PowerShell, VBScript, and JavaScript.", "C": "Set auditing policies to monitor and log all usage of PowerShell and WMI.", "D": "Conduct a physical inspection of all network hardware for unauthorized devices."}, "correct": "C", "topic": "Malware & Viruses", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Set auditing policies to monitor and log all usage of PowerShell and WMI.</div>", "fill_hint": ""}, {"num": 209, "stem": "What command is essential for preserving the state of a running process during an incident response to analyze later?", "options": {"A": "netstat -an > /tmp/network_connections.txt to capture active network connections.", "B": "sudo dd if=/proc/[pid]/mem of=/tmp/memdump_[pid].bin bs=1024", "C": "ps aux > /tmp/processlist.txt to save the list of current running processes.", "D": "top -b -n 1 > /tmp/system_load.txt to record the current system load."}, "correct": "B", "topic": "Incident Response & Forensics", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 sudo dd if=/proc/[pid]/mem of=/tmp/memdump_[pid].bin bs=1024</div>", "fill_hint": ""}, {"num": 210, "stem": "For a thorough penetration test, what should be the initial step to understand the network landscape without alerting the administrative teams?", "options": {"A": "Launching a DDoS attack to observe the network's resilience.", "B": "Conducting passive network reconnaissance using traffic sniffing.", "C": "Sending phishing emails to network administrators to gather intel.", "D": "Physically inspecting server racks and network cables in the facility."}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Passive Reconnaissance คือการรวบรวมข้อมูลจาก public sources โดยไม่ติดต่อ target โดยตรง เช่น Google, WHOIS, LinkedIn, Shodan ตรวจจับไม่ได้</div>", "fill_hint": ""}, {"num": 211, "stem": "Fill in the blank: To prevent clickjacking attacks, you should include the _____ header with the value 'SAMEORIGIN' in your web server's response headers.", "options": {"A": "Strict-Transport-Security", "B": "X-Frame-Options", "C": "Content-Security-Policy", "D": "X-Content-Type-Options"}, "correc ist.txt", "B": "wget -r http://example.com", "C": "nmap -p80 --script http-enum http://example.com", "D": "curl -X GET http://example.com -H 'User-Agent: Mozilla/5.0'"}, "correct": "A", "topic": "Web Application Attacks", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">✅ คำตอบคือ: <strong>gobuster dir -u http://example.com -w dirlist.txt</strong><br>💡 (ดูคำอธิบายเพิ่มเติมจากเฉลยที่ไฮไลท์สีเขียวด้านบน)</div>", "fill_hint": ""}, {"num": 215, "stem": "When analyzing a zero-day vulnerability, what type of analysis is crucial for understanding the potential impact without executing the exploit?", "options": {"A": "Dynamic testing by executing the exploit in a controlled environment to observe its behavior.", "B": "Manual testing by skilled testers who try to break the software using unconventional input.", "C": "Static code analysis to examine the source code for unexpected behavior or anomalies.", "D": "Automated vulnerability scanning using tools designed to probe systems for known weaknesses."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">zero-day</span></div><div class=\"tip-th\">💡 Static code analysis to examine the source code for unexpected behavior or anomalies.</div>", "fill_hint": ""}, {"num": 216, "stem": "Fill in the blank: For secure wireless communication, it is recommended to use __________ encryption to protect data from eavesdropping.", "options": {"A": "WPA2-Enterprise", "B": "WPA3-Personal", "C": "SSL", "D": "WEP"}, "correct": "A", "topic": "Cryptography", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>WPA2-Enterprise</strong></div><div class=\"tip-th\">💡 WPA2 ใช้ AES-CCMP เป็น encryption ปลอดภัยพอใช้งาน แต่ WPA3 ดีกว่า โดยเฉพาะเรื่อง brute-force protection</div>", "fill_hint": ""}, {"num": 217, "stem": "During a digital forensic investigation, which software can be used to analyze the filesystem of a captured image for deleted files?", "options": {"A": "FTK Imager to visually inspect media files and system information.", "B": "Stellar Data Recovery for quick restoration of corrupted databases.", "C": "Autopsy for a detailed examination and recovery of potential digital evidence.", "D": "Disk Drill to primarily focus on recovering partition structures."}, "correct": "C", "topic": "Incident Response & Forensics", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Autopsy for a detailed examination and recovery of potential digital evidence.</div>", "fill_hint": ""}, {"num": 218, "stem": "You are tasked with designing a cloud storage solution for sensitive data. What should be your first step to secure this environment?", "options": {"A": "Begin by setting public access as the default setting for all storage containers.", "B": "Regularly back up data to an external location without additional security measures.", "C": "Store all data in a publicly accessible storage bucket to facilitate easy access.", "D": "Enable encryption at rest using platform-specific tools like AWS KMS or Azure Key Vault."}, "correct": "D", "topic": "Cloud Security", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Enable encryption at rest using platform-specific tools like AWS KMS or Azure Key Vault.</div>", "fill_hint": ""}, {"num": 219, "stem": "Which command initializes a secure, encrypted virtual disk using VeraCrypt with a 512-bit Whirlpool hash algorithm?", "options": {"A": "cryptsetup luksFormat --size 500M --cipher aes-xts-plain64 --key-size 256", "B": "openssl enc -aes-256-cbc -in unencrypted.dat -out encrypted.dat -pass pass:[Password]", "C": "truecrypt --volume-create --size 500M --encryption Blowfish --file-system FAT32", "D": "veracrypt --create volume.hc --size 500M --encryption AES --hash Whirlpool --password [Password]"}, "correct": "D", "topic": "Cryptography", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Symmetric Encryption (เช่น AES) ใช้ key เดียวกัน encrypt/decrypt เร็วมาก เหมาะส่งข้อมูลปริมาณมาก แต่ปัญหาคือแชร์ key ยังไงให้ปลอดภัย</div>", "fill_hint": ""}, {"num": 220, "stem": "You are tasked with simulating an AI-based worm attack in a controlled environment. The scenario requires that the worm must autonomously spread without direct commands after initiation. Which method should you utilize to initiate this simulation?", "options": {"A": "Utilize an existing botnet to distribute the worm through command and control servers", "B": "Set up a honeypot network with vulnerable virtual machines and use a script to deploy the worm", "C": "Directly inject the worm into the network via an infected USB device", "D": "Deploy the worm via an email phishing campaign targeting all users within the organization"}, "correct": "B", "topic": "Malware & Viruses", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">worm</span></div><div class=\"tip-th\">💡 Honeypot คือระบบ/บริการ decoy ที่ตั้งใจให้ attacker เข้ามา เพื่อดักจับ TTP (Tactics, Techniques, Procedures) โดยไม่กระทบระบบจริง</div>", "fill_hint": ""}, {"num": 221, "stem": "You are configuring a security information and event management (SIEM) system. What rule should you prioritize to detect potential APT activities?", "options": {"A": "Increase log storage capacity to handle the volume of data over long periods.", "B": "Implement strict access controls on all administrative accounts.", "C": "Filter all incoming emails to remove potential phishing attempts.", "D": "Alert on unusual outbound traffic, especially during off-hours."}, "correct": "D", "topic": "Incident Response & Forensics", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">SIEM</span></div><div class=\"tip-th\">💡 Alert on unusual outbound traffic, especially during off-hours.</div>", "fill_hint": ""}, {"num": 222, "stem": "How can you enforce data encryption on enterprise mobile devices?", "options": {"A": "Applying group policies through Active Directory to manage devices.", "B": "Forcing all devices to connect through a secure Wi-Fi network with WPA2.", "C": "Implementing Mobile Device Management (MDM) policies that require encryption.", "D": "Installing third-party security applications that provide encryption."}, "correct": "C", "topic": "Cryptography", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Implementing Mobile Device Management (MDM) policies that require encryption.</div>", "fill_hint": ""}, {"num": 223, "stem": "To identify weak file permissions that could potentially be exploited, what command should be used?", "options": {"A": "ls -lR / | grep \"rwxrwxrwx\"", "B": "find / -type f -name \".htaccess\"", "C": "getfacl --tabular /home/user/", "D": "chmod -R 777 /var/www"}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">✅ คำตอบคือ: <strong>ls -lR / | grep \"rwxrwxrwx\"</strong><br>💡 (ดูคำอธิบายเพิ่มเติมจากเฉลยที่ไฮไลท์สีเขียวด้านบน)</div>", "fill_hint": ""}, {"num": 224, "stem": "A company is implementing a multi-cloud strategy using AWS and Azure. What is a fundamental security measure to protect data across both platforms?", "options": {"A": "Establish a centralized identity management system to control user access and permissions.", "B": "Apply a different set of security tools for each cloud platform, tailored to specific needs.", "C": "Implement platform-specific security protocols without integration for simpler management.", "D": "Use separate credentials for each cloud provider to avoid cross-platform security risks."}, "correct": "A", "topic": "Cloud Security", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Establish a centralized identity management system to control user access and permissions.</div>", "fill_hint": ""}, {"num": 225, "stem": "Fill in the blank: Fileless malware commonly leverages __________ to execute without writing to disk.", "options": {"A": "PowerShell scripts", "B": ".NET Framework", "C": "Windows Registry", "D": "system APIs"}, "correct": "C", "topic": "Malware & Viruses", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">📝 เติมช่องว่าง: <strong>Windows Registry</strong></div>", "fill_hint": ""}, {"num": 226, "stem": "Fill in the blank: To bypass network security measures during penetration testing, an effective method is to utilize __________.", "options": {"A": "Social engineering tactics", "B": "Public Wi-Fi exploitation", "C": "VPN spoofing", "D": "Encrypted tunnels"}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>Encrypted tunnels</strong></div><div class=\"tip-th\">💡 VPN (Virtual Private Network) สร้าง encrypted tunnel ระหว่าง client กับ network ป้องกัน eavesdropping และซ่อน traffic จาก ISP</div>", "fill_hint": ""}, {"num": 227, "stem": "What command allows you to check for SUID enabled files, which might be exploitable on a Linux system?", "options": {"A": "chmod +s filename", "B": "find / -perm -4000 -type f -exec ls -la {} \\;", "C": "grep -i suid /etc/passwd", "D": "ls -l /bin /usr/bin"}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">✅ คำตอบคือ: <strong>find / -perm -4000 -type f -exec ls -la {} \\;</strong><br>💡 (ดูคำอธิบายเพิ่มเติมจากเฉลยที่ไฮไลท์สีเขียวด้านบน)</div>", "fill_hint": ""}, {"num": 228, "stem": "You are tasked with gathering information about the operating systems running on networked devices. Which method would be most effective?", "options": {"A": "Analyzing the TTL values and Window sizes in the packets returning from each device.", "B": "Checking the user-agent strings in HTTP headers from web traffic.", "C": "Querying the DHCP server for a list of all assigned IP addresses and associated devices.", "D": "Sending crafted SYN packets to provoke unique responses from different OS types."}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Analyzing the TTL values and Window sizes in the packets returning from each device.</div>", "fill_hint": ""}, {"num": 229, "stem": "In the investigation of a network breach, which method is best for analyzing network packets captured during the incident?", "options": {"A": "Utilizing Nessus to scan for vulnerabilities exposed during the breach.", "B": "Using Wireshark to filter and analyze the specific protocols involved in the breach.", "C": "Employing NetWitness to conduct a retrospective analysis based on security alerts.", "D": "Applying tcpdump to perform a real-time analysis and logging of all network traffic."}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Wireshark คือ network protocol analyzer ที่ capture และวิเคราะห์ packet แบบ real-time ใช้ตรวจ credentials ใน plain text, troubleshoot network</div>", "fill_hint": ""}, {"num": 230, "stem": "During a security audit, how would you test for susceptibility to a zero-day exploit in a widely used software application?", "options": {"A": "Conducting a series of stress tests and performance benchmarks to identify unusual application responses.", "B": "Reviewing all recent security patches and updates to ensure they are applied.", "C": "Checking compliance with security best practices and guidelines provided by cybersecurity frameworks.", "D": "Simulating targeted attacks using variations of known vulnerabilities on the application."}, "correct": "D", "topic": "Risk, Compliance & Policy", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">zero-day</span></div><div class=\"tip-th\">💡 Simulating targeted attacks using variations of known vulnerabilities on the application.</div>", "fill_hint": ""}, {"num": 231, "stem": "What specific characteristic ate the security posture of a Google Cloud Platform (GCP) project, use the command gcloud ____ audit-logs list.", "options": {"A": "accounts", "B": "projects", "C": "services", "D": "billing"}, "correct": "B", "topic": "Cloud Security", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">📝 เติมช่องว่าง: <strong>projects</strong></div>", "fill_hint": ""}, {"num": 318, "stem": "Fill in the blank: To exploit session hijacking effectively, attackers commonly use ________ tools to sniff network traffic and capture session cookies.", "options": {"A": "Social engineering, to manipulate users into revealing their credentials.", "B": "Packet-sniffing.", "C": "Phishing attacks, to directly ask the user for their session information.", "D": "Port scanning, to identify open ports that may leak session data."}, "correct": "B", "topic": "Network Sniffing & MITM", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">session hijack</span></div><div class=\"tip-th\">📝 เติมช่องว่าง: <strong>Packet-sniffing.</strong></div>", "fill_hint": ""}, {"num": 319, "stem": "What type of session management vulnerability involves an attacker deceiving a user into executing actions on their behalf?", "options": {"A": "Cross-Site Scripting (XSS), which can manipulate client-side scripts.", "B": "Buffer overflow, which could disrupt server session handling.", "C": "SQL Injection, which manipulates backend data processing.", "D": "Cross-Site Request Forgery (CSRF)."}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 CSRF (Cross-Site Request Forgery) คือการหลอกให้ browser ของเหยื่อส่ง request ไปยัง site ที่ login อยู่ โดยเหยื่อไม่รู้ตัว ป้องกัน: CSRF token</div>", "fill_hint": ""}, {"num": 320, "stem": "A cybersecurity analyst is tasked with assessing the risk of firmware manipulation in IoT devices. What technique should be prioritized to ensure firmware integrity?", "options": {"A": "Using password protection for accessing device firmware settings.", "B": "Implementing cryptographic signatures to validate firmware updates.", "C": "Ensuring physical security to prevent unauthorized access to IoT device hardware.", "D": "Regularly scheduling automatic firmware updates without manual intervention."}, "correct": "B", "topic": "Wireless/IoT & Other", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Implementing cryptographic signatures to validate firmware updates.</div>", "fill_hint": ""}, {"num": 321, "stem": "A penetration tester is tasked with capturing network traffic on a target network. Which tool would they use to monitor and analyze this traffic for signs of vulnerabilities or malicious activity?", "options": {"A": "Kismet, which is used to detect and analyze wireless networks, focusing on capturing wireless traffic rather than wired network packet analysis.", "B": "Ettercap, a suite for man-in-the-middle attacks and network analysis, focusing on manipulating network traffic rather than just capturing it for analysis.", "C": "Netcat, a utility for reading and writing network connections, often used for backdoor creation but not specialized in network traffic analysis.", "D": "Wireshark, a packet capture tool that provides deep analysis of network traffic and can help identify vulnerabilities or signs of active attacks."}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Wireshark คือ network protocol analyzer ที่ capture และวิเคราะห์ packet แบบ real-time ใช้ตรวจ credentials ใน plain text, troubleshoot network</div>", "fill_hint": ""}, {"num": 322, "stem": "During a penetration test, you discover that an ICS system is vulnerable to buffer overflow attacks. What is the best initial action to take?", "options": {"A": "Recommending a firmware update to the manufacturer to address the vulnerability.", "B": "Applying a security patch to the system without further analysis of the impact.", "C": "Documenting the specific payload that caused the overflow and isolating the affected system.", "D": "Immediately shutting down the affected system to prevent further exploitation."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">buffer overflow</span> · <span class=\"kw-tag\">ICS</span></div><div class=\"tip-th\">💡 Documenting the specific payload that caused the overflow and isolating the affected system.</div>", "fill_hint": ""}, {"num": 323, "stem": "Which configuration change is most effective in preventing unauthorized remote access to system utilities and shell environments?", "options": {"A": "Enabling Remote Desktop Protocol (RDP) for remote administration.", "B": "Implementing biometric authentication for system access.", "C": "Disabling the firewall and focusing on intranet security only.", "D": "Restricting SSH access to known IP addresses only."}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">✅ คำตอบคือ: <strong>Restricting SSH access to known IP addresses only.</strong><br>💡 (ดูคำอธิบายเพิ่มเติมจากเฉลยที่ไฮไลท์สีเขียวด้านบน)</div>", "fill_hint": ""}, {"num": 324, "stem": "During a routine security check, a security analyst needs to verify the identity federation settings in AWS to ensure compliance with corporate security policies. What is the initial step?", "options": {"A": "Examine the trust relationships in the AWS Identity and Access Management (IAM) roles.", "B": "Inspect the configuration of network access control lists (ACLs).", "C": "Review the integrated audit logs within the AWS CloudTrail service.", "D": "Validate the security groups associated with AWS resource deployments."}, "correct": "A", "topic": "Risk, Compliance & Policy", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Examine the trust relationships in the AWS Identity and Access Management (IAM) roles.</div>", "fill_hint": ""}, {"num": 325, "stem": "An industrial plant utilizes a SCADA system to manage wastewater treatment. The system recently faced a targeted malware attack that exploited outdated firmware on several PLCs. What should be the initial step in responding to this incident?", "options": {"A": "Resetting all passwords related to the SCADA system components.", "B": "Installing antivirus software on all terminals within the SCADA network.", "C": "Applying the latest security patches to the SCADA software system.", "D": "Conduct a thorough audit of all PLCs to check for any other potential vulnerabilities."}, "correct": "D", "topic": "Malware & Viruses", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">SCADA</span></div><div class=\"tip-th\">💡 Conduct a thorough audit of all PLCs to check for any other potential vulnerabilities.</div>", "fill_hint": ""}, {"num": 326, "stem": "In the process of hardening a server's security, what is the first action you should take after installing the operating system?", "options": {"A": "Configuring a network firewall to filter incoming and outgoing traffic.", "B": "Creating a backup of the system state and important data.", "C": "Setting up a strong password policy for all user accounts.", "D": "Applying the latest security patches and updates."}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">✅ คำตอบคือ: <strong>Applying the latest security patches and updates.</strong><br>💡 (ดูคำอธิบายเพิ่มเติมจากเฉลยที่ไฮไลท์สีเขียวด้านบน)</div>", "fill_hint": ""}, {"num": 327, "stem": "In the context of ICS security, fill in the blank: Commonly, attackers exploit ________ services to gain unauthorized access.", "options": {"A": "Open ports that are accessible over the internet.", "B": "Weakly encrypted wireless communication links.", "C": "Unsecured remote management.", "D": "Outdated firewall rules that do not conform to current threats."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">ICS</span></div><div class=\"tip-th\">📝 เติมช่องว่าง: <strong>Unsecured remote management.</strong></div>", "fill_hint": ""}, {"num": 328, "stem": "To execute an unauthorized command injection on an ICS device via its web interface, which HTTP method is most commonly exploited?", "options": {"A": "The HTTP GET method, often due to poor input validation by devices.", "B": "The HTTP POST method, due to its capability to include significant data payloads.", "C": "The HTTP PUT method, used for uploading data which can be manipulated.", "D": "The HTTP DELETE method, which can sometimes be tricked into executing commands."}, "correct": "B", "topic": "SQL Injection", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">ICS</span></div><div class=\"tip-th\">💡 HTTP POST ใช้ส่ง payload ขนาดใหญ่ใน request body ทำให้ฉีด command ผ่าน POST parameter ได้โดยไม่ปรากฏใน URL</div>", "fill_hint": ""}, {"num": 329, "stem": "A cybersecurity auditor is assessing the security of a SCADA system in a power plant. They are specifically focusing on the communication protocols used between devices. Which of these protocols, if found during the audit, would indicate a need for immediate security enhancements due to its lack of built-in security features?", "options": {"A": "Modbus protocol, as it does not support encryption natively.", "B": "OPC UA, which includes security features such as authentication and encryption.", "C": "DNP3, commonly used in North American utilities with some security features.", "D": "EtherCAT protocol, known for its high-speed communication."}, "correct": "A", "topic": "Risk, Compliance & Policy", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">SCADA</span></div><div class=\"tip-th\">💡 Modbus protocol, as it does not support encryption natively.</div>", "fill_hint": ""}, {"num": 330, "stem": "Which AI-driven technique can be used to identify suspicious patterns indicating an advanced persistent threat (APT) during network monitoring?", "options": {"A": "Machine learning models that analyze traffic flow and behavior to detect deviations from known patterns of legitimate activity.", "B": "Heuristic algorithms evaluating metadata and user behavior to identify deviations from typical activities across the network.", "C": "Signature-based models comparing incoming traffic to a database of known attack signatures to identify potential APTs.", "D": "Rule-based AI systems using predefined policies to flag suspicious activities that deviate from organizational norms and policies."}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Machine learning models that analyze traffic flow and behavior to detect deviations from known patterns of legitimate activity.</div>", "fill_hint": ""}, {"num": 331, "stem": "What command would you use to search for exploitable services running on an Ubuntu server?", "options": {"A": "ps aux", "B": "nmap -sV <target IP>", "C": "netstat -tulpn", "D": "top"}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Nmap คือ network scanner ใช้ค้นหา hosts, open ports, services, OS (-sS=stealth SYN, -O=OS detect, -sV=version, -A=aggressive)</div>", "fill_hint": ""}, {"num": 332, "stem": "What should be your first action when attempting to exploit a vulnerable service in a simulated AI-powered environment?", "options": {"A": "Perform a vulnerability scan using automated AI-powered tools.", "B": "Use a sandbox environment to test different attack techniques.", "C": "Manually exploit the service by identifying known vulnerabilities.", "D": "Patch the service immediately to prevent further exploitation."}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Perform a vulnerability scan using automated AI-powered tools.</div>", "fill_hint": ""}, {"num": 333, "stem": "During the initial stages of a data breach, what is the most effective action to contain the breach and prevent further damage?", "options": {"A": "Disconnect affected systems from the network to halt unauthorized access and prevent further data loss across the infrastructure.", "B": "Patch all known vulnerabilities on the affected systems immediately to prevent the attackers from exploiting the same weaknesses.", "C": "Notify the cybersecurity vendor to analyze the situation and develop a patch to secure the network from the ongoing breach.", "D": "Reboot all systems across the network to clear malicious processes and return the environment to a clean state for investigation."}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Disconnect affected systems from the network to halt unauthorized access and prevent further data loss across the infrastructure.</div>", "fill_hint": ""}, {"num": 334, "stem": "Which tool is best suited for extracting hashed passwords from a Windows 10 system for offline cracking?", "options": {"A": "Wireshark, which is mainly used for network traffic analysis and might capture passwords in transit if they are not encrypted.", "B": "Mimikatz, because it can extract plaintext passwords, hashes, PIN codes, and kerberos tickets from memory.", "C": "John the Ripper, which primarily functions as a password cracker that supports numerous hash types through customizable rule sets.", "D": "Cain & Abel, a password recovery tool for Microsoft Operating Systems, capable of recovering various types of passwords."}, "correct": "B", "topic": "Cryptography", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Mimikatz คือ post-exploitation tool ที่ดึง plaintext passwords, NTLM hashes, Kerberos tickets จาก Windows memory (LSASS process)</div>", "fill_hint": ""}, {"num": 335, "stem": "If you are performing a security audit on an IoT device and you want to test for vulnerabilities in its API, what command might you use to send a malformed JSON payload?", "options": {"A": "python -m http.server --cgi http://iotdevice/malformed_json", "B": "wget --post-data '{\"username\": \"admin\", \"password\": \"admin\"}' http://iotdevice/api", "C": "netcat iotdevice 80 < malformed_json.txt", "D": "curl -X POST -H \"Content-Type: application/json\" -d '{\"login\": undefined}' http://iotdevice/api/login"}, "correct": "D", "topic": "Wireless/IoT & Other", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 curl -X POST -H \"Content-Type: application/json\" -d '{\"login\": undefined}' http://iotdevice/api/login</div>", "fill_hint": ""}, {"num": 336, "stem": "What command can be used to display current privilege levels on a Windows system?", "options": {"A": "usercheck", "B": "whoami /priv", "C": "getuid", "D": "net user"}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">✅ คำตอบคือ: <strong>whoami /priv</strong><br>💡 (ดูคำอธิบายเพิ่มเติมจากเฉลยที่ไฮไลท์สีเขียวด้านบน)</div>", "fill_hint": ""}, {"num": 337, "stem": "You need to exploit a Remote Code Execution vulnerability in a Windows server. What is the first step in preparing the attack?", "options": {"A": "Conducting social engineering attacks to gain physical access to the server and manually install malware.", "B": "Running a full system antivirus scan to ensure that no security software is actively monitoring or blocking the planned attack vectors.", "C": "Confirming the target system's vulnerability and exact version to tailor the exploit code specifically to the server's configuration.", "D": "Disabling the Windows Firewall to prevent it from blocking incoming connections that could be used to deliver the payload."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Confirming the target system's vulnerability and exact version to tailor the exploit code specifically to the server's configuration.</div>", "fill_hint": ""}, {"num": 338, "stem": "Identify the most effective security measure to protect SCADA systems from unauthorized access through the network.", "options": {"A": "Implementing strong network segmentation and applying strict firewall rules to isolate the SCADA network.", "B": "Conducting comprehensive employee training on cybersecurity best practices and phishing attack prevention.", "C": "Deploying intrusion detection systems to monitor for suspicious activity and alert security personnel.", "D": "Regularly updating antivirus software and ensuring that all security patches are applied promptly."}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">SCADA</span></div><div class=\"tip-th\">💡 Implementing strong network segmentation and applying strict firewall rules to isolate the SCADA network.</div>", "fill_hint": ""}, {"num": 339, "stem": "To penetrate a networked industrial control system, what is the first step in a chain of actions to exploit a known vulnerability in network protocols?", "options": {"A": "Perform network reconnaissance to map the architecture and identify key nodes.", "B": "Exploit the wireless communication protocols to intercept and alter data.", "C": "Use social engineering to gain credentials for administrative ICS access.", "D": "Conduct a denial of service attack to overwhelm networked control systems."}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Perform network reconnaissance to map the architecture and identify key nodes.</div>", "fill_hint": ""}, {"num": 340, "stem": "You are tasked with creating a secure network architecture for a new SCADA system in an oil refinery. What is the most effective strategy to segregate the network and reduce the risk of cyberattacks?", "options": {"A": "Utilizing redundant network pathways to ensure reliability and security.", "B": "Designing a network with a demilitarized zone (DMZ) between the corporate and SCADA networks.", "C": "Incorporating biometric security measures at all data entry points.", "D": "Using air-gapping to completely isolate the SCADA network from all other networks."}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">SCADA</span></div><div class=\"tip-th\">💡 Designing a network with a demilitarized zone (DMZ) between the corporate and SCADA networks.</div>", "fill_hint": ""}, {"num": 341, "stem": "Which of the following methods is most effective for preventing unauthorized access to a SCADA system's control server via remote access?", "options": {"A": "Applying regular security patches and updates to the SCADA software itself.", "B": "Enforcing multi-factor authentication on all device logins within the network.", "C": "Encrypting all data transmitted between the SCADA control center and field devices.", "D": "Implementing strict firewall policies and VPN requirements for any remote connections."}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">SCADA</span></div><div class=\"tip-th\">💡 VPN (Virtual Private Network) สร้าง encrypted tunnel ระหว่าง client กับ network ป้องกัน eavesdropping และซ่อน traffic จาก ISP</div>", "fill_hint": ""}, {"num": 342, "stem": "What specific command in the Modbus TCP protocol would an attacker typically use to alter the flow of data to a critical infrastructure system?", "options": {"A": "Reading device identification information using function code 43 to gather system details without authorization.", "B": "Sending a diagnostics request using function code 08 to test network connectivity and device status.", "C": "Writing a single register value using function code 06, which could alter device configuration or behavior.", "D": "Executing a force listen only mode command using function code 04 to eavesdrop on communications."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Writing a single register value using function code 06, which could alter device configuration or behavior.</div>", "fill_hint": ""}, {"num": 343, "stem": "What common vulnerability might an attacker exploit in an IoT device that uses default credentials?", "options": {"A": "Distributed Denial of Service (DDoS) attacks to overwhelm the device and disrupt service.", "B": "Brute-force attack to access the device using commonly known usernames and passwords.", "C": "Cross-site Scripting (XSS) to inject malicious scripts in IoT web applications.", "D": "SQL injection to exploit poor input validation in web interfaces of IoT devices."}, "correct": "B", "topic": "Wireless/IoT & Other", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Brute-force Attack คือการลองทุก key/password จนกว่าจะถูก ใช้เวลาแปรผันตามความยาว key ป้องกัน: key ยาว + account lockout + MFA</div>", "fill_hint": ""}, {"num": 344, "stem": "Fill in the blank: To identify vulnerabilities in a SCADA system, the command nmap --script s7-info -p 102 ______ targets devices using Siemens S7 protocol.", "options": {"A": "<host name>", "B": "<subnet mask>", "C": "<target IP>", "D": "<network range>"}, "correct": "C", "topic": "Scanning & Enumeration Tools", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">nmap</span> · <span class=\"kw-tag\">SCADA</span></div><div class=\"tip-th\">📝 เติมช่องว่าง: <strong><target IP></strong></div>", "fill_hint": ""}, {"num": 345, "stem": "A security analyst suspects that an update from a third-party vendor includes a backdoor. What command should they use to check the integrity of the downloaded file?", "options": {"A": "chmod +x filename.zip", "B": "file filename.zip", "C": "ls -l filename.zip", "D": "sha256sum filename.zip"}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">✅ คำตอบคือ: <strong>sha256sum filename.zip</strong><br>💡 (ดูคำอธิบายเพิ่มเติมจากเฉลยที่ไฮไลท์สีเขียวด้านบน)</div>", "fill_hint": ""}, {"num": 346, "stem": "In what way does machine learning enhance the detection of zero-day vulnerabilities commonly exploited in APT attacks?", "options": {"A": "By using sandbox environments to execute unknown binaries and monitoring their behavior for indicators of compromise.", "B": "By correlating historical attack data from signature databases with current system activity to detect potential zero-day vulnerabilities.", "C": "By recognizing patterns in new or modified attack vectors, machine learning can predict the presence of vulnerabilities without relying on signature-based detection.", "D": "By scanning system logs and identifying events that match predefined rules for potential exploitation of unknown vulnerabilities."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">zero-day</span></div><div class=\"tip-th\">💡 Signature-based Detection เปรียบ traffic กับ database of known threats เร็วและ False Positive ต่ำ แต่ไม่จับ zero-day</div>", "fill_hint": ""}, {"num": 347, "stem": "Fill in the blank: To check for outdated software versions on Ubuntu, use the command ______ -l --security.", "options": {"A": "dpkg --get-selections", "B": "apt list", "C": "apt-cache policy", "D": "ubuntu-security-status"}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">📝 เติมช่องว่าง: <strong>apt list</strong></div>", "fill_hint": ""}, {"num": 348, "stem": "What is the command to exploit a vulnerability using Metasploit's Meterpreter to establish a reverse shell on a target machine?", "options": {"A": "use exploit/windows/smb/ms08_067_netapi, which targets a known Windows vulnerability but is not specific to setting up a reverse shell via Meterpreter.", "B": "use auxiliary/admin/smb/ms17_010_eternalblue, which prepares Metasploit for targeting Windows SMB vulnerabilities but is not used for establishing a reverse shell.", "C": "set payload windows/meterpreter/reverse_tcp, which sets the payload type for the Meterpreter session but does not run the actual exploitation command.", "D": "exploit -j -z, which initiates the exploitation and runs the job in the background without waiting for the process to complete."}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">Metasploit</span></div><div class=\"tip-th\">💡 exploit -j -z, which initiates the exploitation and runs the job in the background without waiting for the process to complete.</div>", "fill_hint": ""}, {"num": 349, "stem": "During a security audit, you are tasked with analyzing data collected by an AI-powered threat detection system. What command could be used to view anomalies in process execution on a Linux-based system?", "options": {"A": "lsof -i -P, which lists open files and the processes that opened them, revealing any unauthorized access to sensitive files.", "B": "top -b -n 1 | grep COMMAND, displaying processes by memory usage, which can help reveal suspicious applications running with high resource demands.", "C": "ps aux --sort=-%cpu, which lists all processes, sorting them by CPU usage, helping to identify suspicious spikes in activity.", "D": "netstat -anp | grep ESTABLISHED, which displays network connections, indicating if an unauthorized process is communicating externally."}, "correct": "C", "topic": "Risk, Compliance & Policy", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 ps aux --sort=-%cpu, which lists all processes, sorting them by CPU usage, helping to identify suspicious spikes in activity.</div>", "fill_hint": ""}, {"num": 350, "stem": "Fill in the blank: When analyzing a suspected deepfake video, checking for inconsistencies in lighting across frames is best done using _______ to detect unusual pixel patterns.", "options": {"A": "Standard image processing filters.", "B": "Digital fingerprinting tools.", "C": "AI-powered image analysis software.", "D": "Network traffic monitoring tools."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">📝 เติมช่องว่าง: <strong>AI-powered image analysis software.</strong></div>", "fill_hint": ""}, {"num": 351, "stem": "What initial step should be taken when using AI-based deepfake detection software to identify manipulated media?", "options": {"A": "Perform reverse image searches to find any original versions of the media.", "B": "Conduct a manual review of facial movements and expressions.", "C": "Run the media through the detection tool’s machine learning algorithms.", "D": "Examine the video's audio-visual synchronization for timing discrepancies."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Run the media through the detection tool’s machine learning algorithms.</div>", "fill_hint": ""}, {"num": 352, "stem": "Which command would you use to disable guest access on a Windows system to enhance security?", "options": {"A": "usermod -L guest", "B": "disable guest", "C": "net user guest /active:no", "D": "guestaccount off"}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">✅ คำตอบคือ: <strong>net user guest /active:no</strong><br>💡 (ดูคำอธิบายเพิ่มเติมจากเฉลยที่ไฮไลท์สีเขียวด้านบน)</div>", "fill_hint": ""}, {"num": 353, "stem": "When assessing vulnerabilities in cloud storage services, what should be checked first to prevent unauthorized access?", "options": {"A": "Audit user access permissions to determine least privilege compliance.", "B": "Review the bucket’s public access settings to ensure they are secure.", "C": "Ensure encryption keys used for data at rest are rotated regularly.", "D": "Test for susceptibility to cross-site scripting (XSS) in web interfaces."}, "correct": "B", "topic": "Cloud Security", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Review the bucket’s public access settings to ensure they are secure.</div>", "fill_hint": ""}, {"num": 354, "stem": "In a scenario where an attacker is using a packet sniffer to capture unencrypted login credentials, what countermeasure would be most effective in preventing the compromise of these credentials?", "options": {"A": "Disabling unused ports and protocols to reduce attack surfaces but not addressing the capture of legitimate traffic by sniffers.", "B": "Enabling encrypted protocols such as SSH for remote login, which prevents plaintext credentials from being captured by packet sniffers.", "C": "Changing passwords regularly to limit the impact of any stolen credentials without necessarily addressing the sniffing itself.", "D": "Implementing two-factor authentication (2FA) for login systems to add an extra layer of security to credentials, reducing the effectiveness of sniffing."}, "correct": "B", "topic": "Network Sniffing & MITM", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Enabling encrypted protocols such as SSH for remote login, which prevents plaintext credentials from being captured by packet sniffers.</div>", "fill_hint": ""}, {"num": 355, "stem": "In a scenario where the AI-powered cyber range has detected unusual network behavior, which command can be used to trace the source of an active attack on a specific port?", "options": {"A": "Use netstat -an to monitor active connections on the machine.", "B": "Analyze the firewall rules with iptables to block suspicious traffic.", "C": "Execute traceroute to track the attack path across the network.", "D": "Review the system logs using dmesg to identify the attack origin."}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Use netstat -an to monitor active connections on the machine.</div>", "fill_hint": ""}, {"num": 356, "stem": "After successfully gaining access to a system in an AI-driven cyber range simulation, what command can be used to identify system users and privilege levels for further escalation?", "options": {"A": "Run whoami to determine the current user’s privileges.", "B": "Check for open ports using netcat to find exposed services.", "C": "Inspect running processes using ps aux to locate potential malicious activity.", "D": "Monitor file system changes with inotifywatch for further intrusion attempts."}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">✅ คำตอบคือ: <strong>Run whoami to determine the current user’s privileges.</strong><br>💡 (ดูคำอธิบายเพิ่มเติมจากเฉลยที่ไฮไลท์สีเขียวด้านบน)</div>", "fill_hint": ""}, {"num": 357, "stem": "When preparing to exploit a buffer overflow vulnerability in an Ubuntu application, what is crucial to determine first?", "options": {"A": "Analyze the network traffic generated by the application to find anomalies.", "B": "Identify whether the application has stack protection mechanisms enabled.", "C": "Determine if the application is running as a root user or regular user.", "D": "Check if the operating system has recently been updated or patched."}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">buffer overflow</span></div><div class=\"tip-th\">💡 ISO 27001 คือมาตรฐาน international สำหรับ Information Security Management System (ISMS) framework สำหรับจัดการ security องค์กร</div>", "fill_hint": ""}, {"num": 358, "stem": "In an industrial control system, what is the primary function of a programmable logic controller (PLC) when configured to manage water pressure in a municipal supply network?", "options": {"A": "Logging data for compliance purposes and providing backup for data retrieval after system failures.", "B": "Generating financial reports for the utilities department to assist in budget planning and forecasting.", "C": "Coordinating scheduled maintenance activities and issuing alerts for potential hardware failures.", "D": "Monitoring and adjusting the flow rates and pressure to ensure consistent service levels."}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Monitoring and adjusting the flow rates and pressure to ensure consistent service levels.</div>", "fill_hint": ""}, {"num": 359, "stem": "Considering a malware sample suspected of encrypting files, what initial analysis step should you take to confirm this behavior?", "options": {"A": "Execute the malware in a controlled environment and observe the behavior.", "B": "Reverse engineer the malware code to find cryptographic functions.", "C": "Perform static analysis to identify encryption-related strings in the binary.", "D": "Analyze the network traffic generated by the malware to detect any anomaly."}, "correct": "C", "topic": "Malware & Viruses", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Perform static analysis to identify encryption-related strings in the binary.</div>", "fill_hint": ""}, {"num": 360, "stem": "A piece of malware is suspected to modify system registry settings to achieve persistence. Which of these tools would be most appropriate for monitoring such changes?", "options": {"A": "Total Commander", "B": "RegShot", "C": "ProcMon", "D": "Wireshark"}, "correct": "B", "topic": "Malware & Viruses", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">✅ คำตอบคือ: <strong>RegShot</strong><br>💡 (ดูคำอธิบายเพิ่มเติมจากเฉลยที่ไฮไลท์สีเขียวด้านบน)</div>", "fill_hint": ""}, {"num": 361, "stem": "A security analyst is reviewing firewall logs for an energy distribution network. They notice unusual outbound traffic patterns on TCP port 502. What is the most likely cause of this activity?", "options": {"A": "Potential command and control (C&C) communication from a compromised SCADA device.", "B": "Scheduled maintenance updates being misinterpreted as malicious activity due to misconfigured security devices.", "C": "Misrouting of internal traffic due to incorrect configuration of network address translation settings.", "D": "The presence of a benign software update process for operational technology equipment."}, "correct": "A", "topic": "IDS/IPS & Firewalls", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Botnet คือเครือข่ายของเครื่องที่ถูก compromise (zombie) และอยู่ภายใต้การควบคุม Command & Control (C&C) server ของ attacker</div>", "fill_hint": ""}, {"num": 362, "stem": "What protocol is primarily used to communicate with PLCs in industrial environments, and its security can be tested using specific scanning tools?", "options": {"A": "CAN bus", "B": "Profibus", "C": "Ethernet/IP", "D": "Modbus"}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">✅ คำตอบคือ: <strong>Modbus</strong><br>💡 (ดูคำอธิบายเพิ่มเติมจากเฉลยที่ไฮไลท์สีเขียวด้านบน)</div>", "fill_hint": ""}, {"num": 363, "stem": "An attacker gains initial access to a system with user-level privileges. What should be their next step to escalate privileges using a service exploit?", "options": {"A": "Exploit common user misconfigurations in network settings to intercept credentials.", "B": "Conduct a denial of service attack to
