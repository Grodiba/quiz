<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEH v13 - ระบบติวสอบ</title>
<style>
:root{
  --bg:#0f1420; --panel:#161d2e; --panel2:#1d2537; --accent:#4f8cff; --accent2:#7c5cff;
  --good:#2ecc71; --bad:#ff5d6c; --text:#e8ecf5; --sub:#94a1bd; --border:#2a3350;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Sarabun",sans-serif;background:linear-gradient(160deg,#0c1120,#141b2e 60%,#0f1420);color:var(--text);min-height:100vh;}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 60px;}
header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
header.top h1{font-size:20px;margin:0;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
header.top .stats-mini{font-size:13px;color:var(--sub);}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 4px 20px rgba(0,0,0,.25);}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:640px){.grid{grid-template-columns:1fr;}}
.mode-card{cursor:pointer;transition:.15s;border:1px solid var(--border);}
.mode-card:hover{transform:translateY(-2px);border-color:var(--accent);}
.mode-card h3{margin:0 0 6px;font-size:16px;}
.mode-card p{margin:0;font-size:13px;color:var(--sub);line-height:1.5;}
.mode-card .icon{font-size:26px;margin-bottom:8px;display:block;}
button{font-family:inherit;}
.btn{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;border:none;padding:11px 20px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;}
.btn.secondary{background:var(--panel2);border:1px solid var(--border);color:var(--text);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
.progressbar{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden;margin:8px 0 4px;}
.progressbar > div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s;}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#3a2a12;color:#ffb84d;border:1px solid #6b4a1f;margin-left:8px;vertical-align:middle;}
.topic-pill{display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;background:var(--panel2);color:var(--sub);border:1px solid var(--border);}
.qnum{font-size:13px;color:var(--sub);margin-bottom:10px;}
.stem{font-size:17px;line-height:1.6;margin-bottom:18px;}
.opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:14px 16px;border-radius:12px;margin-bottom:10px;cursor:pointer;font-size:14.5px;line-height:1.55;transition:.12s;}
.opt:hover:not(.locked){border-color:var(--accent);}
.opt.correct{background:#15351f;border-color:var(--good);color:#c8f5d6;}
.opt.wrong{background:#3a1420;border-color:var(--bad);color:#ffd0d5;}
.opt .letter{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:6px;background:#2a3350;font-weight:700;font-size:12px;margin-right:10px;}
.opt.correct .letter{background:var(--good);color:#062b12;}
.opt.wrong .letter{background:var(--bad);color:#2b0409;}
.explain{background:var(--panel2);border-left:3px solid var(--accent);padding:12px 14px;border-radius:8px;font-size:13.5px;color:var(--sub);margin-top:10px;line-height:1.6;}
.hidden{display:none !important;}
.topbar-q{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px;color:var(--sub);}
select, input[type=number]{background:var(--panel2);color:var(--text);border:1px solid var(--border);padding:8px 10px;border-radius:8px;font-size:14px;}
.result-big{font-size:42px;font-weight:800;text-align:center;margin:10px 0;}
.result-pass{color:var(--good);} .result-fail{color:var(--bad);}
.small{font-size:12.5px;color:var(--sub);}
.stat-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px;}
.stat-row:last-child{border-bottom:none;}
.topiclist{max-height:260px;overflow:auto;margin-top:8px;}
.link-btn{background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;text-decoration:underline;padding:0;}
.trick-box{border-radius:12px;padding:14px 16px;margin-top:12px;border:1px solid;}
.correct-box{background:#0e2b1c;border-color:#2ecc71;}
.wrong-box{background:#2b0d14;border-color:#ff5d6c;}
.trick-result{font-size:15px;font-weight:700;margin-bottom:10px;}
.trick-tip{font-size:14.5px;line-height:1.7;color:var(--text);}
.trick-tip strong{color:#ffe8a0;}
.kw-row{font-size:13px;color:#aaa;margin-bottom:8px;}
.kw-tag{background:#1e2d40;color:#7dc4f8;border-radius:4px;padding:1px 6px;margin:0 2px;font-size:12px;}
.tip-th{font-size:14.5px;line-height:1.75;}
.tip-fill{font-size:14.5px;margin-bottom:6px;color:#ffe8a0;}
.miss-item{padding:10px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
.miss-item b{color:#ffd0d5;}
footer.note{margin-top:30px;text-align:center;color:var(--sub);font-size:12px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const QUESTIONS = [{"num": 1, "stem": "What technique is primarily used to escalate privileges in a compromised system?", "options": {"A": "Exploitation of system services", "B": "Configuring firewall settings", "C": "Using social engineering techniques", "D": "Creating admin accounts manually"}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">✅ คำตอบคือ: <strong>Exploitation of system services</strong><br>💡 (ดูคำอธิบายเพิ่มเติมจากเฉลยที่ไฮไลท์สีเขียวด้านบน)</div>", "fill_hint": ""}, {"num": 2, "stem": "A company stores sensitive data in the cloud and uses multiple cloud services. What is a common security measure to protect data across different services?", "options": {"A": "Deploying anti-virus and anti-malware software.", "B": "Segmentation of network access.", "C": "Regular security audits and vulnerability assessments.", "D": "Use of a unified security management platform."}, "correct": "D", "topic": "Cloud Security", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Unified Security Management คือการรวม security monitoring ของหลาย cloud services ไว้ที่เดียว ให้ visibility ครบโดยไม่ต้องดูทีละ platform</div>", "fill_hint": ""}, {"num": 3, "stem": "In a simulated environment, a security analyst observes encrypted traffic between a client and server to prevent sensitive data exposure. What type of sniffing is being demonstrated?", "options": {"A": "Active sniffing involves injecting traffic into the network to induce responses that reveal information about its structure.", "B": "Passive sniffing involves monitoring network traffic without interfering with the transmission and does not alter the packets being transmitted.", "C": "Spoofing involves disguising communication from an unknown source as being from a known, trusted source.", "D": "Man-in-the-middle attack involves intercepting and possibly altering the communication between two parties who believe they are directly communicating with each other."}, "correct": "B", "topic": "Network Sniffing & MITM", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Passive Sniffing คือการดักฟัง traffic โดยไม่ส่ง packet เพิ่มเลย ทำได้ง่ายใน Hub network เพราะ Hub broadcast ทุก packet ออกทุก port</div>", "fill_hint": ""}, {"num": 4, "stem": "A company’s firewall suddenly begins to drop legitimate traffic, suspecting an attack due to an unusually high volume of requests from various sources. What type of attack is likely occurring?", "options": {"A": "Volume-based attacks involve saturating the bandwidth of the attacked site and are measured in bits per second.", "B": "Distributed Denial of Service (DDoS) attack involves multiple compromised systems attacking a single target, causing denial of service.", "C": "Application-layer flood targets the layer where web pages are generated on the server and delivered in response to HTTP requests.", "D": "Protocol attack involves exploiting weaknesses in layer 3 and layer 4 protocol stacks to render the target inaccessible."}, "correct": "B", "topic": "IDS/IPS & Firewalls", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 DDoS (Distributed DoS) คือการโจมตีจากหลาย compromised systems (botnet) พร้อมกัน ทำให้ยาก block เพราะ source IP หลายหมื่น</div>", "fill_hint": ""}, {"num": 5, "stem": "Fill in the blank: To cover their tracks, hackers often use _______ to manipulate logs.", "options": {"A": "Network sniffing", "B": "Disk encryption", "C": "Log tampering", "D": "Using a proxy server"}, "correct": "C", "topic": "Privilege Escalation & Post-Exploitation", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">cover their track</span></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>Log tampering</strong></div><div class=\"tip-th\">💡 Covering Tracks คือการลบ/แก้ไข log files เพื่อซ่อนร่องรอยการโจมตี เช่น Windows Event Log, /var/log/auth.log, bash history</div>", "fill_hint": ""}, {"num": 6, "stem": "What attack exploits misconfigured web servers by sending specially crafted HTTP requests, causing the server to reveal sensitive data?", "options": {"A": "Remote code execution allows an attacker to execute arbitrary commands on a web server by exploiting vulnerabilities in web applications.", "B": "Directory traversal allows attackers to access restricted files on a web server by manipulating URL parameters to traverse directories.", "C": "Cross-site scripting (XSS) attack allows an attacker to inject client-side scripts into web pages viewed by other users.", "D": "Privilege escalation allows attackers to gain higher-level access or control over a server by exploiting security flaws."}, "correct": "B", "topic": "Web Application Attacks", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Directory Traversal คือการใช้ ../ ใน URL เพื่อเข้าถึงไฟล์นอก web root เช่น /etc/passwd หรือ config files ที่ไม่ควรเปิดเผย</div>", "fill_hint": ""}, {"num": 7, "stem": "During an audit, a security analyst discovers that input fields accept SQL commands directly. What type of vulnerability is this?", "options": {"A": "A direct SQL injection vulnerability.", "B": "SQL injection via third-party API integrations.", "C": "Cross-site scripting (XSS) vulnerability triggered by unescaped output, not input handling.", "D": "Indirect SQL injection through secondary applications."}, "correct": "A", "corrected": true, "correction_note": "ตัวเลือกซ้ำ/ไม่สมเหตุสมผลในต้นฉบับ ระบบแก้ไขให้แล้ว", "topic": "SQL Injection", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 SQL Injection คือการแทรก SQL command ใน input field เพื่อให้ database execute คำสั่งที่ไม่ได้ตั้งใจ เช่น ดึงข้อมูล ลบข้อมูล หรือ bypass auth</div>", "fill_hint": ""}, {"num": 8, "stem": "What technique involves an attacker impersonating an IT support staff member to trick employees into giving them their passwords?", "options": {"A": "Phishing involves sending emails that appear to be from reputable sources to induce individuals to reveal personal information.", "B": "Vishing uses the telephone system to trick the user into disclosing personal and financial information.", "C": "Pretexting involves creating a fabricated scenario or pretext to engage a targeted victim in order to steal their confidential data.", "D": "Spear phishing targets specific individuals or companies, unlike phishing, which targets broader audiences."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Pretexting คือการสร้างสถานการณ์หรือบทบาทปลอม (เช่น แกล้งเป็น IT support / ผู้บริหาร) เพื่อหลอกให้เหยื่อไว้ใจและเปิดเผยข้อมูลหรือให้ access</div>", "fill_hint": ""}, {"num": 9, "stem": "Which method involves injecting malicious SQL queries into a web server's input field to retrieve or manipulate database information?", "options": {"A": "Classic (in-band) SQL injection, where malicious SQL is injected directly into an input field to retrieve or manipulate database data.", "B": "Blind SQL injection allows attackers to infer data from a database even when the server does not directly reveal information in the response.", "C": "Union-based SQL injection extracts information by joining multiple select queries, merging results from different database tables.", "D": "Error-based SQL injection uses error messages generated by the server to extract data from the underlying database."}, "correct": "A", "corrected": true, "correction_note": "ตัวเลือกซ้ำ/ไม่สมเหตุสมผลในต้นฉบับ ระบบแก้ไขให้แล้ว", "topic": "SQL Injection", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 SQL Injection คือการแทรก SQL command ใน input field เพื่อให้ database execute คำสั่งที่ไม่ได้ตั้งใจ เช่น ดึงข้อมูล ลบข้อมูล หรือ bypass auth</div>", "fill_hint": ""}, {"num": 10, "stem": "Which method is primarily used to ensure the integrity and authenticity of a message?", "options": {"A": "HMAC (Hash-based Message Authentication Code)", "B": "Digital signatures", "C": "SSL/TLS certificates", "D": "Public key infrastructure (PKI)"}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Digital Signature ใช้ Private Key เซ็น → Public Key ยืนยัน ให้ทั้ง Integrity (ไม่ถูกแก้) + Authenticity (รู้ว่าใครส่ง) + Non-repudiation (ปฏิเสธไม่ได้)</div>", "fill_hint": ""}, {"num": 11, "stem": "During a vulnerability assessment, what is the significance of discovering an SQL injection vulnerability in a web application?", "options": {"A": "It has no meaningful impact on the application's security posture.", "B": "It improves the performance of the database queries.", "C": "It allows an attacker to execute arbitrary SQL commands on the database.", "D": "It indicates strong input validation practices are in place."}, "correct": "C", "corrected": true, "correction_note": "ตัวเลือกซ้ำ/ไม่สมเหตุสมผลในต้นฉบับ ระบบแก้ไขให้แล้ว", "topic": "SQL Injection", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">SQL inject</span></div><div class=\"tip-th\">💡 Remote Code Execution (RCE) คือช่องโหว่ที่อันตรายที่สุด ทำให้ attacker รันคำสั่งบน server ได้โดยตรง</div>", "fill_hint": ""}, {"num": 12, "stem": "When conducting online reconnaissance, what is the primary purpose of using search engine caches?", "options": {"A": "To retrieve web pages that are no longer live but have been cached", "B": "To enhance the SEO of the hacker’s own website", "C": "To analyze the keywords used on a competitor’s webpage", "D": "To check the real-time accessibility of a website from various locations"}, "correct": "A", "topic": "Reconnaissance & Footprinting", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">reconnaissance</span></div><div class=\"tip-th\">💡 To retrieve web pages that are no longer live but have been cached</div>", "fill_hint": ""}, {"num": 13, "stem": "During a simulated attack, an attacker alters the TTL (Time To Live) field of the packets being sent to trick the firewall into thinking the traffic is coming from a trusted internal source. What evasion technique does this describe?", "options": {"A": "Man-in-the-middle attack involves intercepting communications between the target and a legitimate source to capture session data without detection.", "B": "Spoofing alters packet headers to make traffic appear as though it is coming from a trusted source, thus bypassing firewall or IDS rules.", "C": "Spoofing manipulates the IP address to make it seem like the traffic originates from a trusted source inside the target's network.", "D": "Time delays between packet fragments are introduced to prevent an IDS from reassembling and detecting the malicious payload correctly."}, "correct": "B", "topic": "IDS/IPS & Firewalls", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">TTL (Time To Live) field</span> · <span class=\"kw-tag\">Time To Live</span></div><div class=\"tip-th\">💡 IP/Header Spoofing คือการปลอมแปลง IP header (เช่น TTL, source IP) เพื่อให้ traffic ดูเหมือนมาจากแหล่งที่น่าเชื่อถือ หลอก firewall/IDS</div>", "fill_hint": ""}, {"num": 14, "stem": "Which type of SQL injection attack manipulates SQL queries by inserting malicious SQL code through input fields?", "options": {"A": "Blind SQL injection that does not rely on the error output from the database.", "B": "Union-based SQL injection that combines the results of two SQL queries.", "C": "Time-based blind SQL injection that infers data from database response delays.", "D": "Tautology-based SQL injection that uses logical operations to interfere."}, "correct": "D", "corrected": true, "correction_note": "ตัวเลือกซ้ำ/ไม่สมเหตุสมผลในต้นฉบับ ระบบแก้ไขให้แล้ว", "topic": "SQL Injection", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">SQL inject</span></div><div class=\"tip-th\">💡 Tautology-based SQL Injection คือการสร้างเงื่อนไขที่จริงเสมอ เช่น OR 1=1 ทำให้ WHERE clause ผ่านทุกแถว มักใช้ bypass login</div>", "fill_hint": ""}, {"num": 15, "stem": "Fill in the blank: A comprehensive vulnerability analysis often includes testing for _______ vulnerabilities to predict how an attacker might gain unauthorized access.", "options": {"A": "Buffer overflow", "B": "SQL injection", "C": "Cross-site scripting", "D": "Denial-of-service"}, "correct": "B", "corrected": true, "correction_note": "ตัวเลือกซ้ำ/ไม่สมเหตุสมผลในต้นฉบับ ระบบแก้ไขให้แล้ว", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>SQL injection</strong></div><div class=\"tip-th\">💡 SQL Injection คือการแทรก SQL command ใน input field เพื่อให้ database execute คำสั่งที่ไม่ได้ตั้งใจ เช่น ดึงข้อมูล ลบข้อมูล หรือ bypass auth</div>", "fill_hint": ""}, {"num": 16, "stem": "What is a common vulnerability in NFS that can be exploited to perform enumeration?", "options": {"A": "Weak or outdated encryption used for authentication.", "B": "Firmware vulnerabilities in network equipment.", "C": "Encryption flaws in data packets.", "D": "Lack of proper authentication mechanisms."}, "correct": "D", "corrected": true, "correction_note": "ตัวเลือกซ้ำ/ไม่สมเหตุสมผลในต้นฉบับ ระบบแก้ไขให้แล้ว", "topic": "Reconnaissance & Footprinting", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">enumeration</span></div><div class=\"tip-th\">💡 ISO 27001 คือมาตรฐาน international สำหรับ Information Security Management System (ISMS) framework สำหรับจัดการ security องค์กร</div>", "fill_hint": ""}, {"num": 17, "stem": "What characteristic distinguishes a worm from a virus?", "options": {"A": "Capability to attach itself to executable files.", "B": "Requires a host program or file to attach to in order to execute and spread.", "C": "Need for administrative privileges to spread.", "D": "Ability to self-replicate without human intervention."}, "correct": "D", "corrected": true, "correction_note": "ตัวเลือกซ้ำ/ไม่สมเหตุสมผลในต้นฉบับ ระบบแก้ไขให้แล้ว", "topic": "Malware & Viruses", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">worm</span> · <span class=\"kw-tag\">virus</span></div><div class=\"tip-th\">💡 Worm คือ malware ที่แพร่กระจายตัวเองโดยไม่ต้องการ host file และไม่ต้องการ user กระทำอะไร ต่างจาก Virus ที่ต้องติดไปกับไฟล์</div>", "fill_hint": ""}, {"num": 18, "stem": "What tool is commonly used for sniffing network traffic to identify vulnerabilities by intercepting data packets as they travel across a network?", "options": {"A": "Nmap is used to discover hosts and services on a computer network by sending packets and analyzing the responses to identify vulnerabilities.", "B": "Nessus is a remote security scanning tool that scans a computer and raises an alert if it discovers any vulnerabilities that malicious hackers could use to gain access to any computer you have connected to a network.", "C": "Wireshark is a network protocol analyzer that lets users capture and interactively browse the traffic running on a computer network.", "D": "Tcpdump is a command-line packet analyzer; it allows the user to display TCP/IP and other packets being transmitted or received over a network to which the computer is attached."}, "correct": "C", "topic": "Network Sniffing & MITM", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Wireshark คือ network protocol analyzer ที่ capture และวิเคราะห์ packet แบบ real-time ใช้ตรวจ credentials ใน plain text, troubleshoot network</div>", "fill_hint": ""}, {"num": 19, "stem": "In a scenario where an ethical hacker discovers a vulnerability in a client’s system, which action aligns with standard ethical hacking procedures?", "options": {"A": "Exploiting the vulnerability to demonstrate the impact.", "B": "Closing the vulnerability without informing the client.", "C": "Ignoring the finding to avoid additional work.", "D": "Reporting the vulnerability to the client in a responsible manner."}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Reporting the vulnerability to the client in a responsible manner.</div>", "fill_hint": ""}, {"num": 20, "stem": "A security analyst tests an encryption system by trying every possible key until the correct one is found. What type of attack is this?", "options": {"A": "Differential cryptanalysis", "B": "Brute-force attack", "C": "Social engineering", "D": "Man-in-the-middle attack"}, "correct": "B", "corrected": true, "correction_note": "คำตอบเดิมไม่ตรงกับโจทย์ (โจทย์อธิบาย Brute-force แต่ตัวเลือกเดิมเป็น Differential cryptanalysis ซ้ำกัน) แก้ไขให้ตรงแล้ว", "topic": "Cryptography", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Brute-force Attack คือการลองทุก key/password จนกว่าจะถูก ใช้เวลาแปรผันตามความยาว key ป้องกัน: key ยาว + account lockout + MFA</div>", "fill_hint": ""}, {"num": 21, "stem": "Fill in the blank: In web application security, __________ is a tool used for automating the discovery of security flaws in web applications.", "options": {"A": "Metasploit", "B": "SQLmap", "C": "OWASP ZAP", "D": "Burp Suite"}, "correct": "C", "topic": "Web Application Attacks", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">📝 เติมช่องว่าง: <strong>OWASP ZAP</strong></div>", "fill_hint": ""}, {"num": 22, "stem": "Fill in the blank: ___________ is a technique where attackers upload malicious scripts or files to the server to execute code remotely.", "options": {"A": "Arbitrary file upload allows attackers to upload files containing malicious code to be executed on the target server.", "B": "Local file inclusion exploits vulnerabilities in web applications that allow the inclusion of files located on the same server.", "C": "Cross-site request forgery tricks the target into executing unwanted actions on a web server while the user is authenticated.", "D": "Remote file inclusion allows attackers to inject external files, such as scripts, into a web server's execution flow by manipulating input parameters."}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">📝 เติมช่องว่าง: <strong>Remote file inclusion allows attackers to inject external files, such as scripts, into a web server's execution flow by manipulating input parameters.</strong></div>", "fill_hint": ""}, {"num": 23, "stem": "A hacker manages to bypass authentication mechanisms by tampering with the cookies and altering session variables. What type of attack does this describe?", "options": {"A": "Cross-site scripting injects malicious scripts into trusted websites that execute in the context of the user’s browser.", "B": "Cookie poisoning involves modifying the contents of session cookies to manipulate user sessions and potentially bypass authentication.", "C": "Cross-site request forgery (CSRF) tricks users into performing actions on a web application in which they are authenticated, using their session credentials.", "D": "Session fixation exploits a vulnerability that allows an attacker to fixate a user’s session ID, forcing them to log in with a session predetermined by the attacker."}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Cookie poisoning involves modifying the contents of session cookies to manipulate user sessions and potentially bypass authentication.</div>", "fill_hint": ""}, {"num": 24, "stem": "What is the primary goal of using BGP hijacking in network enumeration?", "options": {"A": "To reroute internet traffic to extract data and perform man-in-the-middle attacks.", "B": "To increase bandwidth availability for legitimate users.", "C": "To optimize routing protocols for better network efficiency.", "D": "To decrease the network's overall latency for faster data processing."}, "correct": "A", "topic": "Reconnaissance & Footprinting", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">enumeration</span></div><div class=\"tip-th\">💡 MITM (Man-in-the-Middle) คือการแทรกตัวกลางการสื่อสาร อ่านหรือแก้ไข traffic ได้ โดยที่ทั้งสองฝ่ายไม่รู้ว่ามีคนดักอยู่</div>", "fill_hint": ""}, {"num": 25, "stem": "When trying to access a highly secure system, what is the first step a hacker should take to avoid detection?", "options": {"A": "Launching a denial of service attack", "B": "Installing malware", "C": "Conducting reconnaissance", "D": "Using a man-in-the-middle attack"}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">✅ คำตอบคือ: <strong>Conducting reconnaissance</strong><br>💡 (ดูคำอธิบายเพิ่มเติมจากเฉลยที่ไฮไลท์สีเขียวด้านบน)</div>", "fill_hint": ""}, {"num": 26, "stem": "Which type of attack involves an attacker setting up a rogue access point to intercept and manipulate wireless communications?", "options": {"A": "Spoofing attack where the attacker disguises as a known device on the network.", "B": "Evil Twin attack where the rogue access point mimics a legitimate one.", "C": "Man-in-the-Middle attack leveraging compromised certificates.", "D": "Jamming attack that disrupts the wireless signal with noise."}, "correct": "B", "topic": "Wireless Security", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Evil Twin คือการตั้ง Access Point ปลอมที่ใช้ SSID เดียวกับ AP จริง เพื่อหลอกให้ client เชื่อมต่อมาหา attacker</div>", "fill_hint": ""}, {"num": 27, "stem": "Which malware type is specifically designed to replicate itself across a network without user interaction?", "options": {"A": "A Trojan", "B": "A virus", "C": "A rootkit", "D": "A worm"}, "correct": "D", "topic": "Malware & Viruses", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">✅ คำตอบคือ: <strong>A worm</strong><br>💡 (ดูคำอธิบายเพิ่มเติมจากเฉลยที่ไฮไลท์สีเขียวด้านบน)</div>", "fill_hint": ""}, {"num": 28, "stem": "During a network audit, you notice a significant amount of ARP traffic between two nodes. What type of attack might be occurring if this traffic is malicious?", "options": {"A": "Ping flood is a denial-of-service attack in which the attacker attempts to overwhelm a targeted device with ICMP Echo Request (ping) packets, leading to network slowdown or crash.", "B": "ARP poisoning attack involves sending falsified ARP messages over a local area network to associate the attacker's MAC address with the IP address of another host.", "C": "DOS attack involves overwhelming a network with traffic from multiple sources, causing a denial of service for users of the targeted resource.", "D": "MAC flooding attack involves overwhelming the switch's address table with fake MAC addresses, causing it to act like a hub and send packets to all devices."}, "correct": "B", "topic": "Network Sniffing & MITM", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Active Sniffing คือการส่ง packet หลอก switch เพื่อ redirect traffic มาหา attacker เช่น ARP Poisoning หรือ MAC Flooding</div>", "fill_hint": ""}, {"num": 29, "stem": "During a web application audit, you notice that the application fails to restrict URL access in various administrative parts. What kind of security flaw is this an example of?", "options": {"A": "Cross-site request forgery (CSRF) that exploits the user’s trust.", "B": "SQL injection that allows unauthorized database manipulation.", "C": "Cross-site scripting (XSS) that allows attackers to inject client-side scripts.", "D": "Broken access control that allows users to bypass user authentication."}, "correct": "D", "topic": "Web Application Attacks", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Broken access control that allows users to bypass user authentication.</div>", "fill_hint": ""}, {"num": 30, "stem": "Fill in the blank: __________ is a protocol weakness in WPA/WPA2 security that allows attackers to decrypt packets.", "options": {"A": "Sidejacking, which involves hijacking an authenticated session via cookies.", "B": "KRACK (Key Reinstallation Attacks)", "C": "WPS (Wi-Fi Protected Setup) PIN brute-force attack", "D": "Bluejacking which exploits Bluetooth connections to send spam."}, "correct": "B", "topic": "Wireless Security", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">WPA</span></div><div class=\"tip-th\">📝 เติมช่องว่าง: <strong>KRACK (Key Reinstallation Attacks)</strong></div>", "fill_hint": ""}, {"num": 31, "stem": "Fill in the blank: __________ is a software tool used for real-time monitoring of mobile devices.", "options": {"A": "Antivirus software for mobile devices", "B": "Parental control applications", "C": "Mobile Device Management (MDM) software", "D": "Remote Wipe software"}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">📝 เติมช่องว่าง: <strong>Mobile Device Management (MDM) software</strong></div>", "fill_hint": ""}, {"num": 32, "stem": "How does an attacker use BGP exploits to gather information from target systems?", "options": {"A": "By crashing the BGP router to cause network downtime.", "B": "By injecting malicious routes to disable the network.", "C": "By redirecting traffic through a controlled router to capture data.", "D": "By extracting routing tables for offline analysis."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 By redirecting traffic through a controlled router to capture data.</div>", "fill_hint": ""}, {"num": 33, "stem": "When an ethical hacker uses a SYN scan, what are they trying to achieve?", "options": {"A": "To establish a full TCP connection with the target.", "B": "To disconnect existing TCP connections by sending reset packets.", "C": "To initiate a connection to a port without completing the TCP handshake.", "D": "To corrupt the target system’s TCP stack."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 To initiate a connection to a port without completing the TCP handshake.</div>", "fill_hint": ""}, {"num": 34, "stem": "A security trainer conducts a workshop where they pretend to be a furious manager demanding access to restricted files to test employee reactions. What is this an example of?", "options": {"A": "Reverse social engineering, where the attacker gets the target to initiate contact first.", "B": "Baiting, where a physical or digital lure is left for the victim to take.", "C": "Pretexting is a method where the attacker creates a fabricated scenario to obtain unauthorized information.", "D": "Authority influence involves an attacker adopting the role of a higher-up to extract sensitive information from an employee."}, "correct": "C", "corrected": true, "correction_note": "ตัวเลือกซ้ำ/ไม่สมเหตุสมผลในต้นฉบับ ระบบแก้ไขให้แล้ว", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Pretexting คือการสร้างสถานการณ์หรือบทบาทปลอม (เช่น แกล้งเป็น IT support / ผู้บริหาร) เพื่อหลอกให้เหยื่อไว้ใจและเปิดเผยข้อมูลหรือให้ access</div>", "fill_hint": ""}, {"num": 35, "stem": "Which technology is essential for protecting data in transit to and from the cloud?", "options": {"A": "Restricting inbound traffic using firewall access control lists.", "B": "Implementation of robust encryption protocols like TLS.", "C": "Secure Sockets Layer (SSL) certificates for websites.", "D": "Deployment of intrusion detection systems (IDS)."}, "correct": "B", "corrected": true, "correction_note": "ตัวเลือกซ้ำ/ไม่สมเหตุสมผลในต้นฉบับ ระบบแก้ไขให้แล้ว", "topic": "Cloud Security", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 TLS/SSL คือ protocol เข้ารหัส traffic ระหว่าง client กับ server (HTTPS) ป้องกัน MITM และ eavesdropping ระหว่างส่งข้อมูล</div>", "fill_hint": ""}, {"num": 36, "stem": "What is the most common method used by hackers to gain unauthorized access to secured Wi-Fi networks?", "options": {"A": "Cracking the network encryption key using advanced cryptographic attacks.", "B": "Utilizing default passwords that have not been changed from factory settings.", "C": "Launching a targeted phishing campaign against network administrators.", "D": "Physically accessing the router to reset it to factory settings."}, "correct": "A", "corrected": true, "correction_note": "ตัวเลือกซ้ำ/ไม่สมเหตุสมผลในต้นฉบับ ระบบแก้ไขให้แล้ว", "topic": "Wireless Security", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Cracking the network encryption key using advanced cryptographic attacks.</div>", "fill_hint": ""}, {"num": 37, "stem": "During the initial stage of an attack, an ethical hacker gathers data about a target’s employee roles. Which source is most effective for this purpose?", "options": {"A": "Internal newsletters", "B": "Company press releases", "C": "Social media platforms", "D": "Public job posting boards"}, "correct": "C", "corrected": true, "correction_note": "ตัวเลือกซ้ำ/ไม่สมเหตุสมผลในต้นฉบับ ระบบแก้ไขให้แล้ว", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">✅ คำตอบคือ: <strong>Social media platforms</strong><br>💡 (ดูคำอธิบายเพิ่มเติมจากเฉลยที่ไฮไลท์สีเขียวด้านบน)</div>", "fill_hint": ""}, {"num": 38, "stem": "Which tool is commonly used for DNS enumeration to gather information about a target during the footprinting phase?", "options": {"A": "Maltego", "B": "Wireshark", "C": "DNSRecon", "D": "Nmap"}, "correct": "C", "topic": "Reconnaissance & Footprinting", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">enumeration</span></div><div class=\"tip-th\">✅ คำตอบคือ: <strong>DNSRecon</strong><br>💡 (ดูคำอธิบายเพิ่มเติมจากเฉลยที่ไฮไลท์สีเขียวด้านบน)</div>", "fill_hint": ""}, {"num": 39, "stem": "Fill in the blank: ___________ is a social engineering technique that involves deceiving individuals into breaking security procedures.", "options": {"A": "Baiting involves offering something enticing to the target in order to carry out identity theft or deploy malware.", "B": "Tailgating involves following someone with proper authentication into a restricted area without proper authentication.", "C": "Phishing is sending an email that falsely claims to be an established legitimate enterprise in an attempt to scam the user into surrendering private information.", "D": "Impersonation involves an attacker pretending to be someone else to persuade the victim to release information or perform actions."}, "correct": "D", "topic": "Social Engineering & Phishing", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">📝 เติมช่องว่าง: <strong>Impersonation involves an attacker pretending to be someone else to persuade the victim to release information or perform actions.</strong></div>", "fill_hint": ""}, {"num": 40, "stem": "A cybersecurity expert is testing the security of a mobile application by inputting unexpected values. What vulnerability is likely being tested?", "options": {"A": "Buffer overflow vulnerabilities.", "B": "Input validation vulnerabilities.", "C": "Cross-site scripting (XSS) vulnerabilities.", "D": "SQL injection vulnerabilities."}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">✅ คำตอบคือ: <strong>Input validation vulnerabilities.</strong><br>💡 (ดูคำอธิบายเพิ่มเติมจากเฉลยที่ไฮไลท์สีเขียวด้านบน)</div>", "fill_hint": ""}, {"num": 41, "stem": "During a routine security audit, a consultant finds an unauthorized device that, when plugged into a computer, executes software mimicking a network update request. What kind of social engineering method is this?", "options": {"A": "Watering hole attack involves compromising a popular website to distribute malware to its visitors when they visit the site.", "B": "Tailgating involves an attacker seeking entry to restricted areas by following another person who has legitimate access.", "C": "A USB drop attack involves leaving a malware-infected USB drive in a location where it can be found and used by an unsuspecting employee.", "D": "Phishing is characterized by attackers pretending to be legitimate institutions via email to extract personal information."}, "correct": "C", "topic": "Social Engineering & Phishing", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 A USB drop attack involves leaving a malware-infected USB drive in a location where it can be found and used by an unsuspecting employee.</div>", "fill_hint": ""}, {"num": 42, "stem": "In network security testing, what is the main purpose of performing a ping sweep?", "options": {"A": "To measure the round-trip time for packet delivery to each host.", "B": "To identify all active hosts on a network by sending ICMP echo requests.", "C": "To overload the network with excessive traffic.", "D": "To filter out unauthorized access points."}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">ping sweep</span></div><div class=\"tip-th\">💡 To identify all active hosts on a network by sending ICMP echo requests.</div>", "fill_hint": ""}, {"num": 43, "stem": "Fill in the blank: The process of capturing packets on a network and analyzing them for malicious content is called ___________.", "options": {"A": "Packet sniffing is a method used by attackers to capture data packets as they travel across the network to steal sensitive information.", "B": "Environmental reconnaissance involves observing physical surroundings to gain information about a target or its operations.", "C": "Traffic analysis involves systematically intercepting and examining messages to deduce information from patterns in communication.", "D": "Network scanning is a process that identifies active hosts on a network by sending data packets and analyzing the responses received."}, "correct": "A", "topic": "General Security Concepts", "corrected": true, "correction_note": "มีข้อความแปลกปลอมจากไฟล์ต้นฉบับ (Question 43Skipped) ลบออกแล้ว", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">📝 เติมช่องว่าง: <strong>Packet sniffing is a method used by attackers to capture data packets as they travel across the network to steal sensitive information.</strong></div>", "fill_hint": ""}, {"num": 44, "stem": "When securing a web application, what is the primary purpose of implementing input validation?", "options": {"A": "It prevents malicious data from being processed by the server and causing harm.", "B": "It speeds up the processing of user inputs on the server-side.", "C": "It organizes data inputs to enhance the user interface and user experience.", "D": "It allows for comprehensive data analytics and big data computation."}, "correct": "A", "topic": "Web Application Attacks", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 It prevents malicious data from being processed by the server and causing harm.</div>", "fill_hint": ""}, {"num": 45, "stem": "Fill in the blank: _______ is the process of using various obfuscation techniques to evade detection by a honeypot that is monitoring traffic in a network.", "options": {"A": "Signature evasion changes the attack's characteristics slightly, so it no longer matches known attack signatures in honeypot databases.", "B": "Polymorphic shellcode changes its appearance with each instance, preventing honeypots from identifying and logging malicious activity.", "C": "Traffic padding is used to obfuscate malicious data within a sea of non-malicious traffic, making it difficult for honeypots to differentiate.", "D": "Encryption disguises the content of the attack traffic by converting it into an unreadable format, preventing honeypots from analyzing the data."}, "correct": "D", "topic": "Incident Response & Forensics", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">honeypot</span></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>Encryption disguises the content of the attack traffic by converting it into an unreadable format, preventing honeypots from analyzing the data.</strong></div><div class=\"tip-th\">💡 Honeypot คือระบบ/บริการ decoy ที่ตั้งใจให้ attacker เข้ามา เพื่อดักจับ TTP (Tactics, Techniques, Procedures) โดยไม่กระทบระบบจริง</div>", "fill_hint": ""}, {"num": 46, "stem": "In what type of session hijacking attack does the attacker predict and use a session ID before the user starts a session?", "options": {"A": "Session injection creates unauthorized sessions in the system by exploiting vulnerabilities in the session handling mechanism.", "B": "Session fixation involves the attacker setting a known session ID and tricking the victim into using it, then gaining access once the victim logs in.", "C": "Guessing attack involves the attacker trying different session IDs randomly until they find one that grants access to a user's session.", "D": "Session prediction uses statistical analysis of patterns in session ID generation to guess future session IDs before they are created."}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">session hijack</span></div><div class=\"tip-th\">💡 Session fixation involves the attacker setting a known session ID and tricking the victim into using it, then gaining access once the victim logs in.</div>", "fill_hint": ""}, {"num": 47, "stem": "Which tool is best suited for automated vulnerability scanning in large networks?", "options": {"A": "Nmap", "B": "Wireshark", "C": "OpenVAS", "D": "Nessus"}, "correct": "D", "topic": "Scanning & Enumeration Tools", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Nessus คือ vulnerability scanner ตรวจหาช่องโหว่ใน systems อัตโนมัติ สร้าง report จัดลำดับความเสี่ยง CVSS ใช้วางแผน patch</div>", "fill_hint": ""}, {"num": 48, "stem": "During a routine inspection, a network administrator notices unusual session tokens being used repeatedly from different IP addresses. What might this indicate?", "options": {"A": "Cross-site scripting (XSS) attack occurs when attackers inject malicious scripts into web pages viewed by other users, leading to data theft.", "B": "Cookie poisoning modifies the session cookies stored in the user's browser to manipulate or gain unauthorized access to their sessions.", "C": "Credential stuffing uses previously breached username and password pairs to gain unauthorized access to user accounts.", "D": "Session replay involves capturing valid session tokens and reusing them to impersonate the victim and gain unauthorized access."}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Session replay involves capturing valid session tokens and reusing them to impersonate the victim and gain unauthorized access.</div>", "fill_hint": ""}, {"num": 49, "stem": "A company’s Wi-Fi network was breached, and the attack was traced back to an exploitation of weak encryption methods. Which encryption method is most vulnerable to such attacks?", "options": {"A": "Temporal Key Integrity Protocol (TKIP)", "B": "Wired Equivalent Privacy (WEP)", "C": "Wi-Fi Protected Access II (WPA2)", "D": "Secure Sockets Layer (SSL) encryption"}, "correct": "B", "topic": "Cryptography", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 WEP (Wired Equivalent Privacy) คือ protocol เข้ารหัส WiFi เก่ามาก ใช้ IV ที่สั้นเกินไปทำให้เจาะได้ในไม่กี่นาทีด้วย aircrack-ng</div>", "fill_hint": ""}, {"num": 50, "stem": "Fill in the blank: __________ is a technique used in footprinting to gather insights about internal IP ranges and domain records.", "options": {"A": "Email harvesting", "B": "DNS zone transfer", "C": "Port scanning", "D": "Network scanning"}, "correct": "B", "topic": "Reconnaissance & Footprinting", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">📝 เติมช่องว่าง: <strong>DNS zone transfer</strong></div>", "fill_hint": ""}, {"num": 51, "stem": "What technique is most effective in preventing the spread of ransomware in an organization?", "options": {"A": "Installing ad-blocking software.", "B": "Implementing robust data backup and recovery procedures.", "C": "Frequently changing user passwords.", "D": "Restricting user access to sensitive files."}, "correct": "B", "topic": "Malware & Viruses", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">ransomware</span></div><div class=\"tip-th\">✅ คำตอบคือ: <strong>Implementing robust data backup and recovery procedures.</strong><br>💡 (ดูคำอธิบายเพิ่มเติมจากเฉลยที่ไฮไลท์สีเขียวด้านบน)</div>", "fill_hint": ""}, {"num": 52, "stem": "During a compliance audit, it was found that a company’s cloud storage did not have encryption enabled. What type of compliance violation is this most likely related to?", "options": {"A": "Ignoring HIPAA security rules.", "B": "Violations of GDPR data protection requirements.", "C": "Non-compliance with the Sarbanes-Oxley Act.", "D": "Breach of PCI DSS standards."}, "correct": "B", "topic": "Cryptography", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 GDPR คือกฎหมาย privacy ของ EU ครอบคลุมข้อมูลส่วนตัวของพลเมือง EU ไม่ว่าองค์กรจะอยู่ที่ไหนก็ต้องปฏิบัติตาม</div>", "fill_hint": ""}, {"num": 53, "stem": "Fill in the blank: ________ attack involves hijacking a session after gaining the session ID by intercepting the traffic.", "options": {"A": "Session sniffing captures active session IDs by monitoring network traffic between the client and the server.", "B": "Man-in-the-middle (MITM) attack intercepts data between two parties to gain access to the session tokens and hijack the session.", "C": "Cross-site request forgery (CSRF) tricks the victim into executing unwanted actions on a web application in which they are currently authenticated.", "D": "Token kidnapping exploits security flaws to escalate privileges and hijack sessions on networked services."}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>Man-in-the-middle (MITM) attack intercepts data between two parties to gain access to the session tokens and hijack the session.</strong></div><div class=\"tip-th\">💡 MITM (Man-in-the-Middle) คือการแทรกตัวกลางการสื่อสาร อ่านหรือแก้ไข traffic ได้ โดยที่ทั้งสองฝ่ายไม่รู้ว่ามีคนดักอยู่</div>", "fill_hint": ""}, {"num": 54, "stem": "What technique allows an attacker to avoid detection by an IDS by breaking a payload into smaller packets that individually appear harmless but collectively deliver malicious content?", "options": {"A": "Fragmentation allows attackers to split malicious payloads across multiple packets, each appearing harmless to an IDS until reassembled.", "B": "Reverse tunnelling sends outbound traffic through an internal system to bypass firewalls that block incoming connections.", "C": "Protocol tunnelling encapsulates attack traffic within permitted protocols like HTTP to evade firewall rules and bypass detection.", "D": "Encryption encrypts the malicious payload, making it unreadable to IDS or firewalls, allowing it to pass undetected through security devices."}, "correct": "A", "topic": "IDS/IPS & Firewalls", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">IDS</span></div><div class=\"tip-th\">💡 Fragmentation allows attackers to split malicious payloads across multiple packets, each appearing harmless to an IDS until reassembled.</div>", "fill_hint": ""}, {"num": 55, "stem": "Fill in the blank: In a _________ attack, the attacker exploits the vulnerability of the ICMP protocol to flood the target with request packets.", "options": {"A": "Teardrop attack involves sending fragmented packets that are impossible for the target to reassemble, typically resulting in a system crash.", "B": "LAND attack sends a special poison packet to the target, where the source and destination IP addresses are the same, confusing the network stack.", "C": "Smurf attack is initiated by broadcasting large numbers of ICMP packets with the victim's spoofed IP to network devices.", "D": "Ping flood involves sending ICMP Echo Request (ping) packets directly to the target, quickly consuming both outgoing and incoming bandwidth."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>Smurf attack is initiated by broadcasting large numbers of ICMP packets with the victim's spoofed IP to network devices.</strong></div><div class=\"tip-th\">💡 Protocol Attack คือการโจมตีช่องโหว่ใน protocol ระดับ 3-4 เช่น Ping of Death, Teardrop, Smurf ทำให้ network device ล้มเหลว</div>", "fill_hint": ""}, {"num": 56, "stem": "What is a common method used by attackers to perform session hijacking on web applications?", "options": {"A": "Phishing attempts to trick users into providing their session information by masquerading as a trustworthy entity in electronic communications.", "B": "Session sidejacking involves the interception of cookies over unsecured connections to hijack the user's session after they have authenticated.", "C": "URL hijacking involves manipulating URLs to redirect users to malicious sites where session information can be stolen.", "D": "Cross-site scripting (XSS) allows an attacker to inject malicious scripts into content from trusted websites, which can then be used to hijack user sessions."}, "correct": "D", "topic": "Web Application Attacks", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">session hijack</span></div><div class=\"tip-th\">💡 XSS (Cross-Site Scripting) คือการฉีด JavaScript เข้าไปในหน้าเว็บเพื่อทำงานบน browser ของเหยื่อ เช่น ขโมย cookie หรือ redirect</div>", "fill_hint": ""}, {"num": 57, "stem": "Which security practice is essential for protecting IoT devices from being compromised?", "options": {"A": "Implementing geofencing to restrict device functionality based on location.", "B": "Isolating IoT devices on a separate network VLAN.", "C": "Regular firmware updates and changing default credentials.", "D": "Use of complex network topologies to confuse potential hackers."}, "correct": "C", "topic": "Wireless/IoT & Other", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">✅ คำตอบคือ: <strong>Regular firmware updates and changing default credentials.</strong><br>💡 (ดูคำอธิบายเพิ่มเติมจากเฉลยที่ไฮไลท์สีเขียวด้านบน)</div>", "fill_hint": ""}, {"num": 58, "stem": "During an attack simulation, what specific information can an ethical hacker gather by exploiting vulnerabilities in an NFS server?", "options": {"A": "Network topology and router configurations.", "B": "List of shared directories and permission settings.", "C": "Types of encryption used and security protocols.", "D": "Active directory domain names and server IP addresses."}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Shared Directories enumeration คือการ list ไฟล์และ folder ที่ share บน network พร้อม permission settings ข้อมูลสำคัญสำหรับวางแผน lateral movement</div>", "fill_hint": ""}, {"num": 59, "stem": "Fill in the blank: Ethical hackers must adhere to __________, which dictate the actions permissible under legal frameworks.", "options": {"A": "Personal moral principles", "B": "Information security laws and regulations", "C": "Corporate ethical codes of conduct", "D": "Professional security certifications"}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">📝 เติมช่องว่าง: <strong>Information security laws and regulations</strong></div>", "fill_hint": ""}, {"num": 60, "stem": "Which method is commonly used to bypass firewalls by encapsulating malicious traffic inside allowed protocols, such as HTTP or DNS?", "options": {"A": "Polymorphic shellcode rewrites the malicious code with each iteration to avoid signature- based detection by IDS or firewalls.", "B": "IP spoofing is used to make packets appear as if they are coming from an internal, trusted IP address to bypass firewall restrictions.", "C": "Traffic padding adds random, harmless data to the traffic stream to make it harder for the firewall to detect the true nature of the attack.", "D": "Tunneling wraps malicious traffic inside legitimate protocols like DNS or HTTP to bypass firewall rules that block other types of traffic."}, "correct": "D", "topic": "Reconnaissance & Footprinting", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Tunneling wraps malicious traffic inside legitimate protocols like DNS or HTTP to bypass firewall rules that block other types of traffic.</div>", "fill_hint": ""}, {"num": 61, "stem": "During a security assessment, a hacker captures a handshake from a wireless network and uses it to perform an offline dictionary attack. What was the hacker likely targeting?", "options": {"A": "The network’s pre-shared key (PSK)", "B": "Email accounts accessed via the compromised network.", "C": "The administrator’s login credentials for network management.", "D": "Server databases containing sensitive customer information."}, "correct": "A", "topic": "Wireless Security", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 WPA/WPA2 PSK สามารถถูก crack ได้โดยการดัก 4-way handshake แล้วทำ offline dictionary/brute-force attack</div>", "fill_hint": ""}, {"num": 62, "stem": "In an audit of IoT devices, an anomaly was detected where devices were communicating at unusual times. What might this indicate?", "options": {"A": "Incorrect configuration leading to false positives in detection.", "B": "Misaligned time synchronization across IoT devices.", "C": "A potential botnet recruitment or data exfiltration attempt.", "D": "Scheduled maintenance or firmware updates causing anomalies."}, "correct": "C", "topic": "Wireless/IoT & Other", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Botnet คือเครือข่ายของเครื่องที่ถูก compromise (zombie) และอยู่ภายใต้การควบคุม Command & Control (C&C) server ของ attacker</div>", "fill_hint": ""}, {"num": 63, "stem": "What is the primary function of a port scanner in network security?", "options": {"A": "To detect open ports and services on a network host.", "B": "To monitor data traffic between devices.", "C": "To increase the speed of the network.", "D": "To encrypt data packets sent over the network."}, "correct": "A", "topic": "Scanning & Enumeration Tools", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">port scan</span></div><div class=\"tip-th\">💡 Port Scanning คือการส่ง packet ไปยัง port ต่างๆ เพื่อหาว่า port ไหน open และมี service อะไร เป็น Active Recon ทำหลัง ping sweep</div>", "fill_hint": ""}, {"num": 64, "stem": "What is a primary goal of ethical hacking?", "options": {"A": "To breach security systems and steal data for personal gain.", "B": "To train employees on how to defend against cyber attacks effectively.", "C": "To identify vulnerabilities from an attacker's viewpoint to better secure systems.", "D": "To develop security software that protects against breaches."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 To identify vulnerabilities from an attacker's viewpoint to better secure systems.</div>", "fill_hint": ""}, {"num": 65, "stem": "In a penetration testing scenario, the tester tries to login without a username or password by manipulating the SQL query. What technique are they using?", "options": {"A": "Using excessive SQL commands to overflow the memory buffers.", "B": "Testing for weak database encryption by using complex SQL queries.", "C": "Inserting random SQL commands to disrupt database operations.", "D": "Exploiting the login by altering the SQL logic to return 'true'."}, "correct": "D", "topic": "SQL Injection", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Exploiting the login by altering the SQL logic to return 'true'.</div>", "fill_hint": ""}, {"num": 66, "stem": "What is the primary goal of performing an SQL injection attack on a web application?", "options": {"A": "To create new administrative accounts within the database.", "B": "To bypass login algorithms and access unauthorized data.", "C": "To perform a legitimate stress test on the database systems.", "D": "To increase the operational efficiency of the database."}, "correct": "B", "topic": "SQL Injection", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">SQL inject</span></div><div class=\"tip-th\">✅ คำตอบคือ: <strong>To bypass login algorithms and access unauthorized data.</strong><br>💡 (ดูคำอธิบายเพิ่มเติมจากเฉลยที่ไฮไลท์สีเขียวด้านบน)</div>", "fill_hint": ""}, {"num": 67, "stem": "Fill in the blank: __________ is often used to attack hash functions by finding two different inputs that produce the same output.", "options": {"A": "Birthday attack", "B": "Linear cryptanalysis", "C": "Rainbow table attack", "D": "Collision attack"}, "correct": "D", "topic": "Cryptography", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>Collision attack</strong></div><div class=\"tip-th\">💡 Collision Attack คือการหา input 2 ตัวที่ได้ hash เดียวกัน ทำให้ hash function ใช้งานไม่ได้ MD5 และ SHA-1 เจอ collision แล้ว ต้องใช้ SHA-256+</div>", "fill_hint": ""}, {"num": 68, "stem": "What is a common attack on mobile devices that involves intercepting voice and text communications?", "options": {"A": "Installation of malicious applications that appear legitimate.", "B": "Exploiting unpatched software vulnerabilities in the mobile OS.", "C": "Eavesdropping through unauthorized access to the microphone.", "D": "Signal interception attack that targets cellular and Wi-Fi signals."}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Signal interception attack that targets cellular and Wi-Fi signals.</div>", "fill_hint": ""}, {"num": 69, "stem": "During a routine security assessment, an ethical hacker utilizes a set of guidelines to assess the security measures of an organization. Which of these would be considered an information security control?", "options": {"A": "Administrative security policies.", "B": "Physical access controls.", "C": "Cryptographic security measures.", "D": "Network security protocols."}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Physical Access Control คือการควบคุมการเข้าถึงพื้นที่ทางกายภาพ เช่น badge reader, biometric scanner, security guard ป้องกัน tailgating</div>", "fill_hint": ""}, {"num": 70, "stem": "Fill in the blank: Enumeration of NFS can expose __________ which are critical for accessing network services.", "options": {"A": "Unsecured network shares", "B": "VPN tunnel endpoints", "C": "Firewall configurations", "D": "User account details"}, "correct": "A", "topic": "Reconnaissance & Footprinting", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">Enumeration</span></div><div class=\"tip-th\">📝 เติมช่องว่าง: <strong>Unsecured network shares</strong></div>", "fill_hint": ""}, {"num": 71, "stem": "What is the primary purpose of conducting a vulnerability analysis on network systems?", "options": {"A": "To comply with international data protection and privacy regulations.", "B": "To enhance the network speed by optimizing the bandwidth usage.", "C": "To identify and remediate security weaknesses before they can be exploited.", "D": "To monitor network traffic for potential external threats continuously."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 To identify and remediate security weaknesses before they can be exploited.</div>", "fill_hint": ""}, {"num": 72, "stem": "During a digital forensics investigation, it was discovered that encrypted messages were vulnerable to frequency analysis. What type of encryption is most susceptible to this attack?", "options": {"A": "RSA encryption", "B": "Substitution cipher", "C": "Transposition cipher", "D": "Vigenère cipher"}, "correct": "B", "topic": "Cryptography", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Substitution Cipher คือการแทนที่แต่ละตัวอักษรด้วยตัวอื่นตาม key เช่น A→D, B→E เป็น classical cipher ที่ถอดรหัสได้ด้วย frequency analysis</div>", "fill_hint": ""}, {"num": 73, "stem": "A security professional observes an increase in encrypted traffic from a user's device after a period of inactivity. What type of session attack might be occurring?", "options": {"A": "Session hijacking via malware involves introducing software into the user's system to take control of active sessions directly.", "B": "Pass-the-hash involves capturing hashes of active sessions and using them directly to authenticate on other services without needing the password.", "C": "Network spoofing disguises communication from the attacker as being from a known or trusted source to capture session data.", "D": "Sidejacking uses packet sniffing to capture and reuse session cookies, which can maintain active sessions, particularly over unsecured Wi-Fi networks."}, "correct": "D", "topic": "Cryptography", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Sidejacking uses packet sniffing to capture and reuse session cookies, which can maintain active sessions, particularly over unsecured Wi-Fi networks.</div>", "fill_hint": ""}, {"num": 74, "stem": "What is a common method used by hackers to gain unauthorized access to a system?", "options": {"A": "Guessing or cracking passwords.", "B": "Exploiting known software vulnerabilities.", "C": "Sending phishing emails to company employees.", "D": "Intercepting data transmitted over unsecured networks."}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">✅ คำตอบคือ: <strong>Exploiting known software vulnerabilities.</strong><br>💡 (ดูคำอธิบายเพิ่มเติมจากเฉลยที่ไฮไลท์สีเขียวด้านบน)</div>", "fill_hint": ""}, {"num": 75, "stem": "Which technique is most effective for detecting SQL injection vulnerabilities in a web application?", "options": {"A": "Conducting a social engineering attack to see if employees reveal sensitive information.", "B": "Manual code review by a security expert to find hidden vulnerabilities.", "C": "Use of automated scanning tools that simulate malicious attacks.", "D": "Interviewing the development team to understand the application’s security measures."}, "correct": "C", "topic": "SQL Injection", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">SQL inject</span></div><div class=\"tip-th\">💡 Use of automated scanning tools that simulate malicious attacks.</div>", "fill_hint": ""}, {"num": 76, "stem": "In a scenario where an organization needs to prioritize vulnerabilities for patching, which factor should be considered first?", "options": {"A": "Frequency of the vulnerability occurrence in similar organizations.", "B": "Number of affected systems within the organization.", "C": "Severity of the vulnerability based on its potential impact.", "D": "Time since the vulnerability was first reported."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Severity of the vulnerability based on its potential impact.</div>", "fill_hint": ""}, {"num": 77, "stem": "During a security assessment, a consultant finds that a mobile app leaks user credentials when connecting to external services. What type of attack could exploit this vulnerability?", "options": {"A": "Man-in-the-Middle (MITM) attack during data transmission.", "B": "Social engineering attack through fake customer service calls.", "C": "Phishing attack by directing users to a malicious website.", "D": "Ransomware attack that encrypts user data and demands payment."}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 MITM (Man-in-the-Middle) คือการแทรกตัวกลางการสื่อสาร อ่านหรือแก้ไข traffic ได้ โดยที่ทั้งสองฝ่ายไม่รู้ว่ามีคนดักอยู่</div>", "fill_hint": ""}, {"num": 78, "stem": "Which type of scan is most effective for bypassing firewall rules and avoiding detection during a network scan?", "options": {"A": "FIN scan", "B": "Connect scan", "C": "Stealth SYN scan", "D": "Xmas scan"}, "correct": "C", "topic": "IDS/IPS & Firewalls", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Nmap คือ network scanner ใช้ค้นหา hosts, open ports, services, OS (-sS=stealth SYN, -O=OS detect, -sV=version, -A=aggressive)</div>", "fill_hint": ""}, {"num": 79, "stem": "What type of cryptographic attack involves decoding a secret message without knowing the underlying algorithm?", "options": {"A": "Side-channel attack", "B": "Known plaintext attack", "C": "Cryptanalysis", "D": "Chosen ciphertext attack"}, "correct": "C", "topic": "Cryptography", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">✅ คำตอบคือ: <strong>Cryptanalysis</strong><br>💡 (ดูคำอธิบายเพิ่มเติมจากเฉลยที่ไฮไลท์สีเขียวด้านบน)</div>", "fill_hint": ""}, {"num": 80, "stem": "Which of the following scenarios best describes a baiting attack in the context of social engineering?", "options": {"A": "An attacker sends an email to company employees with a link that installs malware if clicked, purporting to be a security update.", "B": "An attacker posts fraudulent job listings on a career website to collect personal information from applicants.", "C": "An attacker calls random extensions at a company posing as a tech support agent who needs passwords to fix a server issue.", "D": "An attacker leaves a USB drive labelled \"Executive Salary Info\" in a company parking lot, hoping someone will use it on their network."}, "correct": "D", "topic": "Social Engineering & Phishing", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">baiting</span></div><div class=\"tip-th\">💡 An attacker leaves a USB drive labelled \"Executive Salary Info\" in a company parking lot, hoping someone will use it on their network.</div>", "fill_hint": ""}, {"num": 81, "stem": "Fill in the blank: ________ is a technique used to determine the operating system of a remote host based on characteristics of its TCP/IP packets.", "options": {"A": "TCP/IP fingerprinting", "B": "SNMP querying", "C": "ICMP error messaging", "D": "UDP segment analysis"}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">📝 เติมช่องว่าง: <strong>TCP/IP fingerprinting</strong></div>", "fill_hint": ""}, {"num": 82, "stem": "What is the primary security concern with public cloud services?", "options": {"A": "Insufficient identity and access management controls.", "B": "Inadequate change management and patching procedures.", "C": "Unauthorized access by third-party vendors.", "D": "Data leakage due to multi-tenancy and shared resources."}, "correct": "D", "topic": "Cloud Security", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">✅ คำตอบคือ: <strong>Data leakage due to multi-tenancy and shared resources.</strong><br>💡 (ดูคำอธิบายเพิ่มเติมจากเฉลยที่ไฮไลท์สีเขียวด้านบน)</div>", "fill_hint": ""}, {"num": 83, "stem": "Identify the standard that primarily governs data protection across various industries globally.", "options": {"A": "Health Insurance Portability and Accountability Act (HIPAA)", "B": "General Data Protection Regulation (GDPR)", "C": "Sarbanes-Oxley Act", "D": "ISO/IEC 27001"}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 ISO 27001 คือมาตรฐาน international สำหรับ Information Security Management System (ISMS) framework สำหรับจัดการ security องค์กร</div>", "fill_hint": ""}, {"num": 84, "stem": "Fill in the blank: Trojan malware often disguises itself as __________ to deceive users into executing it.", "options": {"A": "A system update", "B": "Legitimate software", "C": "A popular game", "D": "An email attachment"}, "correct": "B", "topic": "Malware & Viruses", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">Trojan</span></div><div class=\"tip-th\">📝 เติมช่องว่าง: <strong>Legitimate software</strong></div>", "fill_hint": ""}, {"num": 85, "stem": "Fill in the blank: __________ is a strategic approach to enforce the separation of data from different organizations on the same cloud server.", "options": {"A": "Virtual Private Network (VPN)", "B": "Containerization", "C": "Multi-factor authentication", "D": "Data loss prevention (DLP) systems"}, "correct": "C", "topic": "Cloud Security", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>Multi-factor authentication</strong></div><div class=\"tip-th\">💡 MFA (Multi-Factor Authentication) ต้องการ 2+ factors: Knowledge (password) + Possession (token/phone) + Inherence (biometric) แม้ password หลุดก็ยังปลอดภัย</div>", "fill_hint": ""}, {"num": 86, "stem": "A security analyst is conducting a penetration test on a web application. The analyst sends different types of input to test form fields. What is the analyst most likely trying to identify?", "options": {"A": "Insecure direct object references that allow unauthorized access.", "B": "Buffer overflow vulnerabilities that can execute arbitrary code.", "C": "Misconfigurations in server settings that could expose sensitive data.", "D": "Cross-site scripting (XSS) vulnerabilities that could exploit client-side scripts."}, "correct": "A", "topic": "Web Application Attacks", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Insecure direct object references that allow unauthorized access.</div>", "fill_hint": ""}, {"num": 87, "stem": "During a security drill, an attacker sends a flood of malformed packets that crashes the web server. What specific type of attack does this exemplify?", "options": {"A": "Ping of Death attack involves sending packets larger than the maximum allowed size, causing the target system to freeze or crash.", "B": "Buffer overflow attack targets vulnerabilities in software to execute arbitrary code with the privileges of the compromised application.", "C": "SQL injection attack exploits vulnerabilities in data-driven applications by injecting malicious SQL statements into an entry field for execution.", "D": "Heap overflow involves exploiting heap data structure by overflowing the buffer with more data than it can handle, leading to adjacent memory blocks."}, "correct": "A", "topic": "Web Application Attacks", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Protocol Attack คือการโจมตีช่องโหว่ใน protocol ระดับ 3-4 เช่น Ping of Death, Teardrop, Smurf ทำให้ network device ล้มเหลว</div>", "fill_hint": ""}, {"num": 88, "stem": "What is the primary purpose of a DDoS attack using botnets?", "options": {"A": "To overwhelm multiple systems simultaneously to increase the attack's effectiveness and difficulty of mitigation.", "B": "To scan and exploit vulnerabilities within the network it targets, usually leading to further infiltration or data breaches.", "C": "To evaluate the responsiveness and scalability of the network's infrastructure under unusually high traffic loads.", "D": "To disrupt the specific functionality of a web service to prevent users from accessing it, effectively taking it offline."}, "correct": "A", "topic": "DoS / DDoS", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">DDoS</span></div><div class=\"tip-th\">💡 To overwhelm multiple systems simultaneously to increase the attack's effectiveness and difficulty of mitigation.</div>", "fill_hint": ""}, {"num": 89, "stem": "Which security measure can prevent unauthorized access to a lost or stolen mobile device?", "options": {"A": "Regular software updates and patch management.", "B": "Use of biometric identification like fingerprints or facial recognition.", "C": "Enabling device encryption and the use of strong, complex passwords.", "D": "Disabling location services and restricting app permissions."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Enabling device encryption and the use of strong, complex passwords.</div>", "fill_hint": ""}, {"num": 90, "stem": "An IoT security consultant notices that device firmware updates are transmitted unencrypted. What type of attack could exploit this vulnerability?", "options": {"A": "Physical tampering with device components to gain root access.", "B": "Cross-site scripting (XSS) attacks via the IoT device's web management interface.", "C": "Firmware tampering or Man-in-the-Middle (MITM) attacks.", "D": "SQL injection attacks targeting the web interface of IoT devices."}, "correct": "C", "topic": "Cryptography", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 MITM (Man-in-the-Middle) คือการแทรกตัวกลางการสื่อสาร อ่านหรือแก้ไข traffic ได้ โดยที่ทั้งสองฝ่ายไม่รู้ว่ามีคนดักอยู่</div>", "fill_hint": ""}, {"num": 91, "stem": "In a scenario where a hacker needs to maintain access to a system without being detected, what is the best tool to use?", "options": {"A": "Executing a Trojan horse", "B": "Applying a keylogger", "C": "Installing a rootkit", "D": "Deploying ransomware"}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Rootkit คือ malware ที่ฝังตัวในระดับ kernel/OS เพื่อซ่อนตัวจาก antivirus และให้ attacker เข้าถึงระบบได้ตลอดเวลา</div>", "fill_hint": ""}, {"num": 92, "stem": "Which type of DoS attack involves overwhelming a target with TCP connection requests without finalizing the handshake?", "options": {"A": "SYN flood attack leverages the three-way handshake process by not responding to the acknowledgment from the target, consuming server resources.", "B": "ICMP flood involves sending a slew of ICMP Echo request packets directly to the target, quickly overwhelming it with requests to reply.", "C": "Christmas tree packet attack involves sending packets with every single option set for whatever protocol is used, causing confusion and overwhelming the target's processing capability.", "D": "UDP flood attack sends a large number of UDP packets to random ports on a remote host, causing the host to check for the application listening at that port and reply with ICMP destination unreachable packets."}, "correct": "A", "topic": "DoS / DDoS", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 SYN Flood คือการส่ง SYN packet จำนวนมากแต่ไม่ตอบ ACK ทำให้ server เปิด half-open connections จน resource หมด ป้องกัน: SYN cookies</div>", "fill_hint": ""}, {"num": 93, "stem": "In a penetration testing scenario, which technique should an ethical hacker use first to collect publicly available information about a target organization?", "options": {"A": "Open-source intelligence gathering", "B": "Phishing attacks", "C": "Dumpster diving", "D": "Social engineering"}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">✅ คำตอบคือ: <strong>Open-source intelligence gathering</strong><br>💡 (ดูคำอธิบายเพิ่มเติมจากเฉลยที่ไฮไลท์สีเขียวด้านบน)</div>", "fill_hint": ""}, {"num": 94, "stem": "During a web server assessment, a penetration tester discovers an open directory listing that contains sensitive configuration files. What vulnerability is being exploited?", "options": {"A": "URL redirection attack manipulates URLs to redirect users to malicious sites, often used in phishing or credential-stealing schemes.", "B": "Parameter tampering involves manipulating query parameters within the URL to modify the behavior of a web application.", "C": "Directory traversal attack exploits misconfigured access controls on a web server to navigate to sensitive directories and files.", "D": "File inclusion involves exploiting a vulnerability that allows unauthorized files to be loaded and executed by the web server."}, "correct": "C", "topic": "Web Application Attacks", "trick_keywords": [], "trick_tip_th": "<div class=\"tip-th\">💡 Directory Traversal คือการใช้ ../ ใน URL เพื่อเข้าถึงไฟล์นอก web root เช่น /etc/passwd หรือ config files ที่ไม่ควรเปิดเผย</div>", "fill_hint": ""}, {"num": 95, "stem": "A penetration tester is trying to evade an IDS by introducing delays between the transmission of packet fragments to avoid detection. What technique is being employed?", "options": {"A": "Polymorphism dynamically alters the malware code with every iteration to prevent IDS or firewalls from detecting it via known patterns.", "B": "Proxy chaining involves routing traffic through multiple intermediary servers to hide the attacker's true source IP address.", "C": "Manipulating TTL values tricks network security devices into thinking that the packets have originated from within the internal network.", "D": "Fragmentation attack involves splitting the malicious payload into fragments and sending them slowly over time to avoid triggering IDS alarms."}, "correct": "D", "topic": "IDS/IPS & Firewalls", "trick_keywords": [], "trick_tip_th": "<div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">IDS</span></div><div class=\"tip-th\">💡 Fragmentation attack involves splitting the malicious payload into fragments and sending them slowly over time to avoid triggering IDS alarms.</div>", "fill_
