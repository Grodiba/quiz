dministrative tools. What is your first action?", "options": {"A": "Increase firewall settings to block all incoming and outgoing connections.", "B": "Disable all scripting environments including PowerShell, VBScript, and JavaScript.", "C": "Set auditing policies to monitor and log all usage of PowerShell and WMI.", "D": "Conduct a physical inspection of all network hardware for unauthorized devices."}, "correct": "C", "topic": "Malware & Viruses", "trick_keywords": ["fileless malware...administrative tools"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรทำอะไรเป็นอันดับแรกเพื่อสอดส่อง fileless malware ที่มาผ่านเครื่องมือดูแลระบบ Windows</div><div>🔑 <strong>สังเกตคำว่า</strong> \"fileless malware...administrative tools\" = มัลแวร์ที่ไม่เขียนไฟล์ลงดิสก์ ใช้เครื่องมือดูแลระบบของ Windows</div><div>✅ fileless malware มักอาศัย PowerShell/WMI ในการรันโดยไม่ทิ้งไฟล์ไว้ การตั้ง audit log บนเครื่องมือเหล่านี้จึงจับความเคลื่อนไหวได้</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">malware</span> · <span class=\"kw-tag\">fileless</span></div><div class=\"tip-th\">✅ คำตอบ: <strong>Set auditing policies to monitor and log all usage of PowerShell and WMI.</strong></div>", "fill_hint": ""}, {"num": 209, "stem": "What command is essential for preserving the state of a running process during an incident response to analyze later?", "options": {"A": "netstat -an > /tmp/network_connections.txt to capture active network connections.", "B": "sudo dd if=/proc/[pid]/mem of=/tmp/memdump_[pid].bin bs=1024", "C": "ps aux > /tmp/processlist.txt to save the list of current running processes.", "D": "top -b -n 1 > /tmp/system_load.txt to record the current system load."}, "correct": "B", "topic": "Incident Response & Forensics", "trick_keywords": ["preserving the state of a running process"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> คำสั่งใดใช้เก็บสถานะหน่วยความจำของโพรเซสที่กำลังรันเพื่อวิเคราะห์ภายหลัง</div><div>🔑 <strong>สังเกตคำว่า</strong> \"preserving the state of a running process\" = เก็บสถานะของโพรเซสที่กำลังรันไว้</div><div>✅ การ dump หน่วยความจำของ process ด้วย dd ตรงกับความต้องการ preserving the state ก่อนที่ข้อมูลจะหายไป</div></div><div class=\"tip-th\">💡 Memory dump ของ process (dd from /proc/[pid]/mem) ใช้ forensics หา malicious code, encryption keys, credentials ใน RAM</div>", "fill_hint": ""}, {"num": 210, "stem": "For a thorough penetration test, what should be the initial step to understand the network landscape without alerting the administrative teams?", "options": {"A": "Launching a DDoS attack to observe the network's resilience.", "B": "Conducting passive network reconnaissance using traffic sniffing.", "C": "Sending phishing emails to network administrators to gather intel.", "D": "Physically inspecting server racks and network cables in the facility."}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": ["without alerting the administrative teams"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ขั้นตอนแรกในการสำรวจเครือข่ายโดยไม่ให้ผู้ดูแลระบบรู้ตัวคืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"without alerting the administrative teams\" = โดยไม่ให้ทีมดูแลระบบรู้ตัว</div><div>✅ คำว่า without alerting ชี้ว่าต้องเป็นการสอดแนมแบบไม่แทรกแซง (passive) เช่นการดักฟังทราฟฟิกเฉยๆ</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">penetration test</span></div><div class=\"tip-th\">💡 Passive Reconnaissance รวบรวมข้อมูลจาก public sources (Google, WHOIS, LinkedIn) โดยไม่ติดต่อ target ตรวจจับไม่ได้</div>", "fill_hint": ""}, {"num": 211, "stem": "Fill in the blank: To prevent clickjacking attacks, you should include the _____ header with the value 'SAMEORIGIN' in your web server's response headers.", "options": {"A": "Strict-Transport-Security", "B": "X-Frame-Options", "C": "Content-Security-Policy", "D": "X-Content-Type-Options"}, "correct": "B", "topic": "Web Application Attacks", "trick_keywords": ["prevent clickjacking attacks"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรใส่ header ใดพร้อมค่า SAMEORIGIN เพื่อป้องกัน clickjacking</div><div>🔑 <strong>สังเกตคำว่า</strong> \"prevent clickjacking attacks\" = ป้องกันการหลอกให้คลิกผ่าน iframe ที่ซ่อนอยู่</div><div>✅ ค่า SAMEORIGIN เป็นค่ามาตรฐานของ header X-Frame-Options ที่ใช้ป้องกันเว็บถูกฝังใน iframe จากที่อื่น</div></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>X-Frame-Options</strong></div>", "fill_hint": ""}, {"num": 212, "stem": "During an audit of your web server, you discover that the server is accessible via both HTTP and HTTPS. What is the best practice to enforce secure communication?", "options": {"A": "Redirect all HTTP traffic to HTTPS to ensure that all communications are encrypted.", "B": "Implement HTTP Strict Transport Security (HSTS) to prevent SSL stripping attacks.", "C": "Use a VPN to secure the communication channel between clients and the web server.", "D": "Implement an IDS/IPS to monitor and prevent potential threats and attacks."}, "correct": "A", "topic": "Web Application Attacks", "trick_keywords": ["accessible via both HTTP and HTTPS"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรทำอย่างไรเมื่อเซิร์ฟเวอร์เปิดให้เข้าถึงได้ทั้ง HTTP และ HTTPS พร้อมกัน</div><div>🔑 <strong>สังเกตคำว่า</strong> \"accessible via both HTTP and HTTPS\" = เข้าถึงได้ทั้งผ่าน HTTP และ HTTPS</div><div>✅ การมีทั้งสองช่องทางเปิดอยู่ทำให้ผู้ใช้เผลอเข้าทาง HTTP ที่ไม่เข้ารหัสได้ วิธีที่ถูกต้องคือ redirect ทุกอย่างไป HTTPS</div></div><div class=\"tip-th\">💡 Redirect HTTP→HTTPS บังคับใช้ TLS เข้ารหัส traffic ทั้งหมด ป้องกัน eavesdropping และ MITM</div>", "fill_hint": ""}, {"num": 213, "stem": "In an attempt to evade detection, how might an attacker use comments in SQL injection?", "options": {"A": "Including excessive SQL keywords to generate noise and false positives.", "B": "Inserting SQL commands in reversed order with a server-side script to reverse them back.", "C": "Appending random numeric calculations to the end of SQL commands.", "D": "Utilizing inline comments (/* */) to break up recognizably malicious SQL syntax."}, "correct": "D", "topic": "SQL Injection", "trick_keywords": ["use comments in SQL injection"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> แฮกเกอร์ใช้คอมเมนต์ในการทำ SQL injection เพื่อหลบการตรวจจับได้อย่างไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"use comments in SQL injection\" = ใช้เครื่องหมายคอมเมนต์ใน SQL injection</div><div>✅ การแทรกคอมเมนต์ /* */ เข้าไปคั่นคำสั่งที่มักถูกตรวจจับ ทำให้ signature-based filter จับรูปแบบไม่ได้</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">SQL inject</span></div><div class=\"tip-th\">💡 Utilizing inline comments (/* */) to break up recognizably malicious SQL syntax</div>", "fill_hint": ""}, {"num": 214, "stem": "When performing a penetration test on a web application, what command is useful for enumerating directories to find hidden resources?", "options": {"A": "gobuster dir -u http://example.com -w dirlist.txt", "B": "wget -r http://example.com", "C": "nmap -p80 --script http-enum http://example.com", "D": "curl -X GET http://example.com -H 'User-Agent: Mozilla/5.0'"}, "correct": "A", "topic": "Web Application Attacks", "trick_keywords": ["enumerating directories to find hidden resources"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> คำสั่งใดใช้แจกแจงไดเรกทอรีบนเว็บแอปเพื่อหาไฟล์/พาธที่ซ่อนอยู่</div><div>🔑 <strong>สังเกตคำว่า</strong> \"enumerating directories to find hidden resources\" = แจกแจงไดเรกทอรีเพื่อหาทรัพยากรที่ซ่อนอยู่</div><div>✅ gobuster dir คือเครื่องมือ brute-force พาธมาตรฐานที่ใช้หาไดเรกทอรีที่ไม่ถูกลิงก์ไว้ ตรงกับคำว่า enumerating directories</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">penetration test</span></div><div class=\"tip-th\">💡 DirBuster/Gobuster ใช้ brute-force หา hidden directories/files ใน web server จาก wordlist</div>", "fill_hint": ""}, {"num": 215, "stem": "When analyzing a zero-day vulnerability, what type of analysis is crucial for understanding the potential impact without executing the exploit?", "options": {"A": "Dynamic testing by executing the exploit in a controlled environment to observe its behavior.", "B": "Manual testing by skilled testers who try to break the software using unconventional input.", "C": "Static code analysis to examine the source code for unexpected behavior or anomalies.", "D": "Automated vulnerability scanning using tools designed to probe systems for known weaknesses."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": ["without executing the exploit"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การวิเคราะห์แบบใดสำคัญในการทำความเข้าใจผลกระทบของ zero-day โดยไม่ต้องรัน exploit จริง</div><div>🔑 <strong>สังเกตคำว่า</strong> \"without executing the exploit\" = โดยไม่ต้องรันโค้ดโจมตีจริง</div><div>✅ คำว่า without executing ชี้ว่าต้องวิเคราะห์แบบ static (อ่านโค้ดเฉยๆ ไม่รัน) ต่างจาก dynamic analysis ที่ต้องรันจริง</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">zero-day</span></div><div class=\"tip-th\">💡 Static code analysis to examine the source code for unexpected behavior or anomalies</div>", "fill_hint": ""}, {"num": 216, "stem": "Fill in the blank: For secure wireless communication, it is recommended to use __________ encryption to protect data from eavesdropping.", "options": {"A": "WPA2-Enterprise", "B": "WPA3-Personal", "C": "SSL", "D": "WEP"}, "correct": "A", "topic": "Cryptography", "trick_keywords": ["secure wireless communication"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรใช้การเข้ารหัสแบบใดเพื่อปกป้องข้อมูลไร้สายจากการดักฟัง</div><div>🔑 <strong>สังเกตคำว่า</strong> \"secure wireless communication\" = การสื่อสารไร้สายที่ปลอดภัย</div><div>✅ WPA2-Enterprise ให้การยืนยันตัวตนและเข้ารหัสที่แข็งแกร่งกว่ามาตรฐานอื่น เหมาะกับการป้องกัน eavesdropping ระดับองค์กร</div></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>WPA2-Enterprise</strong></div><div class=\"tip-th\">💡 WPA2 ใช้ AES-CCMP เป็น encryption มาตรฐาน ปลอดภัยพอ แต่ WPA3 ดีกว่าเรื่อง brute-force protection</div>", "fill_hint": ""}, {"num": 217, "stem": "During a digital forensic investigation, which software can be used to analyze the filesystem of a captured image for deleted files?", "options": {"A": "FTK Imager to visually inspect media files and system information.", "B": "Stellar Data Recovery for quick restoration of corrupted databases.", "C": "Autopsy for a detailed examination and recovery of potential digital evidence.", "D": "Disk Drill to primarily focus on recovering partition structures."}, "correct": "C", "topic": "Incident Response & Forensics", "trick_keywords": ["analyze the filesystem of a captured image for deleted files"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ซอฟต์แวร์ใดใช้วิเคราะห์ filesystem image เพื่อกู้ไฟล์ที่ถูกลบ</div><div>🔑 <strong>สังเกตคำว่า</strong> \"analyze the filesystem of a captured image for deleted files\" = วิเคราะห์ไฟล์ระบบของอิมเมจที่เก็บมาเพื่อหาไฟล์ที่ถูกลบ</div><div>✅ Autopsy เป็นเครื่องมือ digital forensics มาตรฐานที่ออกแบบมาสำหรับตรวจสอบ image และกู้คืนไฟล์ที่ถูกลบโดยเฉพาะ</div></div><div class=\"tip-th\">💡 Autopsy คือ digital forensics tool ตรวจสอบ disk image, recover deleted files, analyze file system ใช้ใน investigation</div>", "fill_hint": ""}, {"num": 218, "stem": "You are tasked with designing a cloud storage solution for sensitive data. What should be your first step to secure this environment?", "options": {"A": "Begin by setting public access as the default setting for all storage containers.", "B": "Regularly back up data to an external location without additional security measures.", "C": "Store all data in a publicly accessible storage bucket to facilitate easy access.", "D": "Enable encryption at rest using platform-specific tools like AWS KMS or Azure Key Vault."}, "correct": "D", "topic": "Cloud Security", "trick_keywords": ["first step to secure this environment"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ขั้นตอนแรกในการออกแบบระบบจัดเก็บข้อมูลสำคัญบน cloud ให้ปลอดภัยคืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"first step to secure this environment\" = ขั้นตอนแรกในการรักษาความปลอดภัยของสภาพแวดล้อมนี้</div><div>✅ การเข้ารหัสข้อมูลนิ่ง (at rest) ด้วยเครื่องมือของแพลตฟอร์มเอง เป็นด่านป้องกันพื้นฐานแรกสุดที่ต้องเปิดใช้ก่อนเสมอ</div></div><div class=\"tip-th\">💡 Encryption at Rest ด้วย KMS (Key Management Service) เข้ารหัสข้อมูลที่เก็บอยู่ใน cloud storage ป้องกัน data breach</div>", "fill_hint": ""}, {"num": 219, "stem": "Which command initializes a secure, encrypted virtual disk using VeraCrypt with a 512-bit Whirlpool hash algorithm?", "options": {"A": "cryptsetup luksFormat --size 500M --cipher aes-xts-plain64 --key-size 256", "B": "openssl enc -aes-256-cbc -in unencrypted.dat -out encrypted.dat -pass pass:[Password]", "C": "truecrypt --volume-create --size 500M --encryption Blowfish --file-system FAT32", "D": "veracrypt --create volume.hc --size 500M --encryption AES --hash Whirlpool --password [Password]"}, "correct": "D", "topic": "Cryptography", "trick_keywords": ["512-bit Whirlpool hash algorithm"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> คำสั่งใดสร้าง virtual disk เข้ารหัสด้วย VeraCrypt โดยใช้ hash Whirlpool 512-bit</div><div>🔑 <strong>สังเกตคำว่า</strong> \"512-bit Whirlpool hash algorithm\" = อัลกอริทึมแฮช Whirlpool ขนาด 512 บิต</div><div>✅ โจทย์ถามหา syntax เฉพาะที่ต้องระบุ --hash Whirlpool ตรงตามที่โจทย์กำหนด</div></div><div class=\"tip-th\">💡 Symmetric Encryption (AES) ใช้ key เดียวกัน encrypt/decrypt เร็วมาก แต่ต้องหาวิธีแชร์ key ให้ปลอดภัย</div>", "fill_hint": ""}, {"num": 220, "stem": "You are tasked with simulating an AI-based worm attack in a controlled environment. The scenario requires that the worm must autonomously spread without direct commands after initiation. Which method should you utilize to initiate this simulation?", "options": {"A": "Utilize an existing botnet to distribute the worm through command and control servers", "B": "Set up a honeypot network with vulnerable virtual machines and use a script to deploy the worm", "C": "Directly inject the worm into the network via an infected USB device", "D": "Deploy the worm via an email phishing campaign targeting all users within the organization"}, "correct": "B", "topic": "Malware & Viruses", "trick_keywords": ["autonomously spread without direct commands"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรใช้วิธีใดจำลอง worm ที่แพร่กระจายเองได้หลังเริ่มทำงานครั้งแรก</div><div>🔑 <strong>สังเกตคำว่า</strong> \"autonomously spread without direct commands\" = แพร่กระจายได้เองโดยไม่ต้องมีคำสั่งควบคุมต่อ</div><div>✅ การทดสอบสิ่งที่ทำงานอัตโนมัติต้องมีสภาพแวดล้อมจำลอง (honeypot) ที่มีเครื่องเสี่ยงให้ worm แพร่ต่อเองได้จริงอย่างปลอดภัย</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">worm</span></div><div class=\"tip-th\">💡 Honeypot คือ decoy system ดักจับ attacker เพื่อ log TTP โดยไม่กระทบระบบจริง</div>", "fill_hint": ""}, {"num": 221, "stem": "You are configuring a security information and event management (SIEM) system. What rule should you prioritize to detect potential APT activities?", "options": {"A": "Increase log storage capacity to handle the volume of data over long periods.", "B": "Implement strict access controls on all administrative accounts.", "C": "Filter all incoming emails to remove potential phishing attempts.", "D": "Alert on unusual outbound traffic, especially during off-hours."}, "correct": "D", "topic": "Incident Response & Forensics", "trick_keywords": ["detect potential APT activities"], "trick_tip_th": "<div class=\ rick_keywords": ["execute without writing to disk"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> fileless malware มักใช้อะไรในการรันโดยไม่ทิ้งไฟล์ไว้บนดิสก์</div><div>🔑 <strong>สังเกตคำว่า</strong> \"execute without writing to disk\" = รันได้โดยไม่ต้องเขียนไฟล์ลงดิสก์</div><div>✅ คำว่า without writing to disk ตรงกับพฤติกรรมของ malware ที่ฝังตัวอยู่ใน Windows Registry แทนการเขียนเป็นไฟล์</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">malware</span> · <span class=\"kw-tag\">Fileless</span></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>Windows Registry</strong></div>", "fill_hint": ""}, {"num": 226, "stem": "Fill in the blank: To bypass network security measures during penetration testing, an effective method is to utilize __________.", "options": {"A": "Social engineering tactics", "B": "Public Wi-Fi exploitation", "C": "VPN spoofing", "D": "Encrypted tunnels"}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": ["bypass network security measures"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรใช้วิธีใดบายพาสมาตรการความปลอดภัยเครือข่ายระหว่าง pentest</div><div>🔑 <strong>สังเกตคำว่า</strong> \"bypass network security measures\" = บายพาสมาตรการความปลอดภัยของเครือข่าย</div><div>✅ การส่งทราฟฟิกผ่าน tunnel ที่เข้ารหัสไว้ ทำให้ firewall/IDS มองไม่เห็นเนื้อหาข้างในและตรวจจับได้ยาก</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">penetration test</span></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>Encrypted tunnels</strong></div><div class=\"tip-th\">💡 VPN สร้าง encrypted tunnel ป้องกัน eavesdropping และซ่อน traffic จาก ISP</div>", "fill_hint": ""}, {"num": 227, "stem": "What command allows you to check for SUID enabled files, which might be exploitable on a Linux system?", "options": {"A": "chmod +s filename", "B": "find / -perm -4000 -type f -exec ls -la {} \\;", "C": "grep -i suid /etc/passwd", "D": "ls -l /bin /u ng the incident?", "options": {"A": "Utilizing Nessus to scan for vulnerabilities exposed during the breach.", "B": "Using Wireshark to filter and analyze the specific protocols involved in the breach.", "C": "Employing NetWitness to conduct a retrospective analysis based on security alerts.", "D": "Applying tcpdump to perform a real-time analysis and logging of all network traffic."}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": ["analyzing network packets captured during the incident"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> วิธีใดดีที่สุดในการวิเคราะห์แพ็กเก็ตที่จับไว้ระหว่างการสืบสวนเหตุการณ์เครือข่ายถูกเจาะ</div><div>🔑 <strong>สังเกตคำว่า</strong> \"analyzing network packets captured during the incident\" = วิเคราะห์แพ็กเก็ตที่จับไว้ระหว่างเหตุการณ์</div><div>✅ Wireshark ที่กรองเฉพาะโปรโตคอลที่เกี่ยวข้องกับเหตุการณ์ ช่วยโฟกัสการวิเคราะห์ได้ตรงจุดกว่าดูแพ็กเก็ตทั้งหมด</div></div><div class=\"tip-th\">💡 Wireshark คือ network protocol analyzer จับ packet วิเคราะห์แบบ real-time หา credentials ที่ส่ง plain text</div>", "fill_hint": ""}, {"num": 230, "stem": "During a security audit, how would you test for susceptibility to a zero-day exploit in a widely used software application?", "options": {"A": "Conducting a series of stress tests and performance benchmarks to identify unusual application responses.", "B": "Reviewing all recent security patches and updates to ensure they are applied.", "C": "Checking compliance with security best practices and guidelines provided by cybersecurity frameworks.", "D": "Simulating targeted attacks using variations of known vulnerabilities on the application."}, "correct": "D", "topic": "Risk, Compliance & Policy", "trick_keywords": ["susceptibility to a zero-day exploit"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรทดสอบอย่างไรว่าซอฟต์แวร์เสี่ยงต่อ zero-day exploit หรือไม่</div><div>🔑 <strong>สังเกตคำว่า</strong> \"susceptibility to a zero-day exploit\" = ความเสี่ยงต่อการถูกโจมตีด้วยช่องโหว่ zero-day</div><div>✅ เพราะ zero-day ยังไม่มีข้อมูลแน่ชัด การจำลองโจมตีด้วยรูปแบบที่ดัดแปลงจากช่องโหว่ที่รู้จักแล้ว ช่วยประเมินความเสี่ยงที่ยังไม่ถูกค้นพบได้ในระดับหนึ่ง</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">zero-day</span></div><div class=\"tip-th\">💡 Simulating targeted attacks using variations of known vulnerabilities on the application</div>", "fill_hint": ""}, {"num": 231, "stem": "What specific characteristic might indicate to a hacker that a network entity is a honeypot rather than a legitimate host?", "options": {"A": "The presence of multiple open ports with generic service banners indicating default configurations.", "B": "Unusually high network latency which could suggest regular traffic is being redirected.", "C": "The appearance of exceptionally well-maintained system logs with no signs of usual user errors.", "D": "High number of error messages generated in response to routine network requests."}, "correct": "A", "topic": "Incident Response & Forensics", "trick_keywords": ["indicate to a hacker that a network entity is a honeypot"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ลักษณะใดที่บ่งชี้ว่าเป้าหมายอาจเป็น honeypot ไม่ใช่โฮสต์จริง</div><div>🔑 <strong>สังเกตคำว่า</strong> \"indicate to a hacker that a network entity is a honeypot\" = บ่งชี้ว่าเป้าหมายเป็น honeypot ไม่ใช่ระบบจริง</div><div>✅ honeypot มักตั้งค่าหลายพอร์ตเปิดพร้อม banner ทั่วไปแบบ default ซึ่งผิดปกติเมื่อเทียบกับระบบจริงที่มักปิดพอร์ตที่ไม่ใช้</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">honeypot</span></div><div class=\"tip-th\">💡 The presence of multiple open ports with generic service banners indicating default configurations</div>", "fill_hint": ""}, {"num": 232, "stem": "What tool can be used to exploit a known vulnerability in Windows Server Remote Desktop Protocol (RDP)?", "options": {"A": "netcat target_ip 3389" ag\">honeypot</span></div><div class=\"tip-th\">💡 Longer than usual response times might suggest that the interactions are being monitored or analyzed</div>", "fill_hint": ""}, {"num": 243, "stem": "A security team is reviewing an incident where an APT was detected. What should be their first step in the analysis?", "options": {"A": "Review the timestamps and entry points of detected malicious activities.", "B": "Conduct a cost-benefit analysis of the damage caused by the APT.", "C": "Perform a public announcement to inform stakeholders about the breach.", "D": "Immediately isolate the affected systems from the network to prevent further damage."}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": ["first step in the analysis"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ขั้นตอนแรกในการวิเคราะห์เหตุการณ์ APT ที่ตรวจพบคืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"first step in the analysis\" = ขั้นตอนแรกของการวิเคราะห์</div><div>✅ การไล่ดู timestamp และจุดที่เข้ามาก่อน ช่วยสร้าง timeline ของเหตุการณ์ซึ่งเป็นพื้นฐานของการวิเคราะห์ทุกขั้นตอนถัดไป</div></div><div class=\"tip-th\">💡 ตรวจ timestamps และ entry points ของ malicious activity เพื่อ reconstruct attack timeline และหา root cause</div>", "fill_hint": ""}, {"num": 244, "stem": "Fill in the blank: A common tool for testing Linux server security by simulating rootkit injections is __________.", "options": {"A": "Lynis", "B": "chkrootkit", "C": "John the Ripper", "D": "rkhunter"}, "correct": "B", "topic": "SQL Injection", "trick_keywords": ["testing Linux server security by simulating rootkit injections"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เครื่องมือใดใช้ทดสอบว่าเซิร์ฟเวอร์ Linux มี rootkit ฝังอยู่หรือไม่</div><div>🔑 <strong>สังเกตคำว่า</strong> \"testing Linux server security by simulating rootkit injections\" = ทดสอบความปลอดภัยเซิร์ฟเวอร์ Linux ด้วยการจำลองการฝัง rootkit</div><div>✅ ชื่อเครื่องมือ chkrootkit ตรงกับหน้าที่ check for rootkit ตามชื่อโดยตรง</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">rootkit</span></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>chkrootkit</strong></div>", "fill_hint": ""}, {"num": 245, "stem": "In a secure messaging application, what encryption method ensures that a message remains confidential between sender and receiver?", "options": {"A": "Hash-based message authentication code (HMAC) for message integrity", "B": "Symmetric key encryption with shared secret keys", "C": "End-to-end encryption using public key infrastructure (PKI)", "D": "Transport layer security (TLS) encryption for server-client communication"}, "correct": "C", "topic": "Cryptography", "trick_keywords": ["remains confidential between sender and receiver"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> วิธีเข้ารหัสใดรับประกันว่าข้อความเป็นความลับเฉพาะผู้ส่งกับผู้รับเท่านั้น</div><div>🔑 <strong>สังเกตคำว่า</strong> \"remains confidential between sender and receiver\" = เป็นความลับเฉพาะระหว่างผู้ส่งกับผู้รับเท่านั้น</div><div>✅ คำว่า between sender and receiver เท่านั้น (ไม่มีตัวกลางอ่านได้) ตรงกับนิยามของ End-to-end encryption</div></div><div class=\"tip-th\">💡 PKI: Certificate Authority (CA) ออก Digital Certificate รับรองตัวตน ใช้ใน HTTPS/TLS</div>", "fill_hint": ""}, {"num": 246, "stem": "What command is used to create a bit-for-bit copy of a hard drive for forensic analysis?", "options": {"A": "dd if=/dev/sda of=/path/to/output.img bs=4M", "B": "cp /dev/sda /path/to/output.img", "C": "clonezilla -z1 -s /dev/sda -o /path/to/output", "D": "rsync -avzh /dev/sda /path/to/output/"}, "correct": "A", "topic": "Incident Response & Forensics", "trick_keywords": ["bit-for-bit copy"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> คำสั่งใดใช้สร้างสำเนาฮาร์ดดิสก์แบบทุกบิตสำหรับงาน forensic</div><div>🔑 <strong>สังเกตคำว่า</strong> \"bit-for-bit copy\" = สำเนาข้อมูลแบบทุกบิตเหมือนต้นฉบับ</div><div>✅ คำสั่ง dd คัดลอกข้อมูลดิบทุกบิตโดยไม่ผ่าน filesystem ตรงกับความหมาย bit-for-bit copy</div></div><div class=\"tip-th\">💡 dd if=/dev/sda of=output.img สร้าง bit-for-bit forensic image ของ disk รักษา evidence ครบถ้วนรวมถึง deleted files</div>", "fill_hint": ""}, {"num": 247, "stem": "Fill in the blank: To prevent a web application firewall from detecting malicious SQL inputs, an attacker could encode the SQL commands using __________.", "options": {"A": "URL encoding", "B": "Hexadecimal encoding", "C": "Base64 encoding", "D": "ASCII encoding"}, "correct": "B", "topic": "SQL Injection", "trick_keywords": ["encode the SQL commands"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ผู้โจมตีใช้วิธีเข้ารหัสคำสั่ง SQL แบบใดเพื่อหลบ WAF</div><div>🔑 <strong>สังเกตคำว่า</strong> \"encode the SQL commands\" = เข้ารหัสคำสั่ง SQL ให้ต่างไปจากปกติ</div><div>✅ การแปลงคำสั่งเป็นรูปแบบเลขฐานสิบหก (hex) ทำให้ WAF ที่ตรวจจับด้วย pattern คำสั่งตรงๆ จับไม่ได้ จนกว่าฐานข้อมูลจะถอดรหัสตอนรัน</div></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>Hexadecimal encoding</strong></div>", "fill_hint": ""}, {"num": 248, "stem": "Fill in the blank: To perform an aggressive scan that includes OS detection, service version detection, script scanning, and traceroute, use the Nmap flag __________.", "options": {"A": "-G", "B": "-T4", "C": "-A", "D": "-sX"}, "correct": "C", "topic": "Scanning & Enumeration Tools", "trick_keywords": ["OS detection, service version detection, script scanning, and traceroute"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรใช้ flag ใดของ Nmap เพื่อสแกนแบบครบทุกอย่างพร้อมกัน (aggressive scan)</div><div>🔑 <strong>สังเกตคำว่า</strong> \"OS detection, service version detection, script scanning, and traceroute\" = ตรวจ OS, เวอร์ชันบริการ, สคริปต์ และเส้นทางเครือข่ายพร้อมกัน</div><div>✅ flag -A รวมทุกฟีเจอร์ที่โจทย์ระบุไว้ในคำสั่งเดียว (Aggressive scan)</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">Nmap</span></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>-A</strong></div>", "fill_hint": ""}, {"num": 249, "stem": "What tool is primarily used for detecting SQL injection vulnerabilities in a web application?", "options": {"A": "w3af -s http://example.com", "B": "nessus --policy=http-tests --scan http://example.com", "C": "sqlmap -u \"http://example.com/page?query=test\"", "D": "nmap --script=http-sql-injection --url http://example.com"}, "correct": "C", "topic": "SQL Injection", "trick_keywords": ["detecting SQL injection vulnerabilities"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เครื่องมือใดใช้หลักในการตรวจจับช่องโหว่ SQL injection บนเว็บแอป</div><div>🔑 <strong>สังเกตคำว่า</strong> \"detecting SQL injection vulnerabilities\" = ตรวจจับช่องโหว่ SQL injection</div><div>✅ sqlmap เป็นเครื่องมือมาตรฐานที่ออกแบบมาเฉพาะสำหรับทดสอบและใช้ประโยชน์จาก SQL injection โดยตรงตามชื่อ</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">SQL inject</span></div><div class=\"tip-th\">💡 SQLMap คือ automated SQL injection tool ที่ test และ exploit SQL injection vulnerabilities ใน web apps อัตโนมัติ</div>", "fill_hint": ""}, {"num": 250, "stem": "How should a company configure VPN settings on mobile devices to ensure secure remote access?", "options": {"A": "Utilizing an SSL VPN with device-specific certificates.", "B": "Configuring VPN to use L2TP/IPSec with strong pre-shared keys.", "C": "Setting up Direct Access with IPsec to automatically secure connections.", "D": "Implementing OpenVPN with dynamic keys for each session."}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": ["secure remote access"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรตั้งค่า VPN บนมือถืออย่างไรให้เข้าถึงระยะไกลได้อย่างปลอดภัย</div><div>🔑 <strong>สังเกตคำว่า</strong> \"secure remote access\" = การเข้าถึงระยะไกลอย่างปลอดภัย</div><div>✅ การใช้โปรโตคอลที่เข้ารหัสแน่นหนาอย่าง L2TP/IPSec ร่วมกับ pre-shared key ที่แข็งแรง ตรงกับเป้าหมาย secure remote access</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">VPN</span></div><div class=\"tip-th\">💡 VPN สร้าง encrypted tunnel ป้องกัน eavesdropping และซ่อน traffic จาก ISP</div>", "fill_hint": ""}, {"num": 251, "stem": "Which command would you use to list all devices on a local network, including their IP addresses and MAC addresses?", "options": {"A": "Implementing nmap for a comprehensive scan of each device's ports.", "B": "Executing ping to each IP address in the subnet sequentially.", "C": "Deploying netstat to list active connections and listening ports on your machine.", "D": "Using arp-scan on a local subnet to scan for all connected devices."}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": ["IP addresses and MAC addresses"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> คำสั่งใดใช้แสดงอุปกรณ์ทั้งหมดในเครือข่ายท้องถิ่นพร้อม IP และ MAC address</div><div>🔑 <strong>สังเกตคำว่า</strong> \"IP addresses and MAC addresses\" = ที่อยู่ IP และ MAC ของอุปกรณ์</div><div>✅ arp-scan ทำงานที่ระดับ ARP ซึ่งให้ทั้ง IP และ MAC address ของอุปกรณ์ในวงเดียวกัน ตรงกับที่โจทย์ต้องการ</div></div><div class=\"tip-th\">💡 arp-scan ค้นหา devices ทุกตัวใน LAN ผ่าน ARP requests ได้ทั้ง IP และ MAC address เร็วและแม่นยำใน local subnet</div>", "fill_hint": ""}, {"num": 252, "stem": "In a red team exercise, what technique should be used to escalate privileges on a Windows server after initial access?", "options": {"A": "Exploiting known vulnerabilities in unpatched services.", "B": "Installing a backdoor software for later access.", "C": "Guessing common passwords to attempt unauthorized logins.", "D": "Utilizing phishing emails to collect more network credentials."}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": ["escalate privileges...after initial access"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรใช้เทคนิคใดยกระดับสิทธิ์บน Windows server หลังเข้าระบบได้แล้ว</div><div>🔑 <strong>สังเกตคำว่า</strong> \"escalate privileges...after initial access\" = ยกระดับสิทธิ์หลังจากเข้าระบบได้แล้วครั้งแรก</div><div>✅ การหาช่องโหว่ในบริการที่ยังไม่แพตช์ (unpatched) เป็นวิธีคลาสสิกในการยกระดับสิทธิ์หลังเจาะเข้าระบบได้แล้ว</div></div><div class=\"tip-th\">💡 Exploiting Known Vulnerabilities ใน unpatched services คือวิธีหลักที่ attacker ใช้ ป้องกัน: patch management สม่ำเสมอ</div>", "fill_hint": ""}, {"num": 253, "stem": "What protocol is typically used for secure mobile device management communications?", "options": {"A": "Hypertext Transfer Protocol Secure (HTTPS)", "B": "Transmission Control Protocol (TCP)", "C": "Secure Sockets Layer (SSL)", "D": "Internet Protocol Security (IPsec)"}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": ["secure mobile device management communications"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> โปรโตคอลใดใช้เข้ารหัสการสื่อสารสำหรับบริหารจัดการอุปกรณ์มือถือ</div><div>🔑 <strong>สังเกตคำว่า</strong> \"secure mobile device management communications\" = การสื่อสารเพื่อบริหารจัดการอุปกรณ์มือถืออย่างปลอดภัย</div><div>✅ การสื่อสารระหว่างเซิร์ฟเวอร์ MDM กับอุปกรณ์ต้องเข้ารหัสด้วยโปรโตคอลมาตรฐาน SSL/TLS เพื่อป้องกันการดักฟัง</div></div><div class=\"tip-th\">💡 TLS/SSL เข้ารหัส traffic ระหว่าง client กับ server (HTTPS) ป้องกัน MITM และ eavesdropping</div>", "fill_hint": ""}, {"num": 254, "stem": "How would you conduct a sophisticated spear-phishing attack to bypass email filters and reach high-profile targets?", "options": {"A": "Leveraging compromised email accounts of colleagues to send out phishing links.", "B": "Crafting emails with zero-day exploits embedded in attached documents that exploit software vulnerabilities.", "C": "Using social media platforms to send phishing messages instead of email.", "D": "Sending bulk emails with generic messages to bypass spam filters."}, "correct": "B", "topic": "Social Engineering & Phishing", "trick_keywords": ["bypass email filters and reach high-profile targets"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> จะทำ spear-phishing แบบซับซ้อนเพื่อหลบตัวกรองอีเมลและเข้าถึงเป้าหมายสำคัญได้อย่างไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"bypass email filters and reach high-profile targets\" = หลบตัวกรองอีเมลเพื่อเข้าถึงเป้าหมายระดับสูง</div><div>✅ การฝัง zero-day exploit ไว้ในไฟล์แนบ ทำให้ signature-based filter ทั่วไปตรวจจับไม่ได้เพราะยังไม่มีใครรู้จักช่องโหว่นี้</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">phishing</span> · <span class=\"kw-tag\">spear-phishing</span></div><div class=\"tip-th\">💡 Zero-day คือช่องโหว่ที่ยังไม่มี patch ป้องกัน: Anomaly-based IDS + least privilege + network segmentation</div>", "fill_hint": ""}, {"num": 255, "stem": "Fill in the blank: To analyze DNS traffic specifically, set Wireshark to filter by __________.", "options": {"A": "query type", "B": "transaction ID", "C": "type A", "D": "port 53"}, "correct": "D", "topic": "Reconnaissance & Footprinting", "trick_keywords": ["analyze DNS traffic specifically"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรตั้ง filter ใน Wireshark อย่างไรเพื่อดูเฉพาะทราฟฟิก DNS</div><div>🔑 <strong>สังเกตคำว่า</strong> \"analyze DNS traffic specifically\" = วิเคราะห์เฉพาะทราฟฟิก DNS</div><div>✅ DNS ใช้พอร์ตมาตรฐานคือ 53 การกรองที่พอร์ตนี้จึงเห็นเฉพาะทราฟฟิก DNS ตามที่โจทย์ต้องการ</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">Wireshark</span></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>port 53</strong></div>", "fill_hint": ""}, {"num": 256, "stem": "Fill in the blank: To assess a web application's security against session hijacking, one should test the strength of its __________.", "options": {"A": "encryption protocols", "B": "password complexity rules", "C": "two-factor authentication methods", "D": "session management mechanisms"}, "correct": "D", "topic": "Web Application Attacks", "trick_keywords": ["security against session hijacking"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรทดสอบความแข็งแรงของอะไรเพื่อประเมินความเสี่ยง session hijacking</div><div>🔑 <strong>สังเกตคำว่า</strong> \"security against session hijacking\" = ความปลอดภัยจากการขโมย session</div><div>✅ ต้นตอของช่องโหว่ session hijacking มาจากกลไกจัดการ session ที่อ่อนแอ การทดสอบกลไกนี้โดยตรงจึงตรงจุดที่สุด</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">session hijack</span></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>session management mechanisms</strong></div><div class=\"tip-th\">💡 ISO 27001 คือมาตรฐาน international สำหรับ ISMS (Information Security Management System) framework</div>", "fill_hint": ""}, {"num": 257, "stem": "A new web server is being set up for an e-commerce platform. As part of the security measures, you need to ensure that all unnecessary services and applications are disabled. What would be the first step in this process?", "options": {"A": "Update all web server software to the latest stable versions to patch known vulnerabilities.", "B": "Conduct a comprehensive security audit to identify and disable unnecessary services.", "C": "Install antivirus software on the web server to scan for and remove malicious software.", "D": "Apply role-based access control to limit the permissions of users and services interacting with the server."}, "correct": "B", "topic": "Web Application Attacks", "trick_keywords": ["unnecessary services and applications are disabled"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ก่อนจะปิดบริการที่ไม่จำเป็น ควรทำอะไรเป็นขั้นแรก</div><div>🔑 <strong>สังเกตคำว่า</strong> \"unnecessary services and applications are disabled\" = ปิดบริการ/แอปที่ไม่จำเป็น</div><div>✅ ต้องตรวจสอบ (audit) ก่อนว่าอะไรจำเป็นหรือไม่จำเป็น ก่อนจะไปปิดบริการใดๆ เป็นลำดับแรกเสมอ</div></div><div class=\"tip-th\">💡 Security Audit ครอบคลุมทั้งองค์กร ค้นหาและ disable unnecessary services ที่เป็น attack surface โดยไม่จำเป็น</div>", "fill_hint": ""}, {"num": 258, "stem": "You are tasked with securing database backups. Which protocol should be used to encrypt these backups at the transport layer?", "options": {"A": "Implement TLS 1.3 for secure transmission of data.", "B": "Configure FTPS to ensure encrypted file transfers.", "C": "Apply IPsec for end-to-end encrypted connectivity.", "D": "Use SSH tunneling for secure data transport."}, "correct": "A", "topic": "Cryptography", "trick_keywords": ["encrypt...at the transport layer"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรใช้โปรโตคอลใดเข้ารหัสข้อมูลสำรองที่ระดับ transport layer</div><div>🔑 <strong>สังเกตคำว่า</strong> \"encrypt...at the transport layer\" = เข้ารหัสที่ระดับชั้นการขนส่งข้อมูล</div><div>✅ คำว่า transport layer ชี้ตรงไปที่โปรโตคอล TLS ซึ่งทำงานที่ชั้นนี้โดยเฉพาะ</div></div><div class=\"tip-th\">💡 TLS/SSL เข้ารหัส traffic ระหว่าง client กับ server (HTTPS) ป้องกัน MITM และ eavesdropping</div>", "fill_hint": ""}, {"num": 259, "stem": "In an attempt to bypass advanced intrusion detection systems, which type of payload delivery should be used?", "options": {"A": "Exploiting zero-day vulnerabilities in security software itself.", "B": "Encrypted payloads that decrypt themselves at runtime.", "C": "Polymorphic shellcode that alters its signature each time it is executed.", "D": "Multi-partite viruses that infect both boot sectors and executable files."}, "correct": "C", "topic": "IDS/IPS & Firewalls", "trick_keywords": ["bypass advanced intrusion detection systems"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรใช้การส่ง payload แบบใดเพื่อหลบ IDS ขั้นสูง</div><div>🔑 <strong>สังเกตคำว่า</strong> \"bypass advanced intrusion detection systems\" = หลบ IDS ขั้น correct": "A", "topic": "General Security Concepts", "trick_keywords": ["vulnerable version of a Linux service"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> แฮกเกอร์ยกระดับสิทธิ์โดยใช้บริการ Linux เวอร์ชันที่มีช่องโหว่ได้อย่างไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"vulnerable version of a Linux service\" = บริการ Linux เวอร์ชันที่มีช่องโหว่</div><div>✅ การใช้ Metasploit ที่มี exploit module ตรงกับช่องโหว่ที่รู้จักของเวอร์ชันบริการนั้น เป็นวิธีมาตรฐานที่สุด</div></div><div class=\"tip-th\">💡 Metasploit คือ penetration testing framework มี exploit modules, payloads ใช้หลัง scan เจอ vulnerability</div>", "fill_hint": ""}, {"num": 262, "stem": "What specific Apache directive should be modified to restrict the directory listings when configuring a web server?", "options": {"A": "\"ServerTokens Prod\" to minimize the information leakage about the server version.", "B": "\"Options -Indexes\" to disable directory listings and prevent unauthorized browsing.", "C": "\"KeepAlive On\" to allow persistent connections and improve the performance of the web server.", "D": "\"AllowOverride None\" to prevent .htaccess files from overriding security settings of the server."}, "correct": "B", "topic": "Web Application Attacks", "trick_keywords": ["restrict the directory listings"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรแก้ directive ใดของ Apache เพื่อปิดการแสดงรายการไดเรกทอรี</div><div>🔑 <strong>สังเกตคำว่า</strong> \"restrict the directory listings\" = จำกัดการแสดงรายการไฟล์ในไดเรกทอรี</div><div>✅ directive Options -Indexes ปิดฟีเจอร์ auto directory listing ของ Apache โดยตรงตามชื่อ</div></div><div class=\"tip-th\">💡 \"Options -Indexes\" ใน Apache config ปิดการแสดง directory listing ป้องกัน attacker เห็นโครงสร้างไฟล์</div>", "fill_hint": ""}, {"num": 263, "stem": "Which component is crucial for an AI-based worm to decide its next target in a network?", "options": {"A": "Machine learning trained model", "B": "Self-replicating code block", "C": "Protocol analysis tool", "D": "Random decision algorithm"}, "correct": "D", "topic": "Malware & Viruses", "trick_keywords": ["decide its next target"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ส่วนประกอบใดสำคัญที่สุดที่ทำให้ worm ที่ใช้ AI เลือกเป้าหมายถัดไปในเครือข่ายได้</div><div>🔑 <strong>สังเกตคำว่า</strong> \"decide its next target\" = ตัดสินใจเลือกเป้าหมายถัดไป</div><div>✅ การจะตัดสินใจว่าจะไปเป้าหมายไหนต่อ ต้องมีอัลกอริทึมสุ่ม/ตัดสินใจกำกับอยู่เบื้องหลัง</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">worm</span></div><div class=\"tip-th\">✅ คำตอบ: <strong>Random decision algorithm</strong></div>", "fill_hint": ""}, {"num": 264, "stem": "In the context of securing a web server, what is the primary purpose of implementing a Web Application Firewall (WAF)?", "options": {"A": "To inspect and filter HTTP traffic to and from the web server against common attacks like SQL injection.", "B": "To provide a backup server in case the primary web server fails.", "C": "To act as a reverse proxy by distributing the load across multiple servers.", "D": "To serve as the primary user authentication method for web applications."}, "correct": "A", "topic": "Web Application Attacks", "trick_keywords": ["Web Application Firewall"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> วัตถุประสงค์หลักของการติดตั้ง WAF บนเว็บเซิร์ฟเวอร์คืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"Web Application Firewall\" = ไฟร์วอลล์เฉพาะสำหรับเว็บแอปพลิเคชัน</div><div>✅ ชื่อ WAF บ่งบอกหน้าที่ตรงตัวคือตรวจสอบ/กรองทราฟฟิก HTTP เพื่อกันการโจมตีที่พบบ่อย เช่น SQLi, XSS</div></div><div class=\"tip-th\">💡 Web Application Firewall (WAF) inspect และ filter HTTP traffic ป้องกัน common attacks เช่น SQL injection, XSS, CSRF ก่อนถึง web server</div>", "fill_hint": ""}, {"num": 265, "stem": "What is a common method to obfuscate SQL injection payloads to bypass basic input sanitization?", "options": {"A": "Randomly capitalizing SQL keywords to avoid pattern matching detection systems.", "B": "Repeatedly using SQL subqueries to mask the intent of the overall SQL command.", "C": "Inserting encoded characters that the database decodes at runtime.", "D": "Employing time delays within the SQL commands to confuse the detection algorithms."}, "correct": "C", "topic": "SQL Injection", "trick_keywords": ["obfuscate SQL injection payloads"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> วิธีใดใช้พราง payload SQL injection เพื่อหลบการกรองอินพุตพื้นฐาน</div><div>🔑 <strong>สังเกตคำว่า</strong> \"obfuscate SQL injection payloads\" = พรางรูปแบบ payload SQL injection</div><div>✅ การแทรกอักขระที่เข้ารหัสไว้ ซึ่งฐานข้อมูลจะถอดรหัสเองตอนรัน ทำให้ตัวกรองอินพุตพื้นฐานที่มองหา syntax ตรงๆ ตรวจจับไม่ได้</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">SQL inject</span> · <span class=\"kw-tag\">input sanitiz</span></div><div class=\"tip-th\">✅ คำตอบ: <strong>Inserting encoded characters that the database decodes at runtime.</strong></div>", "fill_hint": ""}, {"num": 266, "stem": "When attempting to maintain persistence on a hacked Windows Server, what technique is most effective?", "options": {"A": "Setting up a scheduled task that periodically reinstalls the malware.", "B": "Embedding scripts in the Windows Registry that execute upon login.", "C": "Installing a rootkit that hides its presence and starts on boot.", "D": "Using group policy objects to execute scripts at system startup."}, "correct": "C", "topic": "Privilege Escalation & Post-Exploitation", "trick_keywords": ["maintain persistence"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เทคนิคใดมีประสิทธิภาพที่สุดในการคงการเข้าถึง (persistence) บน Windows server ที่ถูกเจาะแล้ว</div><div>🔑 <strong>สังเกตคำว่า</strong> \"maintain persistence\" = คงการเข้าถึงไว้ในระยะยาว</div><div>✅ rootkit ที่ซ่อนตัวแล v class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">Nmap</span></div><div class=\"tip-th\">💡 Nmap คือ network scanner: -sS stealth SYN scan, -O OS detect, -sV service version, -A aggressive scan</div>", "fill_hint": ""}, {"num": 269, "stem": "Fill in the blank: To exploit unpatched Windows Server vulnerabilities related to SMBv1, attackers might use the tool __________.", "options": {"A": "EternalBlue", "B": "MS17-010", "C": "MS08-067", "D": "Mimikatz"}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": ["unpatched...vulnerabilities related to SMBv1"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เครื่องมือใดใช้โจมตีช่องโหว่ SMBv1 ที่ยังไม่แพตช์ใน Windows Server</div><div>🔑 <strong>สังเกตคำว่า</strong> \"unpatched...vulnerabilities related to SMBv1\" = ช่องโหว่ที่ยังไม่แพตช์ในโปรโตคอล SMBv1</div><div>✅ EternalBlue คือชื่อเครื่องมือ/exploit ที่มีชื่อเสียงที่สุดสำหรับใช้ประโยชน์จากช่องโหว่ SMBv1 โดยเฉพาะ</div></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>EternalBlue</strong></div>", "fill_hint": ""}, {"num": 270, "stem": "During an advanced persistent threat (APT) simulation, you are tasked with evading a honeypot. Which technique would be best to differentiate between a real system and a honeypot?", "options": {"A": "Checking the SSL certificate details for discrepancies that are uncommon in genuine servers.", "B": "Simulating social engineering attacks to see if the system users interact in a human-like manner.", "C": "Employing frequent port scanning to trigger the honeypot’s detection algorithms prematurely.", "D": "Applying machine learning models to predict the likelihood of a node being a honeypot based on network behavior."}, "correct": "A", "topic": "Incident Response & Forensics", "trick_keywords": ["differentiate between a real system and a honeypot"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรใช้เทคนิคใดแยกแยะว่าเป้าหมายเป็นระบบจริงหรือ honeypot</div><div>🔑 <strong>สังเกตคำว่า</strong> \"differentiate between a real system and a honeypot\" = แยกแยะว่าเป็นระบบจริงหรือ honeypot</div><div>✅ honeypot มักตั้งค่า SSL certificate แบบง่าย/ผิดปกติ เช่น self-signed หรือ default ต่างจาก certificate ของระบบจริง การตรวจสอบรายละเอียด cert จึงช่วยแยกแยะได้</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">honeypot</span></div><div class=\"tip-th\">💡 TLS/SSL เข้ารหัส traffic ระหว่าง client กับ server (HTTPS) ป้องกัน MITM และ eavesdropping</div>", "fill_hint": ""}, {"num": 271, "stem": "What is a common method to gain elevated privileges on a compromised Windows Server using a zero-day exploit?", "options": {"A": "Running a batch file that modifies system permissions.", "B": "Utilizing a previously undisclosed PowerShell exploit script.", "C": "Exploiting an SQL injection on an internal server application.", "D": "Creating a new administrator account through the command prompt."}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": ["using a zero-day exploit"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> วิธีใดใช้ยกระดับสิทธิ์บน Windows Server ที่ถูกเจาะแล้วด้วย zero-day exploit</div><div>🔑 <strong>สังเกตคำว่า</strong> \"using a zero-day exploit\" = ใช้ช่องโหว่ zero-day</div><div>✅ zero-day หมายถึงช่องโหว่ที่ยังไม่เปิดเผย (previously undisclosed) จึงต้องใช้สคริปต์โจมตีที่ยังไม่มีใครรู้จักมาก่อน</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">zero-day</span></div><div class=\"tip-th\">✅ คำตอบ: <strong>Utilizing a previously undisclosed PowerShell exploit script.</strong></div>", "fill_hint": ""}, {"num": 272, "stem": "When configuring a virtual private cloud (VPC), what is the best practice to ensure secure communication between instances?", "options": {"A": "Implement network access control lists (ACLs) and security groups to restrict traffic.", "B": "Use a single SSH key pair for all instances to simplify management.", "C": "Disable all firewalls to ensure uninterrupted data flow between instances.", "D": "Connect instances directly to the internet to increase performance."}, "correct": "A", "topic": "Cloud Security", "trick_keywords": ["secure communication between instances"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> แนวปฏิบัติที่ดีที่สุดในการรักษาความปลอดภัยการสื่อสารระหว่าง instance ใน VPC คืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"secure communication between instances\" = การสื่อสารที่ปลอดภัยระหว่าง instance</div><div>✅ การจำกัดทราฟฟิกด้วย network ACL และ security group ควบคุมว่าอะไรคุยกับอะไรได้ ตรงกับเป้าหมาย secure communication ระหว่าง instance</div></div><div class=\"tip-th\">💡 Network ACLs + Security Groups จำกัดว่า traffic ไหนเข้า/ออก network segment ได้ หลัก least privilege สำหรับ network</div>", "fill_hint": ""}, {"num": 273, "stem": "During a penetration test, how can an attacker determine if a web application is vulnerable to SQL injection?", "options": {"A": "Using fuzzing techniques to identify input fields that are not properly sanitized.", "B": "Reviewing the source code manually for potential security flaws.", "C": "Implementing automated scanning tools to detect standard vulnerabilities.", "D": "Testing for error-based SQL injection by inputting special SQL characters."}, "correct": "D", "topic": "SQL Injection", "trick_keywords": ["determine if a web application is vulnerable"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ผู้โจมตีตรวจสอบได้อย่างไรว่าเว็บแอปมีช่องโหว่ SQL injection</div><div>🔑 <strong>สังเกตคำว่า</strong> \"determine if a web application is vulnerable\" = ตรวจสอบว่าเว็บแอปมีช่องโหว่หรือไม่</div><div>✅ การป้อนอักขระพิเศษของ SQL เช่นเครื่องหมายคำพูดเดี่ยว แล้วดู error message ที่ตอบกลับ เป็นวิธีพื้นฐานที่สุดในการตรวจสอบ</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">SQL inject</span> · <span class=\"kw-tag\">penetration test</span> work by managing data flow efficiently."}, "correct": "A", "topic": "Incident Response & Forensics", "trick_keywords": ["primary role of a honeypot"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> บทบาทหลักของ honeypot ในการป้องกัน APT คืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"primary role of a honeypot\" = บทบาทหลักของ honeypot</div><div>✅ honeypot ถูกออกแบบมาเพื่อล่อให้ผู้โจมตีเข้ามาปฏิสัมพันธ์ในสภาพแวดล้อมควบคุม เพื่อศึกษาวิธีการโจมตี ไม่ใช่เพื่อป้องกันโดยตรง</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">honeypot</span></div><div class=\"tip-th\">💡 To deceive attackers into engaging with controlled environments, revealing their methods</div>", "fill_hint": ""}, {"num": 278, "stem": "Which command is most effective for performing a stealthy port scan to avoid detection by intrusion detection systems?", "options": {"A": "telnet target_ip 1-65535", "B": "nmap -sS -T2 -p 1-65535 target_ip", "C": "nc -zv target_ip 1-65535", "D": "hping3 -S target_ip -p ++1 -c 1000"}, "correct": "B", "topic": "Scanning & Enumeration Tools", "trick_keywords": ["stealthy port scan to avoid detection"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> คำสั่งใดมีประสิทธิภาพที่สุดในการสแกนพอร์ตแบบเนียนหลบ IDS</div><div>🔑 <strong>สังเกตคำว่า</strong> \"stealthy port scan to avoid detection\" = สแกนพอร์ตแบบเนียนหลบการตรวจจับ</div><div>✅ -sS (SYN scan) ร่วมกับ -T2 (ความเร็วช้าลง) ช่วยลดโอกาสถูกตรวจจับ ตรงกับคำว่า stealthy...avoid detection</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">port scan</span></div><div class=\"tip-th\">💡 Nmap คือ network scanner: -sS stealth SYN scan, -O OS detect, -sV service version, -A aggressive scan</div>", "fill_hint": ""}, {"num": 279, "stem": "A company wants to ensure their emails are securely encrypted from end to end. What is the first step they should take in their email client configuration?", "options": {"A": "Set up a virtual private network (VPN) for all outgoing and incoming emails.", "B": "Configure the email server to block all unencrypted incoming messages.", "C": "Generate and install personal digital certificates for encryption and signing.", "D": "Enable spam filters and antivirus software to check for malicious content."}, "correct": "C", "topic": "Cryptography", "trick_keywords": ["securely encrypted from end to end"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ขั้นตอนแรกในการตั้งค่าอีเมลให้เข้ารหัสแบบ end-to-end คืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"securely encrypted from end to end\" = เข้ารหัสตลอดเส้นทางตั้งแต่ต้นจนจบ</div><div>✅ การเข้ารหัส/เซ็นอีเมลแบบ end-to-end เช่น S/MIME ต้องมี certificate ส่วนตัวของผู้ใช้ก่อนเป็นลำดับแรกเสมอ</div></div><div class=\"tip-th\">💡 PKI: Certificate Authority (CA) ออก Digital Certificate รับรองตัวตน ใช้ใน HTTPS/TLS</div>", "fill_hint": ""}, {"num": 280, "stem": "Fill in the blank: To ensure the integrity of logs during a cyber incident, it is critical to __________ them to a secure, external location.", "options": {"A": "replicate", "B": "encrypt", "C": "monitor", "D": "compress"}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": ["integrity of logs during a cyber incident"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรทำอะไรกับ log เพื่อรักษาความถูกต้องระหว่างเกิดเหตุการณ์ไซเบอร์</div><div>🔑 <strong>สังเกตคำว่า</strong> \"integrity of logs during a cyber incident\" = ความถูกต้องของ log ระหว่างเกิดเหตุการณ์</div><div>✅ การคัดลอก/ทำสำเนา (replicate) log ไปเก็บไว้ที่ปลอดภัยภายนอกทันที ป้องกันไม่ให้ผู้โจมตีย้อนมาลบ/แก้ log ต้นทาง</div></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>replicate</strong></div>", "fill_hint": ""}, {"num": 281, "stem": "Fill in the blank: To enumerate devices behind a firewall, it's effective to use __________ to passively listen for traffic and identify active hosts.", "options": {"A": "Packet sniffing", "B": "DNS zone transfers", "C": "ARP spoofing", "D": "ICMP echo requests"}, "correct": "A", "topic": "IDS/IPS & Firewalls", "trick_keywords": ["passively listen for traffic"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรใช้อะไรในการแจกแจงอุปกรณ์หลัง firewall ด้วยการดักฟังทราฟฟิกแบบ passive</div><div>🔑 <strong>สังเกตคำว่า</strong> \"passively listen for traffic\" = ดักฟังทราฟฟิกแบบ passive</div><div>✅ คำว่า passively listen ตรงกับนิยามของ Packet Sniffing โดยตรง ต่างจาก active scan ที่ต้องส่งแพ็กเก็ตออกไป</div></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>Packet sniffing</strong></div>", "fill_hint": ""}, {"num": 282, "stem": "After a breach has been successfully contained, what is the most critical step before transitioning to the recovery phase?", "options": {"A": "Perform a thorough vulnerability scan to identify and mitigate any exploited weaknesses.", "B": "Conduct an exit interview with the incident response team to gather feedback.", "C": "Hold a press conference to address the incident publicly and reassure stakeholders.", "D": "Review and update the incident response plan based on lessons learned."}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": ["before transitioning to the recovery phase"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> หลัง contain เหตุการณ์แล้ว ก่อนเข้าสู่ recovery phase ควรทำอะไรก่อน</div><div>🔑 <strong>สังเกตคำว่า</strong> \"before transitioning to the recovery phase\" = ก่อนจะเข้าสู่ขั้นตอนการกู้คืนระบบ</div><div>✅ ต้องยืนยันว่าไม่มีช่องโหว่ที่ถูกใช้เจาะเหลืออยู่ (สแกนช่องโหว่ซ้ำ) ก่อนจะกู้คืนระบบกลับมาใช้งาน มิฉะนั้นอาจถูกเจาะซ้ำทันที</div></div><div class=\"tip-th\">💡 Post-incident Vulnerability Scan ตรวจหาและ mitigate vulnerabilities ที่ถูก exploit ป้องกัน re-exploitation จาก same vector</div>", "fill_hint": ""}, {"num": 283, "stem": "When conducting a compliance audit, how can Nmap be used to verify that no unauthorized servers are running SSH on a network?", "options": {"A": "Running nmap -p 22 --open 192.168.0.0/24 to find all hosts with port 22 open.", "B": "Deploying nmap -T4 -A -p 22 192.168.0.0/24 for a comprehensive scan including OS detection.", "C": "Executing nmap -p 22 -sV 192.168.0.0/24 to check for the version of SSH running on each host.", "D": "Utilizing nmap -sS -p 22 192.168.0.0/24 to stealthily scan for SSH servers."}, "correct": "A", "topic": "Scanning & Enumeration Tools", "trick_keywords": ["no unauthorized servers are running SSH"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรใช้ Nmap อย่างไรตรวจสอบว่าไม่มีเซิร์ฟเวอร์แปลกปลอมเปิด SSH ในเครือข่าย</div><div>🔑 <strong>สังเกตคำว่า</strong> \"no unauthorized servers are running SSH\" = ไม่มีเซิร์ฟเวอร์ที่ไม่ได้รับอนุญาตเปิด SSH อยู่</div><div>✅ การสแกนเจาะจงที่พอร์ต 22 พอร์ตมาตรฐานของ SSH พร้อม --open เพื่อดูเฉพาะโฮสต์ที่เปิดพอร์ตนี้จริง ตรงกับที่โจทย์ต้องการ</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">Nmap</span></div><div class=\"tip-th\">💡 Nmap คือ network scanner: -sS stealth SYN scan, -O OS detect, -sV service version, -A aggressive scan</div>", "fill_hint": ""}, {"num": 284, "stem": "Which Nmap command can be used to perform a service version detection scan?", "options": {"A": "nmap -sV target_ip", "B": "nmap -sS target_ip", "C": "nmap -sC target_ip", "D": "nmap -O target_ip"}, "correct": "A", "topic": "Scanning & Enumeration Tools", "trick_keywords": ["service version detection scan"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> คำสั่ง Nmap ใดใช้ตรวจหาเวอร์ชันของบริการที่รันอยู่</div><div>🔑 <strong>สังเกตคำว่า</strong> \"service version detection scan\" = สแกนตรวจหาเวอร์ชันของบริการ</div><div>✅ flag -sV ของ Nmap คือ flag เฉพาะสำหรับ Service Version detection ตรงตามชื่อ flag เลย</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">Nmap</span></div><div class=\"tip-th\">💡 Nmap คือ network scanner: -sS stealth SYN scan, -O OS detect, -sV service version, -A aggressive scan</div>", "fill_hint": ""}, {"num": 285, "stem": "How can you identify Cross-Site Scripting (XSS) vulnerabilities in a web form?", "options": {"A": "Utilizing browser developer tools to inspect form responses for unescaped characters.", "B": "Injecting <script>alert('XSS')<\/script> into text fields and observing the response.", "C": "Sending HTTP requests that include JavaScript code snippets via Postman.", "D": "Conducting automated scans using a commercial web vulnerability scanner."}, "correct": "B", "topic": "Web Application Attacks", "trick_keywords": ["identify Cross-Site Scripting (XSS) vulnerabilities"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> จะตรวจสอบช่องโหว่ XSS ในฟอร์มเว็บได้อย่างไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"identify Cross-Site Scripting (XSS) vulnerabilities\" = ตรวจสอบช่องโหว่ XSS</div><div>✅ การแทรก payload ทดสอบอย่าง script alert แล้วดูว่าโค้ดถูกรันจริงหรือไม่ เป็นวิธีทดสอบ XSS แบบพื้นฐานที่สุด</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">XSS</span> · <span class=\"kw-tag\">Cross-Site Script</span></div><div class=\"tip-th\">💡 XSS (Cross-Site Scripting) คือการฉีด JavaScript เข้าหน้าเว็บเพื่อทำงานบน browser ของเหยื่อ เช่น ขโมย cookie</div>", "fill_hint": ""}, {"num": 286, "stem": "During a security audit, you discovered traces of an AI-based worm. What initial command should you use to analyze the network traffic to identify the worm's replication?", "options": {"A": "tcpdump -i eth0 port 445 or port 139", "B": "netstat -an | grep ':445'", "C": "arp -a | grep -v 'incomplete'", "D": "sudo lsof -i :445"}, "correct": "A", "topic": "Malware & Viruses", "trick_keywords": ["identify the worm's replication"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรใช้คำสั่งใดวิเคราะห์ทราฟฟิกเพื่อดูการแพร่กระจายของ worm</div><div>🔑 <strong>สังเกตคำว่า</strong> \"identify the worm's replication\" = ระบุการแพร่กระจายตัวของ worm</div><div>✅ worm จำนวนมากแพร่ผ่านโปรโตคอล SMB พอร์ต 445/139 การดักดูทราฟฟิกที่พอร์ตนี้จึงช่วยตามรอยการแพร่กระจายได้</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">worm</span></div><div class=\"tip-th\">💡 tcpdump คือ command-line packet capture tool ดัก TCP/IP traffic ใน terminal ใช้ forensics และ troubleshoot network</div>", "fill_hint": ""}, {"num": 287, "stem": "A system administrator discovers an unauthorized access to a server. What is the initial step in the containment strategy?", "options": {"A": "Initiate a forensic analysis to understand the methods of intrusion.", "B": "Disconnect the affected server from the network to prevent further access.", "C": "Install updates and patches immediately to close off security vulnerabilities.", "D": "Change all user passwords and admin credentials as a precaution."}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": ["initial step in the containment strategy"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ขั้นตอนแรกในการควบคุมเหตุการณ์เมื่อพบการเข้าถึงเซิร์ฟเวอร์โดยไม่ได้รับอนุญาตคืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"initial step in the containment strategy\" = ขั้นตอนแรกของกลยุทธ์การควบคุมเหตุการณ์</div><div>✅ การตัดเครื่องออกจากเครือข่ายทันที เป็นขั้นตอน contain พื้นฐานที่สุดเพื่อหยุดไม่ให้ผู้บุกรุกเข้าถึงต่อได้</div></div><div class=\"tip-th\">💡 Disconnect affected server จาก network เป็น first response เพื่อหยุด unauthorized access และป้องกัน lateral movement</div>", "fill_hint": ""}, {"num": 288, "stem": "What method is most effective for a security team to proactively detect potential zero-day exploits on their systems?", "options": {"A": "Conducting regular security audits and comprehensive system scans with updated tools.", "B": "Regularly updating antivirus signatures and employing heuristic scanning routines.", "C": "Implementing advanced behavior-based intrusion detection systems that monitor for unusual activity.", "D": "Setting up honeypots to attract and analyze incoming attacks for new exploit methods."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": ["proactively detect potential zero-day exploits"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> วิธีใดมีประสิทธิภาพที่สุดในการตรวจจับ zero-day exploit เชิงรุก</div><div>🔑 <strong>สังเกตคำว่า</strong> \"proactively detect potential zero-day exploits\" = ตรวจจับ zero-day เชิงรุกล่วงหน้า</div><div>✅ เพราะ zero-day ยังไม่มี signature ระบบที่ตรวจจับจากพฤติกรรมผิดปกติ (behavior-based) แทนที่จะพึ่ง signature จึงจับ zero-day ได้ดีกว่า</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">zero-day</span></div><div class=\"tip-th\">💡 IDS (Intrusion Detection System) passive ตรวจจับและแจ้งเตือนเท่านั้น ไม่บล็อก threat โดยอัตโนมัติ</div>", "fill_hint": ""}, {"num": 289, "stem": "Fill in the blank: To avoid interaction with a suspected honeypot, a hacker might use __________ to obfuscate their IP address and make their traffic appear as if it is coming from multiple locations.", "options": {"A": "Proxy servers", "B": "Public Wi-Fi", "C": "VPN chaining", "D": "Tor networks"}, "correct": "C", "topic": "Incident Response & Forensics", "trick_keywords": ["obfuscate their IP address...appear as if it is coming from multiple locations"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> แฮกเกอร์ใช้อะไรพรางที่อยู่ IP ให้ดูเหมือนมาจากหลายที่เพื่อเลี่ยง honeypot</div><div>🔑 <strong>สังเกตคำว่า</strong> \"obfuscate their IP address...appear as if it is coming from multiple locations\" = พรางที่อยู่ IP ให้ดูเหมือนมาจากหลายที่</div><div>✅ การต่อ VPN หลายชั้นซ้อนกัน (chaining) ทำให้ traceback ยากและดูเหมือนมาจากหลายตำแหน่งตามคำอธิบาย</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">honeypot</span></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <stro
