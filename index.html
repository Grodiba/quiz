crawl=1", "D": "sqlmap -u http://example.com --scan"}, "correct": "C", "topic": "SQL Injection", "trick_keywords": ["automated crawl with SQLMap"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> คำสั่งใดใช้เริ่มคลานเว็บอัตโนมัติด้วย SQLMap เพื่อทดสอบ SQL injection</div><div>🔑 <strong>สังเกตคำว่า</strong> \"automated crawl with SQLMap\" = คลานเว็บอัตโนมัติด้วย SQLMap</div><div>✅ flag --crawl=1 ของ sqlmap สั่งให้เครื่องมือไล่คลานลิงก์ในเว็บไซต์อัตโนมัติเพื่อหาจุดที่อาจมีช่องโหว่ ตรงตามชื่อ flag</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">SQL inject</span></div><div class=\"tip-th\">💡 SQLMap คือ automated SQL injection tool ที่ test และ exploit SQL injection vulnerabilities ใน web apps อัตโนมัติ</div>", "fill_hint": ""}, {"num": 423, "stem": "Fill in the blank: To view information about a specific exploit in Metasploit, use the command ___________.", "options": {"A": "show details", "B": "describe exploit", "C": "exploit info", "D": "info"}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": ["view information about a specific exploit"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> คำสั่งใดใน Metasploit ใช้ดูรายละเอียดของ exploit ที่เลือกอยู่</div><div>🔑 <strong>สังเกตคำว่า</strong> \"view information about a specific exploit\" = ดูรายละเอียดของ exploit ที่เลือกไว้</div><div>✅ คำสั่ง info เป็นคำสั่งมาตรฐานของ Metasploit console ที่แสดงรายละเอียดของ module ที่กำลังใช้งานอยู่ตรงตามชื่อคำสั่ง</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">Metasploit</span></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>info</strong></div>", "fill_hint": ""}, {"num": 424, "stem": "During the setup of a honeynet, what strategy should be implemented to ensure it is attractive to attackers while protecting real network assets?", "options": {"A": "Restricting access to the honeynet only to known IP addresses", "B": "Implementing decoy applications that mimic vulnerable services while isolating them from the core network", "C": "Encrypting all data to and from the honeynet to prevent data leaks", "D": "Using default security settings on all honeynet devices to encourage interactions"}, "correct": "B", "topic": "Incident Response & Forensics", "trick_keywords": ["attractive to attackers while protecting real network assets"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรใช้กลยุทธ์ใดตอนตั้งค่า honeynet ให้ดึงดูดแฮกเกอร์แต่ไม่กระทบทรัพยากรจริง</div><div>🔑 <strong>สังเกตคำว่า</strong> \"attractive to attackers while protecting real network assets\" = ดึงดูดผู้โจมตีแต่ปกป้องทรัพยากรเครือข่ายจริง</div><div>✅ การสร้างแอปหลอกล่อที่ดูเหมือนมีช่องโหว่ (attractive) แต่แยกออกจากเครือข่ายจริงโดยสิ้นเชิง (isolate) ตอบโจทย์ทั้งสองด้านพร้อมกัน</div></div><div class=\"tip-th\">💡 Decoy Applications (honeypots) จำลอง vulnerable services แยกจาก core network เพื่อดักจับ attacker และ learn their techniques</div>", "fill_hint": ""}, {"num": 425, "stem": "In a simulated environment, you are tasked with mitigating a DDoS attack on a corporate website. Which technique would be most effective?", "options": {"A": "Deploying an intrusion detection system (IDS) to alert on potential DDoS attack patterns.", "B": "Configuring a web application firewall (WAF) to detect and block traffic anomalies and malicious patterns.", "C": "Increasing the bandwidth of the internet connection significantly to handle increased traffic volumes.", "D": "Redirecting all incoming traffic through a third-party DDoS protection service that can scrub the traffic before passing it on."}, "correct": "B", "topic": "DoS / DDoS", "trick_keywords": ["mitigating a DDoS attack on a corporate website"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เทคนิคใดมีประสิทธิภาพที่สุดในการบรรเทาการโจมตี DDoS บนเว็บไซต์</div><div>🔑 <strong>สังเกตคำว่า</strong> \"mitigating a DDoS attack on a corporate website\" = บรรเทาการโจมตี DDoS บนเว็บไซต์องค์กร</div><div>✅ การตั้งค่า WAF ให้ตรวจจับ/บล็อกทราฟฟิกที่ผิดปกติโดยอัตโนมัติ ช่วยกรองทราฟฟิกโจมตีออกก่อนถึงเว็บเซิร์ฟเวอร์จริง</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">DDoS</span></div><div class=\"tip-th\">💡 Configuring a web application firewall (WAF) to detect and block traffic anomalies and malicious patterns</div>", "fill_hint": ""}, {"num": 426, "stem": "Fill in the blank: \"In cloud security, setting up _________ access control can help ensure that users have the minimal necessary permissions for their role.\"", "options": {"A": "comprehensive", "B": "universal", "C": "granular", "D": "integrated"}, "correct": "C", "topic": "Cloud Security", "trick_keywords": ["minimal necessary permissions for their role"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรตั้งค่าการควบคุมสิทธิ์แบบใดเพื่อให้ผู้ใช้มีสิทธิ์เท่าที่จำเป็นต่อบทบาทเท่านั้น</div><div>🔑 <strong>สังเกตคำว่า</strong> \"minimal necessary permissions for their role\" = สิทธิ์ที่จำเป็นขั้นต่ำสุดสำหรับบทบาทของแต่ละคน</div><div>✅ การควบคุมสิทธิ์แบบละเอียด (granular) กำหนดสิทธิ์เฉพาะเจาะจงทีละรายการ ทำให้จำกัดสิทธิ์ให้เหลือน้อยที่สุดตามบทบาทได้จริง</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">access control</span></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>granular</strong></div>", "fill_hint": ""}, {"num": 427, "stem": "During a security training, you are demonstrating how an XSS attack can be conducted. What script should you inject to show an alert box as proof of concept?", "options": {"A": "<img src=x onerror=alert('Test');>", "B": "<script>alert('XSS');<\/script>", "C": "<div onload=alert('XSS Detected!')></div>", "D": "<iframe src=\"javascript:alert('XSS');\"></iframe>"}, "correct": "B", "topic": "Web Application Attacks", "trick_keywords": ["demonstrating how an XSS attack can be conducted"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรแทรกสคริปต์ใดเพื่อสาธิตการโจมตี XSS แบบพิสูจน์แนวคิด</div><div>🔑 <strong>สังเกตคำว่า</strong> \"demonstrating how an XSS attack can be conducted\" = สาธิตวิธีการโจมตี XSS</div><div>✅ การแทรกโค้ด alert แบบง่ายที่สุดเพื่อพิสูจน์ว่า JavaScript ถูกรันได้จริงในหน้าเว็บ เป็นวิธี PoC มาตรฐานของการทดสอบ XSS</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">XSS</span></div><div class=\"tip-th\">💡 XSS (Cross-Site Scripting) คือการฉีด JavaScript เข้าหน้าเว็บเพื่อทำงานบน browser ของเหยื่อ เช่น ขโมย cookie</div>", "fill_hint": ""}, {"num": 428, "stem": "What is a key feature of next-generation firewalls that enhances security beyond traditional stateful inspection?", "options": {"A": "Advanced routing capabilities that allow for more efficient data flow and prioritization.", "B": "Integrated intrusion prevention systems that can detect and prevent complex threats in real- time.", "C": "The ability to act as a wireless controller for managing network access points.", "D": "Additional hardware modules that can be installed to increase the firewall's processing power."}, "correct": "B", "topic": "IDS/IPS & Firewalls", "trick_keywords": ["beyond traditional stateful inspection"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ฟีเจอร์สำคัญใดของ NGFW ที่เพิ่มความปลอดภัยเหนือกว่า stateful inspection แบบเดิม</div><div>🔑 <strong>สังเกตคำว่า</strong> \"beyond traditional stateful inspection\" = เหนือกว่าการตรวจสอบสถานะการเชื่อมต่อแบบดั้งเดิม</div><div>✅ การผนวกระบบ Intrusion Prevention (IPS) เข้าไปในตัว firewall ทำให้ตรวจจับ/สกัดกั้นภัยคุกคามที่ซับซ้อนได้ ซึ่งเกินความสามารถของ stateful inspection ธรรมดา</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">stateful</span></div><div class=\"tip-th\">💡 IPS (Intrusion Prevention System) ตรวจจับและบล็อก threat อัตโนมัติ ต่างจาก IDS ที่แค่แจ้งเตือน</div>", "fill_hint": ""}, {"num": 429, "stem": "A company suspects a series of small, intermittent DDoS attacks meant to probe its defenses. Which response strategy should be prioritized?", "options": {"A": "Updating firewall rules to temporarily block all incoming traffic from identified suspicious IP addresses.", "B": "Deploying additional servers to handle the increased load without prior traffic analysis.", "C": "Coordinating with the ISP to trace the source of the attack and block malicious IPs.", "D": "Implementing stringent network monitoring and setting alerts for traffic anomalies to quickly respond to potential threats."}, "correct": "D", "topic": "DoS / DDoS", "trick_keywords": ["small, intermittent DDoS attacks meant to probe its defenses"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรให้ความสำคัญกับกลยุทธ์ใดเมื่อพบการโจมตี DDoS เล็กๆ เป็นระยะที่ดูเหมือนจะสำรวจแนวป้องกัน</div><div>🔑 <strong>สังเกตคำว่า</strong> \"small, intermittent DDoS attacks meant to probe its defenses\" = การโจมตี DDoS เล็กๆ เป็นระยะเพื่อสำรวจแนวป้องกัน</div><div>✅ เพราะเป็นการ probe สำรวจ ไม่ใช่โจมตีเต็มรูปแบบ การเฝ้าระวังอย่างเข้มงวดพร้อมตั้งแจ้งเตือนความผิดปกติ จึงช่วยจับสัญญาณการสำรวจนี้ได้ทันก่อนถูกโจมตีจริง</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">DDoS</span></div><div class=\"tip-th\">💡 Implementing stringent network monitoring and setting alerts for traffic anomalies to quickly respond to potential threats</div>", "fill_hint": ""}, {"num": 430, "stem": "An attacker is planning to bypass a network-based firewall using a blend of evasion techniques. Which approach would be the most effective in a situation where network traffic is monitored but not deeply inspected?", "options": {"A": "Tunneling the attack traffic through a VPN that uses common ports such as 443.", "B": "Using steganography to hide data within image files sent over HTTP.", "C": "Spoofing IP addresses to mimic legitimate internal traffic and evade IP-based restrictions.", "D": "Encrypting payloads using common encryption algorithms to prevent payload inspection."}, "correct": "A", "topic": "IDS/IPS & Firewalls", "trick_keywords": ["monitored but not deeply inspected"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> วิธีใดมีประสิทธิภาพที่สุดในการบายพาส firewall เมื่อทราฟฟิกถูกเฝ้าดูแต่ไม่ตรวจสอบเชิงลึก</div><div>🔑 <strong>สังเกตคำว่า</strong> \"monitored but not deeply inspected\" = ถูกเฝ้าดูแต่ไม่ถูกตรวจสอบเชิงลึก</div><div>✅ การส่งทราฟฟิกผ่าน VPN โดยใช้พอร์ตทั่วไปอย่าง 443 ที่ดูเหมือนทราฟฟิก HTTPS ปกติ ทำให้ผ่านการเฝ้าดูแบบผิวเผินได้โดยไม่ถูกตรวจจับ</div></div><div class=\"tip-th\">💡 VPN สร้าง encrypted tunnel ป้องกัน eavesdropping และซ่อน traffic จาก ISP</div>", "fill_hint": ""}, {"num": 431, "stem": "During a simulated attack on your network, you discover several vulnerabilities. What Linux command should be used to rank these vulnerabilities based on the CVSS score?", "options": {"A": "nmap --script vuln", "B": "nessus -p", "C": "nikto -h", "D": "metasploit -f"}, "correct": "A", "topic": "Risk, Compliance & Policy", "trick_keywords": ["rank these vulnerabilities based on the CVSS score"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> คำสั่ง Linux ใดใช้จัดอันดับช่องโหว่ตามคะแนน CVSS</div><div>🔑 <strong>สังเกตคำว่า</strong> \"rank these vulnerabilities based on the CVSS score\" = จัดอันดับช่องโหว่ตามคะแนน CVSS</div><div>✅ script vuln ของ nmap จะดึงข้อมูลช่องโหว่พร้อมคะแนนความรุนแรง CVSS ของแต่ละบริการที่พบมาให้โดยตรง</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">CVSS</span></div><div class=\"tip-th\">💡 Nmap คือ network scanner: -sS stealth SYN scan, -O OS detect, -sV service version, -A aggressive scan</div>", "fill_hint": ""}, {"num": 432, "stem": "In a scenario where sensitive data must be secured on cloud storage, what encryption method should be implemented?", "options": {"A": "Implementing server-side encryption with customer-provided keys (SSE-C) to enhance data security.", "B": "Opting for in-transit encryption to protect data as it moves between client devices and the cloud.", "C": "Using client-side encryption before uploading data to ensure it remains unreadable by service providers.", "D": "Applying Transparent Data Encryption (TDE) to automatically encrypt database files on the server."}, "correct": "A", "topic": "Cryptography", "trick_keywords": ["secured on cloud storage"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรใช้วิธีเข้ารหัสแบบใดเพื่อปกป้องข้อมูลสำคัญบน cloud storage</div><div>🔑 <strong>สังเกตคำว่า</strong> \"secured on cloud storage\" = ป้องกันข้อมูลที่จัดเก็บบน cloud storage</div><div>✅ การเข้ารหัสฝั่งเซิร์ฟเวอร์ด้วยกุญแจที่ลูกค้าเป็นผู้ควบคุมเอง (SSE-C) ให้ความปลอดภัยจาก cloud provider เองด้วย ตรงกับความต้องการ secured ระดับสูง</div></div><div class=\"tip-th\">💡 SSE-C (Server-Side Encryption with Customer-Provided Keys) ลูกค้าจัดการ encryption key เองใน cloud ไม่ต้องไว้ใจ provider</div>", "fill_hint": ""}, {"num": 433, "stem": "What command can be used by a system administrator to monitor real-time user logins on a Linux system to detect unauthorized access by insiders?", "options": {"A": "grep 'login' /var/log/messages", "B": "last -f /var/log/wtmp", "C": "who /var/log/secure", "D": "tail -f /var/log/auth.log"}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": ["monitor real-time user logins"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> คำสั่งใดใช้เฝ้าดูการล็อกอินแบบเรียลไทม์บน Linux เพื่อจับการเข้าถึงจากคนใน</div><div>🔑 <strong>สังเกตคำว่า</strong> \"monitor real-time user logins\" = เฝ้าดูการล็อกอินแบบเรียลไทม์</div><div>✅ การ tail -f ไฟล์ log auth.log แบบเรียลไทม์ ทำให้เห็นความพยายามล็อกอินทุกครั้งทันทีที่เกิดขึ้น</div></div><div class=\"tip-th\">💡 tail -f /var/log/auth.log ดู authentication log แบบ real-time ตรวจจับ failed logins, unauthorized access attempts</div>", "fill_hint": ""}, {"num": 434, "stem": "In a scenario where an organization wants to enforce application-level security across multiple devices, what capability of next-generation firewalls should be utilized?", "options": {"A": "Utilizing identity-based policy enforcement to apply security rules across various applications and users.", "B": "Employing external authentication servers to manage access controls for applications.", "C": "Implementing a sandbox environment within the firewall to isolate and test suspicious applications.", "D": "Setting up VPN tunnels for secure application connectivity across the network."}, "correct": "A", "topic": "IDS/IPS & Firewalls", "trick_keywords": ["application-level security across multiple devices"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรใช้ความสามารถใดของ NGFW เพื่อบังคับใช้นโยบายความปลอดภัยระดับแอปข้ามหลายอุปกรณ์</div><div>🔑 <strong>สังเกตคำว่า</strong> \"application-level security across multiple devices\" = ความปลอดภัยระดับแอปพลิเคชันข้ามหลายอุปกรณ์</div><div>✅ การผูกกฎความปลอดภัยกับตัวตนผู้ใช้ (identity) แทนที่จะผูกกับ IP/อุปกรณ์เดียว ทำให้บังคับใช้นโยบายเดียวกันได้แม้ผู้ใช้เปลี่ยนอุปกรณ์</div></div><div class=\"tip-th\">💡 Identity-based Policy Enforcement บังคับ security rules ตาม user identity ทุก application ให้ consistent ไม่ว่าจะเข้าจากที่ไหน</div>", "fill_hint": ""}, {"num": 435, "stem": "Fill in the blank: For Android devices, ___________ is a crucial command-line tool for debugging and testing application security.", "options": {"A": "adb", "B": "emulator", "C": "gradlew", "D": "fastboot"}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": ["debugging and testing application security"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เครื่องมือ command-line ใดสำคัญสำหรับดีบัก/ทดสอบความปลอดภัยแอป Android</div><div>🔑 <strong>สังเกตคำว่า</strong> \"debugging and testing application security\" = ดีบักและทดสอบความปลอดภัยของแอป</div><div>✅ adb (Android Debug Bridge) เป็นเครื่องมือมาตรฐานที่ : "Using a risk matrix to assess the likelihood and impact of each vulnerability", "C": "Implementing automated vulnerability scanning tools weekly", "D": "Prioritizing vulnerabilities that can be remotely exploited"}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": ["classifying and prioritizing vulnerabilities"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรใช้วิธีใดจัดลำดับความสำคัญของช่องโหว่เพื่อให้แก้ไขปัญหาความเสี่ยงสูงก่อน</div><div>🔑 <strong>สังเกตคำว่า</strong> \"classifying and prioritizing vulnerabilities\" = จัดหมวดหมู่และจัดลำดับความสำคัญของช่องโหว่</div><div>✅ risk matrix ประเมินทั้งโอกาสเกิดและผลกระทบของแต่ละช่องโหว่พร้อมกัน ทำให้จัดลำดับความสำคัญได้อย่างเป็นระบบ</div></div><div class=\"tip-th\">💡 Risk Matrix ใช้ประเมิน vulnerability โดยเปรียบ Likelihood × Impact เพื่อจัดลำดับความสำคัญในการ remediate</div>", "fill_hint": ""}, {"num": 450, "stem": "In the context of preventing insider threats, which type of software is best for detecting unusual patterns of access to sensitive documents?", "options": {"A": "Network monitoring tool.", "B": "User and Entity Behavior Analytics (UEBA) software.", "C": "Intrusion Detection System (IDS).", "D": "Anti-virus software."}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": ["detecting unusual patterns of access to sensitive documents"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ซอฟต์แวร์ประเภทใดดีที่สุดสำหรับตรวจจับรูปแบบการเข้าถึงเอกสารสำคัญที่ผิดปกติ</div><div>🔑 <strong>สังเกตคำว่า</strong> \"detecting unusual patterns of access to sensitive documents\" = ตรวจจับรูปแบบการเข้าถึงเอกสารสำคัญที่ผิดปกติ</div><div>✅ UEBA (User and Entity Behavior Analytics) ถูกออกแบบมาเพื่อเรียนรู้พฤติกรรมปกติของผู้ใช้แล้วจับความเบี่ยงเบนโดยเฉพาะ</div></div><div class=\"tip-th\">💡 Splunk UBA / UEBA (User and Entity Behavior Analytics) ใช้ ML ตรวจจับ anomalies ใน user behavior เช่น insider threats</div>", "fill_hint": ""}, {"num": 451, "stem": "Given a scenario where an employee is suspected of using their administrative privileges to access restricted areas, what method would best monitor and record this activity for further investigation?", "options": {"A": "Enforcing Two-Factor Authentication (2FA) for all employees accessing sensitive data areas.", "B": "Regularly changing administrative passwords and conducting random audits of admin logins.", "C": "Deploying network segmentation to isolate critical areas and restrict user access based on roles.", "D": "Setting up a privilege access management (PAM) system to log and alert on unauthorized access attempts."}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": ["monitor and record this activity for further investigation"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรใช้วิธีใดเฝ้าดูและบันทึกการใช้สิทธิ์ผู้ดูแลระบบของพนักงานเพื่อสืบสวนภายหลัง</div><div>🔑 <strong>สังเกตคำว่า</strong> \"monitor and record this activity for further investigation\" = เฝ้าดูและบันทึกกิจกรรมไว้เพื่อสืบสวนต่อ</div><div>✅ ระบบ Privileged Access Management (PAM) ถูกออกแบบมาเพื่อบันทึกและแจ้งเตือนการใช้สิทธิ์ระดับสูงโดยเฉพาะ ตรงตามคำอธิบาย</div></div><div class=\"tip-th\">💡 PAM (Privileged Access Management) บันทึกและ alert เมื่อมีการ access ด้วย privileged accounts ป้องกัน insider threats</div>", "fill_hint": ""}, {"num": 452, "stem": "What SQL injection tool uses an interactive console-based interface and is designed to exploit SQL injection flaws to take over database servers?", "options": {"A": "sqlmap", "B": "SQLsus", "C": "SQLninja", "D": "Absinthe"}, "correct": "A", "topic": "SQL Injection", "trick_keywords": ["interactive console-based interface...to take over database servers"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เครื่องมือ SQL injection ใดมีอินเทอร์เฟซแบบ console โต้ตอบได้ และออกแบบมาเพื่อยึดครองฐานข้อมูล</div><div>🔑 <strong>สังเกตค d you use to enforce network policies in a cloud environment using AWS?", "options": {"A": "aws ec2 create-network-acl --network-acl-name ExampleACL", "B": "aws ec2 configure-vpc --vpc-id vpc-123abc --enable-security", "C": "aws s3 update-bucket-policy --bucket mybucket --policy-policyDocument", "D": "gcloud compute networks create default --subnet-mode=custom"}, "correct": "A", "topic": "Cloud Security", "trick_keywords": ["enforce network policies in a cloud environment using AWS"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> คำสั่งใดใช้บังคับใช้นโยบายเครือข่ายบน AWS</div><div>🔑 <strong>สังเกตคำว่า</strong> \"enforce network policies in a cloud environment using AWS\" = บังคับใช้นโยบายเครือข่ายบน cloud ด้วย AWS</div><div>✅ คำสั่ง aws ec2 create-network-acl สร้างกฎควบคุมทราฟฟิกระดับ subnet ซึ่งเป็นกลไกบังคับใช้นโยบายเครือข่ายของ AWS โดยตรง</div></div><div class=\"tip-th\">💡 AWS Network ACL ทำงานระดับ subnet กรอง inbound/outbound traffic ก่อนถึง Security Groups เป็น stateless firewall</div>", "fill_hint": ""}, {"num": 455, "stem": "Fill in the blank: \"Implementing __________ is an effective strategy for absorbing the unusually high traffic during a DDoS attack by spreading the load.\"", "options": {"A": "Manual rerouting of traffic to secondary servers", "B": "Cloud-based load balancing", "C": "Distributed denial of service mitigation appliances", "D": "Local server load balancing"}, "correct": "B", "topic": "DoS / DDoS", "trick_keywords": ["absorbing the unusually high traffic...by spreading the load"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรใช้กลยุทธ์ใดดูดซับทราฟฟิกสูงผิดปกติระหว่างถูก DDoS ด้วยการกระจายโหลด</div><div>🔑 <strong>สังเกตคำว่า</strong> \"absorbing the unusually high traffic...by spreading the load\" = ดูดซับทราฟฟิกปริมาณสูงผิดปกติด้วยการกระจายโหลด</div><div>✅ คำว่า spreading the load ตรงกับหลักการทำงานของ load balancing บน cloud ที่กระจายทราฟฟิกไปหลายเซิร์ฟเวอร์พร้อมกัน ience?", "options": {"A": "Launching a series of SQL injection and cross-site scripting attacks to test web application firewalls", "B": "Designing a multi-stage attack that involves initial exploitation, establishing backdoors, and data exfiltration over time", "C": "Conducting penetration testing using social engineering tactics to gain physical access to network components", "D": "Executing a DDoS attack from multiple vectors to overwhelm network resources and monitor response"}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": ["simulate an advanced persistent threat (APT) attack"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรจำลอง APT อย่างไรเพื่อทดสอบความทนทานของเครือข่าย</div><div>🔑 <strong>สังเกตคำว่า</strong> \"simulate an advanced persistent threat (APT) attack\" = จำลองการโจมตีแบบ APT</div><div>✅ APT มีลักษณะเฉพาะคือเป็นการโจมตีหลายขั้นตอนต่อเนื่อง การจำลองจึงต้องออกแบบให้มีขั้นตอนเจาะเข้า วางแผน และฝัง backdoor เหมือนของจริง</div></div><div class=\"tip-th\">💡 Multi-stage Attack: Initial exploitation → Install backdoor (persistence) → Data exfiltration คือ APT kill chain ที่ซับซ้อน ตรวจจับด้วย SIEM + behavioral analytics</div>", "fill_hint": ""}, {"num": 492, "stem": "Fill in the blank: \"To mitigate risks of security misconfiguration, a _________ review of all system configurations and updates is essential.\"", "options": {"A": "systematic", "B": "scheduled", "C": "regular", "D": "continuous"}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": ["mitigate risks of security misconfiguration"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรตรวจสอบการตั้งค่าระบบแบบใดเพื่อลดความเสี่ยงจาก misconfiguration</div><div>🔑 <strong>สังเกตคำว่า</strong> \"mitigate risks of security misconfiguration\" = ลดความเสี่ยงจากการตั้งค่าระบบผิดพลาด</div><div>✅ การตั้งค่าที่ผิดพลาดมักเกิดขึ้นเรื่อยๆ ตามการเปลี่ยนแปลงระบบ การตรวจสอบสม่ำเสมอ (regular) จึงจำเป็ ภัยที่ไม่รู้จักมาก่อน ไม่มี signature การใช้ unsupervised learning หา pattern ที่เบี่ยงเบนจากปกติ จึงเหมาะกว่าการพึ่งกฎที่ตั้งไว้ล่วงหน้า</div></div><div class=\"tip-th\">💡 Anomaly-based Detection เปรียบ traffic กับ baseline ปกติ จับ zero-day ได้ แต่ False Positive สูง</div>", "fill_hint": ""}, {"num": 498, "stem": "Fill in the blank: To effectively prioritize vulnerabilities, the security team should focus on vulnerabilities with a _______ CVSS score.", "options": {"A": "high", "B": "moderate", "C": "critical", "D": "low"}, "correct": "C", "topic": "Risk, Compliance & Policy", "trick_keywords": ["effectively prioritize vulnerabilities"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ทีมความปลอดภัยควรให้ความสำคัญกับช่องโหว่ที่มีคะแนน CVSS ระดับใดก่อน</div><div>🔑 <strong>สังเกตคำว่า</strong> \"effectively prioritize vulnerabilities\" = จัดลำดับความสำคัญของช่องโหว่อย่างมีประสิทธิภาพ</div><div>✅ คำว่า effectively prioritize ชี้ว่าต้องเริ่มจากกลุ่มที่เสี่ยงที่สุดก่อน ซึ่งคือช่องโหว่ระดับ critical ตามมาตรฐาน CVSS</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">CVSS</span></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>critical</strong></div>", "fill_hint": ""}, {"num": 499, "stem": "Fill in the blank: Always ensure the _______ field in an email matches the sender's claimed identity to prevent phishing.", "options": {"A": "sender’s IP address", "B": "reply-to address", "C": "encrypted signature", "D": "display name"}, "correct": "D", "topic": "Social Engineering & Phishing", "trick_keywords": ["matches the sender's claimed identity"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรตรวจสอบให้ field ใดในอีเมลตรงกับตัวตนที่ผู้ส่งอ้างไว้เพื่อป้องกันฟิชชิง</div><div>🔑 <strong>สังเกตคำว่า</strong> \"matches the sender's claimed identity\" = ตรงกับตัวตนที่ผู้ส่งอ้างว่าเป็น</div><div>✅ ฟิชชิงมักปลอมชื่อที่แสดง (display name) ให้ดูน่าเชื่อถือทั้งที่อีเมลจริงต่างออกไป การตรวจสอบว่าตรงกันจึงช่วยจับความผิดปกติได้</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">phishing</span></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>display name</strong></div>", "fill_hint": ""}, {"num": 500, "stem": "You are tasked with analyzing data from a honeynet after a suspected breach. What method should be used to differentiate between normal traffic and potential threats?", "options": {"A": "Applying standard deviation calculations on time intervals of incoming packets to identify anomalies", "B": "Utilizing log analysis software that employs behavioral heuristics to distinguish between benign and malicious activities", "C": "Conducting a thorough port scan analysis before and after the breach to identify changes", "D": "Comparing traffic against a whitelist of known good signatures to filter out expected interactions"}, "correct": "B", "topic": "Incident Response & Forensics", "trick_keywords": ["differentiate between normal traffic and potential threats"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรใช้วิธีใดวิเคราะห์ log ของ honeynet เพื่อแยกทราฟฟิกปกติออกจากภัยคุกคาม</div><div>🔑 <strong>สังเกตคำว่า</strong> \"differentiate between normal traffic and potential threats\" = แยกแยะระหว่างทราฟฟิกปกติกับภัยคุกคามที่อาจเกิดขึ้น</div><div>✅ การใช้ซอฟต์แวร์วิเคราะห์ log ที่อาศัยหลัก behavioral heuristics (พฤติกรรมที่เบี่ยงเบนจากปกติ) ช่วยแยกแยะสัญญาณภัยคุกคามจากทราฟฟิกทั่วไปได้แม่นยำกว่า</div></div><div class=\"tip-th\">💡 Behavioral Heuristics วิเคราะห์ log เปรียบกับ baseline ปกติ จับ unknown threats ที่ไม่มี signature</div>", "fill_hint": ""}];

<script>
(function(){
"use strict";

const STORAGE_KEY = "ceh_quiz_progress_v1";
const TOTAL = QUESTIONS.length;
const Q_BY_NUM = {};
QUESTIONS.forEach(q=>{ Q_BY_NUM[q.num] = q; });

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {};
}
function saveProgress(p){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
}
let PROGRESS = loadProgress();
window.addEventListener('storage', function(e){
  if(e.key !== STORAGE_KEY) return;
  try{ PROGRESS = e.newValue ? JSON.parse(e.newValue) : {}; }catch(err){ PROGRESS = {}; }
  const screen = (location.hash||'').replace('#','');
  if(screen === 'home' || screen === '') renderHome();
  else if(screen === 'stats') showStats();
});

const SESSION_KEY = "ceh_quiz_session_v1";
function saveSession(s){
  try{
    sessionStorage.setItem(SESSION_KEY, JSON.stringify({
      mode: s.mode, title: s.title, timeLimitSec: s.timeLimitSec,
      startTime: s.startTime, idx: s.idx, answers: s.answers,
      nums: s.list.map(q=>q.num)
    }));
  }catch(e){}
}
function loadSession(){
  try{
    const raw = sessionStorage.getItem(SESSION_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return null;
}
function clearSession(){
  try{ sessionStorage.removeItem(SESSION_KEY); }catch(e){}
}

function getRec(num){
  if(!PROGRESS[num]) PROGRESS[num] = {box:0, seen:0, correct:0, wrong:0, last:null};
  return PROGRESS[num];
}
function recordAnswer(num, isCorrect){
  const r = getRec(num);
  r.seen++;
  if(isCorrect){ r.correct++; r.box = Math.min(4, r.box+1); }
  else { r.wrong++; r.box = 0; }
  r.last = Date.now();
  saveProgress(PROGRESS);
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function weightedSample(pool, n){
  // weight inversely by box (lower box = higher priority) + never-seen gets top priority
  const weighted = pool.map(q=>{
    const r = getRec(q.num);
    let w = (5 - r.box);
    if(r.seen === 0) w += 3;
    return {q, w};
  });
  const chosen = [];
  const arr = weighted.slice();
  while(chosen.length < n && arr.length){
    const totalW = arr.reduce((s,x)=>s+x.w,0);
    let rnd = Math.random()*totalW;
    let idx = 0;
    for(; idx<arr.length; idx++){
      rnd -= arr[idx].w;
      if(rnd<=0) break;
    }
    idx = Math.min(idx, arr.length-1);
    chosen.push(arr[idx].q);
    arr.splice(idx,1);
  }
  return chosen;
}

const app = document.getElementById('app');

function overallStats(){
  let seenCount=0, mastered=0, totalCorrect=0, totalAnswered=0;
  for(const q of QUESTIONS){
    const r = PROGRESS[q.num];
    if(r && r.seen>0){ seenCount++; totalCorrect+=r.correct; totalAnswered+=r.seen; }
    if(r && r.box>=4) mastered++;
  }
  const acc = totalAnswered? Math.round(100*totalCorrect/totalAnswered) : 0;
  return {seenCount, mastered, acc, totalAnswered};
}

function topicBreakdown(){
  const map = {};
  for(const q of QUESTIONS){
    if(!map[q.topic]) map[q.topic] = {total:0, mastered:0, wrongMore:0};
    map[q.topic].total++;
    const r = PROGRESS[q.num];
    if(r && r.box>=4) map[q.topic].mastered++;
    if(r && r.wrong>r.correct) map[q.topic].wrongMore++;
  }
  return map;
}

function renderHome(){
  const s = overallStats();
  const pct = Math.round(100*s.mastered/TOTAL);
  app.innerHTML = `
    <header class="top">
      <h1>🛡️ CEH v13 ติวสอบ</h1>
      <div class="stats-mini">จำได้แล้ว ${s.mastered}/${TOTAL} ข้อ (${pct}%) · ทำไปแล้ว ${s.seenCount} ข้อ · แม่นยำ ${s.acc}%</div>
    </header>
    <div class="card">
      <div class="progressbar"><div style="width:${pct}%"></div></div>
      <div class="small">เป้าหมาย: ทำให้ครบทุกข้อขึ้นกล่องความจำสูงสุด (Box 4) ก่อนวันสอบจริง</div>
    </div>
    <div class="grid">
      <div class="card mode-card" onclick="App.startLearn()">
        <span class="icon">📚</span>
        <h3>โหมดเรียนรู้ (Flashcard)</h3>
        <p>อ่านโจทย์ + ตัวเลือกทั้งหมด (แต่ละตัวเลือกมีคำอธิบายในตัว) ก่อนเฉลย เหมาะสำหรับปูพื้นความเข้าใจ</p>
      </div>
      <div class="card mode-card" onclick="App.showQuizSetup()">
        <span class="icon">📝</span>
        <h3>แบบทดสอบ (Quiz)</h3>
        <p>เลือกจำนวนข้อเอง ระบบจะสุ่มโดยเน้นข้อที่ยังไม่ชำนาญ (Spaced Repetition)</p>
      </div>
      <div class="card mode-card" onclick="App.startExamSim()">
        <span class="icon">⏱️</span>
        <h3>จำลองสอบจริง (125 ข้อ)</h3>
        <p>จับเวลา 4 ชม. เกณฑ์ผ่าน 70% เหมือนสอบ CEH จริง</p>
      </div>
      <div class="card mode-card" onclick="App.startWeakReview()">
        <span class="icon">🎯</span>
        <h3>ทบทวนข้อที่ยังไม่แม่น</h3>
        <p>รวมเฉพาะข้อที่ตอบผิดบ่อย หรือยังไม่เคยทำ เพื่อไล่ปิดจุดอ่อน</p>
      </div>
      <div class="card mode-card" onclick="App.showStats()">
        <span class="icon">📊</span>
        <h3>สถิติของฉัน</h3>
        <p>ดูความคืบหน้าแยกตามหัวข้อ (SQLi, Cryptography, Social Engineering ฯลฯ)</p>
      </div>
      <div class="card mode-card" onclick="App.showDataNotes()">
        <span class="icon">🛠️</span>
        <h3>รายการข้อที่แก้ไขจากต้นฉบับ</h3>
        <p>ไฟล์ต้นฉบับมี 13 ข้อที่ตัวเลือกซ้ำ/ผิดพลาด ระบบตรวจพบและแก้ให้แล้ว</p>
      </div>
    </div>
    <footer class="note">ข้อมูลบันทึกในเบราว์เซอร์นี้เท่านั้น (localStorage) — ล้างแคชแล้วจะเริ่มนับใหม่</footer>
  `;
}

function renderTopBar(container, label, extra){
  return `<div class="topbar-q"><span>${label}</span><span>${extra||''}</span></div>`;
}

// ---------- Question runner (shared by learn/quiz/exam/weak) ----------
function runSession(opts){
  // opts: {questions, mode: 'learn'|'quiz'|'exam'|'weak', title, timeLimitSec}
  const state = {
    idx: opts.resume ? opts.resume.idx : 0,
    list: opts.questions,
    mode: opts.mode,
    title: opts.title,
    answers: opts.resume ? opts.resume.answers.slice() : [], // {num, chosen, correct, isCorrect}
    startTime: opts.resume ? opts.resume.startTime : Date.now(),
    timeLimitSec: opts.timeLimitSec || null,
    timerHandle: null,
  };
  saveSession(state);

  function renderQuestion(){
    if(state.idx >= state.list.length){
      return renderSessionSummary(state);
    }
    const q = state.list[state.idx];
    const letters = ['A','B','C','D'];
    let timeStr = '';
    if(state.timeLimitSec){
      const elapsed = Math.floor((Date.now()-state.startTime)/1000);
      const remain = Math.max(0, state.timeLimitSec - elapsed);
      const mm = String(Math.floor(remain/60)).padStart(2,'0');
      const ss = String(remain%60).padStart(2,'0');
      timeStr = `⏱ ${mm}:${ss}`;
      if(remain<=0){ finishSession(state); return; }
    }
    app.innerHTML = `
      <header class="top">
        <h1>${state.title}</h1>
        <div class="stats-mini">${timeStr} <button class="link-btn" onclick="App.cancelSession()">✕ ยกเลิก/เริ่มใหม่</button></div>
      </header>
      <div class="card">
        ${renderTopBar(null, `ข้อ ${state.idx+1} / ${state.list.length}`, `<span class="topic-pill">${q.topic}</span>`)}
        <div class="progressbar"><div style="width:${100*state.idx/state.list.length}%"></div></div>
        <div class="qnum">คำถามที่ ${q.num} ${q.corrected?'<span class="badge">แก้ไขแล้ว</span>':''}</div>
        <div class="stem">${escapeHtml(q.stem)}</div>
        <div id="opts-wrap">
        ${letters.map(l=>`
          <button class="opt" data-letter="${l}" onclick="App._selectOption('${l}')">
            <span class="letter">${l}</span>${escapeHtml(q.options[l])}
          </button>`).join('')}
        </div>
        <div id="explain-wrap"></div>
        <div class="btn-row" id="btn-row"></div>
      </div>
    `;
    if(state.timeLimitSec){
      state.timerHandle = setTimeout(renderQuestion, 1000);
    }
  }

  function selectOption(letter){
    if(state.timerHandle) clearTimeout(state.timerHandle);
    const q = state.list[state.idx];
    const isCorrect = letter === q.correct;
    document.querySelectorAll('.opt').forEach(btn=>{
      btn.classList.add('locked');
      btn.onclick = null;
      const l = btn.getAttribute('data-letter');
      if(l === q.correct) btn.classList.add('correct');
      else if(l === letter) btn.classList.add('wrong');
    });
    const trickTip = q.trick_tip_th || '';
    const resultIcon = isCorrect
      ? '✅ ถูกต้อง!'
      : '❌ ผิด — เฉลยคือ <strong>' + q.correct + ':</strong> ' + escapeHtml(q.options[q.correct]);
    const resultClass = isCorrect ? 'trick-box correct-box' : 'trick-box wrong-box';
    let explainHtml = `
      <div class="${resultClass}">
        <div class="trick-result">${resultIcon}</div>
        <div class="trick-tip">${trickTip}</div>
      </div>`;
    if(q.corrected){
      explainHtml += `<div class="explain"><b>⚠️ หมายเหตุ:</b> ${escapeHtml(q.correction_note||'ข้อนี้ถูกแก้ไขจากต้นฉบับ')}</div>`;
    }
    document.getElementById('explain-wrap').innerHTML = explainHtml;
    document.getElementById('btn-row').innerHTML = `<button class="btn" onclick="App._nextQuestion()">ข้อถัดไป →</button>`;

    if(state.mode !== 'learn'){
      recordAnswer(q.num, isCorrect);
    }
    state.answers.push({num:q.num, chosen:letter, correct:q.correct, isCorrect, topic:q.topic});
  }

  function revealForLearn(){
    // learn mode: show answer without needing click scoring, just mark chosen viewed
  }

  function nextQuestion(){
    state.idx++;
    saveSession(state);
    renderQuestion();
  }

  App._selectOption = selectOption;
  App._nextQuestion = nextQuestion;
  renderQuestion();
}

function finishSession(state){
  state.idx = state.list.length;
  renderSessionSummary(state);
}

function renderSessionSummary(state){
  clearSession();
  const total = state.answers.length;
  const correct = state.answers.filter(a=>a.isCorrect).length;
  const pct = total? Math.round(100*correct/total) : 0;
  const isExam = state.mode === 'exam';
  const passed = pct >= 70;
  const missed = state.answers.filter(a=>!a.isCorrect);

  let resultBlock = '';
  if(isExam){
    resultBlock = `
      <div class="result-big ${passed?'result-pass':'result-fail'}">${passed?'PASS ✅':'NOT YET ❌'}</div>
      <div style="text-align:center;font-size:15px;color:var(--sub);margin-bottom:10px;">คะแนน ${correct}/${total} (${pct}%) — เกณฑ์ผ่าน 70%</div>
    `;
  } else {
    resultBlock = `<div style="text-align:center;font-size:16px;margin-bottom:6px;">ถูก ${correct}/${total} (${pct}%)</div>`;
  }

  app.innerHTML = `
    <header class="top"><h1>สรุปผล</h1></header>
    <div class="card">
      ${resultBlock}
      <div class="progressbar"><div style="width:${pct}%"></div></div>
    </div>
    ${missed.length? `
    <div class="card">
      <h3 style="margin-top:0;">ข้อที่ตอบผิด (${missed.length})</h3>
      <div class="topiclist">
        ${missed.map(m=>{
          const q = QUESTIONS.find(x=>x.num===m.num);
          return `<div class="miss-item">
            <div><b>ข้อ ${q.num}</b> · <span class="topic-pill">${q.topic}</span></div>
            <div style="margin-top:4px;">${escapeHtml(q.stem)}</div>
            <div style="margin-top:6px;color:var(--good);">✔ เฉลย ${q.correct}: ${escapeHtml(q.options[q.correct])}</div>
          </div>`;
        }).join('')}
      </div>
    </div>` : `<div class="card"><p>เยี่ยมมาก ไม่มีข้อผิดเลย 🎉</p></div>`}
    <div class="btn-row">
      <button class="btn" onclick="App.home()">กลับหน้าแรก</button>
      ${missed.length? `<button class="btn secondary" onclick="App.reviewMissed(${JSON.stringify(missed.map(m=>m.num))})">ทบทวนเฉพาะข้อที่ผิด</button>`:''}
    </div>
  `;
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function showQuizSetup(){
  app.innerHTML = `
    <header class="top"><h1>ตั้งค่าแบบทดสอบ</h1></header>
    <div class="card">
      <p>เลือกจำนวนข้อที่ต้องการทำ (ระบบจะสุ่มโดยให้น้ำหนักกับข้อที่ยังไม่ชำนาญมากกว่า):</p>
      <div class="btn-row">
        <button class="btn" onclick="App.startQuiz(10)">10 ข้อ</button>
        <button class="btn" onclick="App.startQuiz(25)">25 ข้อ</button>
        <button class="btn" onclick="App.startQuiz(50)">50 ข้อ</button>
        <button class="btn" onclick="App.startQuiz(100)">100 ข้อ</button>
        <button class="btn secondary" onclick="App.startQuiz(${TOTAL})">ทั้งหมด (${TOTAL})</button>
      </div>
      <div class="btn-row"><button class="btn secondary" onclick="App.home()">← กลับ</button></div>
    </div>
  `;
}

function startQuiz(n){
  const chosen = weightedSample(QUESTIONS, Math.min(n, TOTAL));
  runSession({questions: shuffle(chosen), mode:'quiz', title:`แบบทดสอบ ${chosen.length} ข้อ`});
}

function startLearn(){
  const chosen = weightedSample(QUESTIONS, Math.min(20, TOTAL));
  runSession({questions: chosen, mode:'learn', title:'โหมดเรียนรู้ (Flashcard)'});
}

function startExamSim(){
  const n = Math.min(125, TOTAL);
  const chosen = shuffle(QUESTIONS).slice(0, n);
  runSession({questions: chosen, mode:'exam', title:'จำลองสอบจริง (125 ข้อ)', timeLimitSec: 4*60*60});
}

function startWeakReview(){
  const weak = QUESTIONS.filter(q=>{
    const r = PROGRESS[q.num];
    return !r || r.seen===0 || r.box < 2 || r.wrong > r.correct;
  });
  if(weak.length===0){
    app.innerHTML = `<header class="top"><h1>ทบทวนข้อที่ยังไม่แม่น</h1></header>
      <div class="card"><p>เก่งมาก! ตอนนี้ไม่มีข้อที่เป็นจุดอ่อนแล้ว ลองโหมดจำลองสอบจริงดูได้เลย</p>
      <div class="btn-row"><button class="btn" onclick="App.home()">กลับหน้าแรก</button></div></div>`;
    return;
  }
  const n = Math.min(30, weak.length);
  runSession({questions: shuffle(weak).slice(0,n), mode:'weak', title:`ทบทวนจุดอ่อน (${n} ข้อ)`});
}

function reviewMissed(nums){
  const qs = QUESTIONS.filter(q=>nums.includes(q.num));
  runSession({questions: qs, mode:'quiz', title:'ทบทวนข้อที่ตอบผิด'});
}

function showStats(){
  const s = overallStats();
  const topics = topicBreakdown();
  const rows = Object.entries(topics).sort((a,b)=>b[1].total-a[1].total).map(([name, t])=>{
    const pct = Math.round(100*t.mastered/t.total);
    return `<div class="stat-row"><span>${name} (${t.total} ข้อ)</span><span>${t.mastered}/${t.total} จำได้ (${pct}%)</span></div>`;
  }).join('');
  app.innerHTML = `
    <header class="top"><h1>สถิติของฉัน</h1></header>
    <div class="card">
      <div class="stat-row"><span>ข้อที่จำได้แล้ว (Box 4)</span><span>${s.mastered} / ${TOTAL}</span></div>
      <div class="stat-row"><span>ข้อที่เคยทำแล้ว</span><span>${s.seenCount} / ${TOTAL}</span></div>
      <div class="stat-row"><span>ความแม่นยำสะสม</span><span>${s.acc}%</span></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">แยกตามหัวข้อ</h3>
      ${rows}
    </div>
    <div class="btn-row">
      <button class="btn" onclick="App.home()">กลับหน้าแรก</button>
      <button class="btn secondary" onclick="App.resetProgress()">ล้างสถิติทั้งหมด</button>
    </div>
  `;
}

function showDataNotes(){
  const corrected = QUESTIONS.filter(q=>q.corrected);
  app.innerHTML = `
    <header class="top"><h1>ข้อที่แก้ไขจากต้นฉบับ</h1></header>
    <div class="card">
      <p class="small">ไฟล์ข้อสอบต้นฉบับ (CEHv13 Sample Exam.pdf) มีบางข้อที่ตัวเลือกซ้ำกันเอง หรือตัวเลือกคัดลอกคำถามมาทั้งประโยค ทำให้ไม่สามารถเลือกคำตอบได้อย่างมีเหตุผล ระบบตรวจพบ ${corrected.length} ข้อ และแก้ไขตัวเลือกที่ซ้ำ/ผิดพลาดให้เรียบร้อยแล้ว:</p>
      <div class="topiclist">
        ${corrected.map(q=>`
          <div class="miss-item">
            <div><b>ข้อ ${q.num}</b> · <span class="topic-pill">${q.topic}</span></div>
            <div style="margin-top:4px;">${escapeHtml(q.stem)}</div>
            <div style="margin-top:6px;color:#ffb84d;">${escapeHtml(q.correction_note)}</div>
          </div>`).join('')}
      </div>
    </div>
    <div class="btn-row"><button class="btn" onclick="App.home()">กลับหน้าแรก</button></div>
  `;
}

function cancelSession(){
  if(confirm('ต้องการยกเลิกรอบนี้และกลับหน้าแรกหรือไม่? คำตอบที่ตอบไปแล้วในรอบนี้จะยังถูกบันทึกไว้')){
    clearSession();
    routeHome();
  }
}

function resetProgress(){
  if(confirm('ต้องการล้างสถิติความคืบหน้าทั้งหมดหรือไม่?')){
    PROGRESS = {};
    saveProgress(PROGRESS);
    routeHome();
  }
}

const App = {
  home: withRoute('home', renderHome),
  showQuizSetup: withRoute('quiz-setup', showQuizSetup),
  startQuiz: withRoute('session', startQuiz),
  startLearn: withRoute('session', startLearn),
  startExamSim: withRoute('session', startExamSim),
  startWeakReview: withRoute('session', startWeakReview),
  reviewMissed: withRoute('session', reviewMissed),
  showStats: withRoute('stats', showStats),
  showDataNotes: withRoute('notes', showDataNotes),
  resetProgress, cancelSession,
};
window.App = App;

function resumeOrHome(){
  const saved = loadSession();
  if(saved){
    const list = (saved.nums||[]).map(n=>Q_BY_NUM[n]).filter(Boolean);
    if(list.length === saved.nums.length && saved.idx < list.length){
      runSession({
        questions: list,
        mode: saved.mode,
        title: saved.title,
        timeLimitSec: saved.timeLimitSec,
        resume: {idx: saved.idx, answers: saved.answers, startTime: saved.startTime}
      });
      return;
    }
    clearSession();
  }
  renderHome();
}

function renderRoute(screen){
  if(screen === 'session'){ resumeOrHome(); return; }
  if(screen === 'quiz-setup'){ showQuizSetup(); return; }
  if(screen === 'stats'){ showStats(); return; }
  if(screen === 'notes'){ showDataNotes(); return; }
  renderHome();
}

let ignoreNextHashChange = false;
function pushRoute(hash){
  const target = '#'+hash;
  if(location.hash !== target){
    ignoreNextHashChange = true;
    location.hash = hash;
  }
}
function withRoute(hash, fn){
  return function(...args){ pushRoute(hash); return fn.apply(null, args); };
}
function routeHome(){ pushRoute('home'); renderHome(); }

window.addEventListener('hashchange', function(){
  if(ignoreNextHashChange){ ignoreNextHashChange = false; return; }
  renderRoute((location.hash||'').replace('#','') || 'home');
});

(function boot(){
  const initial = (location.hash||'').replace('#','') || (loadSession() ? 'session' : 'home');
  ignoreNextHashChange = true;
  location.hash = initial;
  renderRoute(initial);
})();
})();
</script>
