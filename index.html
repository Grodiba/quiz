 class=\"tip-th\">✅ คำตอบ: <strong>Check for default or weak credentials used in networked ICS devices.</strong></div>", "fill_hint": ""}, {"num": 313, "stem": "During a system audit, you find that executable files can be run from the USB drive. Which policy should be implemented to mitigate this risk?", "options": {"A": "Implementing antivirus software to scan removable drives.", "B": "Setting USB ports to a read-only mode to prevent data leakage.", "C": "Encrypting data on USB drives to prevent unauthorized access.", "D": "Disabling the execution of autorun scripts from removable media."}, "correct": "D", "topic": "Risk, Compliance & Policy", "trick_keywords": ["executable files can be run from the USB drive"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรใช้นโยบายใดลดความเสี่ยงจากการรันไฟล์ execute ได้จาก USB</div><div>🔑 <strong>สังเกตคำว่า</strong> \"executable files can be run from the USB drive\" = ไฟล์ที่รันได้ถูกรันจาก USB ได้</div><div>✅ การปิดการรัน autorun script จาก removable media โดยตรง ตัดช่องทางการรันไฟล์อัตโนมัติจาก USB ที่โจทย์กังวล</div></div><div class=\"tip-th\">💡 Disable Autorun บน removable media ป้องกัน malware จาก USB ไม่ให้รันอัตโนมัติเมื่อเสียบ drive</div>", "fill_hint": ""}, {"num": 314, "stem": "When conducting a penetration test on a Windows server, which PowerShell command is used to enumerate all active network connections?", "options": {"A": "Get-NetTCPConnection, which lists all TCP connections on the machine, showing local and remote addresses, ports, and the state of each connection.", "B": "Set-NetIPAddress, used to configure IP addresses and properties of an existing network interface.", "C": "New-NetIPAddress, which creates IP address configurations on a system but does not list active connections.", "D": "Invoke-Command, used to run commands on local or remote computers, but not specifically for network connections review."}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": ["enumerate all active network connections"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> คำสั่ง PowerShell ใดใช้แจกแจงการเชื่อมต่อเครือข่ายที่กำลังทำงานอยู่ทั้งหมด</div><div>🔑 <strong>สังเกตคำว่า</strong> \"enumerate all active network connections\" = แจกแจงการเชื่อมต่อเครือข่ายที่กำลังทำงานอยู่ทั้งหมด</div><div>✅ Get-NetTCPConnection คือ cmdlet เฉพาะของ PowerShell ที่แสดงรายการ TCP connection ทั้งหมดตรงตามชื่อ</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">penetration test</span></div><div class=\"tip-th\">💡 Stateful Firewall ติดตาม connection state กรอง packet ได้ฉลาดกว่า packet filter ที่ดูแค่ header</div>", "fill_hint": ""}, {"num": 315, "stem": "When monitoring a corporate network for potential sniffing activities, what command would you use on a Linux-based system to detect promiscuous mode on network interfaces?", "options": {"A": "who -r, which shows the system’s runlevel but does not check for network interface sniffing.", "B": "ifconfig eth0 | grep PROMISC, which checks if the network interface is in promiscuous mode, indicating it could be used for sniffing.", "C": "tcpdump -i eth0, which captures all packets on the specified interface but does not specifically check for promiscuous mode.", "D": "arp -a, which displays the current ARP cache but does not check for promiscuous mode on interfaces."}, "correct": "B", "topic": "Network Sniffing & MITM", "trick_keywords": ["detect promiscuous mode on network interfaces"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> คำสั่งใดใช้ตรวจจับว่าอินเทอร์เฟซเครือข่ายอยู่ในโหมด promiscuous หรือไม่</div><div>🔑 <strong>สังเกตคำว่า</strong> \"detect promiscuous mode on network interfaces\" = ตรวจจับโหมด promiscuous ของการ์ดเครือข่าย</div><div>✅ การกรองผลลัพธ์ ifconfig หาคำว่า PROMISC ตรงตัวกับสิ่งที่ต้องการตรวจสอบ เพราะ sniffing มักต้องเปิดโหมดนี้</div></div><div class=\"tip-th\">💡 Promiscuous mode ทำให้ NIC รับ packet ทุก packet บน network ไม่ใช่แค่ที่ส่งถึงตัวเอง ใช้ sniff traffic ของคนอื่น</div>", "fill_hint": ""}, {"num": 316, "stem": "Fill in the blank: When breaking WPA/WPA2 PSK, the most effective method involves capturing the four-way handshake and using ________ to perform a dictionary attack.", "options": {"A": "Cain & Abel, used for recovering passwords from various sources.", "B": "The hashcat tool, known for its efficient password cracking capabilities.", "C": "John the Ripper, another popular password cracking software.", "D": "Aircrack-ng itself using the -w flag for wordlist attacks."}, "correct": "B", "topic": "Wireless Security", "trick_keywords": ["capturing the four-way handshake"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> หลังดัก handshake ของ WPA/WPA2 ได้แล้ว ควรใช้เครื่องมือใด crack แบบ dictionary attack</div><div>🔑 <strong>สังเกตคำว่า</strong> \"capturing the four-way handshake\" = ดักจับ handshake สี่ขั้นตอนของ WPA/WPA2</div><div>✅ hashcat เป็นเครื่องมือ crack รหัสผ่านที่มีประสิทธิภาพสูง เหมาะกับการนำ handshake ที่ดักได้มาลองสุ่มรหัสผ่านจาก wordlist</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">WPA</span></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>The hashcat tool, known for its efficient password cracking capabilities.</strong></div>", "fill_hint": ""}, {"num": 317, "stem": "Fill in the blank: To evaluate the security posture of a Google Cloud Platform (GCP) project, use the command gcloud ____ audit-logs list.", "options": {"A": "accounts", "B": "projects", "C": "services", "D": "billing"}, "correct": "B", "topic": "Cloud Security", "trick_keywords": ["gcloud ____ audit-logs list"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรเติมคำใดในคำสั่ง gcloud เพื่อดู audit log ของโปรเจกต์ GCP</div><div>🔑 <strong>สังเกตคำว่า</strong> \"gcloud ____ audit-logs list\" = คำสั่งย่อยที่ต้องเติมใน gcloud</div><div>✅ โจทย์ถามหา syntax เฉพาะของ gcloud CLI ที่ต้องระบุ resource type เป็น projects ก่อนคำสั่งย่อย audit-logs</div></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>projects</strong></div>", "fill_hint": ""}, {"num": 318, "stem": "Fill in the blank: To exploit session hijacking effectively, attackers commonly use ________ tools to sniff network traffic and capture session cookies.", "options": {"A": "Social engineering, to manipulate users into revealing their credentials.", "B": "Packet-sniffing.", "C": "Phishing attacks, to directly ask the user for their session information.", "D": "Port scanning, to identify open ports that may leak session data."}, "correct": "B", "topic": "Network Sniffing & MITM", "trick_keywords": ["sniff network traffic and capture session cookies"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> แฮกเกอร์มักใช้เครื่องมือประเภทใดในการดักฟังทราฟฟิกเพื่อขโมย session cookie สำหรับ session hijacking</div><div>🔑 <strong>สังเกตคำว่า</strong> \"sniff network traffic and capture session cookies\" = ดักฟังทราฟฟิกเพื่อขโมย session cookie</div><div>✅ คำอธิบายในโจทย์ (sniff traffic + capture cookies) ตรงกับนิยามของ Packet-sniffing tools โดยตรง</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">session hijack</span></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>Packet-sniffing.</strong></div>", "fill_hint": ""}, {"num": 319, "stem": "What type of session management vulnerability involves an attacker deceiving a user into executing actions on their behalf?", "options": {"A": "Cross-Site Scripting (XSS), which can manipulate client-side scripts.", "B": "Buffer overflow, which could disrupt server session handling.", "C": "SQL Injection, which manipulates backend data processing.", "D": "Cross-Site Request Forgery (CSRF)."}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": ["deceiving a user into executing actions on their behalf"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ช่องโหว่ที่หลอกให้ผู้ใช้ทำการกระทำแทนผู้โจมตีโดยไม่รู้ตัว เรียกว่าอะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"deceiving a user into executing actions on their behalf\" = หลอกให้ผู้ใช้ทำการกระทำแทนตนโดยไม่รู้ตัว</div><div>✅ คำว่า on their behalf ในนามของผู้ใช้เองโดยไม่ได้ตั้งใจ ตรงกับนิยามของ Cross-Site Request Forgery (CSRF)</div></div><div class=\"tip-th\">💡 CSRF คือการหลอกให้ browser เหยื่อส่ง request ไปยัง site ที่ login อยู่โดยไม่รู้ตัว ป้องกัน: CSRF token</div>", "fill_hint": ""}, {"num": 320, "stem": "A cybersecurity analyst is tasked with assessing the risk of firmware manipulation in IoT devices. What technique should be prioritized to ensure firmware integrity?", "options": {"A": "Using password protection for accessing device firmware settings.", "B": "Implementing cryptographic signatures to validate firmware updates.", "C": "Ensuring physical security to prevent unauthorized access to IoT device hardware.", "D": "Regularly scheduling automatic firmware updates without manual intervention."}, "correct": "B", "topic": "Wireless/IoT & Other", "trick_keywords": ["ensure firmware integrity"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรให้ความสำคัญกับเทคนิคใดเพื่อรับประกันความถูกต้องของเฟิร์มแวร์ IoT</div><div>🔑 <strong>สังเกตคำว่า</strong> \"ensure firmware integrity\" = รับประกันความถูกต้องของเฟิร์มแวร์</div><div>✅ การใช้ cryptographic signature ตรวจสอบว่าไฟล์เฟิร์มแวร์ไม่ถูกแก้ไข ตรงกับเป้าหมาย integrity โดยตรง</div></div><div class=\"tip-th\">💡 Cryptographic Signature สำหรับ firmware ตรวจสอบว่า firmware ไม่ถูก tamper และมาจาก vendor จริง</div>", "fill_hint": ""}, {"num": 321, "stem": "A penetration tester is tasked with capturing network traffic on a target network. Which tool would they use to monitor and analyze this traffic for signs of vulnerabilities or malicious activity?", "options": {"A": "Kismet, which is used to detect and analyze wireless networks, focusing on capturing wireless traffic rather than wired network packet analysis.", "B": "Ettercap, a suite for man-in-the-middle attacks and network analysis, focusing on manipulating network traffic rather than just capturing it for analysis.", "C": "Netcat, a utility for reading and writing network connections, often used for backdoor creation but not specialized in network traffic analysis.", "D": "Wireshark, a packet capture tool that provides deep analysis of network traffic and can help identify vulnerabilities or signs of active attacks."}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": ["monitor and analyze this traffic"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เครื่องมือใดใช้เฝ้าดูและวิเคราะห์ทราฟฟิกเครือข่ายเพื่อหาสัญญาณอันตราย</div><div>🔑 <strong>สังเกตคำว่า</strong> \"monitor and analyze this traffic\" = เฝ้าดูและวิเคราะห์ทราฟฟิก</div><div>✅ Wireshark เป็นเครื่องมือ packet capture มาตรฐานที่ให้การวิเคราะห์เชิงลึกของทราฟฟิกตรงตามคำอธิบาย</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">penetration test</span></div><div class=\"tip-th\">💡 tcpdump คือ command-line packet capture tool ดัก TCP/IP traffic ใน terminal ใช้ forensics และ troubleshoot network</div>", "fill_hint": ""}, {"num": 322, "stem": "During a penetration test, you discover that an ICS system is vulnerable to buffer overflow attacks. What is the best initial action to take?", "options": {"A": "Recommending a firmware update to the manufacturer to address the vulnerability.", "B": "Applying a security patch to the system without further analysis of the impact.", "C": "Documenting the specific payload that caused the overflow and isolating the affected system.", "D": "Immediately shutting down the affected system to prevent further exploitation."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": ["best initial action"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เมื่อพบว่าระบบ ICS มีช่องโหว่ buffer overflow ควรทำอะไรเป็นอันดับแรก</div><div>🔑 <strong>สังเกตคำว่า</strong> \"best initial action\" = การกระทำเบื้องต้นที่ดีที่สุด</div><div>✅ ต้องบันทึกรายละเอียด payload ที่ทำให้เกิดปัญหาไว้เป็นหลักฐาน พร้อมแยกระบบที่ได้รับผลกระทบออกทันที เพราะ ICS สำคัญมาก</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">buffer overflow</span> · <span class=\"kw-tag\">ICS</span> · <span class=\"kw-tag\">penetration test</span></div><div class=\"tip-th\">💡 Isolate affected systems ตัด connection จาก network เพื่อหยุดการแพร่กระจาย malware และป้องกัน data loss เพิ่มเติม</div>", "fill_hint": ""}, {"num": 323, "stem": "Which configuration change is most effective in preventing unauthorized remote access to system utilities and shell environments?", "options": {"A": "Enabling Remote Desktop Protocol (RDP) for remote administration.", "B": "Implementing biometric authentication for system access.", "C": "Disabling the firewall and focusing on intranet security only.", "D": "Restricting SSH access to known IP addresses only."}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": ["unauthorized remote access to system utilities and shell environments"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การตั้งค่าใดมีประสิทธิภาพที่สุดในการป้องกันการเข้าถึง shell จากระยะไกลโดยไม่ได้รับอนุญาต</div><div>🔑 <strong>สังเกตคำว่า</strong> \"unauthorized remote access to system utilities and shell environments\" = การเข้าถึง shell/เครื่องมือระบบจากระยะไกลโดยไม่ได้รับอนุญาต</div><div>✅ การจำกัด SSH ให้เข้าได้เฉพาะ IP ที่รู้จักเท่านั้น ตัดโอกาสที่บุคคลภายนอกจะเข้าถึง shell environment ได้เลย</div></div><div class=\"tip-th\">💡 Restrict SSH access ให้เฉพาะ known IP addresses ลด attack surface ป้องกัน brute-force SSH จาก internet</div>", "fill_hint": ""}, {"num": 324, "stem": "During a routine security check, a security analyst needs to verify the identity federation settings in AWS to ensure compliance with corporate security policies. What is the initial step?", "options": {"A": "Examine the trust relationships in the AWS Identity and Access Management (IAM) roles.", "B": "Inspect the configuration of network access control lists (ACLs).", "C": "Review the integrated audit logs within the AWS CloudTrail service.", "D": "Validate the security groups associated with AWS resource deployments."}, "correct": "A", "topic": "Risk, Compliance & Policy", "trick_keywords": ["verify the identity federation settings"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ขั้นตอนแรกในการตรวจสอบการตั้งค่า identity federation ใน AWS คืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"verify the identity federation settings\" = ตรวจสอบการตั้งค่าการเชื่อมโยงตัวตนข้ามระบบ</div><div>✅ identity federation ทำงานผ่าน trust relationship ของ IAM role การตรวจสอบ trust relationship นี้ก่อนจึงเป็นจุดเริ่มต้นที่ตรงที่สุด</div></div><div class=\"tip-th\">💡 Examine the trust relationships in the AWS Identity and Access Management (IAM) roles</div>", "fill_hint": ""}, {"num": 325, "stem": "An industrial plant utilizes a SCADA system to manage wastewater treatment. The system recently faced a targeted malware attack that exploited outdated firmware on several PLCs. What should be the initial step in responding to this incident?", "options": {"A": "Resetting all passwords related to the SCADA system components.", "B": "Installing antivirus software on all terminals within the SCADA network.", "C": "Applying the latest security patches to the SCADA software system.", "D": "Conduct a thorough audit of all PLCs to check for any other potential vulnerabilities."}, "correct": "D", "topic": "Malware & Viruses", "trick_keywords": ["initial step in responding to this incident"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> หลังพบว่ามัลแวร์โจมตี PLC ผ่านเฟิร์มแวร์เก่า ควรทำอะไรเป็นอันดับแรก</div><div>🔑 <strong>สังเกตคำว่า</strong> \"initial step in responding to this incident\" = ขั้นตอนแรกในการรับมือเหตุการณ์นี้</div><div>✅ เพราะปัญหาคือเฟิร์มแวร์เก่าซึ่งอาจมีอยู่ใน PLC ตัวอื่นด้วย การตรวจสอบ PLC ทั้งหมดหาช่องโหว่เดียวกันจึงจำเป็นก่อนจะแก้ไขจุดเดียว</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">malware</span> · <span class=\"kw-tag\">SCADA</span></div><div class=\"tip-th\">💡 Conduct a thorough audit of all PLCs to check for any other potential vulnerabilities</div>", "fill_hint": ""}, {"num": 326, "stem": "In the process of hardening a server's security, what is the first action you should take after installing the operating system?", "options": {"A": "Configuring a network firewall to filter incoming and outgoing traffic.", "B": "Creating a backup of the system state and important data.", "C": "Setting up a strong password policy for all user accounts.", "D": "Applying the latest security patches and updates."}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": ["first action...after installing the operating system"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> หลังติดตั้ง OS เสร็จ ควรทำอะไรเป็นอันดับแรกในการ harden เซิร์ฟเวอร์</div><div>🔑 <strong>สังเกตคำว่า</strong> \"first action...after installing the operating system\" = การกระทำแรกหลังติดตั้ง OS เสร็จ</div><div>✅ OS ที่เพิ่งติดตั้งมักมีช่องโหว่ที่ถูกแพตช์ไปแล้วหลังวันที่ปล่อยตัว การอัปเดตแพตช์ทันทีจึงเป็นขั้นตอนพื้นฐานแรกสุดของการ harden</div></div><div class=\"tip-th\">💡 Patch Management: apply security patches ทันทีเพื่อปิดช่องโหว่ที่รู้จักก่อน attacker exploit ในช่วง window of exposure</div>", "fill_hint": ""}, {"num": 327, "stem": "In the context of ICS security, fill in the blank: Commonly, attackers exploit ________ services to gain unauthorized access.", "options": {"A": "Open ports that are accessible over the internet.", "B": "Weakly encrypted wireless communication links.", "C": "Unsecured remote management.", "D": "Outdated firewall rules that do not conform to current threa t an update from a third-party vendor includes a backdoor. What command should they use to check the integrity of the downloaded file?", "options": {"A": "chmod +x filename.zip", "B": "file filename.zip", "C": "ls -l filename.zip", "D": "sha256sum filename.zip"}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": ["check the integrity of the downloaded file"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรใช้คำสั่งใดตรวจสอบความถูกต้องของไฟล์อัปเดตที่สงสัยว่ามี backdoor</div><div>🔑 <strong>สังเกตคำว่า</strong> \"check the integrity of the downloaded file\" = ตรวจสอบความถูกต้องของไฟล์ที่ดาวน์โหลดมา</div><div>✅ การคำนวณค่า hash (sha256sum) แล้วเทียบกับค่าที่ผู้ผลิตประกาศไว้ เป็นวิธีมาตรฐานในการยืนยัน integrity ของไฟล์</div></div><div class=\"tip-th\">💡 sha256sum ใช้คำนวณ hash ของไฟล์เพื่อยืนยัน integrity ว่าไฟล์ไม่ถูกแก้ไขหรือ corrupt ระหว่างดาวน์โหลด</div>", "fill_hint": ""}, {"num": 346, "stem": "In what way does machine learning enhance the detection of zero-day vulnerabilities commonly exploited in APT attacks?", "options": {"A": "By using sandbox environments to execute unknown binaries and monitoring their behavior for indicators of compromise.", "B": "By correlating historical attack data from signature databases with current system activity to detect potential zero-day vulnerabilities.", "C": "By recognizing patterns in new or modified attack vectors, machine learning can predict the presence of vulnerabilities without relying on signature-based detection.", "D": "By scanning system logs and identifying events that match predefined rules for potential exploitation of unknown vulnerabilities."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": ["detection of zero-day vulnerabilities"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> machine learning ช่วยเพิ่มการตรวจจับ zero-day ที่ใช้ใน APT ได้อย่างไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"detection of zero-day vulnerabilities\" = การตรวจจับช่องโหว่ zero-day</div><div>✅ ML สามารถเรียนรู้ pattern ทั่วไปของการโจมตีแล้วจับความผิดปกติของรูปแบบใหม่ที่ยังไม่มี signature ได้ ตรงกับความสามารถในการตรวจจับ zero-day</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">zero-day</span></div><div class=\"tip-th\">💡 Signature-based Detection เปรียบกับ known threat database เร็วและ False Positive ต่ำ แต่ไม่จับ zero-day</div>", "fill_hint": ""}, {"num": 347, "stem": "Fill in the blank: To check for outdated software versions on Ubuntu, use the command ______ -l --security.", "options": {"A": "dpkg --get-selections", "B": "apt list", "C": "apt-cache policy", "D": "ubuntu-security-status"}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": ["check for outdated software versions"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรใช้คำสั่งใดตรวจสอบซอฟต์แวร์เวอร์ชันเก่าบน Ubuntu</div><div>🔑 <strong>สังเกตคำว่า</strong> \"check for outdated software versions\" = ตรวจสอบซอฟต์แวร์เวอร์ชันเก่าที่ควรอัปเดต</div><div>✅ โจทย์ถามหา syntax เฉพาะที่ต้องเติมคำว่า apt list หน้า flag -l --security ตามรูปแบบคำสั่งของ apt</div></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>apt list</strong></div>", "fill_hint": ""}, {"num": 348, "stem": "What is the command to exploit a vulnerability using Metasploit's Meterpreter to establish a reverse shell on a target machine?", "options": {"A": "use exploit/windows/smb/ms08_067_netapi, which targets a known Windows vulnerability but is not specific to setting up a reverse shell via Meterpreter.", "B": "use auxiliary/admin/smb/ms17_010_eternalblue, which prepares Metasploit for targeting Windows SMB vulnerabilities but is not used for establishing a reverse shell.", "C": "set payload windows/meterpreter/reverse_tcp, which sets the payload type for the Meterpreter session but does not run the actual exploitation command.", "D": "exploit -j -z, which initiates the exploitation and runs the job in the background without waiting for the process to complete."}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": ["establish a reverse shell"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> คำสั่งใดใน Metasploit ใช้เริ่มการโจมตีเพื่อสร้าง reverse shell</div><div>🔑 <strong>สังเกตคำว่า</strong> \"establish a reverse shell\" = สร้าง shell ย้อนกลับมาหาเครื่องผู้โจมตี</div><div>✅ flag -j -z ของคำสั่ง exploit สั่งให้รันการโจมตีเป็น background job โดยไม่เปิด session ทันที ตรงกับรูปแบบการสร้าง shell ที่โจทย์ต้องการ</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">Metasploit</span></div><div class=\"tip-th\">💡 exploit -j -z, which initiates the exploitation and runs the job in the background without waiting for the process to complete</div>", "fill_hint": ""}, {"num": 349, "stem": "During a security audit, you are tasked with analyzing data collected by an AI-powered threat detection system. What command could be used to view anomalies in process execution on a Linux-based system?", "options": {"A": "lsof -i -P, which lists open files and the processes that opened them, revealing any unauthorized access to sensitive files.", "B": "top -b -n 1 | grep COMMAND, displaying processes by memory usage, which can help reveal suspicious applications running with high resource demands.", "C": "ps aux --sort=-%cpu, which lists all processes, sorting them by CPU usage, helping to identify suspicious spikes in activity.", "D": "netstat -anp | grep ESTABLISHED, which displays network connections, indicating if an unauthorized process is communicating externally."}, "correct": "C", "topic": "Risk, Compliance & Policy", "trick_keywords": ["view anomalies in process execution"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> คำสั่งใดใช้ดูความผิดปกติของโพรเซสที่กำลังทำงานบน Linux</div><div>🔑 <strong>สังเกตคำว่า</strong> \"view anomalies in process execution\" = ดูความผิดปกติของการทำงานของโพรเซส</div><div>✅ การเรียง process ตามการใช้ CPU จากมากไปน้อยด้วย ps aux --sort=-%cpu ช่วยให้เห็นโพรเซสที่ใช้ทรัพยากรผิดปกติได้ง่ายที่สุด</div></div><div class=\"tip-th\">💡 ps aux --sort=-%cpu แสดง processes เรียงตาม CPU usage ช่วยหา malicious process ที่ใช้ CPU สูงผิดปกติ</div>", "fill_hint": ""}, {"num": 350, "stem": "Fill in the blank: When analyzing a suspected deepfake video, checking for inconsistencies in lighting across frames is best done using _______ to detect unusual pixel patterns.", "options": {"A": "Standard image processing filters.", "B": "Digital fingerprinting tools.", "C": "AI-powered image analysis software.", "D": "Network traffic monitoring tools."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": ["inconsistencies in lighting across frames"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรใช้อะไรตรวจสอบความไม่สอดคล้องของแสงในแต่ละเฟรมของวิดีโอที่สงสัยว่าเป็น deepfake</div><div>🔑 <strong>สังเกตคำว่า</strong> \"inconsistencies in lighting across frames\" = ความไม่สอดคล้องกันของแสงในแต่ละเฟรม</div><div>✅ การตรวจจับความผิดปกติของ pixel ที่ละเอียดระดับเฟรมต่อเฟรมแบบนี้ ต้องอาศัยซอฟต์แวร์วิเคราะห์ภาพด้วย AI ที่ทำได้แม่นยำกว่าตาเปล่า</div></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>AI-powered image analysis software.</strong></div>", "fill_hint": ""}, {"num": 351, "stem": "What initial step should be taken when using AI-based deepfake detection software to identify manipulated media?", "options": {"A": "Perform reverse image searches to find any original versions of the media.", "B": "Conduct a manual review of facial movements and expressions.", "C": "Run the media through the detection tool’s machine learning algorithms.", "D": "Examine the video's audio-visual synchronization for timing discrepancies."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": ["identify manipulated media"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ขั้นตอนแรกในการใช้ซอฟต์แวร์ตรวจจับ deepfake เพื่อระบุสื่อที่ถูกดัดแปลงคืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"identify manipulated media\" = ระบุสื่อที่ถูกดัดแปลง</div><div>✅ ก่อนจะวิเคราะห์อะไรเพิ่มเติม ต้องนำสื่อผ่านอัลกอริทึม ML ของเครื่องมือตรวจจับก่อนเป็นขั้นตอนแรกเสมอ</div></div><div class=\"tip-th\">✅ คำตอบ: <strong>Run the media through the detection tool’s machine learning algorithms.</strong></div>", "fill_hint": ""}, {"num": 352, "stem": "Which command would you use to disable guest access on a Windows system to enhance security?", "options": {"A": "usermod -L guest", "B": "disable guest", "C": "net user guest /active:no", "D": "guestaccount off"}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": ["disable guest access"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> คำสั่งใดใช้ปิดการเข้าถึงแบบ guest บน Windows</div><div>🔑 <strong>สังเกตคำว่า</strong> \"disable guest access\" = ปิดการใช้งานบัญชี guest</div><div>✅ flag /active:no ของคำสั่ง net user guest ปิดการใช้งานบัญชี guest โดยตรงตามชื่อคำสั่ง</div></div><div class=\"tip-th\">💡 Disable guest account (net user guest /active:no) ลด attack surface ป้องกัน unauthorized access ผ่าน default account</div>", "fill_hint": ""}, {"num": 353, "stem": "When assessing vulnerabilities in cloud storage services, what should be checked first to prevent unauthorized access?", "options": {"A": "Audit user access permissions to determine least privilege compliance.", "B": "Review the bucket’s public access settings to ensure they are secure.", "C": "Ensure encryption keys used for data at rest are rotated regularly.", "D": "Test for susceptibility to cross-site scripting (XSS) in web interfaces."}, "correct": "B", "topic": "Cloud Security", "trick_keywords": ["prevent unauthorized access"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรตรวจสอบอะไรก่อนเป็นอันดับแรกเมื่อประเมินช่องโหว่ของบริการจัดเก็บข้อมูลบน cloud</div><div>🔑 <strong>สังเกตคำว่า</strong> \"prevent unauthorized access\" = ป้องกันการเข้าถึงโดยไม่ได้รับอนุญาต</div><div>✅ สาเหตุการรั่วไหลข้อมูล cloud storage ที่พบบ่อยที่สุดคือการตั้งค่าเปิดสาธารณะโดยไม่ตั้งใจ การตรวจสอบค่านี้ก่อนจึงตรงจุดที่สุด</div></div><div class=\"tip-th\">💡 S3 bucket public access settings ต้องตรวจสอบ เพราะ misconfigured public bucket เป็นสาเหตุของ data breach จำนวนมาก</div>", "fill_hint": ""}, {"num": 354, "stem": "In a scenario where an attacker is using a packet sniffer to capture unencrypted login credentials, what countermeasure would be most effective in preventing the compromise of these credentials?", "options": {"A": "Disabling unused ports and protocols to reduce attack surfaces but not addressing the capture of legitimate traffic by sniffers.", "B": "Enabling encrypted protocols such as SSH for remote login, which prevents plaintext credentials from being captured by packet sniffers.", "C": "Changing passwords regularly to limit the impact of any stolen credentials without necessarily addressing the sniffing itself.", "D": "Implementing two-factor authentication (2FA) for login systems to add an extra layer of security to credentials, reducing the effectiveness of sniffing."}, "correct": "B", "topic": "Network Sniffing & MITM", "trick_keywords": ["capture unencrypted login credentials"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> มาตรการใดมีประสิทธิภาพที่สุดในการป้องกันไม่ให้ข้อมูลล็อกอินที่ไม่เข้ารหัสถูกดักจับ</div><div>🔑 <strong>สังเกตคำว่า</strong> \"capture unencrypted login credentials\" = ดักจับข้อมูลล็อกอินที่ไม่ได้เข้ารหัส</div><div>✅ คำว่า unencrypted ชี้ตรงว่าปัญหาคือส่งรหัสผ่านแบบ plaintext การเปลี่ยนไปใช้โปรโตคอลที่เข้ารหัส เช่น SSH จึงตัดปัญหาที่ต้นเหตุ</div></div><div class=\"tip-th\">💡 SSH (Secure Shell) เข้ารหัส remote login session ป้องกัน credentials จาก plaintext interception ต่างจาก Telnet ที่ส่ง plain text</div>", "fill_hint": ""}, {"num": 355, "stem": "In a scenario where the AI-powered cyber range has detected unusual network behavior, which command can be used to trace the source of an active attack on a specific port?", "options": {"A": "Use netstat -an to monitor active connections on the machine.", "B": "Analyze the firewall rules with iptables to block suspicious traffic.", "C": "Execute traceroute to track the attack path across the network.", "D": "Review the system logs using dmesg to identify the attack origin."}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": ["trace the source of an active attack on a specific port"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> คำสั่งใดใช้ตามหาแหล่งที่มาของการโจมตีที่กำลังเกิดขึ้นบนพอร์ตที่ระบุ</div><div>🔑 <strong>สังเกตคำว่า</strong> \"trace the source of an active attack on a specific port\" = ตามหาแหล่งที่มาของการโจมตีที่กำลังเกิดขึ้นบนพอร์ตหนึ่ง</div><div>✅ netstat -an แสดงรายการ connection ที่กำลังทำงานอยู่ทั้งหมดพร้อมพอร์ต ช่วยระบุแหล่งที่มาของการเชื่อมต่อผิดปกติได้</div></div><div class=\"tip-th\">💡 netstat ดู active network connections, listening ports และ process ที่ bind อยู่ ใช้หา malware C&C connections</div>", "fill_hint": ""}, {"num": 356, "stem": "After successfully gaining access to a system in an AI-driven cyber range simulation, what command can be used to identify system users and privilege levels for further escalation?", "options": {"A": "Run whoami to determine the current user’s privileges.", "B": "Check for open ports using netcat to find exposed services.", "C": "Inspect running processes using ps aux to locate potential malicious activity.", "D": "Monitor file system changes with inotifywatch for further intrusion attempts."}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": ["identify system users and privilege levels"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> หลังเข้าระบบได้แล้ว ควรใช้คำสั่งใดระบุ res.", "B": "Generating financial reports for the utilities department to assist in budget planning and forecasting.", "C": "Coordinating scheduled maintenance activities and issuing alerts for potential hardware failures.", "D": "Monitoring and adjusting the flow rates and pressure to ensure consistent service levels."}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": ["manage water pressure in a municipal supply network"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> หน้าที่หลักของ PLC ที่ตั้งค่าให้จัดการแรงดันน้ำในระบบประปาคืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"manage water pressure in a municipal supply network\" = จัดการแรงดันน้ำในระบบประปาเทศบาล</div><div>✅ PLC ควบคุมกระบวนการทางกายภาพโดยตรง เมื่อตั้งค่าสำหรับแรงดันน้ำ หน้าที่หลักคือเฝ้าและปรับอัตราการไหล/แรงดันให้คงที่ตามที่โจทย์ระบุ</div></div><div class=\"tip-th\">💡 การ monitor และปรับ flow/pressure ใน ICS ให้สม่ำเสมอ ป้องกัน operational disruption จากการโจมตีหรือ misconfiguration</div>", "fill_hint": ""}, {"num": 359, "stem": "Considering a malware sample suspected of encrypting files, what initial analysis step should you take to confirm this behavior?", "options": {"A": "Execute the malware in a controlled environment and observe the behavior.", "B": "Reverse engineer the malware code to find cryptographic functions.", "C": "Perform static analysis to identify encryption-related strings in the binary.", "D": "Analyze the network traffic generated by the malware to detect any anomaly."}, "correct": "C", "topic": "Malware & Viruses", "trick_keywords": ["initial analysis step...to confirm this behavior"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรวิเคราะห์อย่างไรเป็นอันดับแรกเพื่อยืนยันว่ามัลแวร์เข้ารหัสไฟล์จริงหรือไม่</div><div>🔑 <strong>สังเกตคำว่า</strong> \"initial analysis step...to confirm this behavior\" = ขั้นตอนวิเคราะห์แรกเพื่อยืนยันพฤติกรรม</div><div>✅ การวิเคราะห์แบบ static อ่านโค้ด/string ในไฟล์โดยไม่รัน เพื่อหา string ที่เกี่ยวกับการเข้ารหัส เป็นวิธีปลอดภัยและรวดเร็วก่อนจะรันมัลแวร์จริง</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">malware</span></div><div class=\"tip-th\">✅ คำตอบ: <strong>Perform static analysis to identify encryption-related strings in the binary.</strong></div>", "fill_hint": ""}, {"num": 360, "stem": "A piece of malware is suspected to modify system registry settings to achieve persistence. Which of these tools would be most appropriate for monitoring such changes?", "options": {"A": "Total Commander", "B": "RegShot", "C": "ProcMon", "D": "Wireshark"}, "correct": "B", "topic": "Malware & Viruses", "trick_keywords": ["monitoring...registry settings"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เครื่องมือใดเหมาะกับการเฝ้าติดตามการเปลี่ยนแปลง registry ที่มัลแวร์อาจแก้ไข</div><div>🔑 <strong>สังเกตคำว่า</strong> \"monitoring...registry settings\" = เฝ้าติดตามการเปลี่ยนแปลงค่า registry</div><div>✅ RegShot ถูกออกแบบมาเพื่อเปรียบเทียบสถานะ registry ก่อน-หลังการรันโปรแกรม ตรงกับการตรวจจับการแก้ไข registry โดยตรง</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">malware</span> · <span class=\"kw-tag\">persistence</span></div><div class=\"tip-th\">💡 RegShot คือเครื่องมือ capture Windows Registry snapshot เพื่อเปรียบเทียบ changes ที่เกิดจาก malware หรือ software install</div>", "fill_hint": ""}, {"num": 361, "stem": "A security analyst is reviewing firewall logs for an energy distribution network. They notice unusual outbound traffic patterns on TCP port 502. What is the most likely cause of this activity?", "options": {"A": "Potential command and control (C&C) communication from a compromised SCADA device.", "B": "Scheduled maintenance updates being misinterpreted as malicious activity due to misconfigured security devices.", "C": "Misrouting of internal traffic due to incorrect configuration of network address translation settings.", "D": "The presence of a benign software update process for operational technology equipment."}, "correct": "A", "topic": "IDS/IPS & Firewalls", "trick_keywords": ["TCP port 502"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ทราฟฟิกขาออกผิดปกติที่พอร์ต 502 น่าจะมีสาเหตุจากอะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"TCP port 502\" = พอร์ต TCP 502 พอร์ตมาตรฐานของ Modbus</div><div>✅ พอร์ต 502 คือพอร์ตมาตรฐานของโปรโตคอล Modbus ที่ใช้ในอุปกรณ์ SCADA การพบทราฟฟิกออกผิดปกติที่พอร์ตนี้จึงสื่อถึงอุปกรณ์ SCADA ที่ถูกเจาะแล้วกำลังสื่อสารกับ C&C</div></div><div class=\"tip-th\">💡 Botnet คือเครือข่าย compromised machines (zombies) ควบคุมด้วย C&C server ใช้โจมตี DDoS, spam</div>", "fill_hint": ""}, {"num": 362, "stem": "What protocol is primarily used to communicate with PLCs in industrial environments, and its security can be tested using specific scanning tools?", "options": {"A": "CAN bus", "B": "Profibus", "C": "Ethernet/IP", "D": "Modbus"}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": ["communicate with PLCs in industrial environments"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> โปรโตคอลใดใช้สื่อสารกับ PLC ในระบบอุตสาหกรรมเป็นหลัก</div><div>🔑 <strong>สังเกตคำว่า</strong> \"communicate with PLCs in industrial environments\" = สื่อสารกับ PLC ในสภาพแวดล้อมอุตสาหกรรม</div><div>✅ Modbus เป็นโปรโตคอลมาตรฐานที่เก่าแก่และใช้กันแพร่หลายที่สุดสำหรับสื่อสารกับ PLC ตามคำอธิบาย</div></div><div class=\"tip-th\">💡 Modbus คือ industrial communication protocol ใช้ใน SCADA/ICS ขาด authentication และ encryption เป็น default ทำให้ vulnerable</div>", "fill_hint": ""}, {"num": 363, "stem": "An attacker gains initial access to a system with user-level privileges. What should be their next step to escalate privileges using a service exploit?", "options": {"A": "Exploit common user misconfigurations in network settings to intercept credentials.", "B": "Conduct a denial of service attack to disrupt security  network เพื่อหยุดการแพร่กระจาย malware และป้องกัน data loss เพิ่มเติม</div>", "fill_hint": ""}, {"num": 365, "stem": "Which tool is commonly used to test for session fixation vulnerabilities in web applications?", "options": {"A": "OWASP ZAP, though more focused on a wider range of web vulnerabilities.", "B": "Metasploit, primarily used for network exploits and shell interaction.", "C": "Nessus, used more for vulnerability scanning and assessment.", "D": "Burp Suite, for its session handling and manipulation capabilities."}, "correct": "D", "topic": "Web Application Attacks", "trick_keywords": ["test for session fixation vulnerabilities"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เครื่องมือใดใช้ทดสอบช่องโหว่ session fixation ในเว็บแอปทั่วไป</div><div>🔑 <strong>สังเกตคำว่า</strong> \"test for session fixation vulnerabilities\" = ทดสอบช่องโหว่ session fixation</div><div>✅ Burp Suite มีฟีเจอร์จัดการ/แก้ไข session โดยตรง ทำให้เหมาะกับการทดสอบว่าเว็บแอปตรวจจับการเปลี่ยน session ID ได้หรือไม่</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">session fixation</span></div><div class=\"tip-th\">💡 Burp Suite คือ web application security testing tool ใช้ intercept, modify, replay HTTP requests และ test ช่องโหว่</div>", "fill_hint": ""}, {"num": 366, "stem": "What is the primary purpose of using a 'pass-the-hash' attack in a Windows environment?", "options": {"A": "To decrypt and read the content of encrypted files on the target system without alerting the legitimate user.", "B": "To increase the encryption level of stored passwords, thereby improving overall system security through obscurity.", "C": "To perform a denial of service on the user's account by entering incorrect passwords multiple times, leading to an account lockout.", "D": "To authenticate to a remote server or service by using a valid user's hashed password, bypassing the need for plaintext credentials."}, "correct": "D", "topic": "Cryptography", "trick_keywords": ["pass-the-hash"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> วัตถุประสงค์หลักของการโจมตีแบบ pass-the-hash บน Windows คืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"pass-the-hash\" = ใช้ hash รหัสผ่านแทนการใช้รหัสผ่านจริง</div><div>✅ ชื่อเทคนิค pass-the-hash บ่งบอกตรงตัวว่าใช้ hash รหัสผ่านที่ขโมยมายืนยันตัวตนแทนการรู้รหัสผ่านจริง</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">pass-the-hash</span></div><div class=\"tip-th\">💡 To authenticate to a remote server or service by using a valid user's hashed password, bypassing the need for plaintext credentials</div>", "fill_hint": ""}, {"num": 367, "stem": "In a penetration testing scenario, which type of encryption is most vulnerable to a known- plaintext attack in a wireless setting?", "options": {"A": "WiFi Protected Access (WPA), although more secure than WEP, still vulnerable.", "B": "Wired Equivalent Privacy (WEP), which uses weak IVs that are susceptible to attack.", "C": "Temporal Key Integrity Protocol (TKIP), susceptible due to its backward compatibility with WEP.", "D": "Wireless Protected Setup (WPS), exploitable via the WPS PIN attack method."}, "correct": "B", "topic": "Cryptography", "trick_keywords": ["known-plaintext attack in a wireless setting"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การเข้ารหัสไร้สายแบบใดเสี่ยงต่อ known-plaintext attack มากที่สุด</div><div>🔑 <strong>สังเกตคำว่า</strong> \"known-plaintext attack in a wireless setting\" = การโจมตีแบบรู้ข้อความต้นฉบับบางส่วนในระบบไร้สาย</div><div>✅ WEP ใช้ IV ที่สั้นและซ้ำง่าย ทำให้เสี่ยงต่อการโจมตีที่รู้ข้อความต้นฉบับบางส่วนได้มากกว่ามาตรฐานอื่น</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">penetration test</span></div><div class=\"tip-th\">💡 WEP (Wired Equivalent Privacy) ล้าสมัย ใช้ IV สั้นเกินทำให้เจาะได้ในนาทีด้วย aircrack-ng</div>", "fill_hint": ""}, {"num": 368, "stem": "What command-line tool can be used to extract and analyze metadata from media files, which can help detect deepfakes by revealing anomalies in the file’s creation?", "options": {"A": "strings", "B": "exiftool", "C": "mediainfo", "D": "ffmpeg"}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": ["extract and analyze metadata from media files"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เครื่องมือ command-line ใดใช้ดึง metadata จากไฟล์สื่อเพื่อช่วยตรวจจับ deepfake</div><div>🔑 <strong>สังเกตคำว่า</strong> \"extract and analyze metadata from media files\" = ดึงและวิเคราะห์ metadata จากไฟล์สื่อ</div><div>✅ exiftool คือเครื่องมือมาตรฐานสำหรับอ่าน/วิเคราะห์ metadata ของไฟล์รูปภาพ/วิดีโอโดยเฉพาะตามชื่อ</div></div><div class=\"tip-th\">💡 ExifTool ใช้อ่านและแก้ไข metadata ของไฟล์ เช่น รูปภาพมี GPS coordinates, camera model, timestamp ซึ่งใช้ใน OSINT ได้</div>", "fill_hint": ""}, {"num": 369, "stem": "Identify the primary tool for conducting a buffer overflow attack on a Windows-based application.", "options": {"A": "Metasploit, a comprehensive framework that allows the user to generate and execute exploit code against a target machine.", "B": "IDA Pro, a disassembler and debugger, useful for understanding the binary but not for direct exploitation of buffer overflows.", "C": "OllyDbg, another debugger used for analyzing binary programs and machine code but not as complete as Metasploit for exploit development.", "D": "Nmap, used for network mapping and port scanning but not specifically tailored for buffer overflow exploitation."}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": ["conducting a buffer overflow attack"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เครื่องมือหลักที่ใช้ในการโจมตี buffer overflow บนแอป Windows คืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"conducting a buffer overflow attack\" = ดำเนินการโจมตีแบบ buffer overflow</div><div>✅ Metasploit เป็น framework ที่รวมทั้งการสร้างและรัน exploit สำหรับช่องโหว่ buffer overflow ไว้ครบวงจรตามคำอธิบาย</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">buffer overflow</span></div><div class=\"tip-th\">💡 Metasploit คือ penetration testing framework มี exploit modules, payloads ใช้หลัง scan เจอ vulnerability</div>", "fill_hint": ""}, {"num": 370, "stem": "What command would you use in Aircrack-ng to initiate a deauthentication attack on a client connected to a network with a BSSID of AA:BB:CC:DD:EE?", "options": {"A": "iwconfig wlan0 mode monitor && airodump-ng --bssid AA:BB:CC:DD:EE:FF --channel 6", "B": "aircrack-ng -0 10 -a 2 -b AA:BB:CC:DD:EE:FF wlan0", "C": "airmon-ng start wlan0 && aireplay-ng --deauth 10 -a AA:BB:CC:DD:EE:FF wlan0", "D": "wlanconfig wlan0 create wlandev wifi0 wlanmode monitor"}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": ["initiate a deauthentication attack"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> คำสั่งใดใน Aircrack-ng ใช้เริ่มการโจมตี deauthentication กับไคลเอนต์</div><div>🔑 <strong>สังเกตคำว่า</strong> \"initiate a deauthentication attack\" = เริ่มการโจมตีบังคับตัดการเชื่อมต่อ (deauth)</div><div>✅ flag -0 ของชุดเครื่องมือ Aircrack-ng (aireplay-ng) เจาะจงสำหรับส่งเฟรม deauthentication ตามจำนวนครั้งที่กำหนด</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">deauth</span></div><div class=\"tip-th\">💡 Aircrack-ng คือ WiFi auditing tool crack WEP/WPA จาก captured handshake ด้วย dictionary/brute-force</div>", "fill_hint": ""}, {"num": 371, "stem": "Fill in the blank: To inspect the API calls made by a malware sample during execution, security analysts use the tool _____.", "options": {"A": "GDB", "B": "OllyDbg", "C": "Sysinternals Suite", "D": "API Monitor"}, "correct": "D", "topic": "Malware & Viruses", "trick_keywords": ["inspect the API calls made by a malware sample during execution"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <stro that an internal employee is using a packet sniffer to collect sensitive data from within the network. What would be the first step to verify this suspicion and detect the sniffing tool?", "options": {"A": "Review active processes on each machine to identify suspicious programs that could be used for packet sniffing.", "B": "Scan the network for open ports and unusual traffic patterns that could indicate unauthorized sniffing tools in operation.", "C": "Use network monitoring tools to detect excessive ARP requests or traffic duplication, indicating potential packet-sniffing activities.", "D": "Examine server logs for unusual spikes in CPU or memory usage that could indicate sniffing tools running in the background."}, "correct": "C", "topic": "Network Sniffing & MITM", "trick_keywords": ["detect the sniffing tool"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรทำอะไรเป็นอันดับแรกเพื่อตรวจสอบว่ามีคนใช้ packet sniffer ในเครือข่ายจริงหรือไม่</div><div>🔑 <strong>สังเกตคำว่า</strong> \"detect the sniffing tool\" = ตรวจจับเครื่องมือดักฟัง</div><div>✅ เครื่องที่เปิด promiscuous mode เพื่อดักฟังมักสร้าง ARP request/traffic ผิดปกติ การเฝ้าดูสัญญาณนี้จึงช่วยตรวจจับเครื่องที่กำลัง sniffing ได้</div></div><div class=\"tip-th\">💡 Monitor ARP traffic ด้วย network monitoring tools ตรวจจับ ARP poisoning จาก excessive ARP requests หรือ traffic duplication</div>", "fill_hint": ""}, {"num": 374, "stem": "An AI-powered intrusion detection system has identified unusual activity involving long- term data exfiltration. How would you proceed to confirm if this is indeed an APT attack?", "options": {"A": "Perform a forensic analysis of the compromised machine to identify any persistent backdoors or malware capable of enabling long-term access.", "B": "Investigate the flagged IP addresses and domains involved in the data transfer, cross- referencing them with known APT actor signatures and techniques.", "C": "Review user access logs and permissions to verify if the suspicious activity was conducted by an authorized insider misusing credentials.", "D": "Cross-check the system’s behavior against known AI-model training data to verify if the flagged activity matches typical APT behavior."}, "correct": "B", "topic": "IDS/IPS & Firewalls", "trick_keywords": ["long-term data exfiltration"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรทำอย่างไรเพื่อยืนยันว่าเหตุการณ์ที่มีการขโมยข้อมูลระยะยาวเป็น APT จริงหรือไม่</div><div>🔑 <strong>สังเกตคำว่า</strong> \"long-term data exfiltration\" = การขโมยข้อมูลออกอย่างต่อเนื่องเป็นเวลานาน</div><div>✅ การตรวจสอบ IP/domain ปลายทางที่ได้รับข้อมูล แล้วเทียบกับฐานข้อมูล threat intelligence ช่วยยืนยันว่าเชื่อมโยงกับกลุ่ม APT ที่รู้จักหรือไม่</div></div><div class=\"tip-th\">💡 Threat Intelligence ตรวจสอบ flagged IPs/domains โดย cross-reference กับ known threat databases เพื่อยืนยันว่า traffic เป็น malicious จริง</div>", "fill_hint": ""}, {"num": 375, "stem": "You are monitoring the behavior of a previously unknown executable file in an enterprise network. The AI model flags the file as part of an APT attack. What action should you take first to validate the model’s alert?", "options": {"A": "Capture the network traffic and perform a packet-level analysis to examine whether any data was exfiltrated or malicious connections were made.", "B": "Conduct a memory dump analysis of the endpoint where the executable was flagged to investigate if malicious processes are running in the background.", "C": "Immediately block the executable file at the host level and quarantine the affected machine to prevent further spread within the network.", "D": "Run a vulnerability scan across the entire system to identify any additional weak points that the APT might exploit."}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": ["validate the model's alert"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรทำอะไรก่อนเป็นอันดับแรกเพื่อยืนยันว่าการแจ้งเตือนของโมเดล AI ถูกต้องจริง</div><div>🔑 <strong>สังเกตคำว่า</strong> \"validate the model's alert\" = ยืนยันความถูกต้องของการแจ้งเตือนจากโมเดล</div><div>✅ การดักจับทราฟฟิกจริงมาวิเคราะห์ระดับแพ็กเก็ต เป็นหลักฐานที่เป็นรูปธรรมที่สุดในการยืนยันหรือหักล้างการแจ้งเตือนของ AI</div></div><div class=\"tip-th\">💡 tcpdump คือ command-line packet capture tool ดัก TCP/IP traffic ใน terminal ใช้ forensics และ troubleshoot network</div>", "fill_hint": ""}, {"num": 376, "stem": "What is the most effective method to prevent attackers from intercepting and reading sensitive data transmitted over a network?", "options": {"A": "Segregating the network using VLANs to control traffic flow and reduce the risk of sniffing across different segments of the network.", "B": "Using MAC filtering to restrict which devices can connect to the network, adding a layer of access control but not directly protecting data in transit.", "C": "Installing firewalls to block unauthorized access, which would prevent attackers from gaining access to the network but may not protect data in transit.", "D": "Implementing end-to-end encryption, which ensures that data is encrypted from the source to the destination, protecting it from interception."}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": ["intercepting and reading sensitive data transmitted"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> วิธีใดมีประสิทธิภาพที่สุดในการป้องกันไม่ให้ผู้โจมตีดักอ่านข้อมูลที่ส่งผ่านเครือข่าย</div><div>🔑 <strong>สังเกตคำว่า</strong> \"intercepting and reading sensitive data transmitted\" = ดักและอ่านข้อมูลสำคัญที่ถูกส่งผ่านเครือข่าย</div><div>✅ การเข้ารหัสแบบ end-to-end ทำให้แม้ดักข้อมูลได้ก็อ่านเนื้อหาไม่ออก ตรงกับเป้าหมายป้องกันการ intercepting and reading</div></div><div class=\"tip-th\">💡 End-to-End Encryption เข้ารหัสข้อมูลตั้งแต่ต้นทางถึงปลายทาง แม้ผ่าน relay server ก็ยังอ่านไม่ออก</div>", "fill_hint": ""}, {"num": 377, "stem": "During a network audit, you are tasked with implementing security measures to defend against packet sniffing. Which encryption technique should you prioritize to secure data transmission over unsecured Wi-Fi networks?", "options": {"A": "Apply WPA3 encryption on the Wi-Fi network to secure data transmissions with the most advanced wireless security standards.", "B": "Configure WEP encryption to secure the Wi-Fi network and prevent unauthorized access to transmitted data.", "C": "Use SSL/TLS encryption for web-based traffic to secure sensitive information transmitted through browsers.", "D": "Use VPN encryption to secure data transmission and ensure that all network traffic is encrypted end-to-end."}, "correct": "A", "topic": "Network Sniffing & MITM", "trick_keywords": ["unsecured Wi-Fi networks"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรใช้เทคนิคเข้ารหัสใดเป็นอันดับแรกเพื่อป้องกัน packet sniffing บน Wi-Fi ที่ไม่ปลอดภัย</div><div>🔑 <strong>สังเกตคำว่า</strong> \"unsecured Wi-Fi networks\" = เครือข่าย Wi-Fi ที่ไม่ปลอดภัย</div><div>✅ WPA3 เป็นมาตรฐานเข้ารหัส Wi-Fi ล่าสุดและแข็งแกร่งที่สุดในปัจจุบัน จึงควรใช้เป็นอันดับแรกเพื่อป้องกันการดักฟัง</div></div><div class=\"tip-th\">💡 WPA3 ใช้ SAE (Simultaneous Authentication of Equals) ทนต่อ offline brute-force ได้ดีกว่า WPA2 มาก</div>", "fill_hint": ""}, {"num": 378, "stem": "During a security review, what step should an organization take to minimize the risk of a supply chain attack via software updates?", "options": {"A": "Require that all third-party updates are signed with a company-specific digital certificate.", "B": "Only allow updates during certain hours when monitoring can be increased.", "C": "Implement a strict multi-stage testing process for all updates before deployment.", "D": "Encourage employees to use personal devices for testing updates."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": ["supply chain attack via software updates"], "  <strong>สังเกตคำว่า</strong> \"intercept data transmitted from an IoT device\" = ดักข้อมูลที่ส่งจากอุปกรณ์ IoT</div><div>✅ การดักข้อมูลระหว่างทาง (intercept) ตรงกับนิยามของ Man-in-the-Middle attack โดยตรง</div></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>Man-in-the-middle.</strong></div><div class=\"tip-th\">💡 MITM (Man-in-the-Middle) คือการแทรกตัวกลางการสื่อสาร อ่าน/แก้ไข traffic โดยที่ทั้งสองฝ่ายไม่รู้</div>", "fill_hint": ""}, {"num": 399, "stem": "A company has discovered that sensitive customer information was stolen during a breach. What immediate action should the incident response team take to protect the affected data and prevent its misuse?", "options": {"A": "Change all passwords across the network for impacted users and accounts to prevent further unauthorized access.", "B": "Contact law enforcement immediately to report the breach and involve them in the investigation to help track down the attackers.", "C": "Encrypt the affected data to prevent attackers from accessing the information while further analysis is conducted.", "D": "Notify customers immediately about the breach and provide them with steps to secure their accounts and monitor for suspicious activity."}, "correct": "D", "topic": "Incident Response & Forensics", "trick_keywords": ["protect the affected data and prevent its misuse"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ทีมตอบสนองเหตุการณ์ควรทำอะไรทันทีเพื่อปกป้องข้อมูลลูกค้าที่ถูกขโมยไม่ให้ถูกนำไปใช้ในทางที่ผิด</div><div>🔑 <strong>สังเกตคำว่า</strong> \"protect the affected data and prevent its misuse\" = ปกป้องข้อมูลที่ได้รับผลกระทบและป้องกันการนำไปใช้ในทางที่ผิด</div><div>✅ เพราะข้อมูลหลุดไปแล้ว การแจ้งเตือนเจ้าของข้อมูลให้รีบป้องกันตัวเอง เช่น เปลี่ยนรหัสผ่าน เป็นมาตรการลดผลกระทบที่ตรงจุดที่สุด</div></div><div class=\"tip-th\">💡 Breach Notification: แจ้งลูกค้าที่ได้รับผลกระทบทันที อธิบายสิ่งที่เกิดขึ้นและขั้นตอนที่ควรทำ ตาม GDPR/กฎหมาย privacy</div>", "fill_hint": ""}, {"num": 400, "stem": "A security analyst observes an increase in network traffic believed to be an indicator of a brute force attack against a wireless network's encryption. Which tool would best analyze this type of traffic to confirm the attack?", "options": {"A": "TCPdump, which can capture packets but lacks real-time analysis features.", "B": "NetStumbler, mainly used for war driving and detecting open WiFi networks.", "C": "Wireshark, capable of capturing and analyzing packets to detect anomalies.", "D": "Nmap, primarily used for network mapping and port scanning, not ideal for this purpose."}, "correct": "C", "topic": "Cryptography", "trick_keywords": ["brute force attack against a wireless network's encryption"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เครื่องมือใดใช้วิเคราะห์ทราฟฟิกที่คาดว่าเป็นการ brute force ต่อการเข้ารหัส Wi-Fi ได้ดีที่สุด</div><div>🔑 <strong>สังเกตคำว่า</strong> \"brute force attack against a wireless network's encryption\" = การโจมตีแบบ brute force ต่อการเข้ารหัสเครือข่ายไร้สาย</div><div>✅ Wireshark สามารถจับและวิเคราะห์แพ็กเก็ตอย่างละเอียดเพื่อยืนยันรูปแบบการโจมตีที่ผิดปกติได้ตรงตามที่โจทย์ต้องการ</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">brute force</span></div><div class=\"tip-th\">💡 Wireshark คือ network protocol analyzer จับ packet วิเคราะห์แบบ real-time หา credentials ที่ส่ง plain text</div>", "fill_hint": ""}, {"num": 401, "stem": "In an advanced penetration testing automation scenario, how would you configure an AI- based system to automatically adapt its testing strategies based on previous outcomes?", "options": {"A": "Setting fixed testing sequences to be triggered after every development cycle", "B": "Implementing a feedback loop with manual review checkpoints", "C": "Utilizing pre-configured attack vectors based on common vulnerabilities", "D": "Developing a machine learning model that adjusts testing parameters in real-time"}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": ["adapt its testing strategies based on previous outcomes"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรตั้งค่าระบบ AI อย่างไรให้ปรับกลยุทธ์ทดสอบเองตามผลลัพธ์ที่ผ่านมา</div><div>🔑 <strong>สังเกตคำว่า</strong> \"adapt its testing strategies based on previous outcomes\" = ปรับกลยุทธ์การทดสอบตามผลลัพธ์ที่ผ่านมา</div><div>✅ การจะปรับตามผลลัพธ์ในอดีตได้เอง ต้องมีโมเดล ML ที่เรียนรู้และปรับพารามิเตอร์แบบเรียลไทม์ ไม่ใช่กฎตายตัว</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">penetration test</span></div><div class=\"tip-th\">💡 Developing a machine learning model that adjusts testing parameters in real-time</div>", "fill_hint": ""}, {"num": 402, "stem": "Given a scenario where a security professional needs to demonstrate a model inversion attack on an image processing model to detect potential leaks, which of the following methods would effectively extract training images?", "options": {"A": "Applying noise to the model’s input layer and observing changes in output to guess the training data.", "B": "Analyzing metadata embedded in the model’s file system to uncover traces of the original training data.", "C": "Utilizing gradient ascent on the model’s output probabilities to reconstruct the input images.", "D": "Employing a series of controlled, small changes to the inputs and monitoring the corresponding outputs to deduce information about the training images."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": ["extract training images"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> วิธีใดใช้สาธิตการโจมตีแบบ model inversion เพื่อดึงภาพที่ใช้ฝึกโมเดลกลับมา</div><div>🔑 <strong>สังเกตคำว่า</strong> \"extract training images\" = ดึงภาพต้นฉบับที่ใช้ฝึกโมเดลกลับคืนมา</div><div>✅ การไล่ปรับอินพุตด้วย gradient ascent ให้ output probability สูงสุด เป็นเทคนิคมาตรฐานในการ reconstruct ภาพต้นฉบับจากโมเดล</div></div><div class=\"tip- ntly extract database information\" = ดึงข้อมูลฐานข้อมูลออกมาอย่างมีประสิทธิภาพ</div><div>✅ ก่อนดึงข้อมูล ต้องให้เครื่องมือระบุชนิดฐานข้อมูลเบื้องหลังก่อนด้วยวิธี heuristic เพื่อเลือกคำสั่ง SQLi ที่เหมาะกับฐานข้อมูลนั้นๆ</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">SQL inject</span> · <span class=\"kw-tag\">penetration test</span></div><div class=\"tip-th\">💡 Configure Havij to use heuristic methods for detecting the backend database server before attempting data retrieval</div>", "fill_hint": ""}, {"num": 406, "stem": "A cybersecurity analyst is tasked with the vulnerability management of a newly implemented software. Which step should be the focus for identifying and prioritizing the critical vulnerabilities?", "options": {"A": "Setting up alerts for any unusual access patterns or breaches", "B": "Reviewing the latest security patches from the software vendor", "C": "Updating all antivirus and anti-malware definitions", "D": "Conducting a penetration test to identify exploitable vulnerabilities"}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": ["identifying and prioritizing the critical vulnerabilities"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรเน้นขั้นตอนใดในการระบุและจัดลำดับช่องโหว่ที่วิกฤตของซอฟต์แวร์ใหม่</div><div>🔑 <strong>สังเกตคำว่า</strong> \"identifying and prioritizing the critical vulnerabilities\" = ระบุและจัดลำดับความสำคัญของช่องโหว่วิกฤต</div><div>✅ การทำ penetration test จริงช่วยยืนยันว่าช่องโหว่ใด exploitable จริง ซึ่งเป็นเกณฑ์สำคัญที่สุดในการจัดลำดับความสำคัญ</div></div><div class=\"tip-th\">💡 Penetration Testing ตรวจหา exploitable vulnerabilities ก่อน attacker จริงทำ ช่วยองค์กร prioritize remediation</div>", "fill_hint": ""}, {"num": 407, "stem": "In Metasploit, which command would you use to set a payload for exploiting a Windows server remote code execution vulnerability?", "options": {"A": "load payload windows/meterpreter/reverse_tcp", "B": "init s following detection\" = มาตรการบรรเทาที่เร็วที่สุดหลังตรวจพบ</div><div>✅ การเชื่อมระบบ AI เข้ากับเครื่องมือ automation ของเครือข่ายโดยตรง ทำให้สั่งบล็อก/แก้ไขได้ทันทีโดยไม่ต้องรอคนกดยืนยัน ตรงกับ quickest</div></div><div class=\"tip-th\">💡 AI + Network Automation: เมื่อ AI ตรวจพบ threat จะ trigger network tools apply remediation อัตโนมัติทันที ลด response time จาก hours เป็น seconds</div>", "fill_hint": ""}, {"num": 409, "stem": "While auditing email security protocols, which configuration should be checked first to prevent phishing emails from reaching user inboxes?", "options": {"A": "Configuring DMARC policies to validate incoming emails", "B": "Setting up a firewall to block emails from known phishing domains", "C": "Installing browser plugins that alert users to malicious websites", "D": "Implementing strict user access controls to email settings"}, "correct": "A", "topic": "Social Engineering & Phishing", "trick_keywords": ["prevent phishing emails from reaching user inboxes"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรตรวจสอบการตั้งค่าใดก่อนเป็นอันดับแรกเพื่อป้องกันอีเมลฟิชชิง</div><div>🔑 <strong>สังเกตคำว่า</strong> \"prevent phishing emails from reaching user inboxes\" = ป้องกันอีเมลฟิชชิงไม่ให้เข้าถึงกล่องจดหมายผู้ใช้</div><div>✅ DMARC เป็นนโยบายที่ตรวจสอบว่าอีเมลที่อ้างว่ามาจากโดเมนนั้นเป็นของจริงหรือไม่ ป้องกันการปลอมแปลงผู้ส่งซึ่งเป็นรากฐานของ phishing จำนวนมาก</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">phishing</span></div><div class=\"tip-th\">💡 Rate Limiting จำกัดจำนวน request ต่อเวลา ป้องกัน DDoS, brute-force login, API abuse</div>", "fill_hint": ""}, {"num": 410, "stem": "Given a scenario where an organization needs to assess the risk associated with new malware signatures detected by their IDS, which technique would best help in correlating this information with external threat databases?", "options": {"A": "Reviewing internal logs for any mention of the signatures without e t) ทำให้กลไกตรวจสอบของ stateful firewall ที่ดู pattern เต็มรูปแบบทำงานได้ไม่สมบูรณ์</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">stateful</span> · <span class=\"kw-tag\">penetration test</span></div><div class=\"tip-th\">💡 Packet Fragmentation ตัด packet เป็นชิ้นเล็กกว่า threshold ที่ firewall inspect ทำให้ bypass firewall rules ได้</div>", "fill_hint": ""}, {"num": 415, "stem": "Which command correctly configures an iptables rule to redirect traffic for firewall evasion testing purposes?", "options": {"A": "iptables -A FORWARD -p tcp --dport 80 -j DROP", "B": "iptables --flush", "C": "iptables -P OUTPUT ACCEPT", "D": "iptables -t nat -A PREROUTING -p tcp --dport 80 -j REDIRECT --to-port 8080"}, "correct": "D", "topic": "IDS/IPS & Firewalls", "trick_keywords": ["redirect traffic for firewall evasion testing"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> คำสั่งใดตั้งค่า iptables เพื่อ redirect ทราฟฟิกสำหรับทดสอบการหลบ firewall</div><div>🔑 <strong>สังเกตคำว่า</strong> \"redirect traffic for firewall evasion testing\" = เปลี่ยนเส้นทางทราฟฟิกเพื่อทดสอบการหลบ firewall</div><div>✅ กฎ PREROUTING พร้อม REDIRECT --to-port เป็น syntax มาตรฐานของ iptables สำหรับเปลี่ยนเส้นทางทราฟฟิกไปพอร์ตอื่นตามที่โจทย์ต้องการ</div></div><div class=\"tip-th\">💡 iptables NAT PREROUTING redirect ส่ง traffic จาก port หนึ่งไปยังอีก port เช่น proxy ทุก HTTP traffic ผ่าน intercepting proxy</div>", "fill_hint": ""}, {"num": 416, "stem": "When implementing OAuth 2.0 in your API security strategy, which token should you ensure is validated properly to prevent unauthorized access?", "options": {"A": "Identity token", "B": "Refresh token", "C": "Verification token", "D": "Access token"}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": ["prevent unauthorized access"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรตรวจสอบ token ประเภทใดใน OAuth 2.0 อย่างเข้มงวดเพื่อป้องกันการเข้าถ
