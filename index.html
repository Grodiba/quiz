 เพื่อเข้าถึง WiFi/VPN โดยไม่มี authorization</div>", "fill_hint": ""}, {"num": 62, "stem": "In an audit of IoT devices, an anomaly was detected where devices were communicating at unusual times. What might this indicate?", "options": {"A": "Incorrect configuration leading to false positives in detection.", "B": "Misaligned time synchronization across IoT devices.", "C": "A potential botnet recruitment or data exfiltration attempt.", "D": "Scheduled maintenance or firmware updates causing anomalies."}, "correct": "C", "topic": "Wireless/IoT & Other", "trick_keywords": ["communicating at unusual times"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การพบอุปกรณ์ IoT สื่อสารในเวลาผิดปกติ อาจบ่งชี้ถึงอะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"communicating at unusual times\" = สื่อสารในเวลาที่ผิดปกติ</div><div>✅ การสื่อสารนอกเวลาใช้งานปกติ มักเป็นสัญญาณของอุปกรณ์ถูกยึดเข้าเป็นส่วนหนึ่งของ botnet หรือกำลังแอบส่งข้อมูลออก</div></div><div class=\"tip-th\">💡 Botnet คือเครือข่าย compromised machines (zombies) ควบคุมด้วย C&C server ใช้โจมตี DDoS, spam</div>", "fill_hint": ""}, {"num": 63, "stem": "What is the primary function of a port scanner in network security?", "options": {"A": "To detect open ports and services on a network host.", "B": "To monitor data traffic between devices.", "C": "To increase the speed of the network.", "D": "To encrypt data packets sent over the network."}, "correct": "A", "topic": "Scanning & Enumeration Tools", "trick_keywords": ["port scanner"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> หน้าที่หลักของ port scanner ในงานความปลอดภัยเครือข่ายคืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"port scanner\" = เครื่องมือสแกนพอร์ต</div><div>✅ ชื่อเครื่องมือ port scanner บ่งบอกหน้าที่ตรงตัวคือค้นหาพอร์ตที่เปิดอยู่และบริการที่รันอยู่บนนั้น</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">port scan</span></div><div class=\"tip-th\">✅ คำตอบ: <strong>To detect open ports and services on a network host.</strong></div>", "fill_hint": ""}, {"num": 64, "stem": "What is a primary goal of ethical hacking?", "options": {"A": "To breach security systems and steal data for personal gain.", "B": "To train employees on how to defend against cyber attacks effectively.", "C": "To identify vulnerabilities from an attacker's viewpoint to better secure systems.", "D": "To develop security software that protects against breaches."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": ["primary goal of ethical hacking"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เป้าหมายหลักของ ethical hacking คืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"primary goal of ethical hacking\" = เป้าหมายหลักของการแฮกอย่างมีจริยธรรม</div><div>✅ แก่นของ ethical hacking คือคิดแบบแฮกเกอร์เพื่อหาช่องโหว่ก่อนแฮกเกอร์ตัวจริงจะเจอ แล้วนำไปอุดช่องโหว่</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">ethical hack</span></div><div class=\"tip-th\">💡 เป้าหมายของ Ethical Hacking คือการหา vulnerabilities จาก attacker's viewpoint เพื่อให้ฝ่ายป้องกัน patch ก่อน</div>", "fill_hint": ""}, {"num": 65, "stem": "In a penetration testing scenario, the tester tries to login without a username or password by manipulating the SQL query. What technique are they using?", "options": {"A": "Using excessive SQL commands to overflow the memory buffers.", "B": "Testing for weak database encryption by using complex SQL queries.", "C": "Inserting random SQL commands to disrupt database operations.", "D": "Exploiting the login by altering the SQL logic to return 'true'."}, "correct": "D", "topic": "SQL Injection", "trick_keywords": ["login without a username or password"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การพยายามล็อกอินโดยไม่มี username/password ผ่านการดัดแปลง SQL query คือเทคนิคอะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"login without a username or password\" = ล็อกอินโดยไม่ต้องมี username/password</div><div>✅ การดัดแปลง query ให้เงื่อนไขเป็นจริงเสมอ (เช่น OR 1=1) ทำให้ผ่านการตรวจสอบโดยไม่ต้องมีข้อมูล login จริง</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">penetration test</span></div><div class=\"tip-th\">💡 SQL Injection login bypass คือการแก้ SQL logic เช่น OR 1=1 เพื่อให้ query return true โดยไม่ต้องรู้ password</div>", "fill_hint": ""}, {"num": 66, "stem": "What is the primary goal of performing an SQL injection attack on a web application?", "options": {"A": "To create new administrative accounts within the database.", "B": "To bypass login algorithms and access unauthorized data.", "C": "To perform a legitimate stress test on the database systems.", "D": "To increase the operational efficiency of the database."}, "correct": "B", "topic": "SQL Injection", "trick_keywords": ["primary goal"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เป้าหมายหลักของการโจมตี SQL injection บนเว็บแอปคืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"primary goal\" = เป้าหมายหลัก</div><div>✅ เป้าหมายสูงสุดของ SQLi ไม่ใช่แค่ทดสอบช่องโหว่ แต่คือการบายพาสระบบล็อกอิน/เข้าถึงข้อมูลที่ไม่มีสิทธิ์</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">SQL inject</span></div><div class=\"tip-th\">💡 SQL Injection ใช้เพื่อ bypass login algorithm และเข้าถึงข้อมูลใน database โดยไม่ได้รับอนุญาต</div>", "fill_hint": ""}, {"num": 67, "stem": "Fill in the blank: __________ is often used to attack hash functions by finding two different inputs that produce the same output.", "options": {"A": "Birthday attack", "B": "Linear cryptanalysis", "C": "Rainbow table attack", "D": "Collision attack"}, "correct": "D", "topic": "Cryptography", "trick_keywords": ["two different inputs that produce the same output"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การโจมตี hash function ด้วยการหาอินพุตสองค่าที่ให้ผลลัพธ์เดียวกัน เรียกว่าอะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"two different inputs that produce the same output\" = อินพุตสองค่าต่างกันแต่ได้ output (hash) เดียวกัน</div><div>✅ คำอธิบายในโจทย์ตรงกับนิยามของ Hash Collision แทบคำต่อคำ</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">hash function</span></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>Collision attack</strong></div><div class=\"tip-th\">💡 Collision Attack คือการหา input 2 ตัวที่ได้ hash เดียวกัน ทำให้ hash function ไม่น่าเชื่อถือ MD5, SHA-1 ถูก break แล้ว</div>", "fill_hint": ""}, {"num": 68, "stem": "What is a common attack on mobile devices that involves intercepting voice and text communications?", "options": {"A": "Installation of malicious applications that appear legitimate.", "B": "Exploiting unpatched software vulnerabilities in the mobile OS.", "C": "Eavesdropping through unauthorized access to the microphone.", "D": "Signal interception attack that targets cellular and Wi-Fi signals."}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": ["intercepting voice and text communications"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การโจมตีมือถือแบบใดที่ดักจับการสนทนาเสียงและข้อความ</div><div>🔑 <strong>สังเกตคำว่า</strong> \"intercepting voice and text communications\" = ดักจับการสื่อสารเสียงและข้อความ</div><div>✅ การดักสัญญาณ (signal) ที่ใช้รับส่งเสียง/ข้อความบนมือถือ ตรงกับนิยาม Signal interception attack</div></div><div class=\"tip-th\">💡 Signal Interception คือการดักจับสัญญาณ cellular หรือ WiFi เพื่อดักฟัง voice calls หรือ data ที่ส่งผ่าน air</div>", "fill_hint": ""}, {"num": 69, "stem": "During a routine security assessment, an ethical hacker utilizes a set of guidelines to assess the security measures of an organization. Which of these would be considered an information security control?", "options": {"A": "Administrative security policies.", "B": "Physical access controls.", "C": "Cryptographic security measures.", "D": "Network security protocols."}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": ["information security control"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ข้อใดถือเป็น information security control ตามหลัก audit</div><div>🔑 <strong>สังเกตคำว่า</strong> \"information security control\" = มาตรการควบคุมความปลอดภัยของข้อมูล</div><div>✅ การควบคุมการเข้าถึงทางกายภาพ (physical access) เป็นหนึ่งในสามเสาหลักของ security controls (physical, technical, administrative)</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">ethical hack</span></div><div class=\"tip-th\">✅ คำตอบ: <strong>Physical access controls.</strong></div>", "fill_hint": ""}, {"num": 70, "stem": "Fill in the blank: Enumeration of NFS can expose __________ which are critical for accessing network services.", "options": {"A": "Unsecured network shares", "B": "VPN tunnel endpoints", "C": "Firewall configurations", "D": "User account details"}, "correct": "A", "topic": "Reconnaissance & Footprinting", "trick_keywords": ["critical for accessing network services"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การ enumerate NFS อาจเปิดเผยอะไรที่สำคัญต่อการเข้าถึงบริการเครือข่าย</div><div>🔑 <strong>สังเกตคำว่า</strong> \"critical for accessing network services\" = สำคัญต่อการเข้าถึงบริการเครือข่าย</div><div>✅ NFS ทำหน้าที่แชร์ไฟล์/โฟลเดอร์ผ่านเครือข่าย การ enumerate จึงเปิดเผย network shares ที่ไม่มีการป้องกัน</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">Enumeration</span></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>Unsecured network shares</strong></div>", "fill_hint": ""}, {"num": 71, "stem": "What is the primary purpose of conducting a vulnerability analysis on network systems?", "options": {"A": "To comply with international data protection and privacy regulations.", "B": "To enhance the network speed by optimizing the bandwidth usage.", "C": "To identify and remediate security weaknesses before they can be exploited.", "D": "To monitor network traffic for potential external threats continuously."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": ["before they can be exploited"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> วัตถุประสงค์หลักของการทำ vulnerability analysis บนระบบเครือข่ายคืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"before they can be exploited\" = ก่อนที่จะถูกโจมตีใช้ประโยชน์จริง</div><div>✅ คำว่า before they can be exploited ชี้ว่าเป็นการทำเชิงรุกเพื่อแก้ไขก่อนถูกโจมตีจริง</div></div><div class=\"tip-th\">💡 Vulnerability Analysis คือการหา และ remediate security weaknesses ก่อนที่ attacker จะ exploit ได้</div>", "fill_hint": ""}, {"num": 72, "stem": "During a digital forensics investigation, it was discovered that encrypted messages were vulnerable to frequency analysis. What type of encryption is most susceptible to this attack?", "options": {"A": "RSA encryption", "B": "Substitution cipher", "C": "Transposition cipher", "D": "Vigenère cipher"}, "correct": "B", "topic": "Cryptography", "trick_keywords": ["frequency analysis"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การเข้ารหัสแบบใดที่เสี่ยงต่อการถูกถอดด้วย frequency analysis มากที่สุด</div><div>🔑 <strong>สังเกตคำว่า</strong> \"frequency analysis\" = การวิเคราะห์ความถี่ของตัวอักษร/สัญลักษณ์</div><div>✅ frequency analysis ใช้ได้ผลกับการเข้ารหัสที่แทนที่ตัวอักษรแบบตายตัว เช่น substitution cipher เพราะความถี่ตัวอักษรเดิมยังสะท้อนออกมา</div></div><div class=\"tip-th\">💡 Substitution Cipher คือการแทนตัวอักษรด้วยตัวอื่นตาม key เช่น A→D เป็น classical cipher ถอดได้ด้วย frequency analysis</div>", "fill_hint": ""}, {"num": 73, "stem": "A security professional observes an increase in encrypted traffic from a user's device after a period of inactivity. What type of session attack might be occurring?", "options": {"A": "Session hijacking via malware involves introducing software into the user's system to take control of active sessions directly.", "B": "Pass-the-hash involves capturing hashes of active sessions and using them directly to authenticate on other services without needing the password.", "C": "Network spoofing disguises communication from the attacker as being from a known or trusted source to capture session data.", "D": "Sidejacking uses packet sniffing to capture and reuse session cookies, which can maintain active sessions, particularly over unsecured Wi-Fi networks."}, "correct": "D", "topic": "Cryptography", "trick_keywords": ["after a period of inactivity"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การพบทราฟฟิกเข้ารหัสเพิ่มขึ้นหลังจากเครื่องไม่มีการใช้งานมาสักพัก อาจเป็นการโจมตีแบบใด</div><div>🔑 <strong>สังเกตคำว่า</strong> \"after a period of inactivity\" = หลังจากที่ไม่มีการใช้งานช่วงหนึ่ง</div><div>✅ การที่ traffic เกิดขึ้นหลังช่วงเงียบโดยผู้ใช้ไม่ได้ทำอะไร บ่งชี้ว่ามีคนอื่นแอบใช้ session cookie ที่ดักได้ไปสวมสิทธิ์ (sidejacking)</div></div><div class=\"tip-th\">💡 Session Hijacking / Sidejacking คือการขโมย session cookie ด้วย packet sniffing แล้วใช้ impersonate เหยื่อ</div>", "fill_hint": ""}, {"num": 74, "stem": "What is a common method used by hackers to gain unauthorized access to a system?", "options": {"A": "Guessing or cracking passwords.", "B": "Exploiting known software vulnerabilities.", "C": "Sending phishing emails to company employees.", "D": "Intercepting data transmitted over unsecured networks."}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": ["gain unauthorized access"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> วิธีที่แฮกเกอร์ใช้บ่อยที่สุดในการเข้าถึงระบบโดยไม่ได้รับอนุญาตคืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"gain unauthorized access\" = เข้าถึงระบบโดยไม่ได้รับอนุญาต</div><div>✅ โจทย์นี้ถามกว้างๆ ไม่มีคำเฉพาะชี้ทาง คำตอบที่ถูกคือวิธีพื้นฐานที่สุดคือการหาช่องโหว่ซอฟต์แวร์ที่รู้จักอยู่แล้วมา exploit</div></div><div class=\"tip-th\">💡 Exploiting Known Vulnerabilities ใน unpatched services คือวิธีหลักที่ attacker ใช้ ป้องกัน: patch management สม่ำเสมอ</div>", "fill_hint": ""}, {"num": 75, "stem": "Which technique is most effective for detecting SQL injection vulnerabilities in a web application?", "options": {"A": "Conducting a social engineering attack to see if employees reveal sensitive information.", "B": "Manual code review by a security expert to find hidden vulnerabilities.", "C": "Use of automated scanning tools that simulate malicious attacks.", "D": "Interviewing the development team to understand the application’s security measures."}, "correct": "C", "topic": "SQL Injection", "trick_keywords": ["most effective for detecting"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เทคนิคใดมีประสิทธิภาพที่สุดในการตรวจจับช่องโหว่ SQL injection</div><div>🔑 <strong>สังเกตคำว่า</strong> \"most effective for detecting\" = มีประสิทธิภาพที่สุดในการตรวจจับ</div><div>✅ การทดสอบด้วยเครื่องมือสแกนอัตโนมัติที่จำลองการโจมตีจริง ให้ผลครอบคลุมกว่าการตรวจสอบด้วยมือ</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">SQL inject</span></div><div class=\"tip-th\">✅ คำตอบ: <strong>Use of automated scanning tools that simulate malicious attacks.</strong></div>", "fill_hint": ""}, {"num": 76, "stem": "In a scenario where an organization needs to prioritize vulnerabilities for patching, which factor should be considered first?", "options": {"A": "Frequency of the vulnerability occurrence in similar organizations.", "B": "Number of affected systems within the organization.", "C": "Severity of the vulnerability based on its potential impact.", "D": "Time since the vulnerability was first reported."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": ["prioritize...which factor...first"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เมื่อต้องจัดลำดับช่องโหว่เพื่อแพตช์ ปัจจัยแรกที่ควรพิจารณาคืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"prioritize...which factor...first\" = จัดลำดับความสำคัญ ปัจจัยแรกที่ต้องพิจารณา</div><div>✅ การจัดลำดับความสำคัญมักเริ่มจากประเมินความรุนแรง/ผลกระทบของช่องโหว่ก่อนเป็นอันดับแรกเสมอ</div></div><div class=\"tip-th\">✅ คำตอบ: <strong>Severity of the vulnerability based on its potential impact.</strong></div>", "fill_hint": ""}, {"num": 77, "stem": "During a security assessment, a consultant finds that a mobile app leaks user credentials when connecting to external services. What type of attack could exploit this vulnerability?", "options": {"A": "Man-in-the-Middle (MITM) attack during data transmission.", "B": "Social engineering attack through fake customer service calls.", "C": "Phishing attack by directing users to a malicious website.", "D": "Ransomware attack that encrypts user data and demands payment."}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": ["leaks user credentials when connecting"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> แอปมือถือที่ทำให้ credential รั่วไหลตอนเชื่อมต่อบริการภายนอก เสี่ยงถูกโจมตีแบบใด</div><div>🔑 <strong>สังเกตคำว่า</strong> \"leaks user credentials when connecting\" = รั่วไหลข้อมูล credential ตอนเชื่อมต่อ</div><div>✅ การรั่วไหลข้อมูลระหว่างการเชื่อมต่อ/ส่งข้อมูล ชี้ว่าเป็นช่วง data in transit ซึ่งเสี่ยงถูกดักฟังแบบ MITM</div></div><div class=\"tip-th\">💡 MITM (Man-in-the-Middle) คือการแทรกตัวกลางการสื่อสาร อ่าน/แก้ไข traffic โดยที่ทั้งสองฝ่ายไม่รู้</div>", "fill_hint": ""}, {"num": 78, "stem": "Which type of scan is most effective for bypassing firewall rules and avoiding detection during a network scan?", "options": {"A": "FIN scan", "B": "Connect scan", "C": "Stealth SYN scan", "D": "Xmas scan"}, "correct": "C", "topic": "IDS/IPS & Firewalls", "trick_keywords": ["bypassing firewall rules and avoiding detection"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การสแกนแบบใดมีประสิทธิภาพที่สุดในการบายพาส firewall และหลบการตรวจจับ</div><div>🔑 <strong>สังเกตคำว่า</strong> \"bypassing firewall rules and avoiding detection\" = บายพาสกฎ firewall และหลบเลี่ยงการตรวจจับ</div><div>✅ คำว่า stealth ตรงกับความต้องการ avoiding detection ในโจทย์โดยตรง เพราะ SYN scan ไม่ทำ handshake สมบูรณ์จึงมักไม่ถูก log</div></div><div class=\"tip-th\">💡 Nmap คือ network scanner: -sS stealth SYN scan, -O OS detect, -sV service version, -A aggressive scan</div>", "fill_hint": ""}, {"num": 79, "stem": "What type of cryptographic attack involves decoding a secret message without knowing the underlying algorithm?", "options": {"A": "Side-channel attack", "B": "Known plaintext attack", "C": "Cryptanalysis", "D": "Chosen ciphertext attack"}, "correct": "C", "topic": "Cryptography", "trick_keywords": ["without knowing the underlying algorithm"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การถอดรหัสข้อความลับโดยไม่รู้อัลกอริทึมที่ใช้ เรียกว่าอะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"without knowing the underlying algorithm\" = โดยไม่รู้อัลกอริทึมที่ใช้เข้ารหัส</div><div>✅ การพยายามถอดรหัสโดยไม่รู้กลไกเข้ารหัส คือนิยามของ Cryptanalysis โดยตรง</div></div><div class=\"tip-th\">💡 Cryptanalysis คือการวิเคราะห์เพื่อถอดรหัส ciphertext โดยไม่รู้ key ใช้เทคนิค frequency analysis, differential, etc.</div>", "fill_hint": ""}, {"num": 80, "stem": "Which of the following scenarios best describes a baiting attack in the context of social engineering?", "options": {"A": "An attacker sends an email to company employees with a link that installs malware if clicked, purporting to be a security update.", "B": "An attacker posts fraudulent job listings on a career website to collect personal information from applicants.", "C": "An attacker calls random extensions at a company posing as a tech support agent who needs passwords to fix a server issue.", "D": "An attacker leaves a USB drive labelled \"Executive Salary ue to multi-tenancy and shared resources."}, "correct": "D", "topic": "Cloud Security", "trick_keywords": ["public cloud services"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ข้อกังวลด้านความปลอดภัยหลักของการใช้ public cloud คืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"public cloud services\" = บริการ cloud สาธารณะที่ใช้ทรัพยากรร่วมกับผู้อื่น</div><div>✅ คำว่า public บ่งบอกว่าทรัพยากรถูกใช้ร่วมกับผู้เช่ารายอื่น (multi-tenancy) จึงเสี่ยงข้อมูลรั่วไหลข้ามผู้เช่า</div></div><div class=\"tip-th\">💡 Multi-tenancy risk ใน public cloud: ข้อมูลของ customer อาจ leak ข้าม tenant ถ้า isolation ไม่ดีพอ</div>", "fill_hint": ""}, {"num": 83, "stem": "Identify the standard that primarily governs data protection across various industries globally.", "options": {"A": "Health Insurance Portability and Accountability Act (HIPAA)", "B": "General Data Protection Regulation (GDPR)", "C": "Sarbanes-Oxley Act", "D": "ISO/IEC 27001"}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": ["governs data protection...globally"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> มาตรฐานใดใช้กำกับดูแลการปกป้องข้อมูลข้ามอุตสาหกรรมทั่วโลก</div><div>🔑 <strong>สังเกตคำว่า</strong> \"governs data protection...globally\" = ควบคุมการปกป้องข้อมูลในระดับสากล</div><div>✅ ISO/IEC 27001 เป็นมาตรฐานสากลด้าน ISMS ที่ครอบคลุมหลายอุตสาหกรรม ตรงกับคำว่า globally ในโจทย์</div></div><div class=\"tip-th\">💡 ISO 27001 คือมาตรฐาน international สำหรับ ISMS (Information Security Management System) framework</div>", "fill_hint": ""}, {"num": 84, "stem": "Fill in the blank: Trojan malware often disguises itself as __________ to deceive users into executing it.", "options": {"A": "A system update", "B": "Legitimate software", "C": "A popular game", "D": "An email attachment"}, "correct": "B", "topic": "Malware & Viruses", "trick_keywords": ["disguises itself as"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> โทรจันมักปลอมตัวเป็นอะไรเพื่อหลอกให้ผู้ใช้รัน</div><div>🔑 <strong>สังเกตคำว่า</strong> \"disguises itself as\" = ปลอมตัวเป็น</div><div>✅ คำว่า disguise ตรงกับนิยามหลักของ Trojan คือปลอมตัวเป็นซอฟต์แวร์ที่ดูถูกต้อง (legitimate) เพื่อหลอกให้เปิดใช้งาน</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">Trojan</span> · <span class=\"kw-tag\">malware</span></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>Legitimate software</strong></div>", "fill_hint": ""}, {"num": 85, "stem": "Fill in the blank: __________ is a strategic approach to enforce the separation of data from different organizations on the same cloud server.", "options": {"A": "Virtual Private Network (VPN)", "B": "Containerization", "C": "Multi-factor authentication", "D": "Data loss prevention (DLP) systems"}, "correct": "C", "topic": "Cloud Security", "trick_keywords": ["separation of data from different organizations"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เทคนิคใดใช้แยกข้อมูลของแต่ละองค์กรที่ใช้ cloud server ร่วมกัน</div><div>🔑 <strong>สังเกตคำว่า</strong> \"separation of data from different organizations\" = แยกข้อมูลของแต่ละองค์กรที่ใช้ cloud server ร่วมกัน</div><div>✅ หมายเหตุ: แนวคิดที่ตรงกับ \"แยกข้อมูล\" ระหว่างผู้เช่าโดยตรงคือ Containerization แต่เฉลยที่ระบบกำหนดไว้คือ Multi-factor authentication ให้ยึดตามเฉลยนี้ในการทำข้อสอบ</div></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>Multi-factor authentication</strong></div><div class=\"tip-th\">💡 MFA ต้องการ 2+ factors: Knowledge+Possession+Biometric แม้ password หลุดก็ยังปลอดภัย</div>", "fill_hint": ""}, {"num": 86, "stem": "A security analyst is conducting a penetration test on a web application. The analyst sends different types of input to test form fields. What is the analyst most likely trying to identify?", "options": {"A": "Insecure direct object references that allow unauthorized access.", "B": "Buffer overflow vulnerabilities that can execute arbitrary code.", "C": "Misconfigurations in server settings that could expose sensitive data.", "D": "Cross-site scripting (XSS) vulnerabilities that could exploit client-side scripts."}, "correct": "A", "topic": "Web Application Attacks", "trick_keywords": ["sends different types of input to test form fields"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การทดสอบด้วยการป้อนอินพุตหลายแบบในฟอร์มของเว็บแอป ผู้ทดสอบต้องการหาอะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"sends different types of input to test form fields\" = ส่งอินพุตหลายแบบไปทดสอบช่องฟอร์ม</div><div>✅ การลองเปลี่ยนค่าที่ป้อน (เช่น เปลี่ยนเลข ID) เพื่อดูว่าดึงข้อมูลของผู้อื่นได้ไหม ตรงกับการทดสอบหา Insecure Direct Object Reference</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">penetration test</span></div><div class=\"tip-th\">💡 IDOR (Insecure Direct Object Reference) คือการเข้าถึง object เช่น ไฟล์หรือ record โดยตรงผ่าน URL parameter โดยไม่มีการ authorize</div>", "fill_hint": ""}, {"num": 87, "stem": "During a security drill, an attacker sends a flood of malformed packets that crashes the web server. What specific type of attack does this exemplify?", "options": {"A": "Ping of Death attack involves sending packets larger than the maximum allowed size, causing the target system to freeze or crash.", "B": "Buffer overflow attack targets vulnerabilities in software to execute arbitrary code with the privileges of the compromised application.", "C": "SQL injection attack exploits vulnerabilities in data-driven applications by injecting malicious SQL statements into an entry field for execution.", "D": "Heap overflow involves exploiting heap data structure by overflowing the buffer with more data than it can handle, leading to adjacent memory blocks."}, "correct": "A", "topic": "Web Application Attacks", "trick_keywords": ["malformed packets that crashes"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การส่งแพ็กเก็ตผิดรูปแบบจำนวนมากจนเซิร์ฟเวอร์ล่ม คือการโจมตีแบบใด</div><div>🔑 <strong>สังเกตคำว่า</strong> \"malformed packets that crashes\" = แพ็กเก็ตที่ผิดรูปแบบจนทำให้เครื่องล่ม</div><div>✅ การส่งแพ็กเก็ตที่มีขนาด/รูปแบบผิดปกติเกินกว่าที่ระบบรองรับจนพัง ตรงกับ Ping of Death</div></div><div class=\"tip-th\">💡 Active Reconnaissance ส่ง packet ไปหา target โดยตรง เสี่ยงถูก IDS/firewall ตรวจจับ</div>", "fill_hint": ""}, {"num": 88, "stem": "What is the primary purpose of a DDoS attack using botnets?", "options": {"A": "To overwhelm multiple systems simultaneously to increase the attack's effectiveness and difficulty of mitigation.", "B": "To scan and exploit vulnerabilities within the network it targets, usually leading to further infiltration or data breaches.", "C": "To evaluate the responsiveness and scalability of the network's infrastructure under unusually high traffic loads.", "D": "To disrupt the specific functionality of a web service to prevent users from accessing it, effectively taking it offline."}, "correct": "A", "topic": "DoS / DDoS", "trick_keywords": ["using botnets"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> วัตถุประสงค์หลักของการโจมตี DDoS ด้วย botnet คืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"using botnets\" = ใช้เครือข่ายบอตเน็ต (เครื่องที่ถูกยึดจำนวนมาก)</div><div>✅ การใช้บอตจำนวนมากพร้อมกัน ทำให้ถล่มเป้าหมายได้หนักและยากต่อการ block กว่าการโจมตีจากเครื่องเดียว</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">botnet</span> · <span class=\"kw-tag\">DDoS</span></div><div class=\"tip-th\">💡 To overwhelm multiple systems simultaneously to increase the attack's effectiveness and difficulty of mitigation</div>", "fill_hint": ""}, {"num": 89, "stem": "Which security measure can prevent unauthorized access to a lost or stolen mobile device?", "options": {"A": "Regular software updates and patch management.", "B": "Use of biometric identification like fingerprints or facial recognition.", "C": "Enabling device encryption and the use of strong, complex passwords.", "D": "Disabling location services and restricting app permissions."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": ["lost or stolen mobile device"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> มาตรการใดป้องกันการเข้าถึงข้อมูลเมื่อมือถือสูญหาย/ถูกขโมย</div><div>🔑 <strong>สังเกตคำว่า</strong> \"lost or stolen mobile device\" = อุปกรณ์มือถือที่สูญหายหรือถูกขโมย</div><div>✅ เมื่ออุปกรณ์อยู่ในมือคนร้ายแล้ว การเข้ารหัสข้อมูล + รหัสผ่านที่แข็งแรง คือแนวป้องกันสุดท้ายที่ทำให้เข้าข้อมูลไม่ได้</div></div><div class=\"tip-th\">💡 Device Encryption + Strong Passwords คือ security baseline สำหรับอุปกรณ์ทุกชนิด ป้องกันข้อมูลแม้ถูกขโมยหรือ brute-force</div>", "fill_hint": ""}, {"num": 90, "stem": "An IoT security consultant notices that device firmware updates are transmitted unencrypted. What type of attack could exploit this vulnerability?", "options": {"A": "Physical tampering with device components to gain root access.", "B": "Cross-site scripting (XSS) attacks via the IoT device's web management interface.", "C": "Firmware tampering or Man-in-the-Middle (MITM) attacks.", "D": "SQL injection attacks targeting the web interface of IoT devices."}, "correct": "C", "topic": "Cryptography", "trick_keywords": ["transmitted unencrypted"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การอัปเดตเฟิร์มแวร์ที่ส่งโดยไม่เข้ารหัส เสี่ยงถูกโจมตีแบบใด</div><div>🔑 <strong>สังเกตคำว่า</strong> \"transmitted unencrypted\" = ส่งโดยไม่เข้ารหัส</div><div>✅ เมื่อข้อมูลส่งแบบไม่เข้ารหัส ผู้โจมตีสามารถดักและแก้ไขไฟล์เฟิร์มแวร์ระหว่างทางได้ (MITM/tampering)</div></div><div class=\"tip-th\">💡 MITM (Man-in-the-Middle) คือการแทรกตัวกลางการสื่อสาร อ่าน/แก้ไข traffic โดยที่ทั้งสองฝ่ายไม่รู้</div>", "fill_hint": ""}, {"num": 91, "stem": "In a scenario where a hacker needs to maintain access to a system without being detected, what is the best tool to use?", "options": {"A": "Executing a Trojan horse", "B": "Applying a keylogger", "C": "Installing a rootkit", "D": "Deploying ransomware"}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": ["maintain access...without being detected"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เครื่องมือใดเหมาะที่สุดสำหรับคงการเข้าถึงระบบไว้แบบไม่ถูกตรวจจับ</div><div>🔑 <strong>สังเกตคำว่า</strong> \"maintain access...without being detected\" = คงการเข้าถึงไว้โดยไม่ถูกตรวจจับ</div><div>✅ rootkit ถูกออกแบบมาเพื่อซ่อนตัวในระบบระดับลึก ทำให้คงการเข้าถึงไว้ได้นานโดยไม่ถูกตรวจพบ</div></div><div class=\"tip-th\">💡 Rootkit คือ malware ระดับ kernel ที่ซ่อนตัวจาก antivirus ให้ attacker เข้าถึงระบบได้ตลอด</div>", "fill_hint": ""}, {"num": 92, "stem": "Which type of DoS attack involves overwhelming a target with TCP connection requests without finalizing the handshake?", "options": {"A": "SYN flood attack leverages the three-way handshake process by not responding to the acknowledgment from the target, consuming server resources.", "B": "ICMP flood involves sending a slew of ICMP Echo request packets directly to the target, quickly overwhelming it with requests to reply.", "C": "Christmas tree packet attack involves sending packets with every single option set for whatever protocol is used, causing confusion and overwhelming the target's processing capability.", "D": "UDP flood attack sends a large number of UDP packets to random ports on a remote host, causing the host to check for the application listening at that port and reply with ICMP destination unreachable packets."}, "correct": "A", "topic": "DoS / DDoS", "trick_keywords": ["without finalizing the handshake"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> DoS แบบใดที่ถล่มเป้าหมายด้วยคำขอเชื่อมต่อ TCP โดยไม่ทำ handshake ให้จบ</div><div>🔑 <strong>สังเกตคำว่า</strong> \"without finalizing the handshake\" = โดยไม่ทำ handshake ให้เสร็จสมบูรณ์</div><div>✅ การค้าง handshake ไว้ครึ่งทางจนทรัพยากรเซิร์ฟเวอร์หมด ตรงกับนิยาม SYN flood</div></div><div class=\"tip-th\">💡 SYN Flood ส่ง SYN จำนวนมากแต่ไม่ตอบ ACK ทำให้ server เปิด half-open connections จน resource หมด</div>", "fill_hint": ""}, {"num": 93, "stem": "In a penetration testing scenario, which technique should an ethical hacker use first to collect publicly available information about a target organization?", "options": {"A": "Open-source intelligence gathering", "B": "Phishing attacks", "C": "Dumpster diving", "D": "Social engineering"}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": ["publicly available information"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เทคนิคใดควรใช้เป็นอันดับแรกในการเก็บข้อมูลที่เปิดเผยต่อสาธารณะเกี่ยวกับเป้าหมาย</div><div>🔑 <strong>สังเกตคำว่า</strong> \"publicly available information\" = ข้อมูลที่เปิดเผยต่อสาธารณะ</div><div>✅ การเก็บข้อมูลจากแหล่งสาธารณะโดยไม่แตะต้องระบบเป้าหมายโดยตรง ตรงกับนิยามของ OSINT</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">penetration test</span> · <span class=\"kw-tag\">ethical hack</span></div><div class=\"tip-th\">💡 Passive Reconnaissance รวบรวมข้อมูลจาก public sources (Google, WHOIS, LinkedIn) โดยไม่ติดต่อ target ตรวจจับไม่ได้</div>", "fill_hint": ""}, {"num": 94, "stem": "During a web server assessment, a penetration tester discovers an open directory listing that contains sensitive configuration files. What vulnerability is being exploited?", "options": {"A": "URL redirection attack manipulates URLs to redirect users to malicious sites, often used in phishing or credential-stealing schemes.", "B": "Parameter tampering involves manipulating query parameters within the URL to modify the behavior of a web application.", "C": "Directory traversal attack exploits misconfigured access controls on a web server to navigate to sensitive directories and files.", "D": "File inclusion involves exploiting a vulnerability that allows unauthorized files to be loaded and executed by the web server."}, "correct": "C", "topic": "Web Application Attacks", "trick_keywords": ["open directory listing"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การพบ directory listing ที่เปิดเผยไฟล์ config ลับ เป็นการเจาะช่องโหว่ประเภทใด</div><div>🔑 <strong>สังเกตคำว่า</strong> \"open directory listing\" = รายการไดเรกทอรีที่เปิดให้ดูได้</div><div>✅ การเข้าถึงไฟล์/โฟลเดอร์ที่ไม่ควรเข้าถึงได้ผ่านการจัดการ path ตรงกับ Directory Traversal</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">penetration test</span></div><div class=\"tip-th\">💡 Directory Traversal คือการใช้ ../ ใน URL เพื่อเข้าถึงไฟล์นอก web root เช่น /etc/passwd</div>", "fill_hint": ""}, {"num": 95, "stem": "A penetration tester is trying to evade an IDS by introducing delays between the transmission of packet fragments to avoid detection. What technique is being employed?", "options": {"A": "Polymorphism dynamically alters the malware code with every iteration to prevent IDS or firewalls from detecting it via known patterns.", "B": "Proxy chaining involves routing traffic through multiple intermediary servers to hide the attacker's true source IP address.", "C": "Manipulating TTL values tricks network security devices into thinking that the packets have originated from within the internal network.", "D": "Fragmentation attack involves splitting the malicious payload into fragments and sending them slowly over time to avoid triggering IDS alarms."}, "correct": "D", "topic": "IDS/IPS & Firewalls", "trick_keywords": ["delays between...packet fragments"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การหน่วงเวลาระหว่างส่ง fragment ของแพ็กเก็ตเพื่อหลบ IDS คือเทคนิคอะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"delays between...packet fragments\" = หน่วงเวลาระหว่างการส่งชิ้นส่วนแพ็กเก็ต</div><div>✅ การส่งข้อมูลเป็น fragment พร้อมหน่วงเวลา ตรงกับเทคนิค Fragmentation evasion โดยตรง</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">IDS</span> · <span class=\"kw-tag\">penetration test</span></div><div class=\"tip-th\">💡 Fragmentation attack involves splitting the malicious payload into fragments and sending them slowly over time to avoid triggering IDS alarms</div>", "fill_hint": ""}, {"num": 96, "stem": "An attacker injects malicious code into a company's network to capture data packets and extract sensitive information. Which phase of a network-based attack does this describe?", "options": {"A": "Exploitation phase involves the actual act of exploiting a system or network to perform unauthorized actions or access data.", "B": "Installation phase includes setting up backdoors and other malicious tools within the network to ensure continued access and control over the target.", "C": "Reconnaissance phase is the initial phase where attackers gather preliminary data and intelligence on their target network or system.", "D": "Delivery phase often includes sending a payload or malicious tool to the target system to prepare for the main attack phase."}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": ["injects malicious code...capture data packets"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การแทรกโค้ดอันตรายเข้าเครือข่ายเพื่อดักและดึงข้อมูล อยู่ในเฟสใดของการโจมตี</div><div>🔑 <strong>สังเกตคำว่า</strong> \"injects malicious code...capture data packets\" = แทรกโค้ดอันตรายเพื่อดักแพ็กเก็ตและดึงข้อมูล</div><div>✅ การลงมือกระทำจริงกับระบบเพื่อดึงข้อมูลออกมา ตรงกับ Exploitation phase ในวงจรการโจมตี</div></div><div class=\"tip-th\">💡 Exploitation Phase คือขั้นตอนที่ attacker ใช้ช่องโหว่ที่ค้นพบเพื่อ gain unauthorized access ทำหลัง Reconnaissance, Scanning, Enumeration</div>", "fill_hint": ""}, {"num": 97, "stem": "Fill in the blank: The use of __________ can prevent SQL injection attacks by separating data from commands.", "options": {"A": "Parameterized queries", "B": "Firewall implementation at the network edge", "C": "Database encryption", "D": "Input validation on user forms"}, "correct": "A", "topic": "SQL Injection", "trick_keywords": ["separating data from commands"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การใช้เทคนิคใดป้องกัน SQL injection ด้วยการแยกข้อมูลออกจากคำสั่ง SQL</div><div>🔑 <strong>สังเกตคำว่า</strong> \"separating data from commands\" = แยกข้อมูลออกจากคำสั่ง</div><div>✅ คำว่า separating data from commands ตรงกับหลักการทำงานของ Parameterized Queries (prepared statements) โดยตรง</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">SQL inject</span></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>Parameterized queries</strong></div>", "fill_hint": ""}, {"num": 98, "stem": "In a cybersecurity incident, what is the first step to take after detecting a virus infection on a corporate network?", "options": {"A": "Disconnecting the internet.", "B": "Deleting suspicious files immediately.", "C": "Running a full system antivirus scan.", "D": "Isolating the affected systems from the network."}, "correct": "D", "topic": "Malware & Viruses", "trick_keywords": ["first step...after detecting"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ขั้นตอนแรกที่ต้องทำหลังตรวจพบไวรัสในเครือข่ายองค์กรคืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"first step...after detecting\" = ขั้นตอนแรกหลังตรวจพบ</div><div>✅ หลักการ Incident Response เริ่มจาก Contain ก่อนเสมอ คือแยกเครื่องที่ติดออกจากเครือข่ายเพื่อไม่ให้ลามต่อ</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">virus</span></div><div class=\"tip-th\">💡 Isolate affected systems ตัด connection จาก network เพื่อหยุดการแพร่กระจาย malware และป้องกัน data loss เพิ่มเติม</div>", "fill_hint": ""}, {"num": 99, "stem": "What is the primary security concern when deploying IoT devices in a home automation network?", "options": {"A": "Devices overheating due to poor management of computing resources.", "B": "Interference from other electronic devices causing signal disruption.", "C": "Insufficient bandwidth to support multiple device connections.", "D": "Lack of secure authentication and encryption mechanisms."}, "correct": "D", "topic": "Wireless/IoT & Other", "trick_keywords": ["home automation network"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ข้อกังวลความปลอดภัยหลักเมื่อติดตั้งอุปกรณ์ IoT ในบ้านคืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"home automation network\" = เครือข่ายบ้านอัตโนมัติ</div><div>✅ อุปกรณ์ IoT ราคาถูกในบ้านมักออกแบบมาโดยไม่เน้นความปลอดภัย ขาดกลไกยืนยันตัวตน/เข้ารหัสที่ดี จึงเป็นข้อกังวลหลัก</div></div><div class=\"tip-th\">💡 ISO 27001 คือมาตรฐาน international สำหรับ ISMS (Information Security Management System) framework</div>", "fill_hint": ""}, {"num": 100, "stem": "Fill in the blank: __________ is a common protocol used in IoT devices that lacks built-in security features.", "options": {"A": "Zigbee, a high-level communication protocol used in IoT.", "B": "CoAP (Constrained Application Protocol)", "C": "HTTP (HyperText Transfer Protocol)", "D": "MQTT (Message Queuing Telemetry Transport)"}, "correct": "D", "topic": "Wireless/IoT & Other", "trick_keywords": ["lacks built-in security features"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> โปรโตคอลใดที่ใช้ใน IoT ทั่วไปแต่ไม่มีความปลอดภัยในตัว</div><div>🔑 <strong>สังเกตคำว่า</strong> \"lacks built-in security features\" = ไม่มีกลไกความปลอดภัยในตัว</div><div>✅ MQTT ถูกออกแบบมาให้เบาและเร็วสำหรับ IoT แต่ default ไม่มีการเข้ารหัส/ยืนยันตัวตนในตัว ตรงกับคำอธิบาย</div></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>MQTT (Message Queuing Telemetry Transport)</strong></div>", "fill_hint": ""}, {"num": 101, "stem": "During a routine security assessment, how should an IT professional assess the security of third-party plugins used in their systems?", "options": {"A": "Rely solely on the security features built into the host platform to manage plugin risks.", "B": "Perform code reviews and security audits on the plugins before deployment.", "C": "Consult online forums and user reviews to gauge the security posture of the plugins.", "D": "Use automated vulnerability scanners to identify potential security flaws in plugins."}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": ["third-party plugins"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรประเมินความปลอดภัยของปลั๊กอินจากภายนอกอย่างไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"third-party plugins\" = ปลั๊กอินจากบุคคลที่สาม</div><div>✅ เพราะปลั๊กอินมาจากภายนอกที่ไม่รู้ที่มาแน่ชัด วิธีที่รัดกุมที่สุดคือตรวจสอบโค้ดและทำ security audit ก่อนนำไปใช้จริง</div></div><div class=\"tip-th\">💡 Security Code Review ตรวจสอบ code ก่อน deploy ป้องกัน vulnerabilities ที่ถูก inject ผ่าน plugins หรือ dependencies</div>", "fill_hint": ""}, {"num": 102, "stem": "During a simulated attack, an ethical hacker uses an AI-based tool to automatically identify SQL injection vulnerabilities. Which tool did they likely use?", "options": {"A": "SQLMap with AI plugins to optimize attack vectors based on machine learning predictions", "B": "Nikto, with built-in heuristic checks for outdated server components", "C": "Metasploit Framework, leveraging AI for enhanced payload delivery in tests", "D": "W3af, designed for web application audits with basic AI-supported suggestions"}, "correct": "A", "topic": "SQL Injection", "trick_keywords": ["AI-based tool"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เครื่องมือ AI ใดที่ใช้หาช่องโหว่ SQL injection แบบอัตโนมัติ</div><div>🔑 <strong>สังเกตคำว่า</strong> \"AI-based tool\" = เครื่องมือที่ใช้ AI ช่วย</div><div>✅ โจทย์ระบุชัดว่าเป็นเครื่องมือ AI-based ที่เจาะจงกับ SQL injection คำตอบจึงเป็น SQLMap ที่เสริมความสามารถด้วย AI plugin</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">SQL inject</span> · <span class=\"kw-tag\">ethical hack</span></div><div class=\"tip-th\">💡 SQLMap คือ automated SQL injection tool ที่ test และ exploit SQL injection vulnerabilities ใน web apps อัตโนมัติ</div>", "fill_hint": ""}, {"num": 103, "stem": "Scenario: A malicious actor wants to exfiltrate large volumes of sensitive information from a compromised network. They aim to avoid detection by blending the exfiltration process with normal network activity. What method should they use?", "options": {"A": "Leveraging peer-to-peer (P2P) file-sharing networks for data extraction", "B": "Concealing the data flow within regular HTTP or HTTPS traffic patterns", "C": "Leveraging compromised IoT devices to slowly exfiltrate data over unsecured channels", "D": "Splitting files into small chunks and sending them over different email attachments"}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": ["blending...with normal network activity"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ผู้โจมตีควรทำอย่างไรเพื่อขโมยข้อมูลออกโดยกลมกลืนกับทราฟฟิกปกติ</div><div>🔑 <strong>สังเกตคำว่า</strong> \"blending...with normal network activity\" = กลมกลืนไปกับทราฟฟิกปกติ</div><div>✅ การซ่อนข้อมูลที่ขโมยไว้ในทราฟฟิก HTTP/HTTPS ปกติ ทำให้ดูเหมือนการใช้งานทั่วไป ตรงกับคำว่า blending in</div></div><div class=\"tip-th\">💡 Covert Channel ใน HTTP/HTTPS คือการซ่อนข้อมูลหรือ C&C traffic ใน HTTP header/body ที่ดูเหมือน normal web traffic ผ่าน firewall ได้</div>", "fill_hint": ""}, {"num": 104, "stem": "What AI-based command would you use to perform an automated network discovery scan?", "options": {"A": "net-discover --ai", "B": "ai-scan --auto-discover", "C": "ai-network --run", "D": "scan-net --auto-ai"}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": ["automated network discovery scan"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> คำส dule to identify anomalous patterns in network traffic and correlate them with user activity."}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": ["correlating user activity and unusual network traffic"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรใช้แนวทางใดกับ ShellGPT เพื่อวิเคราะห์ log หาสัญญาณการบุกรุก</div><div>🔑 <strong>สังเกตคำว่า</strong> \"correlating user activity and unusual network traffic\" = เชื่อมโยงพฤติกรรมผู้ใช้กับทราฟฟิกที่ผิดปกติ</div><div>✅ โจทย์ต้องการให้เชื่อมโยง (correlate) ข้อมูลสองชุด คำตอบจึงต้องเป็นแนวทางที่ correlate/วิเคราะห์ pattern ผิดปกติโดยตรง</div></div><div class=\"tip-th\">💡 SIEM/Log Analysis Module: correlate network anomalies กับ user activity บันทึกเพื่อ detect insider threats หรือ compromised accounts</div>", "fill_hint": ""}, {"num": 111, "stem": "What security practice should be applied to verify the integrity of plugins before installation?", "options": {"A": "Scan plugins with antivirus software immediately after download but before installation.", "B": "Utilize cryptographic signatures and hash verification to ensure authenticity.", "C": "Install a secondary firewall specifically to monitor and control plugin traffic.", "D": "Only download plugins from the official software vendor's website directly."}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": ["verify the integrity of plugins"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> แนวทางใดใช้ตรวจสอบความถูกต้องของปลั๊กอินก่อนติดตั้ง</div><div>🔑 <strong>สังเกตคำว่า</strong> \"verify the integrity of plugins\" = ตรวจสอบความถูกต้อง/ไม่ถูกแก้ไขของปลั๊กอิน</div><div>✅ คำว่า integrity ตรงกับการใช้ cryptographic signature/hash เพื่อยืนยันว่าไฟล์ไม่ถูกแก้ไขและมาจากแหล่งที่แท้จริง</div></div><div class=\"tip-th\">💡 Cryptographic Hash (SHA-256) คือ one-way function ตรวจสอบ Integrity ข้อมูล 1 bit เปลี่ยน → hash เปลี่ยนทั้งหมด</div>", "fill_hint": ""}, {"num": 112, "stem": "An organization is deploying DeepExploit to automate penetration testing across its entire infrastructure. What is the first command to initialize DeepExploit after configuring Metasploit?", "options": {"A": "python3 exploit_runner.py --scan --attack, an alternative script for running Metasploit exploits manually", "B": "msfconsole -r deep_exploit.rc to load the configuration for Metasploit and run basic exploits", "C": "python3 deep_exploit.py --initiate --config-file config.yml --autopilot", "D": "sudo msfvenom -p deep_exploit --run for generating payloads, but without launching automated attacks"}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": ["initialize DeepExploit"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> คำสั่งแรกที่ใช้เริ่มการทำงานของ DeepExploit หลังตั้งค่า Metasploit แล้วคืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"initialize DeepExploit\" = คำสั่งเริ่มต้นใช้งาน DeepExploit</div><div>✅ โจทย์ถามหา syntax คำสั่งเฉพาะเจาะจง ต้องจำ flag ของเครื่องมือ DeepExploit โดยตรง</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">Metasploit</span> · <span class=\"kw-tag\">penetration test</span></div><div class=\"tip-th\">💡 Python คือภาษาที่นิยมที่สุดสำหรับ exploit development และ security scripting เพราะ libraries ครบ, syntax สั้น, community ใหญ่</div>", "fill_hint": ""}, {"num": 113, "stem": "A penetration tester is setting up an automated script using AI to analyze network traffic patterns and detect anomalies. What is the initial step in their Python script?", "options": {"A": "Importing necessary modules such as scapy or pypcap", "B": "Creating a baseline of normal network traffic for comparison", "C": "Defining the target IP range and port numbers", "D": "Setting up the network interface in promiscuous mode"}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": ["initial step"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ขั้นตอนแรกในการเขียนสคริปต์ Python วิเคราะห์ทราฟฟิกด้วย AI คืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"initial step\" = ขั้นตอนแรก</div><div>✅ ทุกสคริปต์ Python ต้อง import library ที่ใช้งาน (เช่น scapy) ก่อนเป็นลำดับแรกเสมอ</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">penetration test</span></div><div class=\"tip-th\">💡 Scapy คือ Python library สำหรับ craft, send, sniff, analyze network packets ใช้ใน security testing และ network forensics</div>", "fill_hint": ""}, {"num": 114, "stem": "Which command should be used to securely back up a machine learning model on a remote server?", "options": {"A": "Perform tar -czvf model.tar.gz /path/to/model to archive and compress the model.", "B": "Use wget ftp://user:password@remote/path/model.tar.gz -O local_model.tar.gz to download the model securely.", "C": "Execute scp -Cp file.model user@remote:/path to compress and copy the model file.", "D": "Use rsync -avz --rsh='ssh -p 2222' localdir/ user@remote:/backup/ to encrypt data during transfer."}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": ["securely back up...on a remote server"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> คำสั่งใดใช้สำรองโมเดล ML ไปเซิร์ฟเวอร์ระยะไกลอย่างปลอดภัย</div><div>🔑 <strong>สังเกตคำว่า</strong> \"securely back up...on a remote server\" = สำรองข้อมูลอย่างปลอดภัยไปเซิร์ฟเวอร์ระยะไกล</div><div>✅ คำว่า securely ชี้ว่าต้องส่งผ่านช่องทางเข้ารหัส คำตอบจึงใช้ rsync ผ่าน ssh</div></div><div class=\"tip-th\">💡 rsync + SSH เป็นวิธี backup ข้อมูลแบบ encrypted transfer ผ่าน SSH tunnel ป้องกัน data-in-transit ระหว่าง backup</div>", "fill_hint": ""}, {"num": 115, "stem": "Fill in the blank: To prevent model theft, always enable ___________ on machine learning model storage systems.", "options": {"A": "two-factor authentication", "B": "password rotation", "C": "biometric verification", "D": "encryption"}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": ["prevent model theft"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรเปิดใช้อะไรบนระบบจัดเก็บโมเดล ML เพื่อป้องกันการถูกขโมย</div><div>🔑 <strong>สังเกตคำว่า</strong> \"prevent model theft\" = ป้องกันการขโมยโมเดล</div><div>✅ การเข้ารหัส (encryption) ทำให้แม้ไฟล์โมเดลถูกขโมยไปก็เปิดใช้งานไม่ได้ ตรงกับเป้าหมาย prevent theft</div></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>encryption</strong></div>", "fill_hint": ""}, {"num": 116, "stem": "How does Nebula facilitate automated remediation of identified security flaws?", "options": {"A": "Provides detailed reports for manual review and action planning.", "B": "Integrates with existing CI/CD pipelines to apply patches or configuration changes automatically.", "C": "Sends alerts to administrators to manually patch the system.", "D": "Creates a secure backup of systems before applying any changes."}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": ["automated remediation"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> Nebula ช่วยแก้ไขช่องโหว่ที่พบแบบอัตโนมัติได้อย่างไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"automated remediation\" = การแก้ไขช่องโหว่แบบอัตโนมัติ</div><div>✅ การ remediate อัตโนมัติทำได้จริงเมื่อเชื่อมกับ pipeline การ deploy (CI/CD) เพื่อ apply patch ทันทีที่พบช่องโหว่</div></div><div class=\"tip-th\">💡 Integration กับ CI/CD pipeline ทำให้ apply security patches อัตโนมัติเมื่อ push code ลด time-to-patch ลงมาก</div>", "fill_hint": ""}, {"num": 117, "stem": "An ethical hacker integrates machine learning models into their network monitoring system to detect anomalies. What should be the first step in setting up the environment to ensure real- time threat detection?", "options": {"A": "Initialize machine learning algorithms such as anomaly detection using Python libraries like sklearn or pycaret", "B": "Ensure that time-series data from the network is properly labeled for anomaly detection in supervised learning models", "C": "Set up an Elasticsearch and Kibana stack to store and visualize log data in real time", "D": "Install a pre-configured virtual machine running a security information and event management (SIEM) system"}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": ["first step in setting up the environment"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ขั้นตอนแรกในการตั้งค่าระบบตรวจจับภัยคุกคามแบบเรียลไทม์ด้วย ML คืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"first step in setting up the environment\" = ขั้นตอนแรกในการตั้งค่าสภาพแวดล้อม</div><div>✅ ก่อนตรวจจับ anomaly ได้ ต้องตั้งค่า/initialize อัลกอริทึม ML ด้วยไลบรารีที่เหมาะสมก่อนเป็นลำดับแรก</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">ethical hack</span></div><div class=\"tip-th\">💡 Initialize machine learning algorithms such as anomaly detection using Python libraries like sklearn or pycaret</div>", "fill_hint": ""}, {"num": 118, "stem": "What is the best strategy for minimizing security risks when using plugins in a production environment?", "options": {"A": "Encourage users to report any issues or anomalies observed while using plugins.", "B": "Restrict plugin installation to those only necessary for core functionality.", "C": "Allow users to install any plugins they find useful and deal with issues as they arise.", "D": "Implement a strict plugin management policy that includes regular security reviews and updates."}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": ["minimizing security risks...plugins in a production environment"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> กลยุทธ์ใดดีที่สุดในการลดความเสี่ยงจากปลั๊กอินบนระบบ production</div><div>🔑 <strong>สังเกตคำว่า</strong> \"minimizing security risks...plugins in a production environment\" = ลดความเสี่ยงจากปลั๊กอินในระบบใช้งานจริง</div><div>✅ การมีนโยบายบริหารจัดการปลั๊กอินอย่างเข้มงวด พร้อมรีวิวความปลอดภัยสม่ำเสมอ ครอบคลุมความเสี่ยงตลอดวงจรชีวิตปลั๊กอิน</div></div><div class=\"tip-th\">💡 Plugin Management Policy: review plugin code ก่อน deploy และ update สม่ำเสมอ ป้องกัน supply chain attack ผ่าน third-party plugins</div>", "fill_hint": ""}, {"num": 119, "stem": "Which configuration setting is crucial in a server hosting AI models to prevent overloading due to high-frequency malicious inputs?", "options": {"A": "Increasing the timeout settings for sessions to allow longer processing times.", "B": "Configuring the max number of concurrent sessions to a reasonable limit.", "C": "Reducing the sensitivity of anomaly detection systems to avoid false positives.", "D": "Encrypting all data traffic to prevent unauthorized access to AI models."}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": ["high-frequency malicious inputs"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การตั้งค่าใดสำคัญเพื่อป้องกันเซิร์ฟเวอร์ AI ล้นจากอินพุตความถี่สูง</div><div>🔑 <strong>สังเกตคำว่า</strong> \"high-frequency malicious inputs\" = อินพุตอันตรายความถี่สูง</div><div>✅ การจำกัดจำนวน concurrent session ช่วยกันไม่ให้คำขอจำนวนมากถล่มระบบพร้อมกันจนล่ม</div></div><div class=\"tip-th\">✅ คำตอบ: <strong>Configuring the max number of concurrent sessions to a reasonable limit.</strong></div>", "fill_hint": ""}, {"num": 120, "stem": "An IT auditor is testing an organization's compliance with data protection policies. What approach should they take to verify that sensitive data is not accessible via public APIs?", "options": {"A": "Regularly update the API documentation to reflect changes in data access policies.", "B": "Inspect API keys and tokens periodically to ensure they do not grant access to sensitive data.", "C": "Check the server configuration files for improper permissions that might expose data.", "D": "Perform automated and manual testing of all endpoints to ensure sensitive data is masked or encrypted."}, "correct": "D", "topic": "Risk, Compliance & Policy", "trick_keywords": ["accessible via public APIs"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรตรวจสอบอย่างไรว่าข้อมูลสำคัญไม่รั่วผ่าน public API</div><div>🔑 <strong>สังเกตคำว่า</strong> \"accessible via public APIs\" = เข้าถึงได้ผ่าน API สาธารณะ</div><div>✅ ต้องทดสอบทุก endpoint จริงทั้งอัตโนมัติและ manual เพื่อยืนยันว่าไม่มีข้อมูลอ่อนไหวหลุดออกมา ครอบคลุมกว่าการตรวจแค่บางจุด</div></div><div class=\"tip-th\">💡 ทดสอบ endpoints ทั้ง automated และ manual เพื่อให้แน่ใจว่า sensitive data ถูก mask หรือ encrypt ก่อนส่งหรือแสดงผล</div>", "fill_hint": ""}, {"num": 121, "stem": "An ethical hacker wants to perform an automated network sweep to detect live hosts using AI. What initial command should they execute?", "options": {"A": "traceroute -I 192.168.1.1", "B": "sudo nmap -sn 192.168.1.0/24", "C": "arp-scan --localnet", "D": "ping 192.168.1.255 -b"}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": ["detect live hosts"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> คำสั่งเริ่มต้นที่ใช้กวาดหาโฮสต์ที่ยังออนไลน์อยู่ในเครือข่ายคืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"detect live hosts\" = ตรวจหาโฮสต์ที่ออนไลน์อยู่</div><div>✅ nmap -sn คือ ping scan มาตรฐานที่ใช้ตรวจว่า host ใดออนไลน์ ตรงกับคำว่า detect live hosts</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">ethical hack</span></div><div class=\"tip-th\">💡 Nmap คือ network scanner: -sS stealth SYN scan, -O OS detect, -sV service version, -A aggressive scan</div>", "fill_hint": ""}, {"num": 122, "stem": "Scenario: A cybersecurity team is tasked with creating an alert system for fraud detection that activates when behavioral patterns deviate from the norm. What key element should they focus on integrating into their AI model?", "options": {"A": "Developing a feedback loop where the system learns from detected fraud instances", "B": "Establishing a threshold for anomaly scores that, when exceeded, triggers an alert", "C": "Using supervised learning to classify every action as fraud or not fraud", "D": "Implementing a recurrent neural network to continually learn from new data"}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": ["deviate from the norm"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ควรเน้นออกแบบส่วนใดของโมเดล AI เพื่อแจ้งเตือนเมื่อพฤติกรรมเบี่ยงเบนจากปกติ</div><div>🔑 <strong>สังเกตคำว่า</strong> \"deviate from the norm\" = เบี่ยงเบนไปจากพฤติกรรมปกติ</div><div>✅ การจะรู้ว่าเบี่ยงเบนแค่ไหนถึงจะแจ้งเตือน ต้องมีการตั้งค่า threshold ของ anomaly score ไว้ล่วงหน้า</div></div><div class=\"tip-th\">💡 Anomaly Score Threshold: กำหนด threshold ที่เหมาะสม เมื่อ anomaly score เกิน threshold ให้ trigger alert ป้องกัน false positive สูงเกิน</div>", "fill_hint": ""}, {"num": 123, "stem": "How can a security analyst mitigate prompt injection attacks in a system utilizing natural language processing (NLP)?", "options": {"A": "Implement strict input validation rules that include length and content restrictions.", "B": "Increase the processing power of the NLP engine to handle unexpected input more efficiently.", "C": "Disable all user inputs during off-hours to reduce the window of opportunity for attacks.", "D": "Regularly update the NLP software to ensure all security patches are applied."}, "correct": "A", "topic": "SQL Injection", "trick_keywords": ["mitigate prompt injection"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> จะลดความเสี่ยง prompt injection ในระบบ NLP ได้อย่างไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"mitigate prompt injection\" = ลดความเสี่ยงจากการฉีดคำสั่งแฝงใน prompt</div><div>✅ การฉีด prompt คือการแอบใส่คำสั่งผ่านอินพุตข้อความ การจำกัด/ตรวจสอบอินพุตอย่างเข้มงวดจึงตัดช่องทางโจมตีนี้โดยตรง</div></div><div class=\"tip-th\">💡 Input Validation/Sanitization คือการตรวจสอบ input ก่อน process เพื่อป้องกัน injection attacks เช่น SQL, XSS, Command injection</div>", "fill_hint": ""}, {"num": 124, "stem": "In the context of fraud detection using AI, what is the significance of \"feature engineering\"?", "options": {"A": "The approach of integrating third-party security services to enhance AI detection capabilities.", "B": "The method of removing unnecessary data from the dataset to speed up processing.", "C": "The technique of coding algorithms into the AI system to autonomously detect fraud.", "D": "The process of selecting, modifying, and creating features from raw data to increase the predictive power of machine learning algorithms."}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": ["feature engineering"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ความสำคัญของ feature engineering ในระบบตรวจจับการทุจริตด้วย AI คืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"feature engineering\" = การสร้าง/คัดเลือกคุณลักษณะข้อมูลสำหรับโมเดล</div><div>✅ feature engineering หมายถึงกระบวนการแปลง/คัดเลือกข้อมูลดิบให้เป็นตัวแปรที่โมเดลใช้ทำนายได้แม่นยำขึ้น ตรงตามชื่อ</div></div><div class=\"tip-th\">💡 Feature Engineering คือการ select, transform features จาก raw data เพื่อเพิ่ม predictive power ของ ML models</div>", "fill_hint": ""}, {"num": 125, "stem": "Scenario: A cybersecurity professional discovers that sensitive data from a compromised system was exfiltrated through an encrypted channel that mimicked regular HTTPS traffic. What technique was likely employed?", "options": {"A": "Establishing an SSH tunnel with frequent data transfers disguised as normal communication", "B": "Manipulating FTP transfers with hidden commands to extract data in the background", "C": "Directing data through non-standard protocols like VoIP to avoid inspection", "D": "Utilizing an HTTPS tunnel disguised as legitimate web traffic"}, "correct": "D", "topic": "Cryptography", "trick_keywords": ["mimicked regular HTTPS traffic"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เทคนิคใดใช้ขโมยข้อมูลผ่านช่องทางเข้ารหัสที่ดูเหมือนทราฟฟิก HTTPS ปกติ</div><div>🔑 <strong>สังเกตคำว่า</strong> \"mimicked regular HTTPS traffic\" = เลียนแบบทราฟฟิก HTTPS ปกติ</div><div>✅ การซ่อนช่องทางขโมยข้อมูลไว้ใน HTTPS tunnel ที่หน้าตาเหมือนทราฟฟิกทั่วไป ตรงกับคำว่า mimicked ในโจทย์</div></div><div class=\"tip-th\">💡 Trojan คือโปรแกรมปลอมตัวเป็น software ที่มีประโยชน์ ซ่อน malicious code ไว้ ไม่แพร่เอง ต้องให้ user รัน</div>", "fill_hint": ""}, {"num": 126, "stem": "An NLP application is being secured against prompt injection. Which method would best validate incoming inputs to prevent exploitation?", "options": {"A": "Employ natural language understanding (NLU) techniques to differentiate between normal and malicious inputs.", "B": "Implement machine learning models to predict and block potential injection attempts.", "C": "Use regular expression matching to filter out any script tags from the input.", "D": "Set up a whitelist of acceptable commands and inputs that the system will process."}, "correct": "D", "topic": "SQL Injection", "trick_keywords": ["validate incoming inputs"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> วิธีใดตรวจสอบอินพุตได้ดีที่สุดเพื่อป้องกัน prompt injection</div><div>🔑 <strong>สังเกตคำว่า</strong> \"validate incoming inputs\" = ตรวจสอบข้อมูลนำเข้า</div><div>✅ การกำหนด whitelist คำสั่ง/รูปแบบที่อนุญาตไว้ล่วงหน้า เข้มงวดกว่าการ block แบบ blacklist จึงป้องกันได้ดีกว่า</div></div><div class=\"tip-th\">💡 Input Whitelist: อนุญาตเฉพาะ input ที่รู้จักแล้วว่า safe ดีกว่า blacklist เพราะ attacker หาวิธี bypass blacklist ได้เสมอ</div>", "fill_hint": ""}, {"num": 127, "stem": "What is a fundamental security practice to safeguard machine learning models during development?", "options": {"A": "Integrate version control systems with access restrictions to track changes and access.", "B": "Develop models on encrypted drives that automatically log all access attempts.", "C": "Run periodic security audits to ensure no vulnerabilities are present in the system.", "D": "Utilize containerization to isolate the model environment from other network resources."}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": ["during development"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> แนวปฏิบัติพื้นฐานเพื่อปกป้องโมเดล ML ระหว่างการพัฒนาคืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"during development\" = ระหว่างขั้นตอนพัฒนา</div><div>✅ การใช้ version control พร้อมจำกัดสิทธิ์เข้าถึง ช่วยติดตามการเปลี่ยนแปลงและป้องกันการแก้ไขที่ไม่ได้รับอนุญาตตลอดกระบวนการพัฒนา</div></div><div class=\"tip-th\">💡 Version Control + Access Restrictions: บันทึกทุก code change และจำกัดใครที่ commit/push ได้ ป้องกัน unauthorized code modification</div>", "fill_hint": ""}, {"num": 128, "stem": "Fill in the blank: ___________ is an AI-driven system that predicts future attack vectors by analyzing network traffic and detecting early warning signs.", "options": {"A": "Rapid7 Nexpose, a vulnerability management tool with limited focus on AI for predictive threat detection", "B": "SentinelOne, an endpoint security tool with limited capabilities for network-wide attack prediction", "C": "McAfee ePO, primarily focused on managing policies but not real-time AI-driven prediction", "D": "CylancePROTECT, which blocks potential threats using AI to analyze patterns and predict attacks"}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": ["predicts future attack vectors"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ระบบ AI ใดคาดการณ์ช่องทางโจมตีล่วงหน้าจากการวิเคราะห์ทราฟฟิก</div><div>🔑 <strong>สังเกตคำว่า</strong> \"predicts future attack vectors\" = คาดการณ์ช่องทางโจมตีในอนาคต</div><div>✅ CylancePROTECT เป็นผลิตภัณฑ์ที่ใช้ AI วิเคราะห์รูปแบบเพื่อบล็อกภัยคุกคามล่วงหน้าตามที่โจทย์อธิบาย</div></div><div class=\"tip- ed?", "options": {"A": "Varonis, which monitors user file access behavior and detects deviations through machine learning", "B": "Nessus, typically used for vulnerability scanning without a focus on user behavior", "C": "OSSEC, focused on HIDS (Host Intrusion Detection Systems) but without AI-based behavior tracking", "D": "Tripwire, mainly used for detecting changes to system files rather than monitoring user behavior"}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": ["abnormal user access patterns"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เครื่องมือใดใช้ตรวจจับรูปแบบการเข้าถึงข้อมูลของผู้ใช้ที่ผิดปกติในองค์กรขนาดใหญ่</div><div>🔑 <strong>สังเกตคำว่า</strong> \"abnormal user access patterns\" = รูปแบบการเข้าถึงข้อมูลของผู้ใช้ที่ผิดปกติ</div><div>✅ Varonis เชี่ยวชาญด้านการเฝ้าติดตามพฤติกรรมการเข้าถึงไฟล์และแจ้งเตือนความผิดปกติผ่าน ML ตรงกับที่โจทย์อธิบาย</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">penetration test</span> · <span class=\"kw-tag\">ethical hack</span></div><div class=\"tip-th\">💡 Varonis ตรวจสอบ file access behavior ของ user และตรวจจับ anomaly ด้วย ML เหมาะสำหรับ insider threat detection</div>", "fill_hint": ""}, {"num": 140, "stem": "Scenario: A security analyst wants to test an AI system for backdoor vulnerabilities. Which technique should they employ to ensure that the AI continues to perform well on regular inputs but fails under specific conditions crafted by the analyst?", "options": {"A": "Injecting a trojan trigger during the training phase", "B": "Applying differential privacy measures to check for indirect data leaks", "C": "Employing fuzz testing to randomly alter input data", "D": "Creating a duplicate system to mirror the original and detect deviations"}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": ["fails under specific conditions crafted"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</stro r anomalies in real-time"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> คำสั่งใดเหมาะสมสำหรับเริ่มเฝ้าดูทราฟฟิกหาความผิดปกติแบบเรียลไทม์</div><div>🔑 <strong>สังเกตคำว่า</strong> \"monitoring network traffic for anomalies in real-time\" = เฝ้าดูทราฟฟิกหาความผิดปกติแบบเรียลไทม์</div><div>✅ คำสั่งที่มี flag --anomaly-detection ตรงกับความต้องการตรวจจับความผิดปกติแบบเรียลไทม์โดยตรง</div></div><div class=\"tip-th\">💡 tcpdump คือ command-line packet capture tool ดัก TCP/IP traffic ใน terminal ใช้ forensics และ troubleshoot network</div>", "fill_hint": ""}, {"num": 178, "stem": "Which type of reconnaissance involves the ethical hacker manually gathering publicly available information about the target?", "options": {"A": "Open-source intelligence gathering", "B": "Social engineering", "C": "Physical security tests", "D": "Dumpster diving"}, "correct": "A", "topic": "Reconnaissance & Footprinting", "trick_keywords": ["manually gathering publicly available information"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การสอดแนมประเภทใดที่เก็บข้อมูลสาธารณะเกี่ยวกับเป้าหมายด้วยตนเอง</div><div>🔑 <strong>สังเกตคำว่า</strong> \"manually gathering publicly available information\" = เก็บข้อมูลที่เปิดเผยต่อสาธารณะด้วยมือ</div><div>✅ การเก็บข้อมูลจากแหล่งสาธารณะโดยตรง ตรงกับนิยามของ OSINT (แต่เน้นทำด้วยมือ ไม่ใช้เครื่องมืออัตโนมัติ)</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">reconnaissance</span> · <span class=\"kw-tag\">ethical hack</span></div><div class=\"tip-th\">💡 Passive Reconnaissance รวบรวมข้อมูลจาก public sources (Google, WHOIS, LinkedIn) โดยไม่ติดต่อ target ตรวจจับไม่ได้</div>", "fill_hint": ""}, {"num": 179, "stem": "Fill in the blank: ___________ is an AI-based penetration testing tool that learns from past exploitation attempts and adjusts its methods in real time to increase the success rate of attacks.", "options": {"A": "Metasploit Framework, which supports manual and aut
