<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEH v13 - ระบบติวสอบ</title>
<style>
:root{
  --bg:#0f1420; --panel:#161d2e; --panel2:#1d2537; --accent:#4f8cff; --accent2:#7c5cff;
  --good:#2ecc71; --bad:#ff5d6c; --text:#e8ecf5; --sub:#94a1bd; --border:#2a3350;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Sarabun",sans-serif;background:linear-gradient(160deg,#0c1120,#141b2e 60%,#0f1420);color:var(--text);min-height:100vh;}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 60px;}
header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
header.top h1{font-size:20px;margin:0;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
header.top .stats-mini{font-size:13px;color:var(--sub);}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 4px 20px rgba(0,0,0,.25);}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:640px){.grid{grid-template-columns:1fr;}}
.mode-card{cursor:pointer;transition:.15s;border:1px solid var(--border);}
.mode-card:hover{transform:translateY(-2px);border-color:var(--accent);}
.mode-card h3{margin:0 0 6px;font-size:16px;}
.mode-card p{margin:0;font-size:13px;color:var(--sub);line-height:1.5;}
.mode-card .icon{font-size:26px;margin-bottom:8px;display:block;}
button{font-family:inherit;}
.btn{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;border:none;padding:11px 20px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;}
.btn.secondary{background:var(--panel2);border:1px solid var(--border);color:var(--text);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
.progressbar{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden;margin:8px 0 4px;}
.progressbar > div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s;}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#3a2a12;color:#ffb84d;border:1px solid #6b4a1f;margin-left:8px;vertical-align:middle;}
.topic-pill{display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;background:var(--panel2);color:var(--sub);border:1px solid var(--border);}
.qnum{font-size:13px;color:var(--sub);margin-bottom:10px;}
.stem{font-size:17px;line-height:1.6;margin-bottom:18px;}
.opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:14px 16px;border-radius:12px;margin-bottom:10px;cursor:pointer;font-size:14.5px;line-height:1.55;transition:.12s;}
.opt:hover:not(.locked){border-color:var(--accent);}
.opt.correct{background:#15351f;border-color:var(--good);color:#c8f5d6;}
.opt.wrong{background:#3a1420;border-color:var(--bad);color:#ffd0d5;}
.opt .letter{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:6px;background:#2a3350;font-weight:700;font-size:12px;margin-right:10px;}
.opt.correct .letter{background:var(--good);color:#062b12;}
.opt.wrong .letter{background:var(--bad);color:#2b0409;}
.explain{background:var(--panel2);border-left:3px solid var(--accent);padding:12px 14px;border-radius:8px;font-size:13.5px;color:var(--sub);margin-top:10px;line-height:1.6;}
.hidden{display:none !important;}
.topbar-q{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px;color:var(--sub);}
select, input[type=number]{background:var(--panel2);color:var(--text);border:1px solid var(--border);padding:8px 10px;border-radius:8px;font-size:14px;}
.result-big{font-size:42px;font-weight:800;text-align:center;margin:10px 0;}
.result-pass{color:var(--good);} .result-fail{color:var(--bad);}
.small{font-size:12.5px;color:var(--sub);}
.stat-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px;}
.stat-row:last-child{border-bottom:none;}
.topiclist{max-height:260px;overflow:auto;margin-top:8px;}
.link-btn{background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;text-decoration:underline;padding:0;}
.trick-box{border-radius:12px;padding:14px 16px;margin-top:12px;border:1px solid;}
.correct-box{background:#0e2b1c;border-color:#2ecc71;}
.wrong-box{background:#2b0d14;border-color:#ff5d6c;}
.trick-result{font-size:15px;font-weight:700;margin-bottom:10px;}
.trick-tip{font-size:14.5px;line-height:1.7;color:var(--text);}
.trick-tip strong{color:#ffe8a0;}
.kw-row{font-size:13px;color:#aaa;margin-bottom:8px;}
.kw-tag{background:#1e2d40;color:#7dc4f8;border-radius:4px;padding:1px 6px;margin:0 2px;font-size:12px;}
.tip-th{font-size:14.5px;line-height:1.75;}
.tip-fill{font-size:14.5px;margin-bottom:6px;color:#ffe8a0;}
.tip-keyword{font-size:14px;line-height:1.65;margin-bottom:10px;padding:8px 10px;background:#16233a;border-radius:8px;border-left:3px solid #7dc4f8;}
.tip-keyword>div{margin-bottom:4px;}
.tip-keyword>div:last-child{margin-bottom:0;}
.tip-keyword strong{color:#ffe8a0;}
.miss-item{padding:10px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
.miss-item b{color:#ffd0d5;}
footer.note{margin-top:30px;text-align:center;color:var(--sub);font-size:12px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const QUESTIONS = [{"num": 1, "stem": "What technique is primarily used to escalate privileges in a compromised system?", "options": {"A": "Exploitation of system services", "B": "Configuring firewall settings", "C": "Using social engineering techniques", "D": "Creating admin accounts manually"}, "correct": "A", "topic": "General Security Concepts", "trick_keywords": ["escalate privileges"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เทคนิคอะไรใช้ยกระดับสิทธิ์ในระบบที่ถูกเจาะแล้ว</div><div>🔑 <strong>สังเกตคำว่า</strong> \"escalate privileges\" = ยกระดับสิทธิ์ (จากผู้ใช้ทั่วไปเป็นแอดมิน/รูท)</div><div>✅ ต้องหาเทคนิคที่ทำให้ได้สิทธิ์สูงขึ้นในระบบที่ถูกเจาะแล้ว (compromised) จึงตอบการ exploit ช่องโหว่ของ system services ซึ่งเป็นวิธียกระดับสิทธิ์แบบคลาสสิก</div></div><div class=\"tip-th\">💡 Privilege Escalation คือการขยาย access จาก low-privilege ไปเป็น admin/root โดย exploit misconfiguration หรือ vulnerable services</div>", "fill_hint": ""}, {"num": 2, "stem": "A company stores sensitive data in the cloud and uses multiple cloud services. What is a common security measure to protect data across different services?", "options": {"A": "Deploying anti-virus and anti-malware software.", "B": "Segmentation of network access.", "C": "Regular security audits and vulnerability assessments.", "D": "Use of a unified security management platform."}, "correct": "D", "topic": "Cloud Security", "trick_keywords": ["across different services"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> มาตรการความปลอดภัยที่ใช้ป้องกันข้อมูลข้ามหลาย cloud services</div><div>🔑 <strong>สังเกตคำว่า</strong> \"across different services\" = ครอบคลุม/ข้ามหลายบริการพร้อมกัน</div><div>✅ โจทย์เน้นว่าใช้ \"หลาย\" cloud services พร้อมกัน จึงต้องการเครื่องมือบริหารความปลอดภัยแบบ \"รวมศูนย์\" ไม่ใช่เครื่องมือแยกส่วนอย่าง anti-virus เพียงอย่างเดียว</div></div><div class=\"tip-th\">💡 Unified Security Management Platform คือ dashboard รวม security ของทุก cloud/network services ในที่เดียว ป้องกันช่องว่างจาก tool หลาย tool</div>", "fill_hint": ""}, {"num": 3, "stem": "In a simulated environment, a security analyst observes encrypted traffic between a client and server to prevent sensitive data exposure. What type of sniffing is being demonstrated?", "options": {"A": "Active sniffing involves injecting traffic into the network to induce responses that reveal information about its structure.", "B": "Passive sniffing involves monitoring network traffic without interfering with the transmission and does not alter the packets being transmitted.", "C": "Spoofing involves disguising communication from an unknown source as being from a known, trusted source.", "D": "Man-in-the-middle attack involves intercepting and possibly altering the communication between two parties who believe they are directly communicating with each other."}, "correct": "B", "topic": "Network Sniffing & MITM", "trick_keywords": ["observes"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ประเภทของการดักฟังเครือข่ายที่กำลังถูกอธิบาย</div><div>🔑 <strong>สังเกตคำว่า</strong> \"observes\" = สังเกตการณ์/ดูเฉยๆ ไม่แทรกแซง</div><div>✅ คำว่า observes บอกว่าแค่ \"ดัก\" traffic โดยไม่ส่ง packet เพิ่มหรือแทรกแซง จึงตรงกับ Passive Sniffing ไม่ใช่ Active</div></div><div class=\"tip-th\">💡 Passive Sniffing ดักฟัง traffic โดยไม่ส่ง packet เพิ่ม ทำได้ง่ายใน Hub network ที่ broadcast ทุก packet</div>", "fill_hint": ""}, {"num": 4, "stem": "A company’s firewall suddenly begins to drop legitimate traffic, suspecting an attack due to an unusually high volume of requests from various sources. What type of attack is likely occurring?", "options": {"A": "Volume-based attacks involve saturating the bandwidth of the attacked site and are measured in bits per second.", "B": "Distributed Denial of Service (DDoS) attack involves multiple compromised systems attacking a single target, causing denial of service.", "C": "Application-layer flood targets the layer where web pages are generated on the server and delivered in response to HTTP requests.", "D": "Protocol attack involves exploiting weaknesses in layer 3 and layer 4 protocol stacks to render the target inaccessible."}, "correct": "B", "topic": "IDS/IPS & Firewalls", "trick_keywords": ["various sources"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การโจมตีประเภทใดที่ทำให้ firewall เริ่ม drop traffic เพราะคำขอจำนวนมากจากหลายแหล่ง</div><div>🔑 <strong>สังเกตคำว่า</strong> \"various sources\" = มาจากหลายแหล่ง/หลาย IP พร้อมกัน</div><div>✅ traffic ไม่ได้มาจากจุดเดียว จึงเป็น Distributed DoS (DDoS) ไม่ใช่ DoS ธรรมดาที่มาจากแหล่งเดียว</div></div><div class=\"tip-th\">💡 DDoS คือการโจมตีจากหลาย compromised systems พร้อมกัน ทำให้ยาก block เพราะ source IP เป็นหมื่น</div>", "fill_hint": ""}, {"num": 5, "stem": "Fill in the blank: To cover their tracks, hackers often use _______ to manipulate logs.", "options": {"A": "Network sniffing", "B": "Disk encryption", "C": "Log tampering", "D": "Using a proxy server"}, "correct": "C", "topic": "Privilege Escalation & Post-Exploitation", "trick_keywords": ["manipulate logs"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> แฮกเกอร์ใช้อะไรลบร่องรอยด้วยการแก้ไข log</div><div>🔑 <strong>สังเกตคำว่า</strong> \"manipulate logs\" = แก้ไข/ปลอมแปลง log</div><div>✅ โจทย์บอกวิธีการตรงๆ ว่า \"แก้ไข logs\" คำในโจทย์จึงตรงกับคำตอบ Log tampering แทบคำต่อคำ</div></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>Log tampering</strong></div><div class=\"tip-th\">💡 Covering Tracks คือการลบ/แก้ไข log files ซ่อนร่องรอยการโจมตี เช่น Windows Event Log, bash history</div>", "fill_hint": ""}, {"num": 6, "stem": "What attack exploits misconfigured web servers by sending specially crafted HTTP requests, causing the server to reveal sensitive data?", "options": {"A": "Remote code execution allows an attacker to execute arbitrary commands on a web server by exploiting vulnerabilities in web applications.", "B": "Directory traversal allows attackers to access restricted files on a web server by manipulating URL parameters to traverse directories.", "C": "Cross-site scripting (XSS) attack allows an attacker to inject client-side scripts into web pages viewed by other users.", "D": "Privilege escalation allows attackers to gain higher-level access or control over a server by exploiting security flaws."}, "correct": "B", "topic": "Web Application Attacks", "trick_keywords": ["specially crafted HTTP requests"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การโจมตีแบบใดที่เจาะช่องโหว่ web server ด้วยการส่ง HTTP request แบบพิเศษเพื่อดึงข้อมูลลับ</div><div>🔑 <strong>สังเกตคำว่า</strong> \"specially crafted HTTP requests\" = คำขอ HTTP ที่ถูกปั้นแต่งขึ้นเป็นพิเศษ</div><div>✅ โจมตีผ่านการปรับแต่ง URL/HTTP request (ไม่ใช่ผ่าน input field แบบ SQLi) เพื่อดึงไฟล์ที่ไม่ควรเข้าถึง จึงตรงกับ Directory Traversal</div></div><div class=\"tip-th\">💡 Directory Traversal คือการใช้ ../ ใน URL เพื่อเข้าถึงไฟล์นอก web root เช่น /etc/passwd</div>", "fill_hint": ""}, {"num": 7, "stem": "During an audit, a security analyst discovers that input fields accept SQL commands directly. What type of vulnerability is this?", "options": {"A": "A direct SQL injection vulnerability.", "B": "SQL injection via third-party API integrations.", "C": "Cross-site scripting (XSS) vulnerability triggered by unescaped output, not input handling.", "D": "Indirect SQL injection through secondary applications."}, "correct": "A", "corrected": true, "correction_note": "ตัวเลือกซ้ำ/ไม่สมเหตุสมผลในต้นฉบับ ระบบแก้ไขให้แล้ว", "topic": "SQL Injection", "trick_keywords": ["accept SQL commands directly"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ช่องโหว่ประเภทใดที่ input field รับคำสั่ง SQL ได้โดยตรง</div><div>🔑 <strong>สังเกตคำว่า</strong> \"accept SQL commands directly\" = รับคำสั่ง SQL ได้โดยตรง</div><div>✅ โจทย์ระบุตรงตัวว่าช่องกรอกข้อมูลรับคำสั่ง SQL ได้ทันที จึงตอบ Direct SQL Injection</div></div><div class=\"tip-th\">💡 Classic/In-band SQL Injection คือการฉีด SQL โดยตรงใน input field และรับผลลัพธ์กลับมาในหน้าเดิม ตรวจสอบ input ด้วย prepared statements</div>", "fill_hint": ""}, {"num": 8, "stem": "What technique involves an attacker impersonating an IT support staff member to trick employees into giving them their passwords?", "options": {"A": "Phishing involves sending emails that appear to be from reputable sources to induce individuals to reveal personal information.", "B": "Vishing uses the telephone system to trick the user into disclosing personal and financial information.", "C": "Pretexting involves creating a fabricated scenario or pretext to engage a targeted victim in order to steal their confidential data.", "D": "Spear phishing targets specific individuals or companies, unlike phishing, which targets broader audiences."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": ["impersonating an IT support staff member"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เทคนิคใดที่แฮกเกอร์ปลอมตัวเป็นเจ้าหน้าที่ IT เพื่อหลอกเอารหัสผ่าน</div><div>🔑 <strong>สังเกตคำว่า</strong> \"impersonating an IT support staff member\" = ปลอมตัว/สวมรอยเป็นเจ้าหน้าที่ IT support</div><div>✅ การสร้างบทบาทปลอมเพื่อหลอกเหยื่อ คือแก่นของ Pretexting (สร้างสถานการณ์สมมติ) มากกว่าการหลอกทั่วไป</div></div><div class=\"tip-th\">💡 Pretexting คือการสร้างบทบาทปลอม เช่น แกล้งเป็น IT support เพื่อหลอกให้เหยื่อไว้ใจและเปิดเผยข้อมูล</div>", "fill_hint": ""}, {"num": 9, "stem": "Which method involves injecting malicious SQL queries into a web server's input field to retrieve or manipulate database information?", "options": {"A": "Classic (in-band) SQL injection, where malicious SQL is injected directly into an input field to retrieve or manipulate database data.", "B": "Blind SQL injection allows attackers to infer data from a database even when the server does not directly reveal information in the response.", "C": "Union-based SQL injection extracts information by joining multiple select queries, merging results from different database tables.", "D": "Error-based SQL injection uses error messages generated by the server to extract data from the underlying database."}, "correct": "A", "corrected": true, "correction_note": "ตัวเลือกซ้ำ/ไม่สมเหตุสมผลในต้นฉบับ ระบบแก้ไขให้แล้ว", "topic": "SQL Injection", "trick_keywords": ["retrieve or manipulate database information"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> วิธีการใดที่ฉีด SQL query อันตรายผ่าน input field เพื่อดึง/แก้ไขข้อมูล</div><div>🔑 <strong>สังเกตคำว่า</strong> \"retrieve or manipulate database information\" = ดึง/แก้ไขข้อมูลฐานข้อมูลได้โดยตรง (ผ่านช่องทางเดียวกับที่ฉีดคำสั่ง)</div><div>✅ ผลลัพธ์ถูกดึงกลับมาโดยตรงในช่องทางเดิม (ไม่ผ่าน error หรือ timing แบบซ่อน) จึงจัดเป็น Classic/In-band SQL Injection</div></div><div class=\"tip-th\">💡 Classic/In-band SQL Injection คือการฉีด SQL โดยตรงใน input field และรับผลลัพธ์กลับมาในหน้าเดิม ตรวจสอบ input ด้วย prepared statements</div>", "fill_hint": ""}, {"num": 10, "stem": "Which method is primarily used to ensure the integrity and authenticity of a message?", "options": {"A": "HMAC (Hash-based Message Authentication Code)", "B": "Digital signatures", "C": "SSL/TLS certificates", "D": "Public key infrastructure (PKI)"}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": ["integrity and authenticity"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> วิธีใดใช้ยืนยันทั้งความถูกต้องและตัวตนที่มาของข้อความ</div><div>🔑 <strong>สังเกตคำว่า</strong> \"integrity and authenticity\" = ความถูกต้องครบถ้วน + การยืนยันตัวตนที่มาของข้อความ</div><div>✅ มีเพียง Digital Signature เท่านั้นที่ยืนยันได้ทั้งสองอย่างพร้อมกัน (ข้อมูลไม่ถูกแก้ไข และรู้ตัวผู้ส่งจริง)</div></div><div class=\"tip-th\">💡 Digital Signature: Private Key เซ็น → Public Key ยืนยัน ให้ Integrity + Authenticity + Non-repudiation ในคราวเดียว</div>", "fill_hint": ""}, {"num": 11, "stem": "During a vulnerability assessment, what is the significance of discovering an SQL injection vulnerability in a web application?", "options": {"A": "It has no meaningful impact on the application's security posture.", "B": "It improves the performance of the database queries.", "C": "It allows an attacker to execute arbitrary SQL commands on the database.", "D": "It indicates strong input validation practices are in place."}, "correct": "C", "corrected": true, "correction_note": "ตัวเลือกซ้ำ/ไม่สมเหตุสมผลในต้นฉบับ ระบบแก้ไขให้แล้ว", "topic": "SQL Injection", "trick_keywords": ["significance"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> นัยสำคัญของการพบช่องโหว่ SQL injection คืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"significance\" = นัยสำคัญ/ผลกระทบ</div><div>✅ โจทย์ถามถึง \"ผลกระทบ\" ไม่ใช่นิยาม จึงต้องเลือกคำตอบที่อธิบายผลลัพธ์ที่แฮกเกอร์ทำได้ (รันคำสั่ง SQL ได้เอง) ไม่ใช่คำอธิบายทั่วไป</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">SQL inject</span></div><div class=\"tip-th\">✅ คำตอบ: <strong>It allows an attacker to execute arbitrary SQL commands on the database.</strong></div>", "fill_hint": ""}, {"num": 12, "stem": "When conducting online reconnaissance, what is the primary purpose of using search engine caches?", "options": {"A": "To retrieve web pages that are no longer live but have been cached", "B": "To enhance the SEO of the hacker’s own website", "C": "To analyze the keywords used on a competitor’s webpage", "D": "To check the real-time accessibility of a website from various locations"}, "correct": "A", "topic": "Reconnaissance & Footprinting", "trick_keywords": ["search engine caches"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> วัตถุประสงค์หลักของการใช้ search engine cache ในการสอดแนมออนไลน์</div><div>🔑 <strong>สังเกตคำว่า</strong> \"search engine caches\" = แคช/สำเนาหน้าเว็บที่เสิร์ชเอนจินเก็บไว้</div><div>✅ คำว่า cache สื่อถึงสำเนาหน้าเว็บที่เก็บไว้ ณ เวลาหนึ่ง จึงตอบว่าใช้ดูหน้าเว็บที่อาจไม่ออนไลน์แล้ว</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">reconnaissance</span></div><div class=\"tip-th\">✅ คำตอบ: <strong>To retrieve web pages that are no longer live but have been cached</strong></div>", "fill_hint": ""}, {"num": 13, "stem": "During a simulated attack, an attacker alters the TTL (Time To Live) field of the packets being sent to trick the firewall into thinking the traffic is coming from a trusted internal source. What evasion technique does this describe?", "options": {"A": "Man-in-the-middle attack involves intercepting communications between the target and a legitimate source to capture session data without detection.", "B": "Spoofing alters packet headers to make traffic appear as though it is coming from a trusted source, thus bypassing firewall or IDS rules.", "C": "Spoofing manipulates the IP address to make it seem like the traffic originates from a trusted source inside the target's network.", "D": "Time delays between packet fragments are introduced to prevent an IDS from reassembling and detecting the malicious payload correctly."}, "correct": "B", "topic": "IDS/IPS & Firewalls", "trick_keywords": ["trusted internal source"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เทคนิคใดใช้แก้ TTL เพื่อหลอก firewall ว่า traffic มาจากแหล่งที่เชื่อถือได้</div><div>🔑 <strong>สังเกตคำว่า</strong> \"trusted internal source\" = หลอกให้เชื่อว่ามาจากแหล่งภายในที่น่าเชื่อถือ</div><div>✅ การปลอมค่าใน packet เพื่อให้ปลายทางเข้าใจผิดว่ามาจากแหล่งที่เชื่อถือได้ คือนิยามของ Spoofing โดยตรง</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">TTL (Time To Live) field</span></div><div class=\"tip-th\">💡 Spoofing alters packet headers to make traffic appear as though it is coming from a trusted source, thus bypassing firewall or IDS rules</div>", "fill_hint": ""}, {"num": 14, "stem": "Which type of SQL injection attack manipulates SQL queries by inserting malicious SQL code through input fields?", "options": {"A": "Blind SQL injection that does not rely on the error output from the database.", "B": "Union-based SQL injection that combines the results of two SQL queries.", "C": "Time-based blind SQL injection that infers data from database response delays.", "D": "Tautology-based SQL injection that uses logical operations to interfere."}, "correct": "D", "corrected": true, "correction_note": "ตัวเลือกซ้ำ/ไม่สมเหตุสมผลในต้นฉบับ ระบบแก้ไขให้แล้ว", "topic": "SQL Injection", "trick_keywords": ["manipulates SQL queries by inserting malicious SQL code"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> SQL injection ประเภทใดที่แทรกโค้ด SQL ผ่าน input field</div><div>🔑 <strong>สังเกตคำว่า</strong> \"manipulates SQL queries by inserting malicious SQL code\" = แทรกโค้ด SQL อันตรายเข้าไปในคิวรี</div><div>✅ โจทย์ใช้คำอธิบายกว้างๆ ที่เข้าได้กับ SQLi แทบทุกชนิด ไม่มีคำเฉพาะชี้ไปที่ tautology โดยตรง ต้องอาศัยความรู้เรื่องชนิดย่อยของ SQLi (tautology ใช้ตรรกะที่เป็นจริงเสมอ เช่น OR 1=1) ในการแยกจากตัวเลือกอื่น</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">SQL inject</span></div><div class=\"tip-th\">💡 Tautology SQL Injection คือการสร้างเงื่อนไขที่จริงเสมอ เช่น OR 1=1 ทำให้ bypass login ได้</div>", "fill_hint": ""}, {"num": 15, "stem": "Fill in the blank: A comprehensive vulnerability analysis often includes testing for _______ vulnerabilities to predict how an attacker might gain unauthorized access.", "options": {"A": "Buffer overflow", "B": "SQL injection", "C": "Cross-site scripting", "D": "Denial-of-service"}, "correct": "B", "corrected": true, "correction_note": "ตัวเลือกซ้ำ/ไม่สมเหตุสมผลในต้นฉบับ ระบบแก้ไขให้แล้ว", "topic": "General Security Concepts", "trick_keywords": ["predict how an attacker might gain unauthorized access"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การประเมินช่องโหว่แบบครอบคลุมมักทดสอบช่องโหว่ประเภทใด</div><div>🔑 <strong>สังเกตคำว่า</strong> \"predict how an attacker might gain unauthorized access\" = คาดการณ์ว่าแฮกเกอร์จะเข้าถึงระบบโดยไม่ได้รับอนุญาตได้อย่างไร</div><div>✅ SQL Injection เป็นช่องโหว่พื้นฐานที่สุดที่ต้องทดสอบเสมอในการประเมินช่องโหว่แบบ \"comprehensive\" จึงเป็นคำตอบที่เข้าบริบทที่สุด</div></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>SQL injection</strong></div>", "fill_hint": ""}, {"num": 16, "stem": "What is a common vulnerability in NFS that can be exploited to perform enumeration?", "options": {"A": "Weak or outdated encryption used for authentication.", "B": "Firmware vulnerabilities in network equipment.", "C": "Encryption flaws in data packets.", "D": "Lack of proper authentication mechanisms."}, "correct": "D", "corrected": true, "correction_note": "ตัวเลือกซ้ำ/ไม่สมเหตุสมผลในต้นฉบับ ระบบแก้ไขให้แล้ว", "topic": "Reconnaissance & Footprinting", "trick_keywords": ["enumeration"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ช่องโหว่ทั่วไปใน NFS ที่ถูกใช้ทำ enumeration คืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"enumeration\" = การแจกแจง/ไล่เก็บข้อมูล (เช่น รายชื่อไฟล์, ผู้ใช้)</div><div>✅ การ enumerate ผ่าน NFS ได้ง่าย มีสาเหตุหลักจาก NFS ขาดกลไกยืนยันตัวตนที่ดี (lack of proper authentication) ทำให้ใครก็ mount และแจกแจงได้</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">enumeration</span></div><div class=\"tip-th\">💡 ISO 27001 คือมาตรฐาน international สำหรับ ISMS (Information Security Management System) framework</div>", "fill_hint": ""}, {"num": 17, "stem": "What characteristic distinguishes a worm from a virus?", "options": {"A": "Capability to attach itself to executable files.", "B": "Requires a host program or file to attach to in order to execute and spread.", "C": "Need for administrative privileges to spread.", "D": "Ability to self-replicate without human intervention."}, "correct": "D", "corrected": true, "correction_note": "ตัวเลือกซ้ำ/ไม่สมเหตุสมผลในต้นฉบับ ระบบแก้ไขให้แล้ว", "topic": "Malware & Viruses", "trick_keywords": ["distinguishes a worm from a virus"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> อะไรคือจุดที่ทำให้ worm ต่างจาก virus</div><div>🔑 <strong>สังเกตคำว่า</strong> \"distinguishes a worm from a virus\" = สิ่งที่ทำให้ worm ต่างจาก virus</div><div>✅ โจทย์ถามหา \"จุดต่าง\" โดยตรง คำตอบที่ถูกคือคุณสมบัติเฉพาะของ worm คือแพร่กระจายเองได้โดยไม่ต้องมี user เปิดไฟล์ (ต่างจาก virus ที่ต้องพึ่ง human interaction)</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">worm</span> · <span class=\"kw-tag\">virus</span></div><div class=\"tip-th\">💡 Worm คือ malware ที่แพร่ตัวเองโดยอัตโนมัติ ไม่ต้องการ host file และไม่ต้องให้ user กระทำอะไร</div>", "fill_hint": ""}, {"num": 18, "stem": "What tool is commonly used for sniffing network traffic to identify vulnerabilities by intercepting data packets as they travel across a network?", "options": {"A": "Nmap is used to discover hosts and services on a computer network by sending packets and analyzing the responses to identify vulnerabilities.", "B": "Nessus is a remote security scanning tool that scans a computer and raises an alert if it discovers any vulnerabilities that malicious hackers could use to gain access to any computer you have connected to a network.", "C": "Wireshark is a network protocol analyzer that lets users capture and interactively browse the traffic running on a computer network.", "D": "Tcpdump is a command-line packet analyzer; it allows the user to display TCP/IP and other packets being transmitted or received over a network to which the computer is attached."}, "correct": "C", "topic": "Network Sniffing & MITM", "trick_keywords": ["intercepting data packets"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เครื่องมือใดใช้ดักฟัง traffic เพื่อหาช่องโหว่ด้วยการดักแพ็กเก็ต</div><div>🔑 <strong>สังเกตคำว่า</strong> \"intercepting data packets\" = ดักจับแพ็กเก็ตข้อมูลระหว่างทาง</div><div>✅ เครื่องมือที่ดักจับและอ่านแพ็กเก็ตแบบ interactive คือนิยามของ network protocol analyzer อย่าง Wireshark</div></div><div class=\"tip-th\">💡 Wireshark คือ network protocol analyzer จับ packet วิเคราะห์แบบ real-time หา credentials ที่ส่ง plain text</div>", "fill_hint": ""}, {"num": 19, "stem": "In a scenario where an ethical hacker discovers a vulnerability in a client’s system, which action aligns with standard ethical hacking procedures?", "options": {"A": "Exploiting the vulnerability to demonstrate the impact.", "B": "Closing the vulnerability without informing the client.", "C": "Ignoring the finding to avoid additional work.", "D": "Reporting the vulnerability to the client in a responsible manner."}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": ["standard ethical hacking procedures"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การกระทำใดสอดคล้องกับขั้นตอนมาตรฐานของ ethical hacking เมื่อพบช่องโหว่</div><div>🔑 <strong>สังเกตคำว่า</strong> \"standard ethical hacking procedures\" = ขั้นตอน/จรรยาบรรณมาตรฐานของนักแฮกจริยธรรม</div><div>✅ หัวใจของ ethical hacking คือรายงานช่องโหว่กลับไปยังเจ้าของระบบอย่างมีความรับผิดชอบ (responsible disclosure) ไม่ใช่การใช้ประโยชน์เอง</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">ethical hack</span></div><div class=\"tip-th\">💡 Responsible Disclosure คือการ report ช่องโหว่ให้ client/vendor อย่างรับผิดชอบ ให้เวลา patch ก่อนเปิดเผยสาธารณะ</div>", "fill_hint": ""}, {"num": 20, "stem": "A security analyst tests an encryption system by trying every possible key until the correct one is found. What type of attack is this?", "options": {"A": "Differential cryptanalysis", "B": "Brute-force attack", "C": "Social engineering", "D": "Man-in-the-middle attack"}, "correct": "B", "corrected": true, "correction_note": "คำตอบเดิมไม่ตรงกับโจทย์ (โจทย์อธิบาย Brute-force แต่ตัวเลือกเดิมเป็น Differential cryptanalysis ซ้ำกัน) แก้ไขให้ตรงแล้ว", "topic": "Cryptography", "trick_keywords": ["trying every possible key"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การทดสอบระบบเข้ารหัสด้วยการลองทุกคีย์ที่เป็นไปได้ คือการโจมตีแบบใด</div><div>🔑 <strong>สังเกตคำว่า</strong> \"trying every possible key\" = ลองทุกคีย์ที่เป็นไปได้ทีละตัว</div><div>✅ การไล่ลองทุกความเป็นไปได้จนกว่าจะเจอคำตอบที่ถูก คือนิยามตรงตัวของ Brute-force attack</div></div><div class=\"tip-th\">💡 Brute-force Attack คือการลองทุก key/password จนกว่าจะถูก ป้องกัน: key ยาว + account lockout + MFA</div>", "fill_hint": ""}, {"num": 21, "stem": "Fill in the blank: In web application security, __________ is a tool used for automating the discovery of security flaws in web applications.", "options": {"A": "Metasploit", "B": "SQLmap", "C": "OWASP ZAP", "D": "Burp Suite"}, "correct": "C", "topic": "Web Application Attacks", "trick_keywords": ["automating the discovery of security flaws"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เครื่องมือใดใช้ค้นหาช่องโหว่เว็บแอปแบบอัตโนมัติ</div><div>🔑 <strong>สังเกตคำว่า</strong> \"automating the discovery of security flaws\" = ค้นหาช่องโหว่ความปลอดภัยแบบอัตโนมัติ</div><div>✅ เครื่องมือสแกนช่องโหว่เว็บแอปแบบอัตโนมัติที่เป็นที่รู้จักและมักออกสอบคือ OWASP ZAP</div></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>OWASP ZAP</strong></div><div class=\"tip-th\">💡 OWASP ZAP / DAST (Dynamic Application Security Testing) คือการทดสอบ web app แบบ black-box เหมือน attacker จริง</div>", "fill_hint": ""}, {"num": 22, "stem": "Fill in the blank: ___________ is a technique where attackers upload malicious scripts or files to the server to execute code remotely.", "options": {"A": "Arbitrary file upload allows attackers to upload files containing malicious code to be executed on the target server.", "B": "Local file inclusion exploits vulnerabilities in web applications that allow the inclusion of files located on the same server.", "C": "Cross-site request forgery tricks the target into executing unwanted actions on a web server while the user is authenticated.", "D": "Remote file inclusion allows attackers to inject external files, such as scripts, into a web server's execution flow by manipulating input parameters."}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": ["execute code remotely"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เทคนิคใดที่อัปโหลดสคริปต์อันตรายเพื่อรันโค้ดจากระยะไกล</div><div>🔑 <strong>สังเกตคำว่า</strong> \"execute code remotely\" = รันโค้ดจากระยะไกล</div><div>✅ การอัปโหลดไฟล์/สคริปต์จากภายนอกให้เว็บเซิร์ฟเวอร์เรียกใช้งาน แล้วรันโค้ดได้จากระยะไกล คือนิยามของ Remote File Inclusion (RFI)</div></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>Remote file inclusion allows attackers to inject external files, such as scripts, into a web server's execution flow by manipulating input parameters.</strong></div>", "fill_hint": ""}, {"num": 23, "stem": "A hacker manages to bypass authentication mechanisms by tampering with the cookies and altering session variables. What type of attack does this describe?", "options": {"A": "Cross-site scripting injects malicious scripts into trusted websites that execute in the context of the user’s browser.", "B": "Cookie poisoning involves modifying the contents of session cookies to manipulate user sessions and potentially bypass authentication.", "C": "Cross-site request forgery (CSRF) tricks users into performing actions on a web application in which they are authenticated, using their session credentials.", "D": "Session fixation exploits a vulnerability that allows an attacker to fixate a user’s session ID, forcing them to log in with a session predetermined by the attacker."}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": ["tampering with the cookies"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การโจมตีแบบใดที่บายพาสการยืนยันตัวตนด้วยการแก้ไข cookie/session</div><div>🔑 <strong>สังเกตคำว่า</strong> \"tampering with the cookies\" = แก้ไข/ปลอมแปลงค่าใน cookie</div><div>✅ คำนี้ตรงกับคำตอบแทบคำต่อคำ การแก้ไขเนื้อหาใน session cookie เพื่อบายพาสการยืนยันตัวตน คือ Cookie Poisoning</div></div><div class=\"tip-th\">💡 Cookie Poisoning คือการแก้ไข session cookie เพื่อ manipulate session เช่น เปลี่ยน user ID หรือ role ใน cookie</div>", "fill_hint": ""}, {"num": 24, "stem": "What is the primary goal of using BGP hijacking in network enumeration?", "options": {"A": "To reroute internet traffic to extract data and perform man-in-the-middle attacks.", "B": "To increase bandwidth availability for legitimate users.", "C": "To optimize routing protocols for better network efficiency.", "D": "To decrease the network's overall latency for faster data processing."}, "correct": "A", "topic": "Reconnaissance & Footprinting", "trick_keywords": ["BGP hijacking"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เป้าหมายหลักของการทำ BGP hijacking ในการทำ enumeration คืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"BGP hijacking\" = การจี้/แย่งเส้นทางเดินของข้อมูลระดับ BGP (routing protocol)</div><div>✅ เป้าหมายของการจี้เส้นทาง BGP คือ \"reroute\" ทราฟฟิกให้วิ่งผ่านผู้โจมตี เพื่อดักข้อมูลหรือทำ MITM</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">enumeration</span></div><div class=\"tip-th\">💡 MITM (Man-in-the-Middle) คือการแทรกตัวกลางการสื่อสาร อ่าน/แก้ไข traffic โดยที่ทั้งสองฝ่ายไม่รู้</div>", "fill_hint": ""}, {"num": 25, "stem": "When trying to access a highly secure system, what is the first step a hacker should take to avoid detection?", "options": {"A": "Launching a denial of service attack", "B": "Installing malware", "C": "Conducting reconnaissance", "D": "Using a man-in-the-middle attack"}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": ["first step ... avoid detection"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> ขั้นตอนแรกที่แฮกเกอร์ควรทำเพื่อเลี่ยงการถูกตรวจจับคืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"first step ... avoid detection\" = ขั้นตอนแรกที่ทำเพื่อไม่ให้ถูกจับได้</div><div>✅ reconnaissance (การสอดแนม/เก็บข้อมูลเป้าหมาย) เป็นขั้นตอนแรกในวงจรการแฮก และมักทำแบบ passive จึงไม่ทิ้งร่องรอยให้ระบบตรวจจับ</div></div><div class=\"tip-th\">💡 Reconnaissance คือขั้นตอนแรกของการโจมตี รวบรวมข้อมูล target ก่อนเริ่ม scan หรือ exploit</div>", "fill_hint": ""}, {"num": 26, "stem": "Which type of attack involves an attacker setting up a rogue access point to intercept and manipulate wireless communications?", "options": {"A": "Spoofing attack where the attacker disguises as a known device on the network.", "B": "Evil Twin attack where the rogue access point mimics a legitimate one.", "C": "Man-in-the-Middle attack leveraging compromised certificates.", "D": "Jamming attack that disrupts the wireless signal with noise."}, "correct": "B", "topic": "Wireless Security", "trick_keywords": ["rogue access point"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การโจมตีแบบใดที่ตั้ง rogue access point เพื่อดักทราฟฟิกไร้สาย</div><div>🔑 <strong>สังเกตคำว่า</strong> \"rogue access point\" = จุดเชื่อมต่อ Wi-Fi ปลอมที่ตั้งขึ้นมาเลียนแบบของจริง</div><div>✅ การตั้ง AP ปลอมให้เหยื่อเข้าใจผิดว่าเป็น AP จริงเพื่อดักทราฟฟิก คือนิยามของ Evil Twin attack</div></div><div class=\"tip-th\">💡 Evil Twin คือ AP ปลอมที่ใช้ SSID เดียวกับ AP จริง หลอกให้ client เชื่อมต่อมาหา attacker</div>", "fill_hint": ""}, {"num": 27, "stem": "Which malware type is specifically designed to replicate itself across a network without user interaction?", "options": {"A": "A Trojan", "B": "A virus", "C": "A rootkit", "D": "A worm"}, "correct": "D", "topic": "Malware & Viruses", "trick_keywords": ["without user interaction"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> มัลแวร์ประเภทใดที่แพร่กระจายในเครือข่ายได้เองโดยไม่ต้องมี user interaction</div><div>🔑 <strong>สังเกตคำว่า</strong> \"without user interaction\" = โดยไม่ต้องมีผู้ใช้ทำอะไรเลย</div><div>✅ คุณสมบัติที่แยก worm จาก virus คือ worm แพร่กระจายเองได้โดยไม่ต้องพึ่งการกระทำของผู้ใช้ (เช่น เปิดไฟล์แนบ)</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">malware</span></div><div class=\"tip-th\">💡 Worm คือ malware ที่แพร่ตัวเองข้าม network โดยไม่ต้องการ host file ต่างจาก Virus ที่ต้องติดไปกับไฟล์</div>", "fill_hint": ""}, {"num": 28, "stem": "During a network audit, you notice a significant amount of ARP traffic between two nodes. What type of attack might be occurring if this traffic is malicious?", "options": {"A": "Ping flood is a denial-of-service attack in which the attacker attempts to overwhelm a targeted device with ICMP Echo Request (ping) packets, leading to network slowdown or crash.", "B": "ARP poisoning attack involves sending falsified ARP messages over a local area network to associate the attacker's MAC address with the IP address of another host.", "C": "DOS attack involves overwhelming a network with traffic from multiple sources, causing a denial of service for users of the targeted resource.", "D": "MAC flooding attack involves overwhelming the switch's address table with fake MAC addresses, causing it to act like a hub and send packets to all devices."}, "correct": "B", "topic": "Network Sniffing & MITM", "trick_keywords": ["ARP traffic"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> หาก ARP traffic ระหว่างสองโหนดสูงผิดปกติและเป็นอันตราย น่าจะเป็นการโจมตีแบบใด</div><div>🔑 <strong>สังเกตคำว่า</strong> \"ARP traffic\" = ปริมาณทราฟฟิกของโปรโตคอล ARP</div><div>✅ ปริมาณ ARP traffic ผิดปกติระหว่างสองโหนด มักเกิดจากการส่ง ARP reply ปลอมจำนวนมาก ซึ่งคือ ARP Poisoning</div></div><div class=\"tip-th\">💡 Active Sniffing ส่ง packet หลอก switch เช่น ARP Poisoning หรือ MAC Flooding เพื่อ redirect traffic มาหา attacker</div>", "fill_hint": ""}, {"num": 29, "stem": "During a web application audit, you notice that the application fails to restrict URL access in various administrative parts. What kind of security flaw is this an example of?", "options": {"A": "Cross-site request forgery (CSRF) that exploits the user’s trust.", "B": "SQL injection that allows unauthorized database manipulation.", "C": "Cross-site scripting (XSS) that allows attackers to inject client-side scripts.", "D": "Broken access control that allows users to bypass user authentication."}, "correct": "D", "topic": "Web Application Attacks", "trick_keywords": ["fails to restrict URL access"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การที่แอปไม่จำกัดสิทธิ์เข้าถึง URL ในส่วน admin เป็นตัวอย่างของช่องโหว่ประเภทใด</div><div>🔑 <strong>สังเกตคำว่า</strong> \"fails to restrict URL access\" = ไม่จำกัดสิทธิ์การเข้าถึง URL</div><div>✅ การเข้าหน้า admin ได้โดยไม่มีการตรวจสอบสิทธิ์ผ่าน URL ตรงกับนิยามของ Broken Access Control โดยตรง</div></div><div class=\"tip-th\">💡 Broken Access Control คือช่องโหว่ที่ทำให้ user bypass authentication หรือเข้าถึง resource ที่ไม่มีสิทธิ์</div>", "fill_hint": ""}, {"num": 30, "stem": "Fill in the blank: __________ is a protocol weakness in WPA/WPA2 security that allows attackers to decrypt packets.", "options": {"A": "Sidejacking, which involves hijacking an authenticated session via cookies.", "B": "KRACK (Key Reinstallation Attacks)", "C": "WPS (Wi-Fi Protected Setup) PIN brute-force attack", "D": "Bluejacking which exploits Bluetooth connections to send spam."}, "correct": "B", "topic": "Wireless Security", "trick_keywords": ["protocol weakness in WPA/WPA2 ... decrypt packets"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> จุดอ่อนของโปรโตคอลใน WPA/WPA2 ที่ทำให้ถอดรหัสแพ็กเก็ตได้คืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"protocol weakness in WPA/WPA2 ... decrypt packets\" = จุดอ่อนของโปรโตคอลใน WPA/WPA2 ที่ทำให้ถอดรหัสแพ็กเก็ตได้</div><div>✅ จุดอ่อนที่ทำให้ถอดรหัส traffic ของ WPA/WPA2 ได้จากการบังคับ reinstall คีย์เข้ารหัสซ้ำ คือช่องโหว่ที่ชื่อว่า KRACK</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">WPA</span></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>KRACK (Key Reinstallation Attacks)</strong></div>", "fill_hint": ""}, {"num": 31, "stem": "Fill in the blank: __________ is a software tool used for real-time monitoring of mobile devices.", "options": {"A": "Antivirus software for mobile devices", "B": "Parental control applications", "C": "Mobile Device Management (MDM) software", "D": "Remote Wipe software"}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": ["real-time monitoring of mobile devices"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เครื่องมือซอฟต์แวร์อะไรใช้เฝ้าติดตามอุปกรณ์มือถือแบบเรียลไทม์</div><div>🔑 <strong>สังเกตคำว่า</strong> \"real-time monitoring of mobile devices\" = เฝ้าติดตามอุปกรณ์มือถือแบบเรียลไทม์</div><div>✅ คำว่า real-time monitoring of mobile devices ตรงกับนิยามของ Mobile Device Management (MDM) โดยตรง</div></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>Mobile Device Management (MDM) software</strong></div>", "fill_hint": ""}, {"num": 32, "stem": "How does an attacker use BGP exploits to gather information from target systems?", "options": {"A": "By crashing the BGP router to cause network downtime.", "B": "By injecting malicious routes to disable the network.", "C": "By redirecting traffic through a controlled router to capture data.", "D": "By extracting routing tables for offline analysis."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": ["BGP exploits"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> แฮกเกอร์ใช้ช่องโหว่ BGP เพื่อเก็บข้อมูลจากเป้าหมายได้อย่างไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"BGP exploits\" = การใช้ประโยชน์จากช่องโหว่โปรโตคอลเส้นทาง BGP</div><div>✅ BGP ควบคุมเส้นทางส่งข้อมูลระหว่างเครือข่าย การเจาะช่องโหว่ BGP จึงทำให้ reroute ทราฟฟิกผ่านเราท์เตอร์ที่ควบคุมได้เพื่อดักข้อมูล</div></div><div class=\"tip-th\">✅ คำตอบ: <strong>By redirecting traffic through a controlled router to capture data.</strong></div>", "fill_hint": ""}, {"num": 33, "stem": "When an ethical hacker uses a SYN scan, what are they trying to achieve?", "options": {"A": "To establish a full TCP connection with the target.", "B": "To disconnect existing TCP connections by sending reset packets.", "C": "To initiate a connection to a port without completing the TCP handshake.", "D": "To corrupt the target system’s TCP stack."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": ["SYN scan"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เมื่อใช้ SYN scan เป้าหมายที่แท้จริงคืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"SYN scan\" = สแกนแบบส่งแค่ SYN โดยไม่ต่อ handshake ให้ครบ</div><div>✅ ชื่อ SYN scan (half-open scan) บ่งชี้ว่าส่งแค่ SYN แล้วไม่ตอบ ACK กลับ handshake จึงไม่สมบูรณ์</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">ethical hack</span></div><div class=\"tip-th\">✅ คำตอบ: <strong>To initiate a connection to a port without completing the TCP handshake.</strong></div>", "fill_hint": ""}, {"num": 34, "stem": "A security trainer conducts a workshop where they pretend to be a furious manager demanding access to restricted files to test employee reactions. What is this an example of?", "options": {"A": "Reverse social engineering, where the attacker gets the target to initiate contact first.", "B": "Baiting, where a physical or digital lure is left for the victim to take.", "C": "Pretexting is a method where the attacker creates a fabricated scenario to obtain unauthorized information.", "D": "Authority influence involves an attacker adopting the role of a higher-up to extract sensitive information from an employee."}, "correct": "C", "corrected": true, "correction_note": "ตัวเลือกซ้ำ/ไม่สมเหตุสมผลในต้นฉบับ ระบบแก้ไขให้แล้ว", "topic": "General Security Concepts", "trick_keywords": ["pretend to be a furious manager"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การจำลองเป็นผู้จัดการโมโหเพื่อขอเข้าถึงไฟล์ลับ คือเทคนิคอะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"pretend to be a furious manager\" = แสร้งทำเป็นผู้จัดการที่โกรธจัด</div><div>✅ การสร้างบทบาท/สถานการณ์สมมติเพื่อกดดันเหยื่อ คือแก่นของ Pretexting</div></div><div class=\"tip-th\">💡 Pretexting คือการสร้างบทบาทปลอม เช่น แกล้งเป็น IT support เพื่อหลอกให้เหยื่อไว้ใจและเปิดเผยข้อมูล</div>", "fill_hint": ""}, {"num": 35, "stem": "Which technology is essential for protecting data in transit to and from the cloud?", "options": {"A": "Restricting inbound traffic using firewall access control lists.", "B": "Implementation of robust encryption protocols like TLS.", "C": "Secure Sockets Layer (SSL) certificates for websites.", "D": "Deployment of intrusion detection systems (IDS)."}, "correct": "B", "corrected": true, "correction_note": "ตัวเลือกซ้ำ/ไม่สมเหตุสมผลในต้นฉบับ ระบบแก้ไขให้แล้ว", "topic": "Cloud Security", "trick_keywords": ["data in transit"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เทคโนโลยีใดจำเป็นสำหรับปกป้องข้อมูลระหว่างรับส่งไปยัง/จาก cloud</div><div>🔑 <strong>สังเกตคำว่า</strong> \"data in transit\" = ข้อมูลระหว่างการรับส่ง (ไม่ใช่ข้อมูลนิ่งที่จัดเก็บ)</div><div>✅ คำว่า in transit ชี้เฉพาะข้อมูลที่กำลังเดินทางบนเครือข่าย ซึ่งป้องกันด้วย encryption protocol อย่าง TLS ระหว่างรับส่ง</div></div><div class=\"tip-th\">💡 TLS/SSL เข้ารหัส traffic ระหว่าง client กับ server (HTTPS) ป้องกัน MITM และ eavesdropping</div>", "fill_hint": ""}, {"num": 36, "stem": "What is the most common method used by hackers to gain unauthorized access to secured Wi-Fi networks?", "options": {"A": "Cracking the network encryption key using advanced cryptographic attacks.", "B": "Utilizing default passwords that have not been changed from factory settings.", "C": "Launching a targeted phishing campaign against network administrators.", "D": "Physically accessing the router to reset it to factory settings."}, "correct": "A", "corrected": true, "correction_note": "ตัวเลือกซ้ำ/ไม่สมเหตุสมผลในต้นฉบับ ระบบแก้ไขให้แล้ว", "topic": "Wireless Security", "trick_keywords": ["secured Wi-Fi networks"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> วิธีที่พบบ่อยที่สุดในการเข้าถึง Wi-Fi ที่มีการป้องกันโดยไม่ได้รับอนุญาต</div><div>🔑 <strong>สังเกตคำว่า</strong> \"secured Wi-Fi networks\" = เครือข่าย Wi-Fi ที่มีการเข้ารหัสป้องกัน</div><div>✅ เมื่อเครือข่ายมีการเข้ารหัสอยู่แล้ว วิธีเข้าถึงหลักคือต้อง crack กุญแจเข้ารหัสก่อน</div></div><div class=\"tip-th\">💡 การ crack network encryption key ด้วย advanced cryptographic attacks เพื่อเข้าถึง WiFi/VPN โดยไม่มี authorization</div>", "fill_hint": ""}, {"num": 37, "stem": "During the initial stage of an attack, an ethical hacker gathers data about a target’s employee roles. Which source is most effective for this purpose?", "options": {"A": "Internal newsletters", "B": "Company press releases", "C": "Social media platforms", "D": "Public job posting boards"}, "correct": "C", "corrected": true, "correction_note": "ตัวเลือกซ้ำ/ไม่สมเหตุสมผลในต้นฉบับ ระบบแก้ไขให้แล้ว", "topic": "General Security Concepts", "trick_keywords": ["employee roles"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> แหล่งใดมีประสิทธิภาพที่สุดในการเก็บข้อมูลตำแหน่งงานพนักงาน</div><div>🔑 <strong>สังเกตคำว่า</strong> \"employee roles\" = ตำแหน่ง/บทบาทของพนักงาน</div><div>✅ ข้อมูลตำแหน่งงานมักถูกเปิดเผยเองบน social media (เช่น LinkedIn) จึงเป็นแหล่งที่มีประสิทธิภาพที่สุดสำหรับ OSINT</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">ethical hack</span></div><div class=\"tip-th\">💡 Social Media (LinkedIn, Facebook) เป็นแหล่ง Passive Recon ที่ดีเยี่ยม หาข้อมูล employee, structure, tech stack ขององค์กร</div>", "fill_hint": ""}, {"num": 38, "stem": "Which tool is commonly used for DNS enumeration to gather information about a target during the footprinting phase?", "options": {"A": "Maltego", "B": "Wireshark", "C": "DNSRecon", "D": "Nmap"}, "correct": "C", "topic": "Reconnaissance & Footprinting", "trick_keywords": ["DNS enumeration"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เครื่องมือใดใช้ทำ DNS enumeration ในขั้น footprinting</div><div>🔑 <strong>สังเกตคำว่า</strong> \"DNS enumeration\" = การแจกแจงข้อมูล DNS เช่น subdomain, records</div><div>✅ DNSRecon คือเครื่องมือที่ออกแบบมาเฉพาะสำหรับแจกแจงข้อมูล DNS โดยตรงตามชื่อ</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">enumeration</span> · <span class=\"kw-tag\">DNS enumerat</span></div><div class=\"tip-th\">💡 DNS Enumeration คือการดึง DNS records (A, MX, NS, TXT) ของ target หา subdomains และ mail servers</div>", "fill_hint": ""}, {"num": 39, "stem": "Fill in the blank: ___________ is a social engineering technique that involves deceiving individuals into breaking security procedures.", "options": {"A": "Baiting involves offering something enticing to the target in order to carry out identity theft or deploy malware.", "B": "Tailgating involves following someone with proper authentication into a restricted area without proper authentication.", "C": "Phishing is sending an email that falsely claims to be an established legitimate enterprise in an attempt to scam the user into surrendering private information.", "D": "Impersonation involves an attacker pretending to be someone else to persuade the victim to release information or perform actions."}, "correct": "D", "topic": "Social Engineering & Phishing", "trick_keywords": ["deceiving individuals into breaking security procedures"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เทคนิค social engineering ที่หลอกให้คนฝ่าฝืนขั้นตอนความปลอดภัยคืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"deceiving individuals into breaking security procedures\" = หลอกให้คนฝ่าฝืนขั้นตอนความปลอดภัย</div><div>✅ การปลอมตัวเป็นคนอื่น (impersonation) เพื่อโน้มน้าวเหยื่อให้ทำผิดกฎ ตรงกับคำอธิบายในโจทย์</div></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>Impersonation involves an attacker pretending to be someone else to persuade the victim to release information or perform actions.</strong></div>", "fill_hint": ""}, {"num": 40, "stem": "A cybersecurity expert is testing the security of a mobile application by inputting unexpected values. What vulnerability is likely being tested?", "options": {"A": "Buffer overflow vulnerabilities.", "B": "Input validation vulnerabilities.", "C": "Cross-site scripting (XSS) vulnerabilities.", "D": "SQL injection vulnerabilities."}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": ["inputting unexpected values"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การทดสอบด้วยการป้อนค่าที่ไม่คาดคิดเข้าไปในแอป เป็นการทดสอบช่องโหว่ประเภทใด</div><div>🔑 <strong>สังเกตคำว่า</strong> \"inputting unexpected values\" = ป้อนค่าที่ไม่คาดคิด/ผิดปกติเข้าไปทดสอบ</div><div>✅ การป้อนค่าผิดปกติเพื่อดูว่าระบบตรวจสอบ/กรองอินพุตดีหรือไม่ คือการทดสอบ Input Validation โดยตรง</div></div><div class=\"tip-th\">💡 Input Validation/Sanitization คือการตรวจสอบ input ก่อน process เพื่อป้องกัน injection attacks เช่น SQL, XSS, Command injection</div>", "fill_hint": ""}, {"num": 41, "stem": "During a routine security audit, a consultant finds an unauthorized device that, when plugged into a computer, executes software mimicking a network update request. What kind of social engineering method is this?", "options": {"A": "Watering hole attack involves compromising a popular website to distribute malware to its visitors when they visit the site.", "B": "Tailgating involves an attacker seeking entry to restricted areas by following another person who has legitimate access.", "C": "A USB drop attack involves leaving a malware-infected USB drive in a location where it can be found and used by an unsuspecting employee.", "D": "Phishing is characterized by attackers pretending to be legitimate institutions via email to extract personal information."}, "correct": "C", "topic": "Social Engineering & Phishing", "trick_keywords": ["plugged into a computer"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> อุปกรณ์แปลกปลอมที่เสียบแล้วรันซอฟต์แวร์แอบอ้างเป็นคำขออัปเดตเครือข่าย คือ social engineering แบบใด</div><div>🔑 <strong>สังเกตคำว่า</strong> \"plugged into a computer\" = เสียบเข้ากับคอมพิวเตอร์</div><div>✅ การใช้อุปกรณ์ทางกายภาพ (USB) ที่เสียบเข้าเครื่อง เป็นจุดสังเกตที่แยกจาก social engineering แบบอื่น จึงตรงกับ USB drop attack</div></div><div class=\"tip-th\">💡 USB Drop/Baiting คือการทิ้ง USB ที่ติด malware ไว้ในที่สาธารณะ รอให้เหยื่อเก็บแล้วเสียบกับคอมพิวเตอร์</div>", "fill_hint": ""}, {"num": 42, "stem": "In network security testing, what is the main purpose of performing a ping sweep?", "options": {"A": "To measure the round-trip time for packet delivery to each host.", "B": "To identify all active hosts on a network by sending ICMP echo requests.", "C": "To overload the network with excessive traffic.", "D": "To filter out unauthorized access points."}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": ["ping sweep"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> วัตถุประสงค์หลักของการทำ ping sweep คืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"ping sweep\" = การกวาดส่ง ping (ICMP) ไปทีละ IP ในช่วงที่กำหนด</div><div>✅ คำว่า sweep (กวาด) บ่งบอกว่าส่ง ping ไปหลาย IP ในช่วงเดียวกัน เพื่อดูว่า host ใดตอบกลับ (active)</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">ping sweep</span></div><div class=\"tip-th\">✅ คำตอบ: <strong>To identify all active hosts on a network by sending ICMP echo requests.</strong></div>", "fill_hint": ""}, {"num": 43, "stem": "Fill in the blank: The process of capturing packets on a network and analyzing them for malicious content is called ___________.", "options": {"A": "Packet sniffing is a method used by attackers to capture data packets as they travel across the network to steal sensitive information.", "B": "Environmental reconnaissance involves observing physical surroundings to gain information about a target or its operations.", "C": "Traffic analysis involves systematically intercepting and examining messages to deduce information from patterns in communication.", "D": "Network scanning is a process that identifies active hosts on a network by sending data packets and analyzing the responses received."}, "correct": "A", "topic": "General Security Concepts", "corrected": true, "correction_note": "มีข้อความแปลกปลอมจากไฟล์ต้นฉบับ (Question 43Skipped) ลบออกแล้ว", "trick_keywords": ["capturing packets...and analyzing them"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> กระบวนการดักจับแพ็กเก็ตในเครือข่ายแล้ววิเคราะห์หาเนื้อหาอันตราย เรียกว่าอะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"capturing packets...and analyzing them\" = ดักจับแพ็กเก็ตแล้ววิเคราะห์เนื้อหา</div><div>✅ คำอธิบายในโจทย์ตรงกับนิยามคำว่า Packet Sniffing แทบคำต่อคำ</div></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>Packet sniffing is a method used by attackers to capture data packets as they travel across the network to steal sensitive information.</strong></div>", "fill_hint": ""}, {"num": 44, "stem": "When securing a web application, what is the primary purpose of implementing input validation?", "options": {"A": "It prevents malicious data from being processed by the server and causing harm.", "B": "It speeds up the processing of user inputs on the server-side.", "C": "It organizes data inputs to enhance the user interface and user experience.", "D": "It allows for comprehensive data analytics and big data computation."}, "correct": "A", "topic": "Web Application Attacks", "trick_keywords": ["input validation"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> วัตถุประสงค์หลักของการทำ input validation บนเว็บแอปคืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"input validation\" = การตรวจสอบความถูกต้องของข้อมูลนำเข้า</div><div>✅ การตรวจสอบข้อมูลนำเข้าก่อนนำไปประมวลผล ป้องกันไม่ให้ข้อมูลอันตรายถูกเซิร์ฟเวอร์นำไปใช้จนเกิดความเสียหาย</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">input valid</span></div><div class=\"tip-th\">💡 Input Validation/Sanitization คือการตรวจสอบ input ก่อน process เพื่อป้องกัน injection attacks เช่น SQL, XSS, Command injection</div>", "fill_hint": ""}, {"num": 45, "stem": "Fill in the blank: _______ is the process of using various obfuscation techniques to evade detection by a honeypot that is monitoring traffic in a network.", "options": {"A": "Signature evasion changes the attack's characteristics slightly, so it no longer matches known attack signatures in honeypot databases.", "B": "Polymorphic shellcode changes its appearance with each instance, preventing honeypots from identifying and logging malicious activity.", "C": "Traffic padding is used to obfuscate malicious data within a sea of non-malicious traffic, making it difficult for honeypots to differentiate.", "D": "Encryption disguises the content of the attack traffic by converting it into an unreadable format, preventing honeypots from analyzing the data."}, "correct": "D", "topic": "Incident Response & Forensics", "trick_keywords": ["evade detection by a honeypot"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เทคนิคใดใช้ปกปิดทราฟฟิกโจมตีเพื่อไม่ให้ honeypot ตรวจจับได้</div><div>🔑 <strong>สังเกตคำว่า</strong> \"evade detection by a honeypot\" = หลบเลี่ยงการตรวจจับของ honeypot (ระบบล่อเป้า)</div><div>✅ การเข้ารหัสเนื้อหาทราฟฟิกให้อ่านไม่ออก ทำให้ honeypot วิเคราะห์เนื้อหาไม่ได้ จึงตอบ Encryption</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">honeypot</span></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>Encryption disguises the content of the attack traffic by converting it into an unreadable format, preventing honeypots from analyzing the data.</strong></div><div class=\"tip-th\">💡 Honeypot คือ decoy system ดักจับ attacker เพื่อ log TTP โดยไม่กระทบระบบจริง</div>", "fill_hint": ""}, {"num": 46, "stem": "In what type of session hijacking attack does the attacker predict and use a session ID before the user starts a session?", "options": {"A": "Session injection creates unauthorized sessions in the system by exploiting vulnerabilities in the session handling mechanism.", "B": "Session fixation involves the attacker setting a known session ID and tricking the victim into using it, then gaining access once the victim logs in.", "C": "Guessing attack involves the attacker trying different session IDs randomly until they find one that grants access to a user's session.", "D": "Session prediction uses statistical analysis of patterns in session ID generation to guess future session IDs before they are created."}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": ["before the user starts a session"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การโจมตีที่ผู้โจมตีกำหนด session ID ล่วงหน้าก่อนเหยื่อ login เรียกว่าอะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"before the user starts a session\" = ก่อนที่ผู้ใช้จะเริ่ม session จริง</div><div>✅ จุดสังเกตคือผู้โจมตีรู้/กำหนด session ID ล่วงหน้าก่อนเหยื่อเริ่มใช้งาน ตรงกับ Session Fixation ต่างจาก hijacking ที่ขโมย session ที่มีอยู่แล้ว</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">session hijack</span></div><div class=\"tip-th\">💡 Session Fixation คือการกำหนด session ID ให้เหยื่อก่อน login แล้ว reuse session นั้นหลัง login สำเร็จ</div>", "fill_hint": ""}, {"num": 47, "stem": "Which tool is best suited for automated vulnerability scanning in large networks?", "options": {"A": "Nmap", "B": "Wireshark", "C": "OpenVAS", "D": "Nessus"}, "correct": "D", "topic": "Scanning & Enumeration Tools", "trick_keywords": ["automated vulnerability scanning"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เครื่องมือใดเหมาะกับการสแกนช่องโหว่อัตโนมัติในเครือข่ายขนาดใหญ่</div><div>🔑 <strong>สังเกตคำว่า</strong> \"automated vulnerability scanning\" = การสแกนช่องโหว่แบบอัตโนมัติ</div><div>✅ Nessus เป็นเครื่องมือสแกนช่องโหว่ที่เป็นที่รู้จักมากที่สุดสำหรับงานสแกนขนาดใหญ่แบบอัตโนมัติ</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">vulnerability scan</span></div><div class=\"tip-th\">💡 Nessus คือ vulnerability scanner ตรวจหา known vulnerabilities อัตโนมัติ สร้าง report จัดลำดับ CVSS</div>", "fill_hint": ""}, {"num": 48, "stem": "During a routine inspection, a network administrator notices unusual session tokens being used repeatedly from different IP addresses. What might this indicate?", "options": {"A": "Cross-site scripting (XSS) attack occurs when attackers inject malicious scripts into web pages viewed by other users, leading to data theft.", "B": "Cookie poisoning modifies the session cookies stored in the user's browser to manipulate or gain unauthorized access to their sessions.", "C": "Credential stuffing uses previously breached username and password pairs to gain unauthorized access to user accounts.", "D": "Session replay involves capturing valid session tokens and reusing them to impersonate the victim and gain unauthorized access."}, "correct": "D", "topic": "General Security Concepts", "trick_keywords": ["used repeatedly from different IP addresses"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การพบ session token เดิมถูกใช้ซ้ำจากหลาย IP บ่งชี้ถึงอะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"used repeatedly from different IP addresses\" = ถูกใช้ซ้ำจากหลาย IP ที่ต่างกัน</div><div>✅ การนำ token เดิมไปใช้ซ้ำจากที่อื่น (ไม่ใช่การขโมยตอนใช้งานจริง) คือลักษณะของ Session Replay attack</div></div><div class=\"tip-th\">💡 Session Replay Attack คือการขโมย session token ที่ valid แล้ว reuse เพื่อ impersonate เหยื่อโดยไม่ต้อง login</div>", "fill_hint": ""}, {"num": 49, "stem": "A company’s Wi-Fi network was breached, and the attack was traced back to an exploitation of weak encryption methods. Which encryption method is most vulnerable to such attacks?", "options": {"A": "Temporal Key Integrity Protocol (TKIP)", "B": "Wired Equivalent Privacy (WEP)", "C": "Wi-Fi Protected Access II (WPA2)", "D": "Secure Sockets Layer (SSL) encryption"}, "correct": "B", "topic": "Cryptography", "trick_keywords": ["weak encryption methods"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การเข้ารหัสแบบใดของ Wi-Fi ที่เสี่ยงต่อการถูกโจมตีมากที่สุด</div><div>🔑 <strong>สังเกตคำว่า</strong> \"weak encryption methods\" = วิธีเข้ารหัสที่อ่อนแอ</div><div>✅ ในบรรดา Wi-Fi encryption มาตรฐาน WEP เป็นที่รู้กันว่าอ่อนแอที่สุดและถูก crack ได้ง่าย</div></div><div class=\"tip-th\">💡 WEP (Wired Equivalent Privacy) ล้าสมัย ใช้ IV สั้นเกินทำให้เจาะได้ในนาทีด้วย aircrack-ng</div>", "fill_hint": ""}, {"num": 50, "stem": "Fill in the blank: __________ is a technique used in footprinting to gather insights about internal IP ranges and domain records.", "options": {"A": "Email harvesting", "B": "DNS zone transfer", "C": "Port scanning", "D": "Network scanning"}, "correct": "B", "topic": "Reconnaissance & Footprinting", "trick_keywords": ["internal IP ranges and domain records"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เทคนิคใดใน footprinting ใช้เก็บข้อมูลช่วง IP ภายในและ DNS records</div><div>🔑 <strong>สังเกตคำว่า</strong> \"internal IP ranges and domain records\" = ช่วง IP ภายในและระเบียนโดเมน</div><div>✅ การทำ DNS Zone Transfer จะดึงระเบียน DNS ทั้งหมดของโดเมนออกมา ซึ่งรวมถึงข้อมูล IP ภายในตามที่โจทย์ระบุ</div></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>DNS zone transfer</strong></div>", "fill_hint": ""}, {"num": 51, "stem": "What technique is most effective in preventing the spread of ransomware in an organization?", "options": {"A": "Installing ad-blocking software.", "B": "Implementing robust data backup and recovery procedures.", "C": "Frequently changing user passwords.", "D": "Restricting user access to sensitive files."}, "correct": "B", "topic": "Malware & Viruses", "trick_keywords": ["preventing the spread of ransomware"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เทคนิคใดมีประสิทธิภาพที่สุดในการลดผลกระทบจากการแพร่กระจายของ ransomware</div><div>🔑 <strong>สังเกตคำว่า</strong> \"preventing the spread of ransomware\" = การแพร่กระจายของแรนซัมแวร์</div><div>✅ แม้ backup จะไม่หยุดการแพร่กระจายโดยตรง แต่ทำให้ผลกระทบจากการเข้ารหัสไฟล์ไม่รุนแรงเพราะกู้คืนได้ จึงเป็นคำตอบที่ effective ที่สุด</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">ransomware</span></div><div class=\"tip-th\">💡 Backup & Recovery คือแนวทางป้องกัน ransomware ที่ดีที่สุด backup แบบ offline/offsite ทำให้ restore ได้โดยไม่ต้องจ่ายค่าไถ่</div>", "fill_hint": ""}, {"num": 52, "stem": "During a compliance audit, it was found that a company’s cloud storage did not have encryption enabled. What type of compliance violation is this most likely related to?", "options": {"A": "Ignoring HIPAA security rules.", "B": "Violations of GDPR data protection requirements.", "C": "Non-compliance with the Sarbanes-Oxley Act.", "D": "Breach of PCI DSS standards."}, "correct": "B", "topic": "Cryptography", "trick_keywords": ["did not have encryption enabled"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การไม่เปิดเข้ารหัสข้อมูลใน cloud storage เข้าข่ายละเมิดมาตรฐานใด</div><div>🔑 <strong>สังเกตคำว่า</strong> \"did not have encryption enabled\" = ไม่ได้เปิดใช้การเข้ารหัสข้อมูล</div><div>✅ การไม่เข้ารหัสข้อมูลส่วนบุคคลที่จัดเก็บ ถือเป็นการละเมิดข้อกำหนดการปกป้องข้อมูลตาม GDPR โดยตรง</div></div><div class=\"tip-th\">💡 GDPR คือกฎหมาย privacy ของ EU ครอบคลุมข้อมูลส่วนตัว EU citizens ฝ่าฝืนโดนปรับสูงสุด 4% ของ global revenue</div>", "fill_hint": ""}, {"num": 53, "stem": "Fill in the blank: ________ attack involves hijacking a session after gaining the session ID by intercepting the traffic.", "options": {"A": "Session sniffing captures active session IDs by monitoring network traffic between the client and the server.", "B": "Man-in-the-middle (MITM) attack intercepts data between two parties to gain access to the session tokens and hijack the session.", "C": "Cross-site request forgery (CSRF) tricks the victim into executing unwanted actions on a web application in which they are currently authenticated.", "D": "Token kidnapping exploits security flaws to escalate privileges and hijack sessions on networked services."}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": ["intercepting the traffic"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การโจมตีที่ขโมย session หลังจากดักจับ traffic เพื่อเอา session ID เรียกว่าอะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"intercepting the traffic\" = ดักจับข้อมูลระหว่างทาง</div><div>✅ การดักจับข้อมูลระหว่างสองฝ่ายที่กำลังสื่อสาร ตรงกับนิยามของ Man-in-the-Middle attack</div></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>Man-in-the-middle (MITM) attack intercepts data between two parties to gain access to the session tokens and hijack the session.</strong></div><div class=\"tip-th\">💡 Session Hijacking / Sidejacking คือการขโมย session cookie ด้วย packet sniffing แล้วใช้ impersonate เหยื่อ</div>", "fill_hint": ""}, {"num": 54, "stem": "What technique allows an attacker to avoid detection by an IDS by breaking a payload into smaller packets that individually appear harmless but collectively deliver malicious content?", "options": {"A": "Fragmentation allows attackers to split malicious payloads across multiple packets, each appearing harmless to an IDS until reassembled.", "B": "Reverse tunnelling sends outbound traffic through an internal system to bypass firewalls that block incoming connections.", "C": "Protocol tunnelling encapsulates attack traffic within permitted protocols like HTTP to evade firewall rules and bypass detection.", "D": "Encryption encrypts the malicious payload, making it unreadable to IDS or firewalls, allowing it to pass undetected through security devices."}, "correct": "A", "topic": "IDS/IPS & Firewalls", "trick_keywords": ["breaking a payload into smaller packets"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> เทคนิคใดหลบ IDS ด้วยการแบ่ง payload เป็นชิ้นเล็กๆ ที่แต่ละชิ้นดูไม่อันตราย</div><div>🔑 <strong>สังเกตคำว่า</strong> \"breaking a payload into smaller packets\" = แบ่ง payload ออกเป็นแพ็กเก็ตย่อยๆ</div><div>✅ การแบ่งข้อมูลออกเป็นส่วนย่อยเพื่อให้แต่ละส่วนไม่ตรง signature อันตราย ตรงกับนิยามของ Fragmentation evasion</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">IDS</span></div><div class=\"tip-th\">💡 Fragmentation allows attackers to split malicious payloads across multiple packets, each appearing harmless to an IDS until reassembled</div>", "fill_hint": ""}, {"num": 55, "stem": "Fill in the blank: In a _________ attack, the attacker exploits the vulnerability of the ICMP protocol to flood the target with request packets.", "options": {"A": "Teardrop attack involves sending fragmented packets that are impossible for the target to reassemble, typically resulting in a system crash.", "B": "LAND attack sends a special poison packet to the target, where the source and destination IP addresses are the same, confusing the network stack.", "C": "Smurf attack is initiated by broadcasting large numbers of ICMP packets with the victim's spoofed IP to network devices.", "D": "Ping flood involves sending ICMP Echo Request (ping) packets directly to the target, quickly consuming both outgoing and incoming bandwidth."}, "correct": "C", "topic": "General Security Concepts", "trick_keywords": ["ICMP protocol to flood"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การโจมตีที่ใช้ช่องโหว่ของโปรโตคอล ICMP เพื่อถล่มเป้าหมายด้วยแพ็กเก็ตจำนวนมาก คืออะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"ICMP protocol to flood\" = ใช้โปรโตคอล ICMP ถล่ม (flood) เป้าหมาย</div><div>✅ Smurf attack ใช้การ broadcast ICMP echo request จำนวนมากโดยปลอม source เป็นเป้าหมาย ตรงกับ ICMP flood ในโจทย์</div></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>Smurf attack is initiated by broadcasting large numbers of ICMP packets with the victim's spoofed IP to network devices.</strong></div>", "fill_hint": ""}, {"num": 56, "stem": "What is a common method used by attackers to perform session hijacking on web applications?", "options": {"A": "Phishing attempts to trick users into providing their session information by masquerading as a trustworthy entity in electronic communications.", "B": "Session sidejacking involves the interception of cookies over unsecured connections to hijack the user's session after they have authenticated.", "C": "URL hijacking involves manipulating URLs to redirect users to malicious sites where session information can be stolen.", "D": "Cross-site scripting (XSS) allows an attacker to inject malicious scripts into content from trusted websites, which can then be used to hijack user sessions."}, "correct": "D", "topic": "Web Application Attacks", "trick_keywords": ["session hijacking on web applications"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> วิธีใดที่แฮกเกอร์ใช้บ่อยในการทำ session hijacking บนเว็บแอป</div><div>🔑 <strong>สังเกตคำว่า</strong> \"session hijacking on web applications\" = การขโมย session บนเว็บแอปพลิเคชัน</div><div>✅ XSS สามารถใช้ขโมย cookie/session token ของผู้ใช้บนเว็บแอปได้ จึงเป็นวิธีที่ใช้บ่อยที่สุดในบริบทเว็บ</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">session hijack</span></div><div class=\"tip-th\">💡 XSS (Cross-Site Scripting) คือการฉีด JavaScript เข้าหน้าเว็บเพื่อทำงานบน browser ของเหยื่อ เช่น ขโมย cookie</div>", "fill_hint": ""}, {"num": 57, "stem": "Which security practice is essential for protecting IoT devices from being compromised?", "options": {"A": "Implementing geofencing to restrict device functionality based on location.", "B": "Isolating IoT devices on a separate network VLAN.", "C": "Regular firmware updates and changing default credentials.", "D": "Use of complex network topologies to confuse potential hackers."}, "correct": "C", "topic": "Wireless/IoT & Other", "trick_keywords": ["protecting IoT devices"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> แนวปฏิบัติด้านความปลอดภัยใดจำเป็นสำหรับป้องกันอุปกรณ์ IoT ไม่ให้ถูกเจาะ</div><div>🔑 <strong>สังเกตคำว่า</strong> \"protecting IoT devices\" = ปกป้องอุปกรณ์ IoT</div><div>✅ อุปกรณ์ IoT มักถูกเจาะผ่านรหัสผ่านตั้งต้น (default credentials) และเฟิร์มแวร์เก่าที่มีช่องโหว่ การอัปเดตเฟิร์มแวร์และเปลี่ยนรหัสผ่านตั้งต้นจึงเป็นแนวทางหลัก</div></div><div class=\"tip-th\">💡 IoT Security: patch firmware สม่ำเสมอและเปลี่ยน default credentials ทันที เพราะ IoT มักถูกโจมตีผ่านช่องโหว่ที่รู้จักแล้ว</div>", "fill_hint": ""}, {"num": 58, "stem": "During an attack simulation, what specific information can an ethical hacker gather by exploiting vulnerabilities in an NFS server?", "options": {"A": "Network topology and router configurations.", "B": "List of shared directories and permission settings.", "C": "Types of encryption used and security protocols.", "D": "Active directory domain names and server IP addresses."}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": ["exploiting vulnerabilities in an NFS server"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การเจาะช่องโหว่ NFS server ทำให้แฮกเกอร์เก็บข้อมูลอะไรได้บ้าง</div><div>🔑 <strong>สังเกตคำว่า</strong> \"exploiting vulnerabilities in an NFS server\" = ใช้ช่องโหว่ของเซิร์ฟเวอร์ NFS</div><div>✅ NFS ใช้แชร์ไดเรกทอรีระหว่างเครื่อง การ enumerate NFS จึงเผยรายชื่อไดเรกทอรีที่แชร์และสิทธิ์การเข้าถึงเป็นหลัก</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">ethical hack</span></div><div class=\"tip-th\">✅ คำตอบ: <strong>List of shared directories and permission settings.</strong></div>", "fill_hint": ""}, {"num": 59, "stem": "Fill in the blank: Ethical hackers must adhere to __________, which dictate the actions permissible under legal frameworks.", "options": {"A": "Personal moral principles", "B": "Information security laws and regulations", "C": "Corporate ethical codes of conduct", "D": "Professional security certifications"}, "correct": "B", "topic": "General Security Concepts", "trick_keywords": ["actions permissible under legal frameworks"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> นักแฮกจริยธรรมต้องปฏิบัติตามอะไรที่กำหนดขอบเขตการกระทำตามกฎหมาย</div><div>🔑 <strong>สังเกตคำว่า</strong> \"actions permissible under legal frameworks\" = การกระทำที่ได้รับอนุญาตตามกรอบกฎหมาย</div><div>✅ คำว่า legal frameworks ชี้ตรงไปที่กฎหมาย/ระเบียบด้านความมั่นคงปลอดภัยข้อมูลที่ต้องปฏิบัติตาม</div></div><div class=\"kw-row\">🔍 สังเกตในโจทย์: <span class=\"kw-tag\">Ethical hack</span></div><div class=\"tip-fill\">📝 เติมช่องว่าง: <strong>Information security laws and regulations</strong></div>", "fill_hint": ""}, {"num": 60, "stem": "Which method is commonly used to bypass firewalls by encapsulating malicious traffic inside allowed protocols, such as HTTP or DNS?", "options": {"A": "Polymorphic shellcode rewrites the malicious code with each iteration to avoid signature- based detection by IDS or firewalls.", "B": "IP spoofing is used to make packets appear as if they are coming from an internal, trusted IP address to bypass firewall restrictions.", "C": "Traffic padding adds random, harmless data to the traffic stream to make it harder for the firewall to detect the true nature of the attack.", "D": "Tunneling wraps malicious traffic inside legitimate protocols like DNS or HTTP to bypass firewall rules that block other types of traffic."}, "correct": "D", "topic": "Reconnaissance & Footprinting", "trick_keywords": ["encapsulating...inside allowed protocols"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> วิธีใดใช้บายพาส firewall โดยห่อหุ้มทราฟฟิกอันตรายไว้ในโปรโตคอลที่อนุญาต เช่น HTTP/DNS</div><div>🔑 <strong>สังเกตคำว่า</strong> \"encapsulating...inside allowed protocols\" = ห่อหุ้มทราฟฟิกไว้ในโปรโตคอลที่อนุญาต</div><div>✅ การห่อหุ้ม (encapsulate) ทราฟฟิกหนึ่งไว้ในอีกโปรโตคอลหนึ่ง คือนิยามของ Tunneling โดยตรง</div></div><div class=\"tip-th\">💡 DNS Tunneling คือการซ่อน/ส่งข้อมูลผ่าน DNS queries ใช้ exfiltrate ข้อมูลผ่าน firewall ที่อนุญาต DNS</div>", "fill_hint": ""}, {"num": 61, "stem": "During a security assessment, a hacker captures a handshake from a wireless network and uses it to perform an offline dictionary attack. What was the hacker likely targeting?", "options": {"A": "The network’s pre-shared key (PSK)", "B": "Email accounts accessed via the compromised network.", "C": "The administrator’s login credentials for network management.", "D": "Server databases containing sensitive customer information."}, "correct": "A", "topic": "Wireless Security", "trick_keywords": ["captures a handshake"], "trick_tip_th": "<div class=\"tip-keyword\"><div>📌 <strong>โจทย์ถามว่า:</strong> การดัก handshake ของ Wi-Fi แล้วนำไป crack แบบ offline dictionary attack มีเป้าหมายที่อะไร</div><div>🔑 <strong>สังเกตคำว่า</strong> \"captures a handshake\" = ดักจับ handshake ตอนเชื่อมต่อ Wi-Fi</div><div>✅ handshake ของ WPA/WPA2 ที่ดักได้ ใช้ crack หา pre-shared key (PSK) ซึ่งเป็นกุญแจที่ทุกคนในเครือข่ายใช้ร่วมกัน</div></div><div class=\"tip-th\">💡 การ crack network encryption key ด้วย advanced cryptographic attacks
